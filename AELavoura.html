<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AE Lavoura</title>
<link rel="manifest" href="manifest_lavoura.json">
<link rel="icon" href="icon-lavoura-192.png">
<link rel="apple-touch-icon" href="icon-lavoura-192.png">
<meta name="theme-color" content="#1B4332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-escuro:#1B4332;
    --verde-medio:#2D6A4F;
    --verde-claro:#95D5B2;
    --dourado-escuro:#6B4413;
    --dourado-medio:#A6741F;
    --dourado-claro:#E3C371;
    --dourado-bg:#F1E9D8;
    --grafite:#1E2A38;
    --cinza:#65758A;
    --cinza-claro:#DEE6F0;
    --cinza-bg:#F2F5FA;
    --branco:#FFFFFF;
    --ambar:#C98A2B;
    --ambar-bg:#F5E9D7;
    --alerta:#B3462F;
    --alerta-bg:#F6E7E2;
    --ok-bg:#E3F1EA;
    --bom:#0C7A43;
    --bom-bg:#E3F1E8;
    --radius:10px;
    --shadow:0 1px 2px rgba(15,42,74,0.06), 0 4px 12px rgba(15,42,74,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--cinza-bg);
    color:var(--grafite);
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; height:100vh; overflow:hidden;}
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:236px; flex-shrink:0; background:var(--verde-escuro); color:var(--branco);
    display:flex; flex-direction:column; padding:24px 16px; height:100%;
    overflow-y:auto;
  }
  .brand{
    display:flex; align-items:center; gap:10px; padding:0 8px 24px 8px; margin-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .brand-mark{width:32px; height:32px; flex-shrink:0;}
  .brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:19px; letter-spacing:0.2px;}
  nav{margin-top:18px; display:flex; flex-direction:column; gap:4px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer;
    font-size:14px; font-weight:500; color:rgba(255,255,255,0.72);
    transition:background 0.15s, color 0.15s; border:none; background:none; width:100%; text-align:left;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06); color:var(--branco);}
  .nav-item.active{background:var(--verde-medio); color:var(--branco);}
  .nav-item svg{flex-shrink:0;}
  .sidebar-footer{
    margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,0.12);
    font-size:11px; color:rgba(255,255,255,0.45); line-height:1.5;
  }
  /* ---------- MAIN ---------- */
  .main{flex:1; padding:32px 40px 60px 40px; max-width:1240px; height:100%; overflow-y:auto;}
  .page-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.4px; color:var(--verde-medio); font-weight:600; margin:0 0 4px 0;}
  h1{font-family:'Fraunces',serif; font-size:28px; font-weight:600; margin:0; color:var(--verde-escuro);}
  .page-desc{color:var(--cinza); font-size:13.5px; margin-top:6px; max-width:600px;}
  .btn{
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; padding:10px 18px; border-radius:8px;
    border:none; cursor:pointer; transition:filter 0.15s, transform 0.1s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--verde-escuro); color:var(--branco);}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-primary.dourado{background:var(--dourado-escuro);}
  .btn-ghost{background:transparent; color:var(--verde-escuro); border:1px solid var(--cinza-claro);}
  .btn-ghost:hover{background:var(--branco);}
  .btn-danger-ghost{background:transparent; color:var(--alerta); border:1px solid var(--cinza-claro); padding:6px 10px; font-size:12px;}
  .btn-danger-ghost:hover{background:var(--alerta-bg);}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  .card{background:var(--branco); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--cinza-claro); overflow-x:auto;}
  .card-pad{padding:22px 24px;}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
  .stat-card{background:var(--branco); border:1px solid var(--cinza-claro); border-radius:var(--radius); padding:16px 18px;}
  .frente-bloco{margin-bottom:26px;}
  .frente-bloco-titulo{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .frente-bloco-titulo h3{font-family:'Fraunces',serif; font-size:16px; margin:0; color:var(--verde-escuro);}
  .frente-bloco.graos .frente-bloco-titulo h3{color:var(--dourado-escuro);}
  /* ---------- GRÁFICO DE BARRAS (Despesas, Receita x Despesa) ---------- */
  .despesa-barras{display:flex; flex-direction:column; gap:10px;}
  .despesa-barra-linha{
    display:grid; grid-template-columns:200px 1fr 130px; align-items:center; gap:12px;
    cursor:pointer; padding:4px 6px; border-radius:6px; transition:background 0.12s;
  }
  .despesa-barra-linha:hover{background:var(--verde-bg,#EEF5F0);}
  .despesa-barra-linha.ativa{background:var(--bom-bg);}
  .despesa-barra-nome{font-size:13px; color:var(--verde-escuro); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .despesa-barra-track{background:var(--cinza-claro); border-radius:5px; height:14px; overflow:hidden;}
  .despesa-barra-fill{background:var(--verde-medio); height:100%; border-radius:5px; transition:width 0.2s;}
  .despesa-barra-linha.ativa .despesa-barra-fill{background:var(--bom);}
  .despesa-barra-valor{font-size:12.5px; text-align:right; color:var(--cinza);}
  .despesa-grupo{margin-bottom:10px; overflow:visible;}
  .despesa-grupo-header{display:flex; align-items:center; gap:12px; padding:14px 20px; cursor:pointer;}
  .despesa-grupo-header:hover{background:var(--fundo,#F7F9F7);}
  .despesa-grupo-seta{color:var(--verde-medio); font-size:11px; width:12px; flex-shrink:0;}
  .despesa-grupo-nome{font-weight:600; color:var(--verde-escuro); flex-shrink:0;}
  .despesa-grupo-valor{margin-left:auto; font-size:13.5px;}
  .despesa-grupo-tabela{width:100%; border-collapse:collapse;}
  .despesa-grupo-tabela td{padding:9px 20px; border-top:1px solid var(--cinza-claro); font-size:13px; background:var(--fundo,#F7F9F7);}
  .despesa-grupo-data{white-space:nowrap; width:100px; color:var(--cinza);}
  .despesa-grupo-valorlinha{white-space:nowrap; width:130px; text-align:right;}
  .despesa-grupo-acoes{white-space:nowrap; width:170px; text-align:right;}
  .despesa-grupo-acoes .btn-ghost, .despesa-grupo-acoes .btn-danger-ghost{margin-left:6px;}
  /* ---------- DONUT ---------- */
  .painel-resultados{display:flex; gap:32px; align-items:center; flex-wrap:wrap;}
  .donut-wrap{flex-shrink:0;}
  .donut-svg{display:block;}
  .donut-slice{cursor:pointer; transition:opacity 0.15s;}
  .donut-slice:hover{opacity:0.82;}
  .donut-label{font-family:'Inter',monospace; font-size:11px; font-weight:600; fill:#fff; pointer-events:none;}
  .donut-center-value{font-family:'Inter',monospace; font-size:17px; font-weight:600; fill:var(--verde-escuro);}
  .donut-center-label{font-family:'Inter',sans-serif; font-size:10px; fill:var(--cinza); text-transform:uppercase; letter-spacing:0.5px;}
  .painel-legenda{flex:1; min-width:220px; display:flex; flex-direction:column; gap:2px;}
  .legenda-row{display:grid; grid-template-columns:12px 1fr auto auto; align-items:center; gap:10px; padding:7px 8px; border-radius:6px; cursor:pointer;}
  .legenda-row:hover{background:var(--fundo,#F7F9F7);}
  .legenda-swatch{width:12px; height:12px; border-radius:3px;}
  .legenda-nome{font-size:13px; color:var(--verde-escuro);}
  .legenda-valor{font-family:'Inter',monospace; font-size:12.5px; color:var(--verde-escuro); font-variant-numeric:tabular-nums;}
  .legenda-pct{font-family:'Inter',monospace; font-size:12.5px; color:var(--cinza); min-width:48px; text-align:right; font-variant-numeric:tabular-nums;}
  @media (max-width:760px){ .painel-resultados{flex-direction:column; align-items:stretch;} .donut-wrap{align-self:center;} }
  .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--cinza); font-weight:600;}
  .stat-value{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--verde-escuro); margin-top:6px;}
  .stat-value.alerta{color:var(--alerta);}
  .silo-wrap{display:flex; align-items:center; gap:8px;}
  .silo{width:14px; height:30px; border:1.5px solid var(--verde-escuro); border-radius:3px; position:relative; overflow:hidden; background:var(--cinza-claro); flex-shrink:0;}
  .silo-fill{position:absolute; bottom:0; left:0; right:0; background:var(--verde-medio);}
  .silo-fill.alerta{background:var(--alerta);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--cinza); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--cinza-claro); white-space:nowrap;}
  td{padding:12px 14px; border-bottom:1px solid var(--cinza-claro); color:var(--grafite); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .pill{display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;}
  .pill-ok{background:var(--ok-bg); color:var(--verde-medio);}
  .pill-alerta{background:var(--alerta-bg); color:var(--alerta);}
  .pill-cat{background:var(--cinza-claro); color:var(--grafite);}
  .pill-warn{background:var(--ambar-bg); color:var(--ambar);}
  .pill-cana{background:var(--ok-bg); color:var(--verde-medio);}
  .pill-graos{background:var(--dourado-bg); color:var(--dourado-medio);}
  /* form modal */
  .overlay{position:fixed; inset:0; background:rgba(27,67,50,0.35); display:flex; align-items:flex-start; justify-content:center; padding:50px 20px; overflow-y:auto; z-index:50;}
  .modal{background:var(--branco); border-radius:14px; width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal.modal-lg{max-width:760px;}
  .modal-head{padding:20px 24px; border-bottom:1px solid var(--cinza-claro); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h3{font-family:'Fraunces',serif; font-size:18px; margin:0; color:var(--verde-escuro);}
  .modal-close{background:none; border:none; cursor:pointer; color:var(--cinza); font-size:20px; line-height:1;}
  .modal-body{padding:22px 24px; display:flex; flex-direction:column; gap:14px; max-height:70vh; overflow-y:auto;}
  .modal-foot{padding:16px 24px; border-top:1px solid var(--cinza-claro); display:flex; justify-content:flex-end; gap:10px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  label{font-size:12px; font-weight:600; color:var(--grafite);}
  input, select, textarea{font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 11px; border:1px solid var(--cinza-claro); border-radius:7px; background:var(--branco); color:var(--grafite); outline:none; width:100%;}
  input:focus, select:focus, textarea:focus{border-color:var(--verde-medio); box-shadow:0 0 0 3px rgba(45,106,79,0.12);}
  .hint{font-size:11px; color:var(--cinza);}
  .empty{text-align:center; padding:50px 20px; color:var(--cinza);}
  .empty h4{font-family:'Fraunces',serif; color:var(--verde-escuro); margin:10px 0 6px 0; font-size:16px;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
  .search{display:flex; align-items:center; gap:8px; background:var(--branco); border:1px solid var(--cinza-claro); border-radius:8px; padding:8px 12px; width:260px;}
  .search input{border:none; padding:0; flex:1;}
  .search input:focus{box-shadow:none;}
  .subtabs{display:flex; gap:18px; margin-bottom:22px; border-bottom:1px solid var(--cinza-claro); overflow-x:auto;}
  .subtab{font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; color:var(--cinza); background:none; border:none; padding:10px 2px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .subtab:hover{color:var(--verde-escuro);}
  .subtab.active{color:var(--verde-escuro); border-bottom-color:var(--verde-medio);}
  /* ---------- segmentado (toggle Cana/Grãos) ---------- */
  .segmented{display:inline-flex; border:1px solid var(--cinza-claro); border-radius:8px; overflow:hidden;}
  .segmented button{font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; padding:8px 16px; border:none; background:var(--branco); color:var(--cinza); cursor:pointer;}
  .segmented button.active{background:var(--verde-escuro); color:var(--branco);}
  .segmented button.active.graos{background:var(--dourado-escuro);}
  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{background:var(--branco); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,0.12); border:1px solid var(--cinza-claro); padding:40px 36px; width:100%; max-width:360px;}
  .login-brand{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
  .login-brand .brand-name{color:var(--verde-escuro); font-family:'Fraunces',serif; font-weight:600; font-size:19px;}
  .login-field{margin-bottom:16px; display:flex; flex-direction:column; gap:5px;}
  .login-field input{width:100%;}
  .login-error{background:var(--alerta-bg); color:var(--alerta); font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:16px;}
  .login-btn{width:100%; margin-top:6px; justify-content:center;}
  .login-btn:disabled{opacity:0.6; cursor:default;}
  .login-loading{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--cinza); font-size:14px;}
  /* ---------- USUÁRIO LOGADO (sidebar) ---------- */
  .sidebar-user{margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.12); display:flex; flex-direction:column; gap:8px; font-size:12.5px; color:rgba(255,255,255,0.85);}
  .sidebar-user-nome{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sidebar-user-actions{display:flex; gap:8px;}
  .btn-sair{background:rgba(255,255,255,0.1); border:none; color:#fff; padding:6px 10px; border-radius:6px; font-size:11.5px; cursor:pointer; white-space:nowrap; flex:1;}
  .btn-sair:hover{background:rgba(255,255,255,0.2);}
  /* ---------- ADMIN ---------- */
  .perm-matrix{width:100%; border-collapse:collapse; font-size:13px;}
  .perm-matrix th, .perm-matrix td{padding:8px 10px; border-bottom:1px solid var(--cinza-claro); text-align:left;}
  .perm-matrix select{width:100%; padding:6px 8px; font-size:12.5px;}
  .status-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;}
  .status-dot.ativo{background:var(--bom);}
  .status-dot.inativo{background:var(--cinza);}
  /* ---------- RESPONSIVO (celular) ---------- */
  @media (max-width:760px){
    .app{flex-direction:column; height:auto; overflow:visible;}
    .sidebar{width:100%; flex-direction:row; align-items:center; justify-content:space-between; padding:12px 16px; gap:12px; overflow-x:auto; height:auto; position:-webkit-sticky; position:sticky; top:0; z-index:40;}
    .brand{border-bottom:none; padding:0; margin-bottom:0; flex-shrink:0;}
    nav{margin-top:0; flex-direction:row; gap:4px;}
    .nav-item{white-space:nowrap; padding:8px 10px; font-size:13px;}
    .sidebar-footer{display:none;}
    .sidebar-user{margin-bottom:0; padding-bottom:0; border-bottom:none; flex-shrink:0;}
    .main{padding:20px 16px 48px 16px; max-width:100%; height:auto; overflow-y:visible;}
    .page-header{flex-direction:column; align-items:flex-start; gap:14px;}
    h1{font-size:23px;}
    .btn{width:100%; justify-content:center;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .toolbar{flex-direction:column; align-items:stretch;}
    .search{width:100%;}
    .card{overflow-x:auto; -webkit-overflow-scrolling:touch;}
    .overlay{padding:16px 10px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== SUPABASE =====================
 * AE Lavoura reaproveita o MESMO projeto Supabase que hoje é o do AE
 * Cana (cana_schema.sql) — não é um banco novo. Fazendas, Culturas,
 * Safras, Talhões/Áreas e Centros de Custo (Fase 1) já existem e já
 * são compartilháveis entre Cana e Grãos (a coluna `frente` já aceita
 * 'cana' e 'graos' desde o desenho original). As tabelas de Grãos
 * (plantios_graos, insumos_graos, entradas_insumo_graos,
 * aplicacoes_graos, colheitas_graos, despesas_graos, receitas_graos)
 * foram acrescentadas por lavoura_migracao_graos.sql, sem alterar nada
 * do que já existia — ver esse arquivo para detalhes.
 * Login e usuários também são os MESMOS do AE Cana: uma conta que já
 * existe lá funciona aqui, e o que ela vê depende só das permissões
 * marcadas em Administração > Usuários (agora com módulos extras para
 * Grãos, além dos de Cana). O AE Pecuária e o AE Combustível
 * continuam em projetos Supabase próprios e separados — não mudou
 * nada neles; ver AEMatriz.html para a visão consolidada entre todos. */
const db = supabase.createClient(
  'https://kmkystqgpvmzrccxvyaz.supabase.co',
  'sb_publishable_YclssD8pzNZhWO_Om0anMg_SwaZHQOa'
);

/* ===================== HELPERS DE CONVERSÃO ===================== */
function toSnake(s){ return s.replace(/[A-Z]/g, m => '_'+m.toLowerCase()); }
function toCamel(s){ return s.replace(/_([a-z0-9])/g, (_,c)=>c.toUpperCase()); }
function fmt(n, dec=2){ return Number(n||0).toLocaleString('pt-BR', {minimumFractionDigits:dec, maximumFractionDigits:dec}); }
function fmtData(iso){ return iso ? iso.split('-').reverse().join('/') : '—'; }

/* ===================== OPÇÕES (catálogos de enum) =====================
 * CATEGORIAS_INSUMO e TIPOS_OPERACAO existem em duas versões porque as
 * restrições (CHECK) das tabelas *_cana e *_graos no banco são
 * diferentes: insumos_cana/aplicacoes_cana não aceitam 'semente',
 * 'dessecacao' nem 'semeadura' (não fazem sentido pra cana, cultura
 * perene) — só insumos_graos/aplicacoes_graos aceitam. Usar a lista
 * errada faria o formulário oferecer uma opção que o banco rejeita. */
const OPCOES = {
  ESTADOS: [{value:'TO',label:'Tocantins'},{value:'SP',label:'São Paulo'}],
  FRENTES: [{value:'cana',label:'Cana-de-açúcar'},{value:'graos',label:'Grãos'},{value:'pecuaria',label:'Pecuária'}],
  FRENTES_GERAL: [{value:'cana',label:'Cana-de-açúcar'},{value:'graos',label:'Grãos'},{value:'pecuaria',label:'Pecuária'},{value:'geral',label:'Geral'}],
  CATEGORIAS_INSUMO_CANA: [
    {value:'herbicida',label:'Herbicida'}, {value:'inseticida',label:'Inseticida'},
    {value:'fungicida',label:'Fungicida'}, {value:'adubo',label:'Adubo/Fertilizante'},
    {value:'corretivo',label:'Corretivo de solo (Calcário/Gesso)'}, {value:'outro',label:'Outro'},
  ],
  CATEGORIAS_INSUMO_GRAOS: [
    {value:'semente',label:'Semente'}, {value:'herbicida',label:'Herbicida'}, {value:'inseticida',label:'Inseticida'},
    {value:'fungicida',label:'Fungicida'}, {value:'adubo',label:'Adubo/Fertilizante'},
    {value:'corretivo',label:'Corretivo de solo (Calcário/Gesso)'}, {value:'outro',label:'Outro'},
  ],
  TIPOS_OPERACAO_CANA: [
    {value:'adubacao',label:'Adubação'}, {value:'herbicida',label:'Aplicação de herbicida'},
    {value:'inseticida',label:'Aplicação de inseticida'}, {value:'fungicida',label:'Aplicação de fungicida'},
    {value:'cultivo_mecanico',label:'Cultivo mecânico'}, {value:'outro',label:'Outro'},
  ],
  TIPOS_OPERACAO_GRAOS: [
    {value:'dessecacao',label:'Dessecação'}, {value:'semeadura',label:'Semeadura'},
    {value:'adubacao',label:'Adubação'}, {value:'herbicida',label:'Aplicação de herbicida'},
    {value:'inseticida',label:'Aplicação de inseticida'}, {value:'fungicida',label:'Aplicação de fungicida'},
    {value:'cultivo_mecanico',label:'Cultivo mecânico'}, {value:'outro',label:'Outro'},
  ],
};

/* ===================== FRENTE DE UM TALHÃO =====================
 * Talhões não têm coluna própria de frente — ela vem da Cultura
 * vinculada (fazendas/culturas/safras/talhoes_areas são cadastros
 * ÚNICOS, compartilhados por Cana e Grãos neste app). Um talhão sem
 * cultura definida (culturaId vazio) fica "sem frente" até alguém
 * escolher a cultura — nesse estado ele não some do cadastro, mas
 * fica de fora de Custo por Talhão/Histórico (não dá pra saber qual
 * conjunto de tabelas usar). */
function frenteDoTalhao(t){
  if(!t || t.culturaId==null) return null;
  const c = state.culturas.find(x=>x.id===t.culturaId);
  return c ? c.frente : null;
}
function culturaDoTalhaoNome(talhaoId){
  if(talhaoId==null) return null;
  const t = state.talhoes.find(x=>x.id===talhaoId);
  return t && t.culturaId!=null ? fkNome('culturas', t.culturaId) : null;
}

function rowToCadastro(row, cfg){
  const obj = {id: row.id};
  cfg.fields.forEach(f=>{ obj[f.key] = row[toSnake(f.key)]; });
  return obj;
}
function rowToPerfil(r){ return {id:r.id, nome:r.nome, usuario:r.usuario, papel:r.papel, permissoes:r.permissoes||{}, ativo:r.ativo}; }

/* ===================== CACHE LOCAL (abrir offline com os últimos dados) ===================== */
const CACHE_LOCAL_KEY = 'lavoura_cache_cadastros_v1';
function salvarCacheLocal(){
  try{
    const snapshot = {};
    CADASTRO_KEYS.forEach(k=>{ snapshot[k] = state[k]; });
    localStorage.setItem(CACHE_LOCAL_KEY, JSON.stringify(snapshot));
  }catch(e){ /* localStorage indisponível ou cheio — segue sem cache offline */ }
}
function carregarCacheLocal(){
  try{
    const raw = localStorage.getItem(CACHE_LOCAL_KEY);
    if(!raw) return;
    const snapshot = JSON.parse(raw);
    Object.keys(snapshot).forEach(k=>{ if(CADASTROS[k]) state[k] = snapshot[k]; });
  }catch(e){ /* cache corrompido — ignora e segue vazio até conseguir carregar do servidor */ }
}

/* O Supabase limita cada consulta a no máximo 1000 linhas por padrão —
 * sem paginar, uma tabela grande (despesas_cana já passou de 2000
 * linhas na carga de 2026) vem cortada silenciosamente, subestimando
 * totais no Custo por Talhão e em Resultados. Paginamos todas as
 * tabelas (não só as de cana) por segurança. */
async function fetchAllRows(table, orderBy, ascending){
  const PAGE = 1000;
  let all = [];
  let from = 0;
  while(true){
    const { data, error } = await db.from(table).select('*').order(orderBy, {ascending}).range(from, from+PAGE-1);
    if(error) return { data: all, error };
    all = all.concat(data||[]);
    if(!data || data.length < PAGE) break;
    from += PAGE;
  }
  return { data: all, error: null };
}
async function loadAll(){
  const results = await Promise.all([
    ...CADASTRO_KEYS.map(k => {
      const cfg = CADASTROS[k];
      return fetchAllRows(cfg.table, cfg.orderBy || 'nome', !cfg.orderDesc);
    }),
    db.from('profiles').select('*').order('nome'),
  ]);
  CADASTRO_KEYS.forEach((k,i)=>{ state[k] = (results[i].data||[]).map(row=>rowToCadastro(row, CADASTROS[k])); });
  state.perfis = (results[CADASTRO_KEYS.length].data||[]).map(rowToPerfil);
  salvarCacheLocal();
  render();
}

function paginaCustom(page){

/* ===================== AUTENTICAÇÃO E PERMISSÕES =====================
 * Login e tabela profiles são as MESMAS do AE Cana (mesmo projeto
 * Supabase) — uma conta criada em Administração aqui também entra no
 * AECana.html antigo, e vice-versa, porque é a mesma tabela profiles.
 * O AE Pecuária e o AE Combustível continuam com login próprio, em
 * projetos separados. */
const DOMINIO_LOGIN = 'aeagropecuaria.local';
function normalizeUsuario(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,''); }
function souAdmin(){ return state.perfil?.papel === 'admin'; }
function souOperador(){ return state.perfil?.papel === 'operador'; }
function temPermissao(modulo, nivel){
  if(!state.perfil) return false;
  if(souAdmin()) return true;
  const atual = state.perfil.permissoes?.[modulo];
  if(nivel==='visualizar') return atual==='visualizar' || atual==='editar';
  return atual==='editar';
}

async function loadPerfil(){
  const uid = state.session?.user?.id;
  if(!uid){ state.perfil = null; return; }
  const { data } = await db.from('profiles').select('*').eq('id', uid).single();
  state.perfil = data ? rowToPerfil(data) : null;
  if(state.perfil?.ativo && !paginaAcessivel(state.page)){
    const primeira = primeiraPaginaVisivel();
    if(primeira) state.page = primeira;
  }
}

async function initAuth(){
  carregarCacheLocal();
  const { data } = await db.auth.getSession();
  state.session = data.session;
  if(state.session) await loadPerfil();
  state.authChecked = true;
  render();
  if(state.session && state.perfil?.ativo) loadAll();

  let primeiroEvento = true;
  db.auth.onAuthStateChange(async (event, newSession)=>{
    if(primeiroEvento){ primeiroEvento = false; return; }
    if(event==='SIGNED_IN' && state.session?.access_token===newSession?.access_token) return;
    state.session = newSession;
    if(newSession){
      await loadPerfil();
      render();
      if(state.perfil?.ativo) loadAll();
    } else {
      state.perfil = null;
      render();
    }
  });
}

async function fazerLogin(){
  const usuario = normalizeUsuario(state.loginDraft.usuario);
  const senha = state.loginDraft.senha;
  if(!usuario || !senha){ state.loginError = 'Informe usuário e senha.'; render(); return; }
  state.loginLoading = true; state.loginError = ''; render();
  const email = `${usuario}@${DOMINIO_LOGIN}`;
  const { data, error } = await db.auth.signInWithPassword({ email, password: senha });
  state.loginLoading = false;
  if(error){ state.loginError = 'Usuário ou senha inválidos.'; render(); return; }
  state.session = data.session;
  await loadPerfil();
  state.loginDraft = {usuario:'', senha:''};
  render();
  if(state.perfil?.ativo) loadAll();
}
async function fazerLogout(){
  await db.auth.signOut();
  state.session = null; state.perfil = null; state.page = 'fazendas';
  render();
}

function currentGroupKey(){ return Object.keys(GROUPS).find(k=>GROUPS[k].pages.some(p=>p.key===state.page)); }
function grupoVisivel(key){
  if(key==='admin') return souAdmin();
  if(key==='operacoesCana') return temPermissao('operacoes','visualizar');
  if(key==='operacoesGraos') return temPermissao('operacoes_graos','visualizar');
  if(key==='financeiro') return temPermissao('financeiro','visualizar') || temPermissao('financeiro_graos','visualizar');

  // (vê a lucratividade daquela frente) — ou quem só tem 'financeiro'/
  // 'financeiro_graos' de EDITAR, pra conseguir lançar receita "cega"
  // (lança, mas não vê a lista nem o valor — mesmo racional do AE Cana
  // original).
  if(key==='resultados') return temPermissao('resultados','visualizar') || temPermissao('resultados_graos','visualizar')
    || temPermissao('financeiro','editar') || temPermissao('financeiro_graos','editar');
  return temPermissao('cadastros','visualizar');
}
function paginaVisivel(key){ return true; }
function paginaAcessivel(page){
  const grupo = Object.entries(GROUPS).find(([,g])=>g.pages.some(p=>p.key===page));
  if(!grupo) return false;
  return grupoVisivel(grupo[0]);
}
function gruposVisiveis(){ return Object.entries(GROUPS).filter(([key])=>grupoVisivel(key)); }
function primeiraPaginaVisivel(){
  for(const [,g] of gruposVisiveis()){
    if(g.pages[0]) return g.pages[0].key;
  }
  return null;
}

/* ===================== PÁGINA GENÉRICA DE CADASTRO ===================== */
function fkNome(entityKey, id){
  if(id===null || id===undefined || id==='') return '—';
  const item = (state[entityKey]||[]).find(x=>String(x.id)===String(id));
  return item ? item.nome : '—';
}
function celulaValor(f, item){
  if(f.type==='computed') return f.compute(item);
  const val = item[f.key];
  if(f.type==='fk') return fkNome(f.refEntity, val);
  if(f.type==='select') return (f.options.find(o=>o.value===val)||{}).label || val || '—';
  if(f.type==='date') return fmtData(val);
  if(f.type==='number') return (val===null||val===undefined||val==='') ? '—' : `${fmt(val, f.dec ?? 2)}${f.suffix||''}`;
  return val || '—';
}
function PageCadastro(key){
  const cfg = CADASTROS[key];
  const podeEditar = temPermissao(cfg.modulo||'cadastros','editar') || (cfg.moduloEditarAlt && temPermissao(cfg.moduloEditarAlt,'editar'));
  const termo = state.search.toLowerCase();
  const base = cfg.filtroLista ? state[key].filter(cfg.filtroLista) : state[key];
  const list = cfg.semBusca ? base : base.filter(item => !termo || (item.nome||'').toLowerCase().includes(termo));
  const colunas = cfg.fields.filter(f=>f.list!==false);
  const colspanTotal = colunas.length + (cfg.semStatus?0:1) + 1;
  return `
  <div class="toolbar">
    ${cfg.semBusca ? '' : `<div class="search">${iconSearch()}<input type="text" placeholder="Buscar..." value="${state.search}" data-search="1"/></div>`}
    <span class="hint">${list.length} registro(s)</span>
    ${podeEditar ? `<button class="btn btn-primary btn-sm" data-novo-cadastro="${key}">+ Novo(a) ${cfg.singular}</button>` : ''}
  </div>
  <div class="card" style="overflow-x:auto;">
    ${list.length===0 ? Empty(`Nenhum(a) ${cfg.singular.toLowerCase()} cadastrado(a)`, cfg.emptyHint||'Cadastre o primeiro registro.') : `
    <table>
      <thead><tr>${colunas.map(f=>`<th>${f.label}</th>`).join('')}${cfg.semStatus?'':'<th>Status</th>'}<th></th></tr></thead>
      <tbody>
        ${list.map(item=>`
          <tr>
            ${colunas.map(f=>`<td>${celulaValor(f,item)}</td>`).join('')}
            ${cfg.semStatus?'':`<td><span class="status-dot ${item.ativo?'ativo':'inativo'}"></span>${item.ativo?'Ativo':'Inativo'}</td>`}
            <td style="display:flex; gap:6px;">
              ${cfg.historico ? `<button class="btn-ghost btn-sm" data-historico-talhao="${item.id}">Histórico</button>` : ''}
              ${podeEditar ? `<button class="btn-ghost btn-sm" data-edit-cadastro="${key}:${item.id}">Editar</button>` : ''}
              ${podeEditar && !souOperador() ? `<button class="btn-danger-ghost" data-del-cadastro="${key}:${item.id}">Excluir</button>` : ''}
            </td>
          </tr>
          ${key==='fazendas' ? linhaTalhoesDaFazenda(item, podeEditar, colspanTotal) : ''}
        `).join('')}
      </tbody>
    </table>`}
  </div>`;
}
/* Fazenda → cadastra o talhão (nome, ha, cultura) direto ali embaixo,
 * sem precisar ir pra aba Talhões e escolher a fazenda de novo. */
function linhaTalhoesDaFazenda(fazenda, podeEditar, colspanTotal){
  const aberto = !!state.fazendaTalhoesAbertos[fazenda.id];
  const talhoes = state.talhoes.filter(t=>t.fazendaId===fazenda.id && t.tipo==='talhao');
  return `
  <tr class="fazenda-talhoes-row">
    <td colspan="${colspanTotal}" style="padding:0;">
      <div class="despesa-grupo-header" style="cursor:pointer;" data-fazenda-talhoes-toggle="${fazenda.id}">
        <span class="despesa-grupo-seta">${aberto?'▼':'▶'}</span>
        <span class="despesa-grupo-nome">Talhões desta fazenda</span>
        <span class="hint">${talhoes.length} talhão(ões)</span>
      </div>
      ${aberto ? `
      <div style="padding:0 16px 16px;">
        ${talhoes.length===0 ? `<p class="hint">Nenhum talhão cadastrado ainda nesta fazenda.</p>` : `
        <table class="despesa-grupo-tabela">
          <thead><tr><th>Nome</th><th>Área (ha)</th><th>Cultura</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${talhoes.map(t=>`
              <tr>
                <td>${t.nome}</td>
                <td class="mono">${t.areaHa?fmt(t.areaHa)+' ha':'—'}</td>
                <td>${fkNome('culturas', t.culturaId)}</td>
                <td><span class="status-dot ${t.ativo?'ativo':'inativo'}"></span>${t.ativo?'Ativo':'Inativo'}</td>
                <td style="display:flex; gap:6px;">
                  <button class="btn-ghost btn-sm" data-historico-talhao="${t.id}">Histórico</button>
                  ${podeEditar ? `<button class="btn-ghost btn-sm" data-edit-cadastro="talhoes:${t.id}">Editar</button>` : ''}
                  ${podeEditar && !souOperador() ? `<button class="btn-danger-ghost" data-del-cadastro="talhoes:${t.id}">Excluir</button>` : ''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}
        ${podeEditar ? `<button class="btn btn-primary btn-sm" style="margin-top:10px;" data-novo-cadastro="talhoes" data-preset-fazenda="${fazenda.id}">+ Novo Talhão</button>` : ''}
      </div>` : ''}
    </td>
  </tr>`;
}
function novoCadastroDraft(key){
  const cfg = CADASTROS[key];
  const draft = {};
  cfg.fields.forEach(f=>{
    if(f.type==='checkbox') draft[f.key] = f.default!==undefined ? f.default : true;
    else if(f.type==='select') draft[f.key] = f.options[0]?.value ?? '';
    else if(f.type==='fixed' || f.type==='computed') draft[f.key] = f.value;
    else if(f.type==='fk') draft[f.key] = (state[f.refEntity]||[]).filter(f.filter||(()=>true)).find(x=>x.ativo!==false)?.id ?? '';
    else if(f.key==='unidade') draft[f.key] = 'L';
    else draft[f.key] = '';
  });
  return draft;
}
function abrirNovoCadastro(key, presets){
  editDraft = novoCadastroDraft(key);
  if(presets) Object.assign(editDraft, presets);
  state.cadastroError = '';
  state.modal = {type:'cadastro', key};
}
function abrirEditarCadastro(key, id){
  const item = state[key].find(x=>x.id===id);
  if(!item) return;
  editDraft = {...item, _editId:item.id};
  state.cadastroError = '';
  state.modal = {type:'cadastro', key};
}
async function excluirCadastro(key, id){
  const cfg = CADASTROS[key];
  if(!confirm(`Excluir este(a) ${cfg.singular.toLowerCase()}? Essa ação não pode ser desfeita.`)) return;
  const { error } = await db.from(cfg.table).delete().eq('id', id);
  if(error){ alert('Não foi possível excluir: ' + mensagemErroSupabase(error)); return; }
  await loadAll();
}
function mensagemErroSupabase(error){
  if(error?.code==='23505') return 'Já existe um registro com esse nome (talvez nesta fazenda). Use outro nome ou edite o existente.';
  if(error?.code==='23503') return 'Não é possível excluir: existem outros cadastros vinculados a este registro.';
  if(error?.code==='23514') return 'Verifique os valores informados.';
  return error?.message || 'Erro desconhecido.';
}
function campoHtml(f, d){
  if(f.type==='fixed' || f.type==='computed') return '';
  const val = d[f.key] ?? '';
  const id = `f-${f.key}`;
  if(f.type==='checkbox'){
    return `<div class="field"><label><input type="checkbox" id="${id}" ${val?'checked':''} style="width:auto; margin-right:6px;"/> ${f.label}</label></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field"><label>${f.label}</label><textarea id="${id}" rows="3">${val}</textarea></div>`;
  }
  if(f.type==='select'){
    return `<div class="field"><label>${f.label}</label><select id="${id}">${f.options.map(o=>`<option value="${o.value}" ${val===o.value?'selected':''}>${o.label}</option>`).join('')}</select></div>`;
  }
  if(f.type==='fk'){
    const lista = (state[f.refEntity]||[]).filter(x=>x.ativo!==false).filter(f.filter||(()=>true));
    return `<div class="field"><label>${f.label}</label>
      <select id="${id}">
        ${f.required?'':'<option value="">—</option>'}
        ${lista.map(o=>`<option value="${o.id}" ${String(val)===String(o.id)?'selected':''}>${o.nome}</option>`).join('')}
      </select>
      ${lista.length===0?`<span class="hint">Cadastre ${CADASTROS[f.refEntity].singular.toLowerCase()} antes.</span>`:''}
    </div>`;
  }
  if(f.type==='date'){
    return `<div class="field"><label>${f.label}</label><input type="date" id="${id}" value="${val}"/></div>`;
  }
  if(f.type==='number'){
    return `<div class="field"><label>${f.label}</label><input type="number" step="${f.step||'1'}" id="${id}" value="${val}"/>${f.hint?`<span class="hint">${f.hint}</span>`:''}</div>`;
  }
  return `<div class="field"><label>${f.label}</label><input type="text" id="${id}" value="${val}" ${f.placeholder?`placeholder="${f.placeholder}"`:''}/></div>`;
}
function ModalCadastro(){
  const key = state.modal.key;
  const cfg = CADASTROS[key];
  const d = editDraft;
  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal" data-stop="1">
      <div class="modal-head"><h3>${d._editId?'Editar':'Novo(a)'} ${cfg.singular}</h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body">
        ${state.cadastroError ? `<div class="login-error">${state.cadastroError}</div>` : ''}
        ${cfg.fields.map(f=>campoHtml(f, d)).join('')}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="1">Cancelar</button>
        <button class="btn btn-primary" data-save-cadastro="${key}" ${state.cadastroLoading?'disabled':''}>${state.cadastroLoading?'Salvando...':'Salvar'}</button>
      </div>
    </div>
  </div>`;
}
function lerCampoDOM(f){
  if(f.type==='fixed') return f.value;
  const el = document.getElementById(`f-${f.key}`);
  if(!el) return undefined;
  return f.type==='checkbox' ? el.checked : el.value;
}
async function salvarCadastro(key){
  const cfg = CADASTROS[key];
  const row = {};
  let erro = '';
  cfg.fields.forEach(f=>{
    if(f.type==='computed') return;
    const raw = lerCampoDOM(f);
    if(f.required && (raw===''||raw===undefined||raw===null)) erro = erro || `Preencha o campo "${f.label}".`;
    let val = raw;
    if(f.type==='number') val = (raw===''||raw===undefined||raw===null) ? null : Number(raw);
    if(f.type==='fk') val = raw ? Number(raw) : null;
    if(f.type==='date') val = raw || null;
    if(f.type==='checkbox') val = !!raw;
    row[toSnake(f.key)] = (val===''? null : val);
  });
  if(erro){ state.cadastroError = erro; render(); return; }
  state.cadastroLoading = true; state.cadastroError = ''; render();
  let error;
  if(editDraft._editId){
    ({error} = await db.from(cfg.table).update(row).eq('id', editDraft._editId));
  } else {
    ({error} = await db.from(cfg.table).insert(row));
  }
  state.cadastroLoading = false;
  if(error){ state.cadastroError = mensagemErroSupabase(error); render(); return; }
  state.modal = null; editDraft = null;
  await loadAll();
}

/* ===================== ESTOQUE DE INSUMOS (Tratos culturais) =====================
 * Parametrizado por frente ('Cana' ou 'Graos') — usa as chaves de
 * CADASTROS correspondentes (insumosCana/entradasInsumoCana/
 * aplicacoesCana, ou os equivalentes de Grãos). Saldo e preço médio
 * ponderado não ficam guardados numa coluna — são calculados aqui a
 * partir de Entradas e Aplicações, mesmo padrão do AE Combustível. */
function totalEntradasInsumo(frente, insumoId){
  return state['entradasInsumo'+frente].filter(e=>e.insumoId===insumoId).reduce((a,e)=>a+Number(e.quantidade||0),0);
}
function totalAplicacoesInsumo(frente, insumoId){
  return state['aplicacoes'+frente].filter(a=>a.insumoId===insumoId).reduce((a,x)=>a+Number(x.quantidade||0),0);
}
function saldoInsumo(frente, insumoId){
  return totalEntradasInsumo(frente, insumoId) - totalAplicacoesInsumo(frente, insumoId);
}
function precoMedioInsumo(frente, insumoId){
  const entradas = state['entradasInsumo'+frente].filter(e=>e.insumoId===insumoId && e.precoPago!=null && e.precoPago!=='');
  const qtd = entradas.reduce((a,e)=>a+Number(e.quantidade||0),0);
  if(qtd<=0) return null;
  const valor = entradas.reduce((a,e)=>a+Number(e.quantidade||0)*Number(e.precoPago||0),0);
  return valor/qtd;
}
function pctEstoque(saldo, minimo){
  if(!minimo || minimo<=0) return saldo>0 ? 100 : 0;
  return Math.round(Math.max(0, Math.min(saldo/(minimo*2), 1)) * 100);
}
function PageEstoqueInsumos(frente){
  const categoriasOpt = frente==='Cana' ? OPCOES.CATEGORIAS_INSUMO_CANA : OPCOES.CATEGORIAS_INSUMO_GRAOS;
  const insumos = state['insumos'+frente].filter(i=>i.ativo!==false);
  if(insumos.length===0){
    return `<div class="card">${Empty('Nenhum insumo ativo', `Cadastre um insumo em Operações · ${frente==='Cana'?'Cana':'Grãos'} > Insumos para acompanhar o estoque.`)}</div>`;
  }
  const linhas = insumos.map(i=>{
    const saldo = saldoInsumo(frente, i.id);
    const precoMedio = precoMedioInsumo(frente, i.id);
    const baixo = i.estoqueMinimo!=null && saldo < Number(i.estoqueMinimo);
    return {i, saldo, precoMedio, baixo};
  });
  const valorTotalEstoque = linhas.reduce((a,l)=> a + (l.precoMedio!=null ? l.saldo*l.precoMedio : 0), 0);
  const alertas = linhas.filter(l=>l.baixo).length;
  return `
  <div class="stat-row">
    <div class="stat-card"><div class="stat-label">Insumos cadastrados</div><div class="stat-value">${insumos.length}</div></div>
    <div class="stat-card"><div class="stat-label">Valor aprox. em estoque</div><div class="stat-value">R$ ${fmt(valorTotalEstoque)}</div></div>
    <div class="stat-card"><div class="stat-label">Alertas de estoque baixo</div><div class="stat-value ${alertas>0?'alerta':''}">${alertas}</div></div>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Nível</th><th>Insumo</th><th>Categoria</th><th>Saldo</th><th>Preço médio</th><th>Status</th></tr></thead>
      <tbody>
        ${linhas.map(l=>{
          const pct = pctEstoque(l.saldo, l.i.estoqueMinimo);
          return `
          <tr>
            <td><div class="silo-wrap"><div class="silo"><div class="silo-fill ${l.baixo?'alerta':''}" style="height:${pct}%"></div></div></div></td>
            <td><strong>${l.i.nome}</strong></td>
            <td>${(categoriasOpt.find(o=>o.value===l.i.categoria)||{}).label || '—'}</td>
            <td class="mono">${fmt(l.saldo)} ${l.i.unidade} ${l.i.estoqueMinimo?`<span class="hint">/ mín. ${fmt(l.i.estoqueMinimo)} ${l.i.unidade}</span>`:''}</td>
            <td class="mono">${l.precoMedio==null ? '—' : `R$ ${fmt(l.precoMedio,4)}/${l.i.unidade}`}</td>
            <td>${l.baixo ? '<span class="pill pill-alerta">Estoque baixo</span>' : '<span class="pill pill-ok">Normal</span>'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ===================== FINANCEIRO: CUSTO POR TALHÃO (unificado) =====================
 * Uma tabela só, com TODOS os talhões ativos (cana e grãos juntos) —
 * cada linha usa o conjunto de tabelas certo (aplicacoes_cana/
 * despesas_cana/colheitas_cana OU os equivalentes _graos) de acordo
 * com a frente da Cultura vinculada ao talhão (frenteDoTalhao). Custo
 * de insumo pelo preço médio ponderado; despesa com talhão marcado
 * entra 100% nele; despesa geral (sem talhão) é rateada ENTRE OS
 * TALHÕES DA MESMA FRENTE com plantio ativo, proporcional à área —
 * uma despesa de Grãos nunca dilui o custo de um talhão de Cana e
 * vice-versa, porque os dois ratões são calculados separadamente. */
function custoInsumosTalhao(frente, talhaoId){
  return state['aplicacoes'+frente].filter(a=>a.talhaoId===talhaoId).reduce((a,ap)=>{
    const preco = precoMedioInsumo(frente, ap.insumoId);
    return a + (preco!=null ? Number(ap.quantidade||0)*preco : 0);
  },0);
}
function talhaoEmProducao(frente, t){
  const chave = frente==='Cana' ? 'plantiosCana' : 'plantiosGraos';
  return state[chave].some(p=>p.talhaoId===t.id && p.ativo);
}
function areaTotalEmProducao(frente){
  return state.talhoes.filter(t=>t.ativo!==false && frenteDoTalhao(t)===(frente==='Cana'?'cana':'graos') && talhaoEmProducao(frente,t)).reduce((a,t)=>a+Number(t.areaHa||0),0);
}
function despesasGeraisSemTalhao(frente){
  return state['despesas'+frente].filter(d=>!d.talhaoId).reduce((a,d)=>a+Number(d.valor||0),0);
}
function custoDespesasTalhao(frente, talhaoId){
  const t = state.talhoes.find(x=>x.id===talhaoId);
  const direta = state['despesas'+frente].filter(d=>d.talhaoId===talhaoId).reduce((a,d)=>a+Number(d.valor||0),0);
  let rateio = 0;
  if(t && t.areaHa && talhaoEmProducao(frente,t)){
    const areaTotal = areaTotalEmProducao(frente);
    if(areaTotal>0) rateio = despesasGeraisSemTalhao(frente) * (Number(t.areaHa)/areaTotal);
  }
  return direta + rateio;
}
function producaoTotalTalhao(frente, talhaoId){
  const chave = frente==='Cana' ? 'colheitasCana' : 'colheitasGraos';
  const campo = frente==='Cana' ? 'toneladas' : 'sacas';
  return state[chave].filter(c=>c.talhaoId===talhaoId).reduce((a,c)=>a+Number(c[campo]||0),0);
}
function PageCustoProducao(){
  const talhoes = state.talhoes.filter(t=>t.ativo!==false && frenteDoTalhao(t));
  if(talhoes.length===0){
    return `<div class="card">${Empty('Nenhum talhão com cultura definida','Cadastre um talhão em Cadastros > Talhões, com a Cultura (cana ou grãos) definida, para acompanhar o custo.')}</div>`;
  }
  const linhas = talhoes.map(t=>{
    const frenteChave = frenteDoTalhao(t)==='cana' ? 'Cana' : 'Graos';
    const unidade = frenteChave==='Cana' ? 't' : 'sc';
    const custoInsumos = custoInsumosTalhao(frenteChave, t.id);
    const custoDespesas = custoDespesasTalhao(frenteChave, t.id);
    const custoTotalTalhao = custoInsumos + custoDespesas;
    const producao = producaoTotalTalhao(frenteChave, t.id);
    const custoHa = t.areaHa ? custoTotalTalhao/Number(t.areaHa) : null;
    const custoUnidade = producao>0 ? custoTotalTalhao/producao : null;
    return {t, frenteChave, unidade, custoInsumos, custoDespesas, custoTotalTalhao, producao, custoHa, custoUnidade};
  });
  const totalPorFrente = (chave)=>{
    const doFrente = linhas.filter(l=>l.frenteChave===chave);
    const custoTotal = doFrente.reduce((a,l)=>a+l.custoTotalTalhao,0);
    const areaTotal = doFrente.reduce((a,l)=>a+Number(l.t.areaHa||0),0);
    return {qtdTalhoes:doFrente.length, custoTotal, custoHa: areaTotal>0?custoTotal/areaTotal:null};
  };
  const cana = totalPorFrente('Cana');
  const graos = totalPorFrente('Graos');
  const custoGeral = cana.custoTotal + graos.custoTotal;
  return `
  <div class="stat-row">
    <div class="stat-card"><div class="stat-label">Custo total · Cana</div><div class="stat-value">R$ ${fmt(cana.custoTotal)}</div></div>
    <div class="stat-card"><div class="stat-label">Custo/ha · Cana</div><div class="stat-value">${cana.custoHa==null?'—':'R$ '+fmt(cana.custoHa)}</div></div>
    <div class="stat-card"><div class="stat-label">Custo total · Grãos</div><div class="stat-value">R$ ${fmt(graos.custoTotal)}</div></div>
    <div class="stat-card"><div class="stat-label">Custo/ha · Grãos</div><div class="stat-value">${graos.custoHa==null?'—':'R$ '+fmt(graos.custoHa)}</div></div>
  </div>
  <div class="card" style="overflow-x:auto;">
    <table>
      <thead><tr><th>Talhão</th><th>Frente</th><th>Fazenda</th><th>Área</th><th>Custo insumos</th><th>Custo despesas</th><th>Custo total</th><th>Custo/ha</th><th>Produção</th><th>Custo/unidade</th></tr></thead>
      <tbody>
        ${linhas.map(l=>`
          <tr>
            <td><strong>${l.t.nome}</strong></td>
            <td><span class="pill ${l.frenteChave==='Cana'?'pill-cana':'pill-graos'}">${l.frenteChave==='Cana'?'Cana':'Grãos'}</span></td>
            <td>${fkNome('fazendas', l.t.fazendaId)}</td>
            <td class="mono">${l.t.areaHa?fmt(l.t.areaHa)+' ha':'—'}</td>
            <td class="mono">R$ ${fmt(l.custoInsumos)}</td>
            <td class="mono">R$ ${fmt(l.custoDespesas)}</td>
            <td class="mono">R$ ${fmt(l.custoTotalTalhao)}</td>
            <td class="mono">${l.custoHa==null?'—':'R$ '+fmt(l.custoHa)}</td>
            <td class="mono">${fmt(l.producao)} ${l.unidade}</td>
            <td class="mono">${l.custoUnidade==null?'—':'R$ '+fmt(l.custoUnidade)+'/'+l.unidade}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>
  <p class="hint" style="margin-top:12px;">Custo total da lavoura (Cana + Grãos): R$ ${fmt(custoGeral)}. Custo de insumo pelo preço médio ponderado; aplicação sem nenhuma entrada com preço informado entra com custo zero. Despesa com talhão marcado entra 100% nele; despesa geral (sem talhão) é rateada entre os talhões DA MESMA FRENTE com plantio ativo, proporcional à área de cada um — uma despesa de Grãos nunca é rateada num talhão de Cana, e vice-versa.</p>`;
}

/* ===================== FINANCEIRO: DESPESAS (unificado, por frente) =====================
 * Mesma UI (filtro por mês/centro de custo, gráfico clicável, grupos
 * colapsáveis) do AE Cana original — agora parametrizada por frente e
 * com um seletor Cana/Grãos no topo. Novo/editar/excluir reaproveitam
 * o motor genérico de CADASTROS (despesasCana ou despesasGraos, de
 * acordo com o seletor).
 * Agrupamento é por CENTRO DE CUSTO (centroCustoId) — o mesmo Plano de
 * Contas gerencial do Conag (Centro Gerencial > SubCategoria > Centro
 * de Custo/Receita), com os mesmos nomes já usados lá. NÃO é por
 * fazenda: fazenda/talhão de cada lançamento são campos à parte (o
 * "onde"); centro de custo é o "o quê" foi gasto/recebido. O campo
 * `categoria` (enum antigo, mao_obra/transporte/...) fica fixo em
 * 'outro' só pra satisfazer a constraint do banco — não aparece mais
 * na tela. Ver conversa de 2026-08-19. */
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function mesLabel(yyyyMm){
  const [y,m] = String(yyyyMm).split('-');
  return `${MESES_PT[Number(m)-1]||m}/${y}`;
}
function despesaPorCentroCusto(lista){
  const agreg = new Map();
  lista.forEach(d=>{
    const chave = d.centroCustoId ?? 'sem';
    agreg.set(chave, (agreg.get(chave)||0) + Number(d.valor||0));
  });
  return [...agreg.entries()].map(([chave,total])=>({
    chave, nome: chave==='sem' ? 'Sem centro de custo' : fkNome('centrosCusto', chave), total,
  })).sort((a,b)=>b.total-a.total);
}
/* ---------- DONUT ---------- */
function polarXY(cx, cy, r, ang){ return [cx + r*Math.sin(ang), cy - r*Math.cos(ang)]; }
function donutSlicePath(cx, cy, rOut, rIn, a0, a1){
  const largeArc = (a1-a0) > Math.PI ? 1 : 0;
  const [x0,y0] = polarXY(cx,cy,rOut,a0);
  const [x1,y1] = polarXY(cx,cy,rOut,a1);
  const [x2,y2] = polarXY(cx,cy,rIn,a1);
  const [x3,y3] = polarXY(cx,cy,rIn,a0);
  return `M ${x0} ${y0} A ${rOut} ${rOut} 0 ${largeArc} 1 ${x1} ${y1} L ${x2} ${y2} A ${rIn} ${rIn} 0 ${largeArc} 0 ${x3} ${y3} Z`;
}
const DONUT_PALETTE = ['#1B4332','#2D6A4F','#40916C','#74C69D','#95D5B2','#C98A2B','#E0A458','#8A5A2B','#B3462F','#D98A73','#4A5A7A','#6E7BA6','#2E4057','#7A5C61','#A6798E','#65758A'];
function corCentroCusto(idx){ return DONUT_PALETTE[idx % DONUT_PALETTE.length]; }
const LIMITE_PCT_OUTROS = 3;
function donutChart(entries, opts){
  opts = opts || {};
  const totalGeral = entries.reduce((a,e)=>a+e.total,0);
  if(entries.length===0 || totalGeral<=0){
    return `<div class="card">${Empty('Sem despesa para compor o gráfico', 'Lance uma despesa para ver o gráfico.')}</div>`;
  }
  const principais = entries.filter(e => (e.total/totalGeral*100) >= LIMITE_PCT_OUTROS);
  const pequenas = entries.filter(e => (e.total/totalGeral*100) < LIMITE_PCT_OUTROS);
  const agrupadas = pequenas.length>0
    ? [...principais, {chave:'outros', nome:`Outros (${pequenas.length})`, total: pequenas.reduce((a,e)=>a+e.total,0)}]
    : principais;
  const total = totalGeral;
  const cx=110, cy=110, rOut=100, rIn=64;
  const gap = agrupadas.length>1 ? 0.025 : 0;
  let angle = 0;
  const slices = agrupadas.map((e,idx)=>{
    const frac = total>0 ? e.total/total : 0;
    const sweep = frac*Math.PI*2;
    const a0 = angle + gap/2;
    const a1 = angle + sweep - gap/2;
    angle += sweep;
    const path = donutSlicePath(cx,cy,rOut,rIn,a0,a1);
    const midAngle = (a0+a1)/2;
    const [lx,ly] = polarXY(cx,cy,(rOut+rIn)/2,midAngle);
    const pct = frac*100;
    const showLabel = pct>=6;
    const clicavel = !!opts.clicavel && e.chave!=='outros';
    return `
      <path class="donut-slice" ${clicavel?`data-donut-centro="${e.chave}"`:'style="cursor:default;"'} d="${path}" fill="${corCentroCusto(idx)}"
        tabindex="0" role="img" aria-label="${e.nome}: R$ ${fmt(e.total)}, ${fmt(pct,1)}%"></path>
      ${showLabel ? `<text class="donut-label" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${fmt(pct,0)}%</text>` : ''}
    `;
  }).join('');

/* ===================== RESULTADOS: RESULTADO (Cana, Grãos e Geral) =====================
 * Junta Receita (receitas_cana/receitas_graos) com Despesas gerais e
 * custo de insumo de cada frente — sem guardar nada à parte. O bloco
 * "Geral" soma as duas frentes: é a resposta direta para "quanto a
 * lavoura inteira deu de lucro" (o que o AE Matriz também vai
 * enxergar, lendo este mesmo indicador). Resultado/ha de cada frente
 * usa a área EM PRODUÇÃO daquela frente (talhões com plantio ativo) —
 * mais correto que usar a área total das fazendas (que inclui hectares
 * de outra frente, ou nenhuma). O bloco Geral usa a soma das duas
 * áreas em produção. */
function resultadoFrente(frente){
  const cfgReceita = frente==='Cana' ? 'receitasCana' : 'receitasGraos';
  const receitaTotal = state[cfgReceita].reduce((a,r)=>a+Number(r.valorTotal||0),0);
  const despesasGerais = state['despesas'+frente].reduce((a,d)=>a+Number(d.valor||0),0);
  const talhoesFrente = state.talhoes.filter(t=>t.ativo!==false && frenteDoTalhao(t)===(frente==='Cana'?'cana':'graos'));
  const custoInsumoTotal = talhoesFrente.reduce((a,t)=>a+custoInsumosTalhao(frente,t.id),0);
  const despesaTotal = despesasGerais + custoInsumoTotal;
  const resultado = receitaTotal - despesaTotal;
  const areaProducao = areaTotalEmProducao(frente);
  const resultadoHa = areaProducao>0 ? resultado/areaProducao : null;
  return {receitaTotal, despesasGerais, custoInsumoTotal, despesaTotal, resultado, areaProducao, resultadoHa};
}
function blocoResultado(titulo, r, extraClass){
  return `
  <div class="frente-bloco ${extraClass||''}">
    <div class="frente-bloco-titulo"><h3>${titulo}</h3></div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-label">Receita</div><div class="stat-value">R$ ${fmt(r.receitaTotal)}</div></div>
      <div class="stat-card"><div class="stat-label">Despesa</div><div class="stat-value">R$ ${fmt(r.despesaTotal)}</div></div>
      <div class="stat-card"><div class="stat-label">Resultado</div><div class="stat-value ${r.resultado<0?'alerta':''}">R$ ${fmt(r.resultado)}</div></div>
      <div class="stat-card"><div class="stat-label">Resultado / hectare</div><div class="stat-value ${r.resultadoHa!=null&&r.resultadoHa<0?'alerta':''}">${r.resultadoHa==null?'—':'R$ '+fmt(r.resultadoHa)}</div></div>
    </div>
  </div>`;
}
function PageResultado(){
  const cana = resultadoFrente('Cana');
  const graos = resultadoFrente('Graos');
  const geral = {
    receitaTotal: cana.receitaTotal + graos.receitaTotal,
    despesaTotal: cana.despesaTotal + graos.despesaTotal,
    resultado: cana.resultado + graos.resultado,
    areaProducao: cana.areaProducao + graos.areaProducao,
  };
  geral.resultadoHa = geral.areaProducao>0 ? geral.resultado/geral.areaProducao : null;
  const porFrenteDonut = [
    {chave:'cana', nome:'Cana', total: Math.max(0,cana.resultado)},
    {chave:'graos', nome:'Grãos', total: Math.max(0,graos.resultado)},
  ].filter(e=>e.total>0);
  return `
  ${blocoResultado('Geral da empresa (Cana + Grãos)', geral)}
  ${blocoResultado('Cana', cana)}
  ${blocoResultado('Grãos', graos, 'graos')}
  ${porFrenteDonut.length>0 ? donutChart(porFrenteDonut, {titulo:'Resultado positivo por frente', centroLabel:'lucro'}) : ''}
  <p class="hint" style="margin-top:4px;">Resultado por hectare usa a área EM PRODUÇÃO de cada frente (talhões com plantio ativo) — não a área total das fazendas, para não diluir o resultado de uma frente com hectares que são da outra (ou de nenhuma). Ainda não separa por safra/período — mostra o acumulado de tudo que foi lançado.</p>`;
}

/* ===================== HISTÓRICO DO TALHÃO =====================
 * Ramifica por frente (frenteDoTalhao) — usa colheitas_cana/
 * aplicacoes_cana para talhão de cana, colheitas_graos/aplicacoes_graos
 * para talhão de grãos. Não guarda nada à parte: lê direto dos dois
 * módulos, então fica sempre conciliado com o que já foi lançado. */
function ModalHistoricoTalhao(){
  const talhaoId = state.modal.talhaoId;
  const t = state.talhoes.find(x=>x.id===talhaoId);
  if(!t) return '';
  const frente = frenteDoTalhao(t);
  if(!frente){
    return `
    <div class="overlay" data-close-overlay="1">
      <div class="modal modal-lg" data-stop="1">
        <div class="modal-head"><h3>Histórico — ${t.nome}</h3><button class="modal-close" data-close="1">&times;</button></div>
        <div class="modal-body">${Empty('Talhão sem cultura definida','Defina a Cultura deste talhão em Cadastros > Talhões (Cana ou Grãos) para ver o histórico.')}</div>
        <div class="modal-foot"><button class="btn btn-ghost" data-close="1">Fechar</button></div>
      </div>
    </div>`;
  }
  const frenteChave = frente==='cana' ? 'Cana' : 'Graos';
  const unidade = frenteChave==='Cana' ? 't' : 'sc';
  const campoQtd = frenteChave==='Cana' ? 'toneladas' : 'sacas';
  const chaveColheitas = frenteChave==='Cana' ? 'colheitasCana' : 'colheitasGraos';
  const chaveAplicacoes = frenteChave==='Cana' ? 'aplicacoesCana' : 'aplicacoesGraos';
  const chaveInsumos = frenteChave==='Cana' ? 'insumosCana' : 'insumosGraos';
  const categoriasOpt = frenteChave==='Cana' ? OPCOES.CATEGORIAS_INSUMO_CANA : OPCOES.CATEGORIAS_INSUMO_GRAOS;

  const colheitasDoTalhao = state[chaveColheitas].filter(c=>c.talhaoId===talhaoId).sort((a,b)=> (b.data||'').localeCompare(a.data||''));
  const producaoTotal = colheitasDoTalhao.reduce((a,c)=>a+Number(c[campoQtd]||0),0);
  const produtividadeMedia = t.areaHa ? producaoTotal/Number(t.areaHa)/(colheitasDoTalhao.length||1) : null;

  const aplicacoesDoTalhao = state[chaveAplicacoes].filter(a=>a.talhaoId===talhaoId);
  const porInsumo = {};
  aplicacoesDoTalhao.forEach(a=>{
    if(!porInsumo[a.insumoId]) porInsumo[a.insumoId] = 0;
    porInsumo[a.insumoId] += Number(a.quantidade||0);
  });
  const linhasInsumo = Object.entries(porInsumo).map(([insumoId,total])=>{
    const insumo = state[chaveInsumos].find(x=>x.id===Number(insumoId));
    return {
      nome: insumo?.nome || '—',
      categoria: (categoriasOpt.find(o=>o.value===insumo?.categoria)||{}).label || '—',
      total, unidade: insumo?.unidade || '',
    };
  }).sort((a,b)=> a.nome.localeCompare(b.nome));

  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal modal-lg" data-stop="1">
      <div class="modal-head"><h3>Histórico — ${t.nome} <span class="pill ${frenteChave==='Cana'?'pill-cana':'pill-graos'}" style="margin-left:8px;">${frenteChave==='Cana'?'Cana':'Grãos'}</span></h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body">
        <p class="hint">${fkNome('fazendas', t.fazendaId)} · ${t.areaHa ? fmt(t.areaHa)+' ha' : 'área não informada'}</p>

        <div class="stat-row" style="grid-template-columns:repeat(3,1fr);">
          <div class="stat-card"><div class="stat-label">Número de colheitas</div><div class="stat-value">${colheitasDoTalhao.length}</div></div>
          <div class="stat-card"><div class="stat-label">Produção total</div><div class="stat-value">${fmt(producaoTotal)} ${unidade}</div></div>
          <div class="stat-card"><div class="stat-label">${frenteChave==='Cana'?'TCH médio':'Produtividade média'}</div><div class="stat-value">${produtividadeMedia==null?'—':fmt(produtividadeMedia)+' '+unidade+'/ha'}</div></div>
        </div>

        <h4 style="font-family:'Fraunces',serif; color:var(--verde-escuro); margin:4px 0;">${frenteChave==='Cana'?'Colheitas (cortes)':'Colheitas'}</h4>
        ${colheitasDoTalhao.length===0 ? `<p class="hint">Nenhuma colheita registrada para este talhão.</p>` : `
        <table>
          <thead><tr><th>Data</th>${frenteChave==='Cana'?'<th>Corte</th>':''}<th>${unidade==='t'?'Toneladas':'Sacas'}</th><th>${frenteChave==='Cana'?'TCH':'Produtividade'}</th></tr></thead>
          <tbody>
            ${colheitasDoTalhao.map(c=>`
              <tr>
                <td>${fmtData(c.data)}</td>
                ${frenteChave==='Cana'?`<td>${c.corte ?? '—'}</td>`:''}
                <td class="mono">${fmt(c[campoQtd])} ${unidade}</td>
                <td class="mono">${t.areaHa ? fmt(Number(c[campoQtd]||0)/Number(t.areaHa)) + ' '+unidade+'/ha' : '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}

        <h4 style="font-family:'Fraunces',serif; color:var(--verde-escuro); margin:16px 0 4px 0;">Insumos aplicados</h4>
        ${linhasInsumo.length===0 ? `<p class="hint">Nenhuma aplicação registrada para este talhão.</p>` : `
        <table>
          <thead><tr><th>Insumo</th><th>Categoria</th><th>Total aplicado</th></tr></thead>
          <tbody>
            ${linhasInsumo.map(l=>`
              <tr>
                <td><strong>${l.nome}</strong></td>
                <td>${l.categoria}</td>
                <td class="mono">${fmt(l.total)} ${l.unidade}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="1">Fechar</button>
      </div>
    </div>
  </div>`;
}

function Modal(){
  if(state.modal.type==='cadastro') return ModalCadastro();
  if(state.modal.type==='usuario') return ModalUsuario();
  if(state.modal.type==='permissoes') return ModalPermissoes();
  if(state.modal.type==='trocarSenha') return ModalTrocarSenha();
  if(state.modal.type==='historicoTalhao') return ModalHistoricoTalhao();
  return '';
}

/* ===================== EVENTOS ===================== */
function attachEvents(){
  const loginForm = document.querySelector('[data-login-form]');
  if(loginForm){
    loginForm.onsubmit = (e)=>{ e.preventDefault(); fazerLogin(); };
    const uEl = document.querySelector('[data-login-usuario]');
    const sEl = document.querySelector('[data-login-senha]');
    if(uEl) uEl.oninput = (e)=>{ state.loginDraft.usuario = e.target.value; };
    if(sEl) sEl.oninput = (e)=>{ state.loginDraft.senha = e.target.value; };
  }
  document.querySelectorAll('[data-logout]').forEach(el=>{ el.onclick = ()=> fazerLogout(); });
  document.querySelectorAll('[data-trocar-senha-abrir]').forEach(el=>{
    el.onclick = ()=>{ editDraft = {senhaAtual:'', novaSenha:'', confirmarSenha:''}; state.modal = {type:'trocarSenha'}; render(); };
  });
  document.querySelectorAll('[data-novo-usuario]').forEach(el=>{
    el.onclick = ()=>{ editDraft = {nome:'', usuario:'', senha:''}; state.usuarioError=''; state.modal = {type:'usuario'}; render(); };
  });
  document.querySelectorAll('[data-editar-usuario]').forEach(el=>{
    el.onclick = ()=>{
      const perfil = state.perfis.find(p=>p.id===el.dataset.editarUsuario);
      editDraft = {_perfilId: perfil.id, nome: perfil.nome, usuario: perfil.usuario, papel: perfil.papel, ativo: perfil.ativo, permissoes: {...perfil.permissoes}};
      state.modal = {type:'permissoes'}; render();
    };
  });
  const criarUsuarioBtn = document.querySelector('[data-criar-usuario]');
  if(criarUsuarioBtn){
    criarUsuarioBtn.onclick = async ()=>{
      const nome = document.getElementById('f-nomeusuario').value.trim();
      const usuario = document.getElementById('f-usuario').value.trim();
      const senha = document.getElementById('f-senhausuario').value;
      if(!nome || !usuario || !senha){ state.usuarioError = 'Preencha nome, usuário e senha.'; render(); return; }
      state.usuarioLoading = true; state.usuarioError = ''; render();
      const { data, error } = await db.functions.invoke('criar-usuario-cana', { body: { nome, usuario, senha } });
      state.usuarioLoading = false;
      if(error || data?.error){
        let msg = data?.error || error?.message || 'Falha ao criar usuário.';
        if(error?.context && typeof error.context.json === 'function'){
          try { const corpo = await error.context.json(); if(corpo?.error) msg = corpo.error; } catch(e){}
        }
        state.usuarioError = msg; render(); return;
      }
      state.modal = null; editDraft = null;
      await loadAll();
    };
  }
  const searchEl = document.querySelector('[data-search]');
  if(searchEl){
    searchEl.oninput = (e)=>{
      state.search = e.target.value; render();
      const s = document.querySelector('[data-search]');
      s.focus(); s.setSelectionRange(s.value.length, s.value.length);
    };
  }
  document.querySelectorAll('[data-nav-group]').forEach(el=>{
    el.onclick = ()=>{
      const group = GROUPS[el.dataset.navGroup];
      if(!group.pages.some(p=>p.key===state.page)){
        state.page = group.pages[0].key;
      }
      render();
    };
  });
  document.querySelectorAll('[data-subnav]').forEach(el=>{
    el.onclick = ()=>{ state.page = el.dataset.subnav; render(); };
  });
  document.querySelectorAll('[data-novo-cadastro]').forEach(el=>{
    el.onclick = ()=>{
      const presets = el.dataset.presetFazenda ? {fazendaId:Number(el.dataset.presetFazenda)} : null;
      abrirNovoCadastro(el.dataset.novoCadastro, presets);
      render();
    };
  });
  document.querySelectorAll('[data-fazenda-talhoes-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const id = Number(el.dataset.fazendaTalhoesToggle);
      state.fazendaTalhoesAbertos[id] = !state.fazendaTalhoesAbertos[id];
      render();
    };
  });
  document.querySelectorAll('[data-edit-cadastro]').forEach(el=>{
    el.onclick = ()=>{
      const [key, idStr] = el.dataset.editCadastro.split(':');
      abrirEditarCadastro(key, Number(idStr));
      render();
    };
  });
  document.querySelectorAll('[data-historico-talhao]').forEach(el=>{
    el.onclick = ()=>{
      state.modal = {type:'historicoTalhao', talhaoId:Number(el.dataset.historicoTalhao)};
      render();
    };
  });
  document.querySelectorAll('[data-despesa-frente]').forEach(el=>{
    el.onclick = ()=>{ state.despesaFrenteAtual = el.dataset.despesaFrente; state.despesaFiltroMes=''; state.despesaFiltroCentro=''; render(); };
  });
  document.querySelectorAll('[data-receita-frente]').forEach(el=>{
    el.onclick = ()=>{ state.receitaFrenteAtual = el.dataset.receitaFrente; render(); };
  });
  const despesaMesEl = document.querySelector('[data-despesa-filtro-mes]');
  if(despesaMesEl) despesaMesEl.onchange = (e)=>{ state.despesaFiltroMes = e.target.value; render(); };
  const despesaCentroEl = document.querySelector('[data-despesa-filtro-centro]');
  if(despesaCentroEl) despesaCentroEl.onchange = (e)=>{ state.despesaFiltroCentro = e.target.value; render(); };
  document.querySelectorAll('[data-despesa-filtro-centro-bar]').forEach(el=>{
    el.onclick = ()=>{
      const chave = el.dataset.despesaFiltroCentroBar;
      state.despesaFiltroCentro = String(state.despesaFiltroCentro)===String(chave) ? '' : chave;
      render();
    };
  });
  document.querySelectorAll('[data-despesa-grupo-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const chave = el.dataset.despesaGrupoToggle;
      state.despesaGruposAbertos[chave] = !state.despesaGruposAbertos[chave];
      render();
    };
  });
  document.querySelectorAll('[data-del-cadastro]').forEach(el=>{
    el.onclick = async ()=>{
      const [key, idStr] = el.dataset.delCadastro.split(':');
      await excluirCadastro(key, Number(idStr));
    };
  });
  const saveCadastroBtn = document.querySelector('[data-save-cadastro]');
  if(saveCadastroBtn){
    saveCadastroBtn.onclick = ()=> salvarCadastro(saveCadastroBtn.dataset.saveCadastro);
  }
  document.querySelectorAll('[data-close], [data-close-overlay]').forEach(el=>{
    el.onclick = (e)=>{ if(e.target.dataset.stop) return; state.modal = null; editDraft = null; render(); };
  });
  const stopEl = document.querySelector('[data-stop]');
  if(stopEl) stopEl.onclick = (e)=> e.stopPropagation();

  const saveBtn = document.querySelector('[data-save]');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const type = saveBtn.dataset.save;
      let error = null;
      if(type==='permissoes'){
        const papel = document.getElementById('f-papelusuario').value;
        const ativo = document.getElementById('f-ativousuario').checked;
        const permissoes = {};
        document.querySelectorAll('[data-perm-modulo]').forEach(sel=>{ permissoes[sel.dataset.permModulo] = sel.value; });
        ({error} = await db.from('profiles').update({papel, ativo, permissoes}).eq('id', editDraft._perfilId));
      } else if(type==='trocarSenha'){
        const senhaAtual = document.getElementById('f-senhaatual').value;
        const novaSenha = document.getElementById('f-novasenha').value;
        const confirmarSenha = document.getElementById('f-confirmarsenha').value;
        if(!senhaAtual || !novaSenha || !confirmarSenha){ alert('Preencha todos os campos.'); return; }
        if(novaSenha.length<6){ alert('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
        if(novaSenha!==confirmarSenha){ alert('A confirmação não bate com a nova senha.'); return; }
        const email = `${state.perfil.usuario}@${DOMINIO_LOGIN}`;
        const { error: erroSenhaAtual } = await db.auth.signInWithPassword({ email, password: senhaAtual });
        if(erroSenhaAtual){ alert('Senha atual incorreta.'); return; }
        ({error} = await db.auth.updateUser({ password: novaSenha }));
        if(error){ alert('Não foi possível trocar a senha: ' + error.message); return; }
        state.modal = null; editDraft = null;
        alert('Senha alterada com sucesso.');
        render();
        return;
      }
      if(error){ alert('Não foi possível salvar: ' + error.message); return; }
      state.modal = null; editDraft = null;
      await loadAll();
    };
  }
}

initAuth();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw_lavoura.js'));
}
</script>
</body>
</html>
