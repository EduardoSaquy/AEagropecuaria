<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AE Matriz</title>
<link rel="manifest" href="manifest_matriz.json">
<link rel="icon" href="icon-matriz-192.png">
<link rel="apple-touch-icon" href="icon-matriz-192.png">
<meta name="theme-color" content="#173D2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-escuro:#173D2E;
    --verde-medio:#158A4C;
    --verde-vivo:#00BE5E;
    --verde-vivo-escuro:#008C31;
    --verde-claro:#DFF6E8;
    --dourado-escuro:#6B4413;
    --dourado-medio:#A6741F;
    --dourado-claro:#E3C371;
    --dourado-bg:#F7EFDC;
    --grafite:#1A2430;
    --cinza:#5B6B7A;
    --cinza-claro:#E1E7EE;
    --cinza-bg:#F5F7FA;
    --chip-bg:#F0F1F3;
    --chip-color:#6B7280;
    --branco:#FFFFFF;
    --trigo:#C98A2B;
    --ambar:#C98A2B;
    --ambar-bg:#F5E9D7;
    --alerta:#C0432B;
    --alerta-bg:#FBEAE6;
    --ok-bg:#E3F1EA;
    --bom:#008C31;
    --bom-bg:#DFF6E8;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,42,74,0.04), 0 8px 24px rgba(15,42,74,0.06);
    --shadow-lift:0 10px 24px rgba(15,42,74,0.12), 0 2px 6px rgba(15,42,74,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--cinza-bg);
    color:var(--grafite);
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; flex-direction:column; height:100vh; overflow:hidden;}
  /* ---------- TOPBAR + TABSROW ---------- */
  .topbar{background:var(--verde-escuro); padding:0 28px; display:flex; align-items:center; gap:20px; height:60px; flex-shrink:0;}
  .brand{display:flex; align-items:center; gap:10px; color:#fff;}
  .brand-mark{width:26px; height:26px; flex-shrink:0;}
  .brand-name{font-family:'Fraunces',serif; font-weight:700; font-size:18px; letter-spacing:0.2px;}
  .topbar-user{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .topbar-user-nome{color:rgba(255,255,255,0.85); font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px;}
  .avatar{width:28px; height:28px; border-radius:50%; background:var(--verde-vivo); color:#0B2318; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;}
  .btn-sair{background:rgba(255,255,255,0.1); border:none; color:#fff; padding:7px 11px; border-radius:8px; font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .btn-sair:hover{background:rgba(255,255,255,0.2);}
  .tabsrow{background:var(--branco); border-bottom:1px solid var(--cinza-claro); display:flex; gap:6px; padding:10px 20px; overflow-x:auto; flex-shrink:0;}
  .nav-item{display:flex; align-items:center; gap:7px; font-family:'Inter',sans-serif; font-size:13px; font-weight:700; color:var(--cinza); background:none; border:none; padding:9px 14px; border-radius:10px; cursor:pointer; white-space:nowrap; transition:background 0.12s, color 0.12s;}
  .nav-item svg{opacity:0.72; flex-shrink:0;}
  .nav-item:hover{background:var(--cinza-bg); color:var(--verde-escuro);}
  .nav-item.active{background:var(--verde-vivo); color:#0B2318;}
  .nav-item.active svg{opacity:1;}
  /* ---------- MAIN ---------- */
  .main{flex:1; padding:28px 32px 60px 32px; max-width:1280px; width:100%; margin:0 auto; overflow-y:auto;}
  .page-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--verde-medio); font-weight:700; margin:0 0 4px 0;}
  h1{font-family:'Fraunces',serif; font-size:26px; font-weight:700; margin:0; color:var(--grafite); letter-spacing:-0.2px;}
  .page-desc{color:var(--cinza); font-size:13.5px; margin-top:6px; max-width:600px;}
  .btn{
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700; padding:10px 18px; border-radius:10px;
    border:none; cursor:pointer; transition:filter 0.15s, transform 0.1s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--verde-vivo); color:#0B2318;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:var(--branco); color:var(--verde-escuro); border:1px solid var(--cinza-claro);}
  .btn-ghost:hover{background:var(--cinza-bg);}
  .btn-danger-ghost{background:var(--branco); color:var(--alerta); border:1px solid var(--cinza-claro); padding:6px 10px; font-size:12px;}
  .btn-danger-ghost:hover{background:var(--alerta-bg);}
  .btn-sm{padding:7px 13px; font-size:12.5px;}

  .card{background:var(--branco); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--cinza-claro); overflow-x:auto;}
  .card-pad{padding:22px 24px;}
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px;}
  .stat-card{background:var(--branco); border:1px solid var(--cinza-claro); border-radius:var(--radius); padding:18px 20px;}
  .stat-card-ic{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
  .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:0.7px; color:var(--cinza); font-weight:700;}
  .stat-value{font-family:'IBM Plex Mono',monospace; font-size:23px; font-weight:600; color:var(--grafite); margin-top:8px;}
  .stat-value.alerta{color:var(--alerta);}
  .stat-value.bom{color:var(--bom);}

  .op-chip{display:inline-flex; align-items:center; gap:8px; white-space:nowrap;}
  .op-chip-ic{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  /* ---------- FILTRO DE PERÍODO (Resultados) ---------- */
  .periodo-tabs{display:inline-flex; background:var(--cinza-bg); border-radius:9px; padding:3px; gap:2px;}
  .periodo-tab{font-family:'Inter',sans-serif; font-size:12.5px; font-weight:700; padding:7px 16px; border-radius:7px; border:none; background:none; color:var(--cinza); cursor:pointer;}
  .periodo-tab:hover{color:var(--verde-escuro);}
  .periodo-tab.active{background:var(--branco); color:var(--verde-escuro); box-shadow:var(--shadow);}
  .valor-clicavel{
    background:none; border:none; padding:2px 6px; border-radius:5px; font-family:'IBM Plex Mono',monospace;
    font-size:13.5px; color:var(--verde-medio); cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px;
  }
  .valor-clicavel:hover{background:var(--ok-bg);}
  .valor-clicavel.neg{color:var(--alerta);}
  .grafico-barras-svg{display:block; width:100%; height:auto;}
  .gbar{cursor:pointer;}
  .gbar:hover{opacity:0.82;}

  /* ---------- DONUTS (Resultados por operação) ---------- */
  .donuts-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:18px; margin-bottom:22px;}
  .painel-resultados{display:flex; gap:26px; align-items:center; flex-wrap:wrap;}
  .donut-wrap{flex-shrink:0;}
  .donut-svg{display:block;}
  .donut-slice{cursor:pointer; transition:opacity 0.15s;}
  .donut-slice:hover, .donut-slice.hover{opacity:0.82;}
  .donut-slice:focus{outline:2px solid var(--verde-medio); outline-offset:2px;}
  .donut-label{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; fill:#fff; pointer-events:none;}
  .donut-center-value{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; fill:var(--grafite);}
  .donut-center-label{font-family:'Inter',sans-serif; font-size:9.5px; fill:var(--cinza); text-transform:uppercase; letter-spacing:0.5px;}
  .painel-legenda{flex:1; min-width:180px; display:flex; flex-direction:column; gap:2px;}
  .legenda-row{display:grid; grid-template-columns:12px 1fr auto auto; align-items:center; gap:10px; padding:7px 8px; border-radius:8px;}
  .legenda-row:hover, .legenda-row.hover{background:var(--cinza-bg);}
  .legenda-swatch{width:12px; height:12px; border-radius:3px; flex-shrink:0;}
  .legenda-nome{font-size:13px; color:var(--grafite);}
  .legenda-valor{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--grafite); font-variant-numeric:tabular-nums;}
  .legenda-pct{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--cinza); min-width:48px; text-align:right; font-variant-numeric:tabular-nums;}
  .painel-tooltip{
    position:fixed; pointer-events:none; z-index:80; display:none; max-width:220px;
    background:var(--verde-escuro); color:#fff; padding:8px 12px; border-radius:8px;
    font-size:12.5px; box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .painel-tooltip .v{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;}
  .painel-tooltip .l{font-size:11px; color:rgba(255,255,255,0.75); margin-top:2px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--cinza); font-weight:700; padding:13px 14px; border-bottom:1px solid var(--cinza-claro); white-space:nowrap;}
  td{padding:13px 14px; border-bottom:1px solid var(--cinza-claro); color:var(--grafite); vertical-align:middle;}
  tbody tr:hover td{background:var(--cinza-bg);}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .pill{display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;}
  .pill-ok{background:var(--ok-bg); color:var(--verde-vivo-escuro);}
  .pill-alerta{background:var(--alerta-bg); color:var(--alerta);}
  .pill-cat{background:var(--chip-bg); color:var(--chip-color); border-radius:8px; font-weight:600;}
  .pill-warn{background:var(--ambar-bg); color:var(--ambar);}

  /* form modal */
  .overlay{position:fixed; inset:0; background:rgba(23,61,46,0.4); display:flex; align-items:flex-start; justify-content:center; padding:50px 20px; overflow-y:auto; z-index:50;}
  .modal{background:var(--branco); border-radius:16px; width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal-head{padding:20px 24px; border-bottom:1px solid var(--cinza-claro); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h3{font-family:'Fraunces',serif; font-size:18px; margin:0; color:var(--grafite);}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--cinza);font-size:20px; line-height:1;}
  .modal-body{padding:22px 24px; display:flex; flex-direction:column; gap:14px; max-height:70vh; overflow-y:auto;}
  .modal-foot{padding:16px 24px; border-top:1px solid var(--cinza-claro); display:flex; justify-content:flex-end; gap:10px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  label{font-size:12px; font-weight:600; color:var(--grafite);}
  input, select, textarea{
    font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 12px; border:1px solid var(--cinza-claro);
    border-radius:9px; background:var(--branco); color:var(--grafite); outline:none; width:100%;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--verde-vivo); box-shadow:0 0 0 3px rgba(0,190,94,0.14);}
  input[type=color]{padding:3px; height:38px; width:100%;}
  .hint{font-size:11px; color:var(--cinza);}
  .total-bar{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:8px; background:var(--cinza-bg); font-size:13px;}
  .total-bar.ok{color:var(--verde-medio); font-weight:600;}

  .empty{text-align:center; padding:50px 20px; color:var(--cinza);}
  .empty h4{font-family:'Fraunces',serif; color:var(--grafite); margin:10px 0 6px 0; font-size:16px;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--cinza-bg);}
  .login-card{background:var(--branco); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.12); border:1px solid var(--cinza-claro); padding:40px 36px; width:100%; max-width:380px;}
  .login-brand{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .login-brand .brand-name{color:var(--grafite); font-family:'Fraunces',serif; font-weight:700; font-size:19px;}
  .login-tagline{font-size:12.5px; color:var(--cinza); line-height:1.5; margin:0 0 26px 0;}
  .login-field{margin-bottom:16px; display:flex; flex-direction:column; gap:5px;}
  .login-field input{width:100%;}
  .login-error{background:var(--alerta-bg); color:var(--alerta); font-size:13px; padding:10px 12px; border-radius:9px; margin-bottom:16px;}
  .login-btn{width:100%; margin-top:6px; justify-content:center;}
  .login-btn:disabled{opacity:0.6; cursor:default;}
  .login-loading{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--cinza); font-size:14px;}

  .status-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px;}
  .status-dot.ativo{background:var(--bom);}
  .status-dot.inativo{background:var(--cinza);}

  /* ---------- PAINEL: cards de app ---------- */
  .app-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:18px;}
  .app-card{
    background:var(--branco); border:1px solid var(--cinza-claro); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow);
    position:relative; overflow:hidden; display:flex; flex-direction:column; gap:12px;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  .app-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--app-cor, var(--verde-vivo));
  }
  .app-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift);}
  .app-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .app-card-icon{
    width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .app-card-titles{flex:1; min-width:0;}
  .app-card-nome{font-family:'Fraunces',serif; font-weight:700; font-size:17px; color:var(--grafite); line-height:1.25;}
  .app-card-desc{font-size:12.5px; color:var(--cinza); line-height:1.55;}
  .app-card-stats{display:flex; gap:20px; flex-wrap:wrap; margin-top:4px; padding-top:12px; border-top:1px dashed var(--cinza-claro);}
  .app-card-stat .v{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--grafite); font-size:17px;}
  .app-card-stat .l{font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--cinza);}
  .app-card-actions{display:flex; gap:8px; margin-top:auto; padding-top:6px;}
  .badge-em-breve{background:var(--cinza-claro); color:var(--cinza);}

  /* ---------- RESPONSIVO (celular) ---------- */
  @media (max-width:760px){
    .app{height:auto; overflow:visible;}
    .topbar{padding:10px 14px; height:auto; flex-wrap:wrap; row-gap:8px; position:-webkit-sticky; position:sticky; top:0; z-index:40;}
    .topbar-user-nome{display:none;}
    .tabsrow{padding:8px 10px; position:-webkit-sticky; position:sticky; top:0; z-index:39;}
    .nav-item{padding:8px 11px; font-size:12.5px;}
    .main{padding:20px 16px 48px 16px; max-width:100%; overflow-y:visible;}
    .page-header{flex-direction:column; align-items:flex-start; gap:14px;}
    h1{font-size:22px;}
    .btn{width:100%; justify-content:center;}
    .stat-row{grid-template-columns:1fr; gap:10px;}
    .donuts-row{grid-template-columns:1fr;}
    .toolbar{flex-direction:column; align-items:stretch;}
    .card{overflow-x:auto; -webkit-overflow-scrolling:touch;}
    .field-row{grid-template-columns:1fr;}
    .overlay{padding:16px 10px;}
    .app-grid{grid-template-columns:1fr;}
    .painel-resultados{flex-direction:column; align-items:stretch; gap:14px;}
    .donut-wrap{align-self:center;}
    .painel-legenda{min-width:0; width:100%;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== SUPABASE ===================== */
// AE Matriz não tem projeto Supabase próprio (limite do plano gratuito
// esgotado) — reaproveita o projeto real do AE Lavoura, que já tem
// fazendas, culturas, talhões e os dados de cana + grãos (Cana e Cereais
// foram unificados no AE Lavoura). Login/perfis também vêm de lá
// (profiles compartilhado — mesmo DOMINIO_LOGIN dos dois apps).
const db = supabase.createClient(
  'https://kmkystqgpvmzrccxvyaz.supabase.co',
  'sb_publishable_YclssD8pzNZhWO_Om0anMg_SwaZHQOa'
);

// Cliente extra, só de leitura, apontando pro projeto da Pecuária —
// usado para os indicadores ao vivo do card "AE Pecuária" no Painel.
// Não duplica dado nenhum: cada consulta lê direto do banco da Pecuária.
// Requer políticas de leitura liberadas pro anon key nas tabelas usadas
// aqui (a Pecuária guarda RLS por permissão de usuário logado — ver
// script de políticas fornecido separadamente).
const dbPecuaria = supabase.createClient(
  'https://leojfqlbdtlriemdgnyw.supabase.co',
  'sb_publishable_IYD9cnj_7tlul7K5zs5YHg_kv5YvzjB'
);

// AE Combustível ainda não foi implantado com banco real — o card dele
// fica "em breve" no Painel por enquanto (ver APPS_REGISTRO) e
// carregarCombustivel() abaixo não faz nenhuma chamada de rede. Quando o
// schema for desenhado, ele entra no mesmo projeto do Lavoura (db acima),
// sem precisar de projeto Supabase novo.

// Cadastro de fazenda foi centralizado aqui no Matriz (era espalhado entre
// Lavoura e Pecuária) — este app agora é o único que cria/edita/exclui
// fazenda; Lavoura e Pecuária só leem (ver AELavoura.html/AEpecuaria.html).
// Quanto hectare de cada atividade (grãos/cana/pecuária) tem em cada
// fazenda mora à parte, em fazenda_atividades — não na própria fazenda —
// justamente pra permitir área por atividade independente (inclusive
// passando da área total, em caso de integração lavoura-pecuária). A
// antiga coluna fazendas.atividades (lista de tags sem área) foi
// substituída por essa tabela; não é mais lida por nenhum app.
function rowToFazendaLavoura(r){ return {id:r.id, nome:r.nome, estado:r.estado||'', areaHa:r.area_ha, ativo:r.ativo}; }
function fazendaToRow(f){ return {nome:f.nome, estado:f.estado||null, area_ha:f.areaHa===''||f.areaHa==null?null:Number(f.areaHa)}; }
function rowToFazendaAtividade(r){ return {id:r.id, fazendaId:r.fazenda_id, atividade:r.atividade, areaHa:r.area_ha}; }

// Funcionários — cadastro só aqui no Matriz. Nunca guarda CPF, salário ou
// Pix (dado sensível não entra em tabela lida pela anon key). "Acesso" é
// só um VÍNCULO com um login que já existe — este cadastro não cria conta
// nova; contas continuam sendo criadas em Usuários (Lavoura/Matriz) ou na
// tela de Usuários de cada app (Pecuária tem projeto Supabase próprio, por
// isso o vínculo com ela é só um texto de referência, não um FK real).
function rowToFuncionario(r){ return {id:r.id, nome:r.nome, cargo:r.cargo||'', ativo:r.ativo, dataAdmissao:r.data_admissao||'', perfilId:r.perfil_id||'', usuarioPecuaria:r.usuario_pecuaria||'', observacao:r.observacao||''}; }
function funcionarioToRow(f){ return {nome:f.nome, cargo:f.cargo||null, ativo:!!f.ativo, data_admissao:f.dataAdmissao||null, perfil_id:f.perfilId||null, usuario_pecuaria:f.usuarioPecuaria||null, observacao:f.observacao||null}; }
function rowToFuncionarioAtividade(r){ return {id:r.id, funcionarioId:r.funcionario_id, atividade:r.atividade, percentual:r.percentual}; }
const ESTADOS_BR = [
  ['AC','Acre'],['AL','Alagoas'],['AP','Amapá'],['AM','Amazonas'],['BA','Bahia'],['CE','Ceará'],
  ['DF','Distrito Federal'],['ES','Espírito Santo'],['GO','Goiás'],['MA','Maranhão'],['MT','Mato Grosso'],
  ['MS','Mato Grosso do Sul'],['MG','Minas Gerais'],['PA','Pará'],['PB','Paraíba'],['PR','Paraná'],
  ['PE','Pernambuco'],['PI','Piauí'],['RJ','Rio de Janeiro'],['RN','Rio Grande do Norte'],['RS','Rio Grande do Sul'],

// Resultado (receita x despesa) da pecuária, lido direto do banco dela —
// mesma lógica de "custo variável do mês" (ração/pasto/cria) e "custo fixo
// do mês" (com fallback pro recorrente) que o próprio AE Pecuária usa em
// Financeiro/Resultados, só que sem o detalhamento por área (aqui o que
// interessa é o total da fazenda inteira, pra comparar com as outras
// operações). Se essa lógica mudar lá, precisa atualizar aqui também.
// Janela de meses cobertos pelo cache mensal: de janeiro de (ano atual - 2)
// até o mês atual — cobre qualquer Mês/Ano/Safra que os seletores do filtro
// de período oferecem, sem precisar buscar de novo a cada troca de filtro
// (as consultas ao banco já trazem TODAS as linhas, sem filtro de data).
function mesesJanela(){
  const hoje = new Date();
  // precisa cobrir a safra mais antiga que safrasDisponiveis() oferece: de
  // jan a abr o ano-safra atual já é (ano-1), então a 3ª opção do seletor
  // (safraAtual-2) pode cair 3 anos pra trás — daí o -3 (com folga).
  const anoIni = hoje.getFullYear()-3;
  const meses = [];
  for(let ano=anoIni; ano<=hoje.getFullYear(); ano++){
    const mFim = ano===hoje.getFullYear() ? hoje.getMonth()+1 : 12;
    for(let m=1; m<=mFim; m++) meses.push(`${ano}-${String(m).padStart(2,'0')}`);
  }
  return meses;
}
async function carregarResultadoPecuaria(){
  state.resultados.pecuaria = {...state.resultados.pecuaria, loading:true, erro:''};
  render();
  try{
    const [ingRes, dietRes, srRes, ptRes, rcRes, cfRes, recRes] = await Promise.all([
      dbPecuaria.from('ingredientes').select('id, preco_kg'),
      dbPecuaria.from('dietas').select('id, itens'),
      dbPecuaria.from('saidas_racao').select('data, dieta_id, quantidade_kg'),
      dbPecuaria.from('pasto').select('data, dieta_id, quantidade'),
      dbPecuaria.from('reproducao_custos').select('data, custo'),
      dbPecuaria.from('custos_fixos').select('nome, categoria, valor_mensal, mes, areas'),
      dbPecuaria.from('receitas').select('data, descricao, valor'),
    ]);
    for(const r of [ingRes, dietRes, srRes, ptRes, rcRes, cfRes, recRes]) if(r.error) throw r.error;

    const ingredientes = ingRes.data||[];
    const custoKgPorDieta = new Map();
    (dietRes.data||[]).forEach(d=>{
      let custoKg = 0;
      (d.itens||[]).forEach(it=>{
        const ing = ingredientes.find(i=>i.id===it.ingredienteId);
        if(ing) custoKg += Number(ing.preco_kg||0) * (Number(it.pct||0)/100);
      });
      custoKgPorDieta.set(d.id, custoKg);
    });

    function custoVariavelDoMes(prefixo){
      // "s.data &&" — uma linha antiga com data nula (banco mantido por
      // outro app) não pode derrubar o carregamento inteiro do período.
      const racao = (srRes.data||[]).filter(s=>s.data && s.data.startsWith(prefixo)).reduce((a,s)=>a+(custoKgPorDieta.get(s.dieta_id)||0)*Number(s.quantidade_kg||0), 0);
      const pasto = (ptRes.data||[]).filter(p=>p.data && p.data.startsWith(prefixo)).reduce((a,p)=>a+(custoKgPorDieta.get(p.dieta_id)||0)*Number(p.quantidade||0), 0);
      const reproducao = (rcRes.data||[]).filter(r=>r.data && r.data.startsWith(prefixo)).reduce((a,r)=>a+Number(r.custo||0), 0);
      return {racao, pasto, reproducao, total: racao+pasto+reproducao};
    }
    function fixosDoMes(mesFiltro){
      const grupos = new Map();
      (cfRes.data||[]).forEach(c=>{
        const chaveAreas = (c.areas||[]).slice().sort().join(',');
        const chave = `${c.nome}||${c.categoria||''}||${chaveAreas}`;
        if(!grupos.has(chave)) grupos.set(chave, []);
        grupos.get(chave).push(c);
      });
      let total = 0;
      grupos.forEach(rows=>{
        const doMes = rows.filter(c=>c.mes===mesFiltro);
        const usar = doMes.length>0 ? doMes : rows.filter(c=>!c.mes);
        total += usar.reduce((a,c)=>a+Number(c.valor_mensal||0),0);
      });
      return total;
    }
    function receitasNoPrefixo(prefixo){
      return (recRes.data||[]).filter(r=>r.data && r.data.startsWith(prefixo)).sort((a,b)=>b.data.localeCompare(a.data));
    }

    // Um item por mês da janela, já com tudo que os filtros (Mês/Ano/Safra)
    // e o gráfico (últimos 12 meses) precisam — agregar um período depois é
    // só somar os meses que caem nele, sem buscar nada de novo no banco.
    const mensal = mesesJanela().map(mesStr=>{
      const variavel = custoVariavelDoMes(mesStr);
      const fixa = fixosDoMes(mesStr);
      const receitasDoMes = receitasNoPrefixo(mesStr);
      const receita = receitasDoMes.reduce((a,r)=>a+Number(r.valor||0),0);
      return {
        mes: mesStr, despesa: variavel.total+fixa, receita, resultado: receita-(variavel.total+fixa),
        despesaPorCategoria: {racao: variavel.racao, pasto: variavel.pasto, reproducao: variavel.reproducao, fixa},
        receitas: receitasDoMes.map(r=>({data:r.data, descricao:r.descricao||'Receita', valor:Number(r.valor||0)})),
      };
    });

    state.resultados.pecuaria = {loading:false, erro:'', mensal};
  } catch(e){
    state.resultados.pecuaria = {loading:false, erro:'Não foi possível carregar os resultados agora.', mensal:[]};
  }
  render();
}

// Resultado da Cana, lido do banco do Lavoura (db) — mesma lógica de preço
// médio ponderado e custo por talhão que o próprio AELavoura.html usa em
// Financeiro/Estoque — se aquela lógica mudar lá, precisa atualizar aqui
// também.
async function carregarResultadoCana(){
  state.resultados.cana = {...state.resultados.cana, loading:true, erro:''};
  render();
  try{
    const [insRes, entRes, aplRes, desRes, recRes] = await Promise.all([
      db.from('insumos_cana').select('id'),
      db.from('entradas_insumo_cana').select('insumo_id, quantidade, preco_pago'),
      db.from('aplicacoes_cana').select('data, insumo_id, quantidade'),
      db.from('despesas_cana').select('data, valor'),
      db.from('receitas_cana').select('data, valor_total'),
    ]);
    for(const r of [insRes, entRes, aplRes, desRes, recRes]) if(r.error) throw r.error;

    const precoMedioPorInsumo = new Map();
    (insRes.data||[]).forEach(i=>{
      const entradas = (entRes.data||[]).filter(e=>e.insumo_id===i.id && e.preco_pago!=null && e.preco_pago!=='');
      const qtd = entradas.reduce((a,e)=>a+Number(e.quantidade||0),0);
      if(qtd>0){
        const valor = entradas.reduce((a,e)=>a+Number(e.quantidade||0)*Number(e.preco_pago||0),0);
        precoMedioPorInsumo.set(i.id, valor/qtd);
      }
    });
    function custoInsumoNoPrefixo(prefixo){
      return (aplRes.data||[]).filter(a=>a.data && a.data.startsWith(prefixo)).reduce((acc,a)=>{
        const preco = precoMedioPorInsumo.get(a.insumo_id);
        return acc + (preco!=null ? Number(a.quantidade||0)*preco : 0);
      }, 0);
    }
    function despesaGeralNoPrefixo(prefixo){
      return (desRes.data||[]).filter(d=>d.data && d.data.startsWith(prefixo)).reduce((a,d)=>a+Number(d.valor||0), 0);
    }
    function receitasNoPrefixoCana(prefixo){
      return (recRes.data||[]).filter(r=>r.data && r.data.startsWith(prefixo)).sort((a,b)=>b.data.localeCompare(a.data));
    }

    const mensal = mesesJanela().map(mesStr=>{
      const custoInsumo = custoInsumoNoPrefixo(mesStr);
      const despesaGeral = despesaGeralNoPrefixo(mesStr);
      const receitasDoMes = receitasNoPrefixoCana(mesStr);
      const receita = receitasDoMes.reduce((a,r)=>a+Number(r.valor_total||0), 0);
      return {
        mes: mesStr, despesa: custoInsumo+despesaGeral, receita, resultado: receita-(custoInsumo+despesaGeral),
        despesaPorCategoria: {custoInsumo, despesaGeral},
        receitas: receitasDoMes.map(r=>({data:r.data, descricao:'Venda de cana', valor:Number(r.valor_total||0)})),
      };
    });

    state.resultados.cana = {loading:false, erro:'', mensal};
  } catch(e){
    state.resultados.cana = {loading:false, erro:'Não foi possível carregar os resultados agora.', mensal:[]};
  }
  render();
}

const CATEGORIA_DESPESA_LABEL = {racao:'Ração (Confinamento)', pasto:'Pasto', reproducao:'Reprodução (Cria)', fixa:'Despesas fixas', combustivel:'Combustível', custoInsumo:'Insumo (Tratos culturais)', despesaGeral:'Despesas gerais (Cana/Cereais)'};
// Soma os meses de "mensal" que caem no período (array de "YYYY-MM"). Meses
// fora da janela carregada (ex: período futuro) simplesmente não têm
// correspondência e contam como zero — sem precisar recortar antes.
// despesaPorCategoria é livre (cada operação tem as categorias que fazem
// sentido pra ela — pecuária tem ração/pasto/..., cana/cereais por ora só
// combustível), a soma abaixo não presume quais chaves existem.
function agregarPeriodo(resultado, meses){
  if(!resultado) return null;
  if(resultado.erro) return {erro: resultado.erro};
  const linhas = meses.map(m=>resultado.mensal.find(x=>x.mes===m)).filter(Boolean);
  const despesa = linhas.reduce((a,l)=>a+l.despesa,0);
  const receita = linhas.reduce((a,l)=>a+l.receita,0);
  const totalPorCategoria = {};
  linhas.forEach(l=>{
    Object.entries(l.despesaPorCategoria||{}).forEach(([k,v])=>{ totalPorCategoria[k] = (totalPorCategoria[k]||0) + Number(v||0); });
  });
  return {
    despesa, receita, resultado: receita-despesa,
    despesaDetalhe: Object.entries(totalPorCategoria)
      .map(([k,valor])=>({label: CATEGORIA_DESPESA_LABEL[k]||k, valor}))
      .filter(x=>x.valor>0),
    receitasDetalhe: [].concat(...linhas.map(l=>l.receitas||[])).sort((a,b)=>b.data.localeCompare(a.data)),
    soDespesaCombustivel: resultado.soDespesaCombustivel,
    semReceita: resultado.semReceita,
  };
}

// AE Combustível ainda não tem banco real ligado à matriz (card fica "em
// breve" no Painel, ver APPS_REGISTRO) — sem chamada de rede por enquanto.
// Quando o schema for criado dentro do projeto do Lavoura, esta função
// volta a fazer sentido: ler tanques/entradas/abastecimentos e ratear o
// custo por frente (pecuária/cana/grãos), igual o AECombustivel.html fazia
// no projeto próprio dele antes da integração.
async function carregarCombustivel(){
  state.indicadores.combustivel = {loading:false, erro:'', estoqueAtual:null, consumoMes:null, alertasAbertos:null};
  state.resultados.combustivelPorFrente = {loading:false, erro:'', mensal:[]};
  render();
}
// Junta o custo mensal de combustível (por operação) com o resultado
// próprio da operação (receita/despesa lançadas no app dela) — hoje as
// três operações (pecuária, cana, cereais) já têm receita e despesa
// completas. `soDespesaCombustivel` fica como fallback pra qualquer
// operação futura que ainda não tenha app nenhum ligado à matriz (hoje
// não é o caso de nenhuma das três); combustível em si não contribui
// nada ainda, porque `combustivelPorFrente.mensal` está sempre vazio
// enquanto o card dele estiver "em breve" (ver carregarCombustivel()).
function resultadoComCombustivel(baseResultado, slug){
  const comb = state.resultados.combustivelPorFrente;
  if(comb.loading || (baseResultado && baseResultado.loading)) return {loading:true, erro:'', mensal:[]};
  if(baseResultado && baseResultado.erro) return {erro: baseResultado.erro};
  if(!baseResultado && comb.erro) return {erro: comb.erro};
  const baseMensal = baseResultado ? baseResultado.mensal : null;
  if(!baseMensal && (!comb.mensal || comb.mensal.every(m=>!m.porFrente[slug]))) return null;
  const meses = new Set([...(baseMensal||[]).map(m=>m.mes), ...(comb.mensal||[]).map(m=>m.mes)]);
  const mensal = [...meses].sort().map(mes=>{
    const base = baseMensal ? baseMensal.find(m=>m.mes===mes) : null;
    const combMes = comb.mensal ? comb.mensal.find(m=>m.mes===mes) : null;
    const custoComb = combMes ? Number(combMes.porFrente[slug]||0) : 0;
    const despesaPorCategoria = {...(base?.despesaPorCategoria||{})};
    if(custoComb>0) despesaPorCategoria.combustivel = (despesaPorCategoria.combustivel||0) + custoComb;
    const despesa = (base?.despesa||0) + custoComb;
    const receita = base?.receita||0;
    return { mes, despesa, receita, resultado: receita-despesa, despesaPorCategoria, receitas: base?.receitas||[] };
  });
  return {loading:false, erro:'', mensal, soDespesaCombustivel: !baseMensal, semReceita: !!baseResultado?.semReceita};
}

function fmt(n, dec=2){ return Number(n||0).toLocaleString('pt-BR', {minimumFractionDigits:dec, maximumFractionDigits:dec}); }

// Toda tela é montada com innerHTML a partir de texto livre do usuário
// (nome de fazenda, descrição, observação — e até dado vindo do banco do
// AE Pecuária, outro limite de confiança) — sem escapar, um <script> ou
// onerror= digitado num campo executaria na sessão de quem visualizar.
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hexToRgba(hex, alpha){
  let h = String(hex||'').replace('#','');
  if(/^[0-9a-fA-F]{3}$/.test(h)) h = h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) h = '1D5DA8';
  const n = parseInt(h, 16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function render(){
  const root = document.getElementById('root');

  if(!state.authChecked){
    root.innerHTML = `<div class="login-loading">Carregando...</div>`;
    return;
  }
  if(!state.session){
    root.innerHTML = LoginPage();
    attachEvents();
    return;
  }
  if(!state.perfil || !state.perfil.ativo){
    root.innerHTML = AguardandoLiberacao();
    attachEvents();
    return;
  }

  let conteudo;
  try{
    conteudo = `
      ${Header()}
      ${state.page==='painel' ? PagePainel() : ''}
      ${state.page==='resultados' ? PageResultados() : ''}
      ${state.page==='fazendas' ? PageFazendas() : ''}
      ${state.page==='funcionarios' ? PageFuncionarios() : ''}
      ${state.page==='usuarios' ? PageUsuarios() : ''}
    `;
  } catch(e){
    console.error('Erro ao montar a tela:', e);
    conteudo = `<div class="card" style="margin:20px;">
      <h3 style="color:var(--alerta);">Ocorreu um erro ao carregar esta tela</h3>
      <p class="hint">Mande um print desta mensagem: <strong>${String(e && e.message || e)}</strong></p>
      <button class="btn btn-ghost btn-sm" data-voltar-erro="1" style="margin-top:10px;">Voltar pro Painel</button>
    </div>`;
  }
  let modalHtml = '';
  if(state.modal){
    try{ modalHtml = Modal(); }
    catch(e){
      console.error('Erro ao abrir modal:', e);
      state.modal = null;
      alert('Ocorreu um erro ao abrir esta janela: ' + String(e && e.message || e));
    }
  }
  root.innerHTML = `
    <div class="app">
      ${Topbar()}
      ${TabsRow()}
      <div class="main">${conteudo}</div>
    </div>
    ${modalHtml}
  `;
  attachEvents();
}

const DOMINIO_LOGIN = 'aeagropecuaria.local';
const PAGES = [

function normalizeUsuario(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,''); }
function souAdmin(){ return state.perfil?.papel === 'admin'; }
function paginasVisiveis(){ return PAGES.filter(p=>!p.adminOnly || souAdmin()); }
function pareceErroDeRede(error){
  const msg = String(error?.message||'').toLowerCase();
  return msg.includes('fetch') || msg.includes('network') || msg.includes('failed');
}

const PERFIL_CACHE_KEY = 'aematriz_perfil_cache_v1';
function lerPerfilCache(uid){
  try{
    const cache = JSON.parse(localStorage.getItem(PERFIL_CACHE_KEY)||'null');
    return (cache && cache.uid===uid) ? cache.perfil : null;
  }catch(e){ return null; }
}
function salvarPerfilCache(uid, perfil){
  try{ localStorage.setItem(PERFIL_CACHE_KEY, JSON.stringify({uid, perfil})); }
  catch(e){ /* localStorage indisponível (modo privado etc.) */ }
}
async function loadPerfil(){
  const uid = state.session?.user?.id;
  if(!uid){ state.perfil = null; state.perfilErroRede = false; return; }
  const { data, error } = await db.from('profiles').select('*').eq('id', uid).single();
  state.perfilErroRede = false;
  if(data){
    state.perfil = rowToPerfil(data);
    salvarPerfilCache(uid, state.perfil);
  } else if(error && pareceErroDeRede(error)){
    const cache = lerPerfilCache(uid);
    if(cache){ state.perfil = cache; }
    else { state.perfil = null; state.perfilErroRede = true; }
  } else {
    state.perfil = null;
  }
  if(state.perfil && state.perfil.ativo && !paginasVisiveis().some(p=>p.key===state.page)){
    state.page = 'painel';
  }
}

async function initAuth(){
  const { data } = await db.auth.getSession();
  state.session = data.session;
  if(state.session) await loadPerfil();
  state.authChecked = true;
  render();
  if(state.session && state.perfil?.ativo) loadAll();

  let primeiroEvento = true;
  db.auth.onAuthStateChange(async (event, newSession)=>{
    if(primeiroEvento){ primeiroEvento = false; return; }
    // token renovado automaticamente (a cada ~1h) não é troca de sessão de
    // verdade — o cliente supabase-js já usa o token novo sozinho; só
    // guardamos a referência, sem re-renderizar (senão um modal aberto com
    // campo digitado e ainda não salvo perderia o texto no meio da digitação).
    if(event==='TOKEN_REFRESHED'){ state.session = newSession; return; }
    if(event==='SIGNED_IN' && state.session?.access_token===newSession?.access_token) return;
    state.session = newSession;
    if(newSession){
      await loadPerfil();
      render();
      if(state.perfil?.ativo) loadAll();
    } else {
      state.perfil = null;
      render();
    }
  });
}

async function fazerLogin(){
  const usuario = normalizeUsuario(state.loginDraft.usuario);
  const senha = state.loginDraft.senha;
  if(!usuario || !senha){ state.loginError = 'Informe usuário e senha.'; render(); return; }
  state.loginLoading = true; state.loginError = ''; render();
  const email = `${usuario}@${DOMINIO_LOGIN}`;
  const { data, error } = await db.auth.signInWithPassword({ email, password: senha });
  state.loginLoading = false;
  if(error){
    state.loginError = 'Usuário ou senha inválidos.';
    render();
    return;
  }
  state.session = data.session;
  await loadPerfil();
  state.loginDraft = {usuario:'', senha:''};
  render();
  if(state.perfil?.ativo) loadAll();
}

async function fazerLogout(){
  await db.auth.signOut();
  state.session = null;
  state.perfil = null;
  render();
}

        <div class="app-card-stat"><div class="v">${fmtInt(ind.totalAnimais)}</div><div class="l">Animais</div></div>
        <div class="app-card-stat"><div class="v">${fmtInt(ind.dietas)}</div><div class="l">Dietas</div></div>
      </div>`;
    } else if(a.slug==='cana'){
      stats = `<div class="app-card-stats">
        <div class="app-card-stat"><div class="v">${fmtInt(ind.talhoes)}</div><div class="l">Talhões</div></div>
        <div class="app-card-stat"><div class="v">${fmtInt(ind.plantiosAtivos)}</div><div class="l">Plantios ativos</div></div>
        <div class="app-card-stat"><div class="v">${fmtInt(ind.toneladasMes)} t</div><div class="l">Colhido no mês</div></div>
      </div>`;
    } else if(a.slug==='cereais'){
      stats = `<div class="app-card-stats">
        <div class="app-card-stat"><div class="v">${fmtInt(ind.talhoes)}</div><div class="l">Talhões</div></div>
        <div class="app-card-stat"><div class="v">${fmtInt(ind.plantiosAtivos)}</div><div class="l">Plantios ativos</div></div>
        <div class="app-card-stat"><div class="v">${fmtInt(ind.sacasMes)} sc</div><div class="l">Colhido no mês</div></div>

/* ===================== FILTRO DE PERÍODO (Mês / Ano / Safra) ===================== */
const NOMES_MES_LONGO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const NOMES_MES_ABREV = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

// Lista de "YYYY-MM" cobertos pelo período selecionado.
function periodoMeses(periodo){
  if(periodo.tipo==='mes') return [periodo.mes];
  if(periodo.tipo==='ano'){
    const meses = []; for(let m=1;m<=12;m++) meses.push(`${periodo.ano}-${String(m).padStart(2,'0')}`); return meses;
  }
  // safra: maio do ano-safra até abril do ano seguinte
  const meses = [];
  for(let m=5;m<=12;m++) meses.push(`${periodo.safra}-${String(m).padStart(2,'0')}`);
  for(let m=1;m<=4;m++) meses.push(`${periodo.safra+1}-${String(m).padStart(2,'0')}`);
  return meses;
}
function labelPeriodo(periodo){
  if(periodo.tipo==='mes'){ const [a,m] = periodo.mes.split('-'); return `${NOMES_MES_LONGO[Number(m)-1]}/${a}`; }
  if(periodo.tipo==='ano') return `Ano ${periodo.ano}`;
  return `Safra ${periodo.safra}/${periodo.safra+1}`;
}
// Últimos 12 meses terminando no último mês do período selecionado — é a
// janela usada pelo gráfico de comparação mês a mês, sempre disponível
// independente de o filtro estar em Mês, Ano ou Safra.
function ultimos12Meses(periodo){
  const meses = periodoMeses(periodo);
  const [anoStr, mesStr] = meses[meses.length-1].split('-');
  let ano = Number(anoStr), mes = Number(mesStr);
  const janela = [];
  for(let i=11;i>=0;i--){
    let a=ano, m=mes-i;
    while(m<=0){ m+=12; a-=1; }
    janela.push(`${a}-${String(m).padStart(2,'0')}`);
  }
  return janela;
}
function anosDisponiveis(){
  const hoje = new Date().getFullYear();
  return [hoje, hoje-1, hoje-2];
}
function safrasDisponiveis(){
  const hoje = new Date();
  const safraAtual = hoje.getMonth()+1>=5 ? hoje.getFullYear() : hoje.getFullYear()-1;
  return [safraAtual, safraAtual-1, safraAtual-2];
}

/* ===================== RESULTADOS (geral, todas as operações) ===================== */
// Pecuária, Cana e Cereais/Grãos têm receita e despesa próprias, cada uma
// lida do banco de origem (dbPecuaria ou db/Lavoura).
function resultadoBrutoOperacao(slug){
  if(slug==='pecuaria') return resultadoComCombustivel(state.resultados.pecuaria, slug);
  if(slug==='cana') return resultadoComCombustivel(state.resultados.cana, slug);
  if(slug==='cereais') return resultadoComCombustivel(state.resultados.cereais, slug);
  return null;
}
function resultadoOperacaoNoPeriodo(slug){
  return agregarPeriodo(resultadoBrutoOperacao(slug), periodoMeses(state.periodo));
}
// Área (ha) de cada operação — vem direto do cadastro de Fazendas (aba
// Fazendas, aqui no Matriz), que guarda quanto hectare de cada atividade
// (grãos/cana/pecuária) tem em cada fazenda. Não depende mais de somar
// talhão por talhão: o admin lança a área de cada atividade direto na
// fazenda. Isso também permite integração lavoura-pecuária (mesma área
// contando ao mesmo tempo como grãos/cana E como pecuária) sem duplicar
// hectare por engano — cada atividade é um número independente, a soma
// das três pode passar da área total da fazenda de propósito.
const ATIVIDADE_DA_OPERACAO = {cana:'cana', cereais:'graos', pecuaria:'pecuaria'};
function hectaresPorOperacao(slug){
  const atividade = ATIVIDADE_DA_OPERACAO[slug];
  if(!atividade) return 0;
  return state.fazendaAtividades.filter(a=>a.atividade===atividade).reduce((s,a)=>s+Number(a.areaHa||0),0);
}
// Só as operações de terra (mesmo recorte de OPERACOES_ORDEM) — Combustível
// não entra aqui pelo mesmo motivo que não entra nos donuts: é custo
// consumido pelas outras operações, não uma operação com receita própria.
function linhasResultado(){
  return OPERACOES_ORDEM.map(slug=>({
    app: state.apps.find(a=>a.slug===slug) || {slug, nome: OPERACOES[slug]||slug, cor: OPERACAO_COR[slug]},
    resultado: resultadoOperacaoNoPeriodo(slug),
  }));
}
function resultadoTotal(campo){
  return OPERACOES_ORDEM.reduce((soma,slug)=>{
    const r = resultadoOperacaoNoPeriodo(slug);
    return soma + (r && !r.erro && r[campo]!=null ? r[campo] : 0);
  }, 0);
}
function algumResultadoCarregando(){
  return state.resultados.pecuaria.loading || state.resultados.cana.loading || state.resultados.cereais.loading || state.resultados.combustivelPorFrente.loading;
}
// Só as 3 operações de terra (pecuária, cana, cereais) — combustível é
// insumo consumido pelas outras, não uma operação com receita/despesa
// própria, então não entra nesse recorte.
const OPERACOES_ORDEM = ['pecuaria','cana','cereais'];
function fatiasOperacoes(campo){
  return OPERACOES_ORDEM.map(slug=>{
    const app = state.apps.find(a=>a.slug===slug);
    const r = resultadoOperacaoNoPeriodo(slug);
    const valor = (r && !r.erro && r[campo]!=null) ? r[campo] : 0;
    return {nome: app ? app.nome : (OPERACOES[slug]||slug), valor, cor: OPERACAO_COR[slug]};
  });
}
function StatCard(label, valor, tipo){
  // tipo: 'receita' | 'despesa' | 'resultado'
  const positivo = valor>=0;
  const ic = tipo==='receita' ? iconSetaAlta() : tipo==='despesa' ? iconCarteira() : (positivo ? iconCheckCircle() : iconAlertTriangle());
  const bg = tipo==='receita' ? 'var(--bom-bg)' : tipo==='despesa' ? '#F5E9D7' : (positivo ? 'var(--bom-bg)' : 'var(--alerta-bg)');
  const cor = tipo==='receita' ? 'var(--bom)' : tipo==='despesa' ? 'var(--trigo)' : (positivo ? 'var(--bom)' : 'var(--alerta)');
  return `
  <div class="stat-card">
    <div class="stat-card-ic" style="background:${bg}; color:${cor};">${ic}</div>
    <div class="stat-label">${label}</div>
    <div class="stat-value ${tipo==='resultado' ? (positivo?'bom':'alerta') : ''}">R$ ${fmt(valor)}</div>
  </div>`;
}
// Paleta categórica validada (contraste + daltonismo) pras 3 operações —
// ver skill de dataviz: as cores de marca (azul/verde/marrom) usadas nos
// chips de Fazendas não passavam no piso de croma nem na separação de
// daltonismo, então as 3 operações usam esta paleta em todo canto onde
// aparecem lado a lado (chips e os donuts abaixo).
const OPERACAO_COR = {pecuaria:'#2a78d6', cana:'#eb6834', cereais:'#1baf7a'};

function polarXY(cx, cy, r, ang){ return [cx + r*Math.sin(ang), cy - r*Math.cos(ang)]; }
function donutSlicePath(cx, cy, rOut, rIn, a0, a1){
  const largeArc = (a1-a0) > Math.PI ? 1 : 0;
  const [x0,y0] = polarXY(cx,cy,rOut,a0);
  const [x1,y1] = polarXY(cx,cy,rOut,a1);
  const [x2,y2] = polarXY(cx,cy,rIn,a1);
  const [x3,y3] = polarXY(cx,cy,rIn,a0);
  return `M ${x0} ${y0} A ${rOut} ${rOut} 0 ${largeArc} 1 ${x1} ${y1} L ${x2} ${y2} A ${rIn} ${rIn} 0 ${largeArc} 0 ${x3} ${y3} Z`;
}
// fatias: [{nome, valor, cor}]. panelId identifica o gráfico (usado só pra
// não colidir os data-attributes de hover entre os dois donuts da tela).
// fatias podem ter valor negativo (ex: operação no prejuízo) — um donut não
// representa "fatia negativa" geometricamente, então a área do anel usa só a
// parte positiva de cada fatia (valorArco); o valor real (podendo ser
// negativo) continua exibido — e destacado em vermelho — na legenda, e o
// centro mostra a soma real (não só a soma dos arcos desenhados).
function Donut(fatias, panelId, titulo, vazioMsg){
  const totalReal = fatias.reduce((a,f)=>a+Number(f.valor||0),0);
  const totalPositivo = fatias.reduce((a,f)=>a+Math.max(0,Number(f.valor||0)),0);
  if(totalPositivo<=0){
    const msg = totalReal<0
      ? 'Todas as operações com dado lançado fecharam no prejuízo neste período — não dá pra desenhar um gráfico de proporção. Veja os valores na tabela abaixo.'
      : (vazioMsg || 'Nenhuma operação com valor lançado neste período.');
    return `<div class="card card-pad" style="flex:1;"><p class="stat-label" style="margin-bottom:10px;">${titulo}</p>${Empty('Sem dados ainda', msg)}</div>`;
  }
  const cx=90, cy=90, rOut=80, rIn=50;
  // gap sempre > 0, mesmo com 1 fatia só a 100% — sem isso, o início e o
  // fim do arco caem no mesmíssimo ponto (frac=1 vira uma volta inteira) e
  // dependendo do navegador o círculo renderiza como invisível.
  const gap = fatias.length>1 ? 0.03 : 0.004;
  let angle = 0;
  const slices = fatias.map((f,idx)=>{
    const valor = Number(f.valor||0);
    const valorArco = Math.max(0, valor);
    const pct = valorArco/totalPositivo*100;
    const frac = valorArco/totalPositivo;
    const sweep = frac*Math.PI*2;
    const a0 = angle + (sweep>0?gap/2:0);
    const a1 = angle + sweep - (sweep>0?gap/2:0);
    angle += sweep;
    if(sweep<=0) return '';
    const path = donutSlicePath(cx,cy,rOut,rIn,a0,a1);
    const midAngle = (a0+a1)/2;
    const [lx,ly] = polarXY(cx,cy,(rOut+rIn)/2,midAngle);
    const showLabel = pct>=8;
    return `
      <path class="donut-slice" data-slice-idx="${panelId}-${idx}" data-tip-nome="${esc(f.nome)}" data-tip-valor="${fmt(valor)}" data-tip-pct="${fmt(pct,1)}"
        d="${path}" fill="${f.cor}" tabindex="0" role="img" aria-label="${esc(f.nome)}: R$ ${fmt(valor)}, ${fmt(pct,1)}%"></path>
      ${showLabel ? `<text class="donut-label" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${fmt(pct,0)}%</text>` : ''}
    `;
  }).join('');
  const legenda = fatias.map((f,idx)=>{
    const valor = Number(f.valor||0);
    const negativo = valor<0;
    return `
    <div class="legenda-row" data-legenda-idx="${panelId}-${idx}">
      <span class="legenda-swatch" style="background:${f.cor}"></span>
      <span class="legenda-nome">${esc(f.nome)}</span>
      <span class="legenda-valor" style="${negativo?'color:var(--alerta); font-weight:600;':''}">R$ ${fmt(valor,0)}</span>
      <span class="legenda-pct">${negativo ? 'prejuízo' : fmt(valor/totalPositivo*100,1)+'%'}</span>
    </div>
  `;}).join('');
  return `
  <div class="card card-pad" style="flex:1;">
    <p class="stat-label" style="margin-bottom:14px;">${titulo}</p>
    <div class="painel-resultados">
      <div class="donut-wrap">
        <svg class="donut-svg" viewBox="0 0 180 180" width="180" height="180">
          ${slices}
          <text class="donut-center-value" x="90" y="86" text-anchor="middle">R$ ${fmt(totalReal,0)}</text>
          <text class="donut-center-label" x="90" y="102" text-anchor="middle">total</text>
        </svg>
      </div>
      <div class="painel-legenda">${legenda}</div>
    </div>
  </div>`;
}
function FiltroPeriodo(){
  const p = state.periodo;
  return `
  <div class="card card-pad" style="margin-bottom:18px;">
    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <div class="periodo-tabs">
        <button class="periodo-tab ${p.tipo==='mes'?'active':''}" data-periodo-tipo="mes">Mês</button>
        <button class="periodo-tab ${p.tipo==='ano'?'active':''}" data-periodo-tipo="ano">Ano</button>
        <button class="periodo-tab ${p.tipo==='safra'?'active':''}" data-periodo-tipo="safra">Safra</button>
      </div>
      ${p.tipo==='mes' ? `<input type="month" id="f-periodo-mes" value="${p.mes}"/>` : ''}
      ${p.tipo==='ano' ? `<select id="f-periodo-ano">${anosDisponiveis().map(a=>`<option value="${a}" ${p.ano===a?'selected':''}>${a}</option>`).join('')}</select>` : ''}
      ${p.tipo==='safra' ? `<select id="f-periodo-safra">${safrasDisponiveis().map(s=>`<option value="${s}" ${p.safra===s?'selected':''}>Safra ${s}/${s+1} (mai/${String(s).slice(2)} a abr/${String(s+1).slice(2)})</option>`).join('')}</select>` : ''}
    </div>
  </div>`;
}

function PagePorHectare(){
  const linhas = OPERACOES_ORDEM.map(slug=>{
    const app = state.apps.find(a=>a.slug===slug);
    return {slug, nome: app ? app.nome : (OPERACOES[slug]||slug), ha: hectaresPorOperacao(slug), r: resultadoOperacaoNoPeriodo(slug)};
  });
  return `
  <div class="card" style="margin-top:18px; overflow-x:auto;">
    <div class="card-pad" style="padding-bottom:0;">
      <p class="stat-label" style="margin-bottom:2px;">Por hectare — ${labelPeriodo(state.periodo)}</p>
      <p class="hint" style="margin-bottom:14px;">Clique num valor pra ver a evolução mês a mês dos últimos 12 meses.</p>
    </div>
    <table>
      <thead><tr><th>Operação</th><th>Área (ha)</th><th>Despesa/ha</th><th>Receita/ha</th><th>Lucro/ha</th></tr></thead>
      <tbody>
        ${linhas.map(l=>{
          const chip = `<span class="op-chip"><span class="op-chip-ic" style="background:${hexToRgba(OPERACAO_COR[l.slug],0.14)}; color:${OPERACAO_COR[l.slug]};">${iconOperacao(l.slug, l.nome)}</span><strong>${esc(l.nome)}</strong></span>`;
          if(l.ha<=0) return `<tr><td>${chip}</td><td colspan="4" class="hint">Sem hectares cadastrados pra essa operação — marque a atividade em Fazendas (aqui no Matriz) ou cadastre o talhão no AE Lavoura.</td></tr>`;
          if(!l.r || l.r.erro) return `<tr><td>${chip}</td><td class="mono">${fmtInt(l.ha)}</td><td colspan="3" class="hint">${l.r?.erro || 'Sem dados ainda.'}</td></tr>`;
          const despesaHa = l.r.despesa/l.ha, receitaHa = l.r.receita/l.ha, resultadoHa = l.r.resultado/l.ha;
          return `<tr>
            <td>${chip}</td>
            <td class="mono">${fmtInt(l.ha)}</td>
            <td class="mono"><button class="valor-clicavel" data-grafico-op="${l.slug}" data-grafico-metrica="despesaHa">R$ ${fmt(despesaHa)}</button></td>
            <td class="mono"><button class="valor-clicavel" data-grafico-op="${l.slug}" data-grafico-metrica="receitaHa">R$ ${fmt(receitaHa)}</button></td>
            <td class="mono"><button class="valor-clicavel ${resultadoHa<0?'neg':''}" data-grafico-op="${l.slug}" data-grafico-metrica="resultadoHa">R$ ${fmt(resultadoHa)}</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

  if(state.apps.length===0) return Empty('Nenhum app cadastrado', 'Cadastre os apps que compõem a matriz para ver os resultados aqui.');

    return `${FiltroPeriodo()}<div class="card card-pad"><p class="hint">Carregando resultados...</p></div>`;
  }
  const despesa = resultadoTotal('despesa'), receita = resultadoTotal('receita'), resultado = receita-despesa;
  return `
  ${FiltroPeriodo()}
  <p class="eyebrow" style="margin-bottom:10px;">${labelPeriodo(state.periodo)} — todas as operações</p>
  <div class="stat-row">
    ${StatCard('Receita', receita, 'receita')}
    ${StatCard('Despesa', despesa, 'despesa')}
    ${StatCard('Resultado', resultado, 'resultado')}
  </div>
  <p class="eyebrow" style="margin-bottom:10px;">Impacto de cada operação</p>
  <div class="donuts-row">
    ${Donut(fatiasOperacoes('despesa'), 'donut-despesa', 'Despesa por operação')}
    ${Donut(fatiasOperacoes('receita'), 'donut-receita', 'Receita por operação')}
    ${Donut(fatiasOperacoes('resultado'), 'donut-lucro', 'Lucro por operação')}
  </div>
  <div id="painel-tooltip" class="painel-tooltip"></div>
  ${PagePorHectare()}
  <div class="card" style="overflow-x:auto; margin-top:18px;">
    <table>
      <thead><tr><th>Operação</th><th>Receita</th><th>Despesa</th><th>Resultado</th></tr></thead>
      <tbody>
        ${linhasResultado().map(l=>{
          const r = l.resultado;
          const chip = `<span class="op-chip"><span class="op-chip-ic" style="background:${hexToRgba(l.app.cor,0.14)}; color:${l.app.cor};">${iconOperacao(l.app.slug, l.app.nome)}</span><strong>${esc(l.app.nome)}</strong></span>`;
          if(!r || r.erro) return `<tr><td>${chip}</td><td colspan="3" class="hint">${r?.erro || 'Sem dados ainda.'}</td></tr>`;
          return `<tr>
            <td>${chip}</td>
            <td class="mono">R$ ${fmt(r.receita)}</td>
            <td class="mono">R$ ${fmt(r.despesa)}</td>

/* ===================== FAZENDAS (cadastro centralizado) ===================== */
// Cadastro de fazenda é feito só aqui no Matriz (nome, estado, área total e,
// pra cada atividade — grãos/cana/pecuária — quantos hectares dela tem
// nessa fazenda) — Lavoura e Pecuária só leem. Cada atividade guarda sua
// própria área em fazenda_atividades, independente das outras: não precisa
// bater com a área total nem com talhão nenhum. Isso cobre integração
// lavoura-pecuária de propósito (ex: 300ha que são, ao mesmo tempo, área de
// grãos E de pastagem — contam inteiro nas duas atividades, sem "sobrar"
// nem "faltar" hectare em nenhuma conta).
function operacoesDaFazendaLavoura(fazenda){
  return state.fazendaAtividades
    .filter(a=>a.fazendaId===fazenda.id)
    .map(a=>({operacao: a.atividade==='graos' ? 'cereais' : a.atividade, areaHa:a.areaHa}));
}
function chipsOperacoes(ops){
  if(ops.length===0) return '<span class="hint">Nenhuma atividade com área definida</span>';
  return `<div style="display:flex; flex-wrap:wrap; gap:8px;">${ops.map(o=>{
    const cor = OPERACAO_COR[o.operacao] || 'var(--verde-medio)';
    return `<span class="op-chip"><span class="op-chip-ic" style="background:${hexToRgba(cor,0.14)}; color:${cor}; width:22px; height:22px;">${iconOperacao(o.operacao)}</span>${OPERACOES[o.operacao]||o.operacao}${o.areaHa!=null ? ' · '+fmtInt(o.areaHa)+' ha' : ''}</span>`;
  }).join('')}</div>`;
}

/* ===================== FUNCIONÁRIOS ===================== */
// Cadastro de funcionário — cargo, em quais atividades participa (com % de
// alocação, não precisa somar 100 — dá pra estar "meio" em duas coisas) e
// qual login de acesso usa. NUNCA guarda CPF, salário individual ou Pix —
// essas tabelas são lidas pela anon key, então dado sensível de RH não
// pode entrar aqui (ver observação de segurança combinada com o usuário).
// "Acesso" não cria conta nova, só vincula uma que já existe em Usuários
// (Lavoura/Matriz) — a Pecuária tem projeto próprio, por isso o vínculo
// com ela é só uma referência de texto.
function chipsAtividadesFuncionario(funcionarioId){
  const ativs = state.funcionarioAtividades.filter(a=>a.funcionarioId===funcionarioId);
  if(ativs.length===0) return '<span class="hint">Nenhuma atividade definida</span>';
  return `<div style="display:flex; flex-wrap:wrap; gap:8px;">${ativs.map(a=>{
    const operacao = a.atividade==='graos' ? 'cereais' : a.atividade;
    const cor = OPERACAO_COR[operacao] || 'var(--verde-medio)';
    return `<span class="op-chip"><span class="op-chip-ic" style="background:${hexToRgba(cor,0.14)}; color:${cor}; width:22px; height:22px;">${iconOperacao(operacao)}</span>${OPERACOES[operacao]||operacao} · ${fmtInt(a.percentual)}%</span>`;
  }).join('')}</div>`;
}
function nomeAcessoFuncionario(f){
  const partes = [];
  if(f.perfilId){
    const p = state.perfis.find(x=>x.id===f.perfilId);
    if(p) partes.push(`${esc(p.nome)} (Lavoura/Matriz)`);
  }
  if(f.usuarioPecuaria) partes.push(`${esc(f.usuarioPecuaria)} (Pecuária)`);
  // Alerta quando a pessoa participa da Pecuária mas não tem login lá —
  // sem conta própria, os lançamentos dela na Pecuária ficam sem
  // rastreabilidade real (entram sob a conta genérica de quem logou).
  const alocadoPecuaria = state.funcionarioAtividades.some(a=>a.funcionarioId===f.id && a.atividade==='pecuaria' && Number(a.percentual)>0);
  if(alocadoPecuaria && !f.usuarioPecuaria){
    partes.push('<span class="pill pill-warn" title="Participa da Pecuária mas não tem login lá — lançamentos dessa pessoa não são rastreáveis por conta própria.">Sem login Pecuária</span>');
  }
  return partes.length ? partes.join(' · ') : '<span class="hint">Sem acesso vinculado</span>';
}
// Contas de login (Lavoura/Matriz e Pecuária) que ainda não têm nenhum
// funcionário apontando pra elas — candidatas a importar em vez de
// recadastrar do zero. Comparação por id (Lavoura/Matriz) ou por
// usuário/texto (Pecuária, projeto separado sem FK real).
function contasNaoVinculadas(){
  const perfilIdsUsados = new Set(state.funcionarios.map(f=>f.perfilId).filter(Boolean));
  const usuariosPecuariaUsados = new Set(state.funcionarios.map(f=>f.usuarioPecuaria).filter(Boolean));
  const lavoura = state.perfis.filter(p=>!perfilIdsUsados.has(p.id)).map(p=>({origem:'lavoura', nome:p.nome, usuario:p.usuario, ref:p.id}));
  const pecuaria = state.perfisPecuaria.filter(p=>!usuariosPecuariaUsados.has(p.usuario)).map(p=>({origem:'pecuaria', nome:p.nome, usuario:p.usuario, ref:p.usuario}));
  return [...lavoura, ...pecuaria];
}

// Barras com linha de zero — despesa/receita por hectare são sempre >=0
// (barra cresce de baixo), lucro/ha pode ser negativo (barra cresce dos
// dois lados da linha de zero, verde acima e vermelho abaixo).
function GraficoBarras(pontos){
  const vals = pontos.map(p=>p.valor);
  const maxV = Math.max(0, ...vals), minV = Math.min(0, ...vals);
  const range = (maxV-minV) || 1;
  const largura=560, altura=200, margemBaixo=28, margemTopo=10;
  const areaAltura = altura-margemBaixo-margemTopo;
  const zeroY = margemTopo + areaAltura*(maxV/range);
  const n = pontos.length;
  const passo = largura/n;
  const larguraBarra = Math.min(24, passo-8);
  const barras = pontos.map((p,i)=>{
    const x = i*passo + (passo-larguraBarra)/2;
    const [ano,mesNum] = p.mes.split('-');
    const rotuloMes = mesNum==='01' ? `${NOMES_MES_ABREV[0]}/${ano.slice(2)}` : NOMES_MES_ABREV[Number(mesNum)-1];
    const rotuloTexto = `<text x="${(x+larguraBarra/2).toFixed(1)}" y="${altura-12}" text-anchor="middle" font-size="9" fill="var(--cinza)" font-family="Inter,sans-serif">${rotuloMes}</text>`;
    // mês que ainda não aconteceu (dentro de uma safra em andamento, por
    // exemplo) não tem como ter valor — mostrar uma barra verde/vermelha
    // de R$ 0 ali pareceria "esse mês fechou em zero", que é mentira.
    if(p.futuro){
      return `<rect x="${x.toFixed(1)}" y="${(zeroY-1).toFixed(1)}" width="${larguraBarra}" height="2" rx="1" fill="var(--cinza-claro)"></rect>${rotuloTexto}`;
    }
    const yVal = margemTopo + areaAltura*((maxV-p.valor)/range);
    const y = Math.min(zeroY,yVal), h = Math.max(1.5,Math.abs(yVal-zeroY));
    const cor = p.valor>=0 ? 'var(--bom)' : 'var(--alerta)';
    return `<rect class="gbar" data-gbar-valor="R$ ${fmt(p.valor)}" data-gbar-label="${NOMES_MES_LONGO[Number(mesNum)-1]}/${ano}"
        x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${larguraBarra}" height="${h.toFixed(1)}" rx="3" fill="${cor}"></rect>${rotuloTexto}`;
  }).join('');
  return `<svg class="grafico-barras-svg" viewBox="0 0 ${largura} ${altura}">
    <line x1="0" y1="${zeroY.toFixed(1)}" x2="${largura}" y2="${zeroY.toFixed(1)}" stroke="var(--cinza-claro)" stroke-width="1"/>
    ${barras}
  </svg>`;
}

const METRICA_LABEL = {despesaHa:'Despesa por hectare', receitaHa:'Receita por hectare', resultadoHa:'Lucro por hectare'};
const METRICA_CAMPO = {despesaHa:'despesa', receitaHa:'receita', resultadoHa:'resultado'};
function ModalGraficoOperacao(){
  const {slug, metrica} = state.modal;
  const app = state.apps.find(a=>a.slug===slug);
  const nome = esc(app ? app.nome : (OPERACOES[slug]||slug));
  const ha = hectaresPorOperacao(slug);
  const bruto = resultadoBrutoOperacao(slug);
  const semDados = !bruto || bruto.erro || !bruto.mensal || ha<=0;
  let corpo;
  if(semDados){
    const msg = ha<=0
      ? 'Sem hectares cadastrados pra essa operação — marque a atividade em Fazendas (aqui no Matriz) ou cadastre o talhão no AE Lavoura pra ver esse gráfico.'
      : (bruto?.erro || `O app ${nome} ainda não está com o banco de dados ligado à matriz.`);
    corpo = Empty('Sem dados ainda', msg);
  } else {
    const campo = METRICA_CAMPO[metrica];
    const meses = ultimos12Meses(state.periodo);
    const hoje = new Date();
    const mesAtualStr = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
    const pontos = meses.map(mesStr=>{
      const linha = bruto.mensal.find(x=>x.mes===mesStr);
      return {mes: mesStr, valor: linha ? linha[campo]/ha : 0, futuro: mesStr>mesAtualStr};
    });
    corpo = `<p class="hint" style="margin-bottom:8px;">Últimos 12 meses, em R$/ha.</p>${GraficoBarras(pontos)}`;
  }
  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal" data-stop="1" style="max-width:640px;">
      <div class="modal-head"><h3>${METRICA_LABEL[metrica]} — ${nome}</h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body">${corpo}</div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="1">Fechar</button>
      </div>
    </div>
  </div>`;
}

  document.querySelectorAll('[data-logout]').forEach(el=>{ el.onclick = ()=> fazerLogout(); });
  document.querySelectorAll('[data-retry-perfil]').forEach(el=>{
    el.onclick = async ()=>{ await loadPerfil(); render(); if(state.perfil?.ativo) loadAll(); };

    editDraft = {nome:'', cargo:'', dataAdmissao:'', ativo:true, atividades:{}, perfilId:'', usuarioPecuaria:'', observacao:''};
    state.acessoPecuariaError = ''; state.acessoPecuariaLoading = false;
    state.acessoLavouraError = ''; state.acessoLavouraLoading = false;
    state.modal = {type:'funcionario'}; render();
  };
  const importarFuncionariosBtn = document.querySelector('[data-importar-funcionarios]');
  if(importarFuncionariosBtn) importarFuncionariosBtn.onclick = ()=>{
    state.modal = {type:'importarFuncionarios'}; render();
  };
  const confirmarImportarBtn = document.querySelector('[data-confirmar-importar-funcionarios]');
  if(confirmarImportarBtn) confirmarImportarBtn.onclick = async ()=>{
    const pendentes = contasNaoVinculadas();
    const selecionados = pendentes.filter((p,i)=>document.querySelector(`[data-importar-item="${i}"]`)?.checked);
    if(selecionados.length===0){ state.modal = null; render(); return; }
    confirmarImportarBtn.disabled = true; confirmarImportarBtn.textContent = 'Importando...';
    const linhas = selecionados.map(p=>funcionarioToRow({
      nome: p.nome,
      cargo: '',
      ativo: true,
      dataAdmissao: '',
      perfilId: p.origem==='lavoura' ? p.ref : '',
      usuarioPecuaria: p.origem==='pecuaria' ? p.ref : '',
      observacao: '',
    }));
    const {error} = await db.from('funcionarios').insert(linhas);
    if(error){ alert('Não foi possível importar: ' + error.message); confirmarImportarBtn.disabled = false; confirmarImportarBtn.textContent = 'Importar selecionados'; return; }

  document.querySelectorAll('[data-editar-funcionario]').forEach(el=>{
    el.onclick = ()=>{
      const f = state.funcionarios.find(x=>x.id===Number(el.dataset.editarFuncionario));

      state.funcionarioAtividades.filter(a=>a.funcionarioId===f.id).forEach(a=>{ atividades[a.atividade] = a.percentual; });
      editDraft = {...f, _editId: f.id, atividades};
      state.acessoPecuariaError = ''; state.acessoPecuariaLoading = false;
      state.acessoLavouraError = ''; state.acessoLavouraLoading = false;
      state.modal = {type:'funcionario'}; render();

  const criarAcessoPecuariaBtn = document.querySelector('[data-criar-acesso-pecuaria]');
  if(criarAcessoPecuariaBtn) criarAcessoPecuariaBtn.onclick = ()=>{
    editDraft._criandoAcessoPecuaria = true;
    state.acessoPecuariaError = '';
    render();
  };
  const cancelarAcessoPecuariaBtn = document.querySelector('[data-cancelar-acesso-pecuaria]');
  if(cancelarAcessoPecuariaBtn) cancelarAcessoPecuariaBtn.onclick = ()=>{
    editDraft._criandoAcessoPecuaria = false;
    state.acessoPecuariaError = '';
    render();
  };
  const confirmarAcessoPecuariaBtn = document.querySelector('[data-confirmar-acesso-pecuaria]');
  if(confirmarAcessoPecuariaBtn) confirmarAcessoPecuariaBtn.onclick = async ()=>{
    const nome = document.getElementById('f-nomeacessopecuaria').value.trim();
    const usuario = document.getElementById('f-usuarioacessopecuaria').value.trim();
    const senha = document.getElementById('f-senhaacessopecuaria').value;
    if(!nome || !usuario || !senha || senha.length<6){
      state.acessoPecuariaError = 'Preencha nome, usuário e senha (mín. 6 caracteres).';
      render(); return;
    }
    state.acessoPecuariaLoading = true; state.acessoPecuariaError = ''; render();
    // Chama a Edge Function 'criar-usuario' do projeto da Pecuária (separada
    // da 'criar-usuario-cana' do Lavoura/Matriz — cada projeto Supabase tem
    // a sua). Não testado em produção a partir do Matriz até este momento;
    // se falhar por causa de autenticação exigida pela função, o fallback
    // garantido é criar a conta na própria tela de Usuários do AE Pecuária.
    try{
      const { data, error } = await dbPecuaria.functions.invoke('criar-usuario', { body: { nome, usuario, senha } });
      if(error || data?.error){
        let msg = data?.error || error?.message || 'Falha ao criar usuário na Pecuária.';
        if(error?.context && typeof error.context.json === 'function'){
          try { const corpo = await error.context.json(); if(corpo?.error) msg = corpo.error; } catch(e){}
        }
        state.acessoPecuariaError = msg + ' — crie manualmente em AE Pecuária > Usuários.';
        state.acessoPecuariaLoading = false;
        render();
        return;
      }
    } catch(e){
      state.acessoPecuariaError = 'Não foi possível conectar ao projeto da Pecuária. Crie manualmente em AE Pecuária > Usuários.';
      state.acessoPecuariaLoading = false;
      render();
      return;
    }
    editDraft.usuarioPecuaria = usuario;
    editDraft._criandoAcessoPecuaria = false;
    state.acessoPecuariaLoading = false;
    // Atualiza a lista de contas da Pecuária pra já aparecer no select.
    const { data: novosPerfis } = await Promise.resolve(dbPecuaria.from('profiles').select('id, nome, usuario, ativo').order('nome')).catch(()=>({data:null}));
    if(novosPerfis) state.perfisPecuaria = novosPerfis.filter(p=>p.ativo!==false);
    render();

  const criarAcessoLavouraBtn = document.querySelector('[data-criar-acesso-lavoura]');
  if(criarAcessoLavouraBtn) criarAcessoLavouraBtn.onclick = ()=>{
    editDraft._criandoAcessoLavoura = true;
    state.acessoLavouraError = '';
    render();

  const cancelarAcessoLavouraBtn = document.querySelector('[data-cancelar-acesso-lavoura]');
  if(cancelarAcessoLavouraBtn) cancelarAcessoLavouraBtn.onclick = ()=>{
    editDraft._criandoAcessoLavoura = false;
    state.acessoLavouraError = '';
    render();
  };
  const confirmarAcessoLavouraBtn = document.querySelector('[data-confirmar-acesso-lavoura]');
  if(confirmarAcessoLavouraBtn) confirmarAcessoLavouraBtn.onclick = async ()=>{
    const nome = document.getElementById('f-nomeacessolavoura').value.trim();
    const usuario = document.getElementById('f-usuarioacessolavoura').value.trim();
    const senha = document.getElementById('f-senhaacessolavoura').value;
    if(!nome || !usuario || !senha || senha.length<6){
      state.acessoLavouraError = 'Preencha nome, usuário e senha (mín. 6 caracteres).';
      render(); return;
    }
    state.acessoLavouraLoading = true; state.acessoLavouraError = ''; render();
    // Mesma Edge Function que a tela de Usuários já usa (criar-usuario-cana,
    // reaproveitada — Lavoura e Matriz escrevem no mesmo profiles/auth).
    const { data, error } = await db.functions.invoke('criar-usuario-cana', { body: { nome, usuario, senha } });
    if(error || data?.error){
      let msg = data?.error || error?.message || 'Falha ao criar usuário.';
      if(error?.context && typeof error.context.json === 'function'){
        try { const corpo = await error.context.json(); if(corpo?.error) msg = corpo.error; } catch(e){}
      }
      state.acessoLavouraError = msg;
      state.acessoLavouraLoading = false;
      render();
      return;
    }
    editDraft._criandoAcessoLavoura = false;
    state.acessoLavouraLoading = false;
    // Recarrega profiles pra pegar o id novo e já deixar selecionado.
    const { data: novosPerfis } = await db.from('profiles').select('*').order('nome');
    state.perfis = (novosPerfis||[]).map(rowToPerfil);
    const criado = state.perfis.find(p=>p.usuario===usuario);
    if(criado) editDraft.perfilId = criado.id;
    render();
  };

  document.querySelectorAll('[data-excluir-funcionario]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('Excluir este funcionário? Essa ação não pode ser desfeita.')) return;
