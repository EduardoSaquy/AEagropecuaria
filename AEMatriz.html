/* Vencido depende do dia de hoje, entao nao fica guardado no banco — e
 * calculado aqui. hojeStr() e local; toISOString devolveria o dia seguinte
 * depois das 21h no Brasil. */
function estadoDoVencimento(t){
  if(t.cancelado) return 'cancelado';
  if(t.situacao==='pago') return 'pago';
  const hoje = hojeStr();
  if(!t.vencimento) return 'aberto';
  if(t.vencimento < hoje) return 'vencido';
  if(t.vencimento === hoje) return 'hoje';
  return 'aberto';
}
function PillSituacao(t){
  const e = estadoDoVencimento(t);
  if(e==='pago')      return `<span class="pill pill-ok">Pago</span>`;
  if(e==='cancelado') return `<span class="pill">Cancelado</span>`;
  if(e==='vencido')   return `<span class="pill pill-alerta">Vencido</span>`;
  if(e==='hoje')      return `<span class="pill pill-warn">Vence hoje</span>`;
  return t.situacao==='parcial'
    ? `<span class="pill pill-warn">Parcial</span>`
    : `<span class="pill">Em aberto</span>`;
}
function dataBr(iso){ return iso ? iso.split('-').reverse().join('/') : '—'; }

function titulosFiltrados(){
  const tipo = state.abaContas;
  const busca = (state.searchContas||'').trim().toLowerCase();
  return state.titulos
    .filter(t=>t.tipo===tipo)
    .filter(t=>{
      const f = state.filtroContas;
      if(f==='todos') return true;
      const e = estadoDoVencimento(t);
      if(f==='vencidos') return e==='vencido';
      if(f==='hoje')     return e==='hoje';
      if(f==='abertos')  return e==='aberto' || e==='hoje' || e==='vencido';
      if(f==='pagos')    return e==='pago';
      if(f==='previsao') return t.previsao===true;
      return true;
    })
    .filter(t=>{
      if(!busca) return true;
      const rat = rateiosDoTitulo(t.id);
      const alvo = [
        t.descricao, t.documento, nomeEntidade(t.entidadeId),
        ...rat.map(r=>nomeCentroCusto(r.centroCustoId)),
        ...rat.map(r=>nomeFazendaLanc(r.fazendaId)),
      ].join(' ').toLowerCase();
      return alvo.includes(busca);
    })
    .sort((a,b)=>{
      // vencido primeiro, depois por vencimento mais proximo
      const pa = estadoDoVencimento(a)==='vencido' ? 0 : 1;
      const pb = estadoDoVencimento(b)==='vencido' ? 0 : 1;
      if(pa!==pb) return pa-pb;
      return String(a.vencimento||'').localeCompare(String(b.vencimento||''));
    });
}

/* Le o formulario do titulo. Usado ao salvar e tambem ao mexer nos
 * rateios, que redesenha a tela — sem isto o que ja foi digitado sumiria.
 * Mesmo motivo do lerLancamentoDoFormulario. */
function lerTituloDoFormulario(base){
  const v = (id)=> document.getElementById(id)?.value ?? '';
  const rateios = (base.rateios||[]).map((r,i)=>({
    ...r,
    fazendaId:     document.getElementById(`f-rat-fazenda-${i}`)   ? v(`f-rat-fazenda-${i}`)   : r.fazendaId,
    atividade:     document.getElementById(`f-rat-atividade-${i}`) ? v(`f-rat-atividade-${i}`) : r.atividade,
    centroCustoId: document.getElementById(`f-rat-centro-${i}`)    ? v(`f-rat-centro-${i}`)    : r.centroCustoId,
    competencia:   document.getElementById(`f-rat-comp-${i}`)      ? v(`f-rat-comp-${i}`)      : r.competencia,
    valor:         document.getElementById(`f-rat-valor-${i}`)     ? v(`f-rat-valor-${i}`)     : r.valor,
  }));
  return {
    ...base,
    entidadeNome:    v('f-tit-entidade').trim(),
    descricao:       v('f-tit-descricao').trim(),
    documento:       v('f-tit-documento').trim(),
    valor:           v('f-tit-valor'),
    vencimento:      v('f-tit-vencimento'),
    parcelas:        v('f-tit-parcelas') || '1',
    intervaloDias:   v('f-tit-intervalo') || '',
    formaPagamento:  v('f-tit-forma'),
    contaBancariaId: v('f-tit-conta'),
    previsao:        document.getElementById('f-tit-previsao')?.checked === true,
    observacao:      v('f-tit-obs').trim(),
    rateios,
  };
}

/* Gera as parcelas. Mensal soma meses de verdade (nao 30 dias), entao um
 * boleto que vence dia 31 cai no ultimo dia do mes seguinte em vez de
 * pular para o mes subsequente. */
function vencimentoDaParcela(primeiro, i, intervaloDias){
  const base = new Date(primeiro + 'T12:00:00');
  if(intervaloDias){
    base.setDate(base.getDate() + Number(intervaloDias) * i);
    return base.toISOString().slice(0,10);
  }
  const dia = base.getDate();
  const d = new Date(base.getFullYear(), base.getMonth() + i, 1, 12, 0, 0);
  const ultimoDiaDoMes = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(dia, ultimoDiaDoMes));
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}

/* Reparte um valor em n partes de 2 casas cuja soma bate exatamente. O
 * resto vai na ultima — mesma regra do gatilho do banco, para a tela nunca
 * mostrar um numero diferente do que o banco vai gravar. */
function repartir(total, n){
  const t = Math.round(Number(total)*100);
  const base = Math.floor(t/n);
  const partes = Array.from({length:n}, ()=>base);
  partes[n-1] = t - base*(n-1);
  return partes.map(c=>c/100);
}


/* Acha a entidade pelo nome ou cria. O indice unico do banco e por
 * lower(btrim(nome)), entao a comparacao aqui usa a mesma regra — senao a
 * tela tentaria criar "Agrosaquy" tendo "AGROSAQUY" e tomaria erro. */
async function acharOuCriarEntidade(nome){
  const limpo = (nome||'').trim();
  if(!limpo) return {id:null};
  const achou = state.entidades.find(e=>e.nome.trim().toLowerCase() === limpo.toLowerCase());
  if(achou) return {id:achou.id};
  const {data, error} = await db.from('entidades')
    .insert({nome: limpo, papel: 'fornecedor', criado_por: state.perfil?.nome || null})
    .select('id').single();
  if(error) return {error};
  return {id: data.id};
}

async function salvarTitulo(){
  const d = lerTituloDoFormulario(editDraft);
  const total = Number(d.valor||0);
  const nParcelas = Math.max(1, Number(d.parcelas||1));

  const faltando = [];
  if(!d.descricao) faltando.push('descrição');
  if(!(total > 0)) faltando.push('valor (maior que zero)');
  if(!d.vencimento) faltando.push('vencimento');
  if(!(d.rateios||[]).length) faltando.push('pelo menos um rateio');
  (d.rateios||[]).forEach((r,i)=>{
    if(!r.centroCustoId) faltando.push(`centro de custo do rateio ${i+1}`);
    if(!r.competencia)   faltando.push(`competência do rateio ${i+1}`);
    if(!(Number(r.valor) > 0)) faltando.push(`valor do rateio ${i+1}`);
  });
  const soma = (d.rateios||[]).reduce((a,r)=>a+Number(r.valor||0), 0);
  if(faltando.length===0 && Math.abs(soma - total) > 0.005){
    faltando.push(`a soma dos rateios (R$ ${fmt(soma)}) tem que fechar com o valor do título (R$ ${fmt(total)})`);
  }
  if(faltando.length){
    state.erroTitulo = 'Preencha: ' + faltando.join('; ') + '.';
    editDraft = d; render(); return;
  }
  state.erroTitulo = '';

  const ent = await acharOuCriarEntidade(d.entidadeNome);
  if(ent.error){ alert('Não foi possível cadastrar o fornecedor: ' + ent.error.message); return; }

  const comum = {
    tipo: d.tipo,
    entidade_id: ent.id,
    descricao: d.descricao,
    documento: d.documento || null,
    forma_pagamento: d.formaPagamento || null,
    conta_bancaria_id: d.contaBancariaId ? Number(d.contaBancariaId) : null,
    previsao: d.previsao === true,
    observacao: d.observacao || null,
  };

  if(d._editId){
    // Editar mexe num titulo so. Os rateios sao trocados por inteiro: e
    // mais simples e mais seguro do que casar linha a linha, e o gatilho
    // que confere o fechamento e "deferrable", entao a troca acontece
    // dentro da mesma transacao sem acusar diferenca no meio do caminho.
    const {error: e1} = await db.from('titulos')
      .update({...comum, valor: total, vencimento: d.vencimento}).eq('id', d._editId);
    if(e1){ alert('Não foi possível salvar: ' + e1.message); return; }
    const {error: e2} = await db.from('titulo_rateios').delete().eq('titulo_id', d._editId);
    if(e2){ alert('Não foi possível atualizar o rateio: ' + e2.message); return; }
    const {error: e3} = await db.from('titulo_rateios').insert((d.rateios||[]).map(r=>({
      titulo_id: d._editId,
      fazenda_id: r.fazendaId ? Number(r.fazendaId) : null,
      atividade: r.atividade,
      centro_custo_id: Number(r.centroCustoId),
      competencia: r.competencia,
      valor: Number(r.valor),
    })));
    if(e3){ alert('Não foi possível salvar o rateio: ' + e3.message); return; }
  } else {
    const grupo = nParcelas > 1
      ? (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(16).slice(2))
      : null;
    const valoresParcela = repartir(total, nParcelas);

    for(let p = 0; p < nParcelas; p++){
      const vp = valoresParcela[p];
      const {data: novo, error: e1} = await db.from('titulos').insert({
        ...comum,
        valor: vp,
        vencimento: vencimentoDaParcela(d.vencimento, p, d.intervaloDias),
        parcela: p + 1,
        parcelas: nParcelas,
        grupo,
        criado_por: state.perfil?.nome || null,
      }).select('id').single();
      if(e1){ alert('Não foi possível salvar: ' + e1.message); return; }

      // Cada parcela recebe o rateio na mesma proporcao do titulo cheio, e
      // a ultima linha absorve o arredondamento para a soma fechar exata —
      // o banco recusa rateio que nao fecha.
      const rat = d.rateios || [];
      let acumulado = 0;
      const linhas = rat.map((r, i)=>{
        const parte = (i === rat.length - 1)
          ? Math.round((vp - acumulado) * 100) / 100
          : Math.round((vp * (Number(r.valor) / total)) * 100) / 100;
        if(i < rat.length - 1) acumulado += parte;
        return {
          titulo_id: novo.id,
          fazenda_id: r.fazendaId ? Number(r.fazendaId) : null,
          atividade: r.atividade,
          centro_custo_id: Number(r.centroCustoId),
          competencia: r.competencia,
          valor: parte,
        };
      }).filter(l=>l.valor > 0);

      const {error: e2} = await db.from('titulo_rateios').insert(linhas);
      if(e2){ alert('Não foi possível salvar o rateio: ' + e2.message); return; }
    }
  }

  state.modal = null; editDraft = null;
  await loadAll();
}

async function salvarBaixa(){
  const d = editDraft;
  const t = state.titulos.find(x=>x.id===d._tituloId);
  if(!t) return;
  const data  = document.getElementById('f-bx-data')?.value || '';
  const valor = Number(document.getElementById('f-bx-valor')?.value || 0);
  const conta = document.getElementById('f-bx-conta')?.value || '';
  const obs   = document.getElementById('f-bx-obs')?.value.trim() || '';

  if(!data){ state.erroTitulo = 'Informe a data do pagamento.'; render(); return; }
  if(!(valor > 0)){ state.erroTitulo = 'Informe um valor maior que zero.'; render(); return; }
  if(valor > saldoDoTitulo(t) + 0.005){
    state.erroTitulo = `O valor passa do saldo (R$ ${fmt(saldoDoTitulo(t))}).`; render(); return;
  }
  state.erroTitulo = '';

  // A tela so insere a baixa. Quem cria os lancamentos e reparte pelo
  // rateio e o gatilho do banco — replicar isso aqui seria a segunda
  // implementacao da mesma regra.
  const {error} = await db.from('titulo_baixas').insert({
    titulo_id: t.id,
    data,
    valor,
    conta_bancaria_id: conta ? Number(conta) : null,
    observacao: obs || null,
    criado_por: state.perfil?.nome || null,
  });
  if(error){ alert('Não foi possível registrar a baixa: ' + error.message); return; }

  state.modal = null; editDraft = null;
  await loadAll();
}

function ligarEventosContas(){
  document.querySelectorAll('[data-aba-contas]').forEach(el=>{
    el.onclick = ()=>{ state.abaContas = el.dataset.abaContas; render(); };
  });
  document.querySelectorAll('[data-filtro-contas]').forEach(el=>{
    el.onclick = ()=>{ state.filtroContas = el.dataset.filtroContas; render(); };
  });
  const buscaContas = document.querySelector('[data-search-contas]');
  if(buscaContas){
    buscaContas.oninput = ()=>{ state.searchContas = buscaContas.value; render();
      const novo = document.querySelector('[data-search-contas]');
      if(novo){ novo.focus(); novo.setSelectionRange(novo.value.length, novo.value.length); } };
  }
  document.querySelectorAll('[data-novo-titulo]').forEach(el=>{
    el.onclick = ()=>{
      state.erroTitulo = '';
      editDraft = {tipo: el.dataset.novoTitulo, valor:'', vencimento: hojeStr(), parcelas:1,
                   intervaloDias:'', previsao:false, rateios:[rateioVazio()]};
      state.modal = {type:'titulo'};
      render();
    };
  });
  document.querySelectorAll('[data-edit-titulo]').forEach(el=>{
    el.onclick = ()=>{
      const t = state.titulos.find(x=>x.id===Number(el.dataset.editTitulo));
      if(!t) return;
      state.erroTitulo = '';
      const rat = rateiosDoTitulo(t.id).map(r=>({
        fazendaId: r.fazendaId ?? '', atividade: r.atividade, centroCustoId: r.centroCustoId,
        competencia: r.competencia, valor: r.valor,
      }));
      editDraft = {
        _editId: t.id, tipo: t.tipo, entidadeNome: nomeEntidade(t.entidadeId)==='—'?'':nomeEntidade(t.entidadeId),
        descricao: t.descricao, documento: t.documento, valor: t.valor, vencimento: t.vencimento,
        parcelas: t.parcelas, intervaloDias:'', formaPagamento: t.formaPagamento,
        contaBancariaId: t.contaBancariaId ?? '', previsao: t.previsao, observacao: t.observacao,
        rateios: rat.length ? rat : [rateioVazio()],
      };
      state.modal = {type:'titulo'};
      render();
    };
  });
  document.querySelectorAll('[data-baixar-titulo]').forEach(el=>{
    el.onclick = ()=>{
      const t = state.titulos.find(x=>x.id===Number(el.dataset.baixarTitulo));
      if(!t) return;
      state.erroTitulo = '';
      editDraft = {_tituloId: t.id, data: hojeStr(), valor: saldoDoTitulo(t),
                   contaBancariaId: t.contaBancariaId ?? '', observacao:''};
      state.modal = {type:'baixa'};
      render();
    };
  });
  document.querySelectorAll('[data-ver-baixas]').forEach(el=>{
    el.onclick = ()=>{ state.modal = {type:'verBaixas', tituloId: Number(el.dataset.verBaixas)}; render(); };
  });
  document.querySelectorAll('[data-del-titulo]').forEach(el=>{
    el.onclick = async ()=>{
      const t = state.titulos.find(x=>x.id===Number(el.dataset.delTitulo));
      if(!t) return;
      const temBaixa = baixasDoTitulo(t.id).length > 0;
      const aviso = temBaixa
        ? `"${t.descricao}" já tem baixa registrada. Excluir o título apaga também os lançamentos que a baixa criou no Financeiro. Continuar?`
        : `Excluir "${t.descricao}"? Essa ação não pode ser desfeita.`;
      if(!confirm(aviso)) return;
      const {error} = await db.from('titulos').delete().eq('id', t.id);
      if(error){ alert('Não foi possível excluir: ' + error.message); return; }
      await loadAll();
    };
  });
  document.querySelectorAll('[data-del-baixa]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('Desfazer esta baixa? Os lançamentos que ela criou no Financeiro serão apagados.')) return;
      const {error} = await db.from('titulo_baixas').delete().eq('id', Number(el.dataset.delBaixa));
      if(error){ alert('Não foi possível desfazer: ' + error.message); return; }
      state.modal = null;
      await loadAll();
    };
  });

  // ---- dentro do formulário de título ----
  document.querySelectorAll('[data-recalcula-titulo]').forEach(el=>{
    el.onchange = ()=>{ editDraft = lerTituloDoFormulario(editDraft); render(); };
  });
  const addRateio = document.querySelector('[data-add-rateio]');
  if(addRateio){
    addRateio.onclick = ()=>{
      const d = lerTituloDoFormulario(editDraft);
      // O rateio novo já vem com o que falta para fechar: quase sempre é o
      // valor que a pessoa ia digitar de qualquer jeito.
      const falta = Math.round((Number(d.valor||0) - (d.rateios||[]).reduce((a,r)=>a+Number(r.valor||0),0)) * 100)/100;
      d.rateios = [...(d.rateios||[]), {...rateioVazio(), valor: falta > 0 ? falta : ''}];
      editDraft = d; render();
    };
  }
  document.querySelectorAll('[data-remove-rateio]').forEach(el=>{
    el.onclick = ()=>{
      const d = lerTituloDoFormulario(editDraft);
      d.rateios = (d.rateios||[]).filter((_,i)=> i !== Number(el.dataset.removeRateio));
      editDraft = d; render();
    };
  });
  const bxValor = document.querySelector('[data-recalcula-baixa]');
  if(bxValor){
    bxValor.onchange = ()=>{
      editDraft = {...editDraft, valor: bxValor.value,
                   data: document.getElementById('f-bx-data')?.value || editDraft.data};
      render();
    };
  }
}

// Lê o formulário de lançamento. Usado ao salvar e também ao trocar a
// atividade, que redesenha a tela — sem isto o que já foi digitado sumiria.
function lerLancamentoDoFormulario(base){
  const v = (id)=> document.getElementById(id)?.value ?? '';
  const areas = ['confinamento','pasto','cria'].filter(a=>document.getElementById(`f-arealanc-${a}`)?.checked);
  return {
    ...base,
    atividade:     v('f-atividadelanc') || base.atividade,
    fazendaId:     v('f-fazendalanc'),
    centroCustoId: v('f-centrocustolanc'),
    descricao:     v('f-descricaolanc').trim(),
    valor:         v('f-valorlanc'),
    data:          v('f-datalanc'),
    fornecedor:    v('f-fornecedorlanc').trim(),
    observacao:    v('f-obslanc').trim(),
    areas:         document.getElementById('f-arealanc-confinamento') ? areas : (base.areas||[]),
    loteId:        document.getElementById('f-lotelanc') ? v('f-lotelanc') : (base.loteId||''),
    arrobas:       document.getElementById('f-arrobaslanc') ? v('f-arrobaslanc') : (base.arrobas??''),
  };
}
function ModalLancamento(){
  const d = editDraft;
  const ehDespesa      = d.tipo==='despesa';

  const ehPecuaria     = d.atividade==='pecuaria';
  // Centros de custo que fazem sentido para a atividade escolhida.
  //
  // Frente NULA entra sempre, e isso não é exceção: é a regra para o plano
  // de contas do Conag. Os 56 centros dele são organizados por natureza
  // (receita, despesa, investimento, financeiro) e servem pecuária, cana e
  // cereais ao mesmo tempo — "MÃO-DE-OBRA DE OPERACIONAL" não é de uma
  // frente só. Enquanto este filtro exigia frente preenchida, nenhum deles
  // aparecia aqui: o plano de contas de verdade estava invisível no
  // formulário, e só dava para escolher os centros que a migração da
  // pecuária criou.
  //
  // A coluna frente é resquício do desenho anterior à unificação. Quem diz
  // a que atividade o gasto pertence é o campo atividade do lançamento.
  const centros = state.centrosCusto
    .filter(c=> c.ativo!==false)
    .filter(c=> !c.frente || c.frente==='geral' || c.frente===d.atividade)

          </select>
        </div>
        <div class="field"><label>Centro de custo${ehReceita?' / origem':''}</label>
          <select id="f-centrocustolanc">
            <option value="">— Selecione —</option>
            ${centros.map(c=>`<option value="${c.id}" ${String(d.centroCustoId)===String(c.id)?'selected':''}>${esc(c.nome)}</option>`).join('')}

        </div>
        <div class="field"><label>Descrição</label><input id="f-descricaolanc" value="${esc(d.descricao||'')}" placeholder="${ehReceita?'Ex: Venda de boi gordo':'Ex: Mão de obra do curral'}" autocomplete="off"/></div>
        <div class="field"><label>Valor (R$)</label><input id="f-valorlanc" type="number" step="0.01" min="0" value="${d.valor ?? ''}" autocomplete="off"/></div>
        <div class="field"><label>Data${ehDespesa?' (deixe vazia para recorrente)':''}</label><input id="f-datalanc" type="date" value="${d.data||''}"/>
          ${ehDespesa?`<span class="hint">Sem data, vale como valor mensal padrão para qualquer mês sem lançamento próprio.</span>`:''}
        </div>
        ${ehDespesa?`<div class="field"><label>Fornecedor (opcional)</label><input id="f-fornecedorlanc" value="${esc(d.fornecedor||'')}" autocomplete="off"/></div>`:''}
        ${ehDespesa && ehPecuaria ? `

          <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:4px;">
            ${['confinamento','pasto','cria'].map(a=>`

// Barras com linha de zero — despesa/receita por hectare são sempre >=0
// (barra cresce de baixo), lucro/ha pode ser negativo (barra cresce dos
// dois lados da linha de zero, verde acima e vermelho abaixo).
function GraficoBarras(pontos){
  const vals = pontos.map(p=>p.valor);
  const maxV = Math.max(0, ...vals), minV = Math.min(0, ...vals);
  const range = (maxV-minV) || 1;
  const largura=560, altura=200, margemBaixo=28, margemTopo=10;
  const areaAltura = altura-margemBaixo-margemTopo;
  const zeroY = margemTopo + areaAltura*(maxV/range);
  const n = pontos.length;
  const passo = largura/n;
  const larguraBarra = Math.min(24, passo-8);
  const barras = pontos.map((p,i)=>{
    const x = i*passo + (passo-larguraBarra)/2;
    const [ano,mesNum] = p.mes.split('-');
    const rotuloMes = mesNum==='01' ? `${NOMES_MES_ABREV[0]}/${ano.slice(2)}` : NOMES_MES_ABREV[Number(mesNum)-1];
    const rotuloTexto = `<text x="${(x+larguraBarra/2).toFixed(1)}" y="${altura-12}" text-anchor="middle" font-size="9" fill="var(--cinza)" font-family="Inter,sans-serif">${rotuloMes}</text>`;
    // mês que ainda não aconteceu (dentro de uma safra em andamento, por
    // exemplo) não tem como ter valor — mostrar uma barra verde/vermelha
    // de R$ 0 ali pareceria "esse mês fechou em zero", que é mentira.
    if(p.futuro){
      return `<rect x="${x.toFixed(1)}" y="${(zeroY-1).toFixed(1)}" width="${larguraBarra}" height="2" rx="1" fill="var(--cinza-claro)"></rect>${rotuloTexto}`;
    }
    const yVal = margemTopo + areaAltura*((maxV-p.valor)/range);
    const y = Math.min(zeroY,yVal), h = Math.max(1.5,Math.abs(yVal-zeroY));
    const cor = p.valor>=0 ? 'var(--bom)' : 'var(--alerta)';
    return `<rect class="gbar" data-gbar-valor="R$ ${fmt(p.valor)}" data-gbar-label="${NOMES_MES_LONGO[Number(mesNum)-1]}/${ano}"
        x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${larguraBarra}" height="${h.toFixed(1)}" rx="3" fill="${cor}"></rect>${rotuloTexto}`;
  }).join('');
  return `<svg class="grafico-barras-svg" viewBox="0 0 ${largura} ${altura}">
    <line x1="0" y1="${zeroY.toFixed(1)}" x2="${largura}" y2="${zeroY.toFixed(1)}" stroke="var(--cinza-claro)" stroke-width="1"/>
    ${barras}
  </svg>`;
}

const METRICA_LABEL = {despesaHa:'Despesa por hectare', receitaHa:'Receita por hectare', resultadoHa:'Lucro por hectare'};
const METRICA_CAMPO = {despesaHa:'despesa', receitaHa:'receita', resultadoHa:'resultado'};
function ModalGraficoOperacao(){
  const {slug, metrica} = state.modal;
  const app = state.apps.find(a=>a.slug===slug);
  const nome = esc(app ? app.nome : (OPERACOES[slug]||slug));
  const ha = hectaresPorOperacao(slug);
  const bruto = resultadoBrutoOperacao(slug);
  const semDados = !bruto || bruto.erro || !bruto.mensal || ha<=0;
  let corpo;
  if(semDados){
    const msg = ha<=0
      ? 'Sem hectares cadastrados pra essa operação — marque a atividade em Fazendas (aqui no Matriz) ou cadastre o talhão no AE Lavoura pra ver esse gráfico.'
      : (bruto?.erro || `O app ${nome} ainda não está com o banco de dados ligado à matriz.`);
    corpo = Empty('Sem dados ainda', msg);
  } else {
    const campo = METRICA_CAMPO[metrica];
    const meses = ultimos12Meses(state.periodo);
    const hoje = new Date();
    const mesAtualStr = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
    const pontos = meses.map(mesStr=>{
      const linha = bruto.mensal.find(x=>x.mes===mesStr);
      return {mes: mesStr, valor: linha ? linha[campo]/ha : 0, futuro: mesStr>mesAtualStr};
    });
    corpo = `<p class="hint" style="margin-bottom:8px;">Últimos 12 meses, em R$/ha.</p>${GraficoBarras(pontos)}`;
  }
  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal" data-stop="1" style="max-width:640px;">
      <div class="modal-head"><h3>${METRICA_LABEL[metrica]} — ${nome}</h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body">${corpo}</div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="1">Fechar</button>
      </div>
    </div>
  </div>`;
}

/* ===================== EVENTOS ===================== */
function attachEvents(){
  const loginForm = document.querySelector('[data-login-form]');
  if(loginForm){
    loginForm.onsubmit = (e)=>{ e.preventDefault(); fazerLogin(); };
    const uEl = document.querySelector('[data-login-usuario]');
    const sEl = document.querySelector('[data-login-senha]');
    if(uEl) uEl.oninput = (e)=>{ state.loginDraft.usuario = e.target.value; };
    if(sEl) sEl.oninput = (e)=>{ state.loginDraft.senha = e.target.value; };
  }
  document.querySelectorAll('[data-logout]').forEach(el=>{ el.onclick = ()=> fazerLogout(); });
  document.querySelectorAll('[data-retry-perfil]').forEach(el=>{
    el.onclick = async ()=>{ await loadPerfil(); render(); if(state.perfil?.ativo) loadAll(); };
  });
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ state.page = el.dataset.nav; render(); };
  });
  const voltarErroBtn = document.querySelector('[data-voltar-erro]');
  if(voltarErroBtn) voltarErroBtn.onclick = ()=>{ state.page = 'painel'; render(); };

  document.querySelectorAll('[data-trocar-senha-abrir]').forEach(el=>{
    el.onclick = ()=>{ editDraft = {senhaAtual:'', novaSenha:'', confirmarSenha:''}; state.modal = {type:'trocarSenha'}; render(); };
  });

  // ---- centros de custo ----
  const buscaCentrosEl = document.querySelector('[data-search-centros]');
  if(buscaCentrosEl){
    buscaCentrosEl.oninput = (e)=>{
      state.searchCentros = e.target.value; render();
      // render() reescreve o HTML inteiro, entao o cursor volta pro
      // comeco se nao for reposicionado aqui.
      const s = document.querySelector('[data-search-centros]');
      if(s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    };
  }
  const novoCentroBtn = document.querySelector('[data-novo-centro]');
  if(novoCentroBtn) novoCentroBtn.onclick = ()=>{
    editDraft = {nome:'', fazendaId:'', ativo:true};
    state.modal = {type:'centroCusto'}; render();
  };
  document.querySelectorAll('[data-editar-centro]').forEach(el=>{
    el.onclick = ()=>{
      const c = state.centrosCusto.find(x=>x.id===Number(el.dataset.editarCentro));
      editDraft = {...c, _editId: c.id};
      state.modal = {type:'centroCusto'}; render();
    };
  });
  document.querySelectorAll('[data-excluir-centro]').forEach(el=>{
    el.onclick = async ()=>{
      const id = Number(el.dataset.excluirCentro);
      // O botao so aparece quando nao ha lancamento usando o centro, mas a
      // lista pode estar velha se alguem lancou em outra aba. O banco
      // recusa pela chave estrangeira, e a mensagem abaixo explica.
      if(!confirm('Excluir este centro de custo? Essa acao nao pode ser desfeita.')) return;
      const {error} = await db.from('centros_custo').delete().eq('id', id);
      if(error){
        alert('Nao foi possivel excluir: ' + error.message
              + '\n\nSe houver lancamento usando este centro, desative-o em vez de excluir.');
        return;
      }
      await loadAll();
    };
  });

  // ---- fazendas ----
  const novaFazendaBtn = document.querySelector('[data-nova-fazenda]');
  if(novaFazendaBtn) novaFazendaBtn.onclick = ()=>{
    editDraft = {nome:'', estado:'', areaHa:'', atividades:{}};
    state.modal = {type:'fazenda'}; render();
  };
  document.querySelectorAll('[data-editar-fazenda]').forEach(el=>{
    el.onclick = ()=>{
      const f = state.fazendasLavoura.find(x=>x.id===Number(el.dataset.editarFazenda));
      const atividades = {};
      state.fazendaAtividades.filter(a=>a.fazendaId===f.id).forEach(a=>{ atividades[a.atividade] = a.areaHa; });
      editDraft = {...f, _editId: f.id, atividades};
      state.modal = {type:'fazenda'}; render();
    };
  });
  document.querySelectorAll('[data-excluir-fazenda]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('Excluir esta fazenda? Essa ação não pode ser desfeita. Se houver talhão cadastrado nela (no AE Lavoura), a exclusão vai falhar até o talhão ser removido ou movido.')) return;
      const id = Number(el.dataset.excluirFazenda);
      const {error} = await db.from('fazendas').delete().eq('id', id);
      if(error){ alert('Não foi possível excluir esta fazenda: ' + error.message); return; }
      await loadAll();
    };
  });

  // ---- financeiro ----
  document.querySelectorAll('[data-aba-financeiro]').forEach(el=>{

  });
  const filtroAtiv = document.querySelector('[data-filtro-atividade]');
  if(filtroAtiv) filtroAtiv.onchange = (e)=>{ state.filtroAtividade = e.target.value; render(); };
  const buscaDespesas = document.querySelector('[data-search-despesas]');
  if(buscaDespesas) buscaDespesas.oninput = (e)=>{
    state.searchDespesas = e.target.value;

    const campo = document.querySelector('[data-search-despesas]');
    if(campo){ campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
  };
  const filtroMesDesp = document.querySelector('[data-filtro-mes-despesas]');
  if(filtroMesDesp) filtroMesDesp.onchange = (e)=>{ state.filtroMesDespesas = e.target.value; render(); };

  const novoLancBtn = document.querySelector('[data-novo-lancamento]');
  if(novoLancBtn) novoLancBtn.onclick = ()=>{
    const tipo = novoLancBtn.dataset.novoLancamento;
    editDraft = {
      tipo,
      atividade: state.filtroAtividade || 'pecuaria',
      fazendaId:'', centroCustoId:'', descricao:'', valor:'',
      // despesa nasce sem data (recorrente); receita e investimento nascem hoje
      // hojeStr() usa componentes locais. toISOString() é UTC: no Brasil,
    // das 21h à meia-noite ele devolve a data de AMANHÃ, e a receita
    // lançada na noite de 31/08 caía na competência de setembro.
    data: tipo==='despesa' ? '' : hojeStr(),
      fornecedor:'', observacao:'', areas:[], loteId:'', arrobas:'',
    };
    state.erroLancamento = '';
    state.modal = {type:'lancamento'}; render();
  };
  // Trocar a atividade muda quais campos e quais centros de custo aparecem.
  const selAtivLanc = document.getElementById('f-atividadelanc');
  if(selAtivLanc) selAtivLanc.onchange = (e)=>{
    editDraft = {...lerLancamentoDoFormulario(editDraft), atividade: e.target.value};
    render();
  };
  document.querySelectorAll('[data-edit-lancamento]').forEach(el=>{
    el.onclick = ()=>{
      const l = state.lancamentos.find(x=>x.id===Number(el.dataset.editLancamento));
      editDraft = {...l, _editId:l.id};
      state.erroLancamento = '';
      state.modal = {type:'lancamento'}; render();
    };
  });
  ligarEventosContas();

  document.querySelectorAll('[data-del-lancamento]').forEach(el=>{
    el.onclick = async ()=>{
      const l = state.lancamentos.find(x=>x.id===Number(el.dataset.delLancamento));
      if(!confirm(`Excluir "${l?.descricao||''}"? Essa ação não pode ser desfeita.`)) return;
      const {error} = await db.from('lancamentos_financeiros').delete().eq('id', Number(el.dataset.delLancamento));
      if(error){ alert('Não foi possível excluir: ' + error.message); return; }
      await loadAll();
    };
  });

  // ---- funcionários ----
  const novoFuncionarioBtn = document.querySelector('[data-novo-funcionario]');
  if(novoFuncionarioBtn) novoFuncionarioBtn.onclick = ()=>{
    editDraft = {nome:'', cargo:'', dataAdmissao:'', ativo:true, atividades:{}, perfilId:'', observacao:''};
    state.acessoLavouraError = ''; state.acessoLavouraLoading = false;
    state.modal = {type:'funcionario'}; render();
  };
  const importarFuncionariosBtn = document.querySelector('[data-importar-funcionarios]');
  if(importarFuncionariosBtn) importarFuncionariosBtn.onclick = ()=>{
    state.modal = {type:'importarFuncionarios'}; render();
  };
  const confirmarImportarBtn = document.querySelector('[data-confirmar-importar-funcionarios]');
  if(confirmarImportarBtn) confirmarImportarBtn.onclick = async ()=>{
    const pendentes = contasNaoVinculadas();
    const selecionados = pendentes.filter((p,i)=>document.querySelector(`[data-importar-item="${i}"]`)?.checked);
    if(selecionados.length===0){ state.modal = null; render(); return; }
    confirmarImportarBtn.disabled = true; confirmarImportarBtn.textContent = 'Importando...';
    const linhas = selecionados.map((p)=>{
      const idxOriginal = pendentes.indexOf(p);
      const cargo = document.querySelector(`[data-importar-cargo="${idxOriginal}"]`)?.value.trim() || '';
      return funcionarioToRow({
        nome: p.nome,
        cargo,
        ativo: true,
        dataAdmissao: '',
        perfilId: p.ref,
        observacao: '',
      });
    });
    const {error} = await db.from('funcionarios').insert(linhas);
    if(error){ alert('Não foi possível importar: ' + error.message); confirmarImportarBtn.disabled = false; confirmarImportarBtn.textContent = 'Importar selecionados'; return; }
    state.modal = null;
    await loadAll();
  };
  // Trocar a conta vinculada precisa re-render pra o bloco de permissões
  // abaixo mostrar os dados da conta certa.
  // Cargo: escolher "Outro" revela o campo de texto. Sem re-render, pra
  // não perder o que já foi digitado nos outros campos do formulário.
  const selCargoFuncionario = document.getElementById('f-cargofuncionario');
  if(selCargoFuncionario) selCargoFuncionario.onchange = (e)=>{
    const campoOutro = document.getElementById('f-cargooutrofuncionario');
    if(!campoOutro) return;
    const ehOutro = e.target.value === CARGO_OUTRO;
    campoOutro.style.display = ehOutro ? '' : 'none';
    if(ehOutro) campoOutro.focus(); else campoOutro.value = '';
  };
  const selPerfilFuncionario = document.getElementById('f-perfilfuncionario');
  if(selPerfilFuncionario) selPerfilFuncionario.onchange = (e)=>{
    editDraft.perfilId = e.target.value; render();
  };
  document.querySelectorAll('[data-editar-funcionario]').forEach(el=>{
    el.onclick = ()=>{
      const f = state.funcionarios.find(x=>x.id===Number(el.dataset.editarFuncionario));
      const atividades = {};
      state.funcionarioAtividades.filter(a=>a.funcionarioId===f.id).forEach(a=>{ atividades[a.atividade] = a.percentual; });
      editDraft = {...f, _editId: f.id, atividades};
        state.acessoLavouraError = ''; state.acessoLavouraLoading = false;
      state.modal = {type:'funcionario'}; render();
    };
  });
  const criarAcessoLavouraBtn = document.querySelector('[data-criar-acesso-lavoura]');
  if(criarAcessoLavouraBtn) criarAcessoLavouraBtn.onclick = ()=>{
    editDraft._criandoAcessoLavoura = true;
    state.acessoLavouraError = '';
    render();
  };
  const cancelarAcessoLavouraBtn = document.querySelector('[data-cancelar-acesso-lavoura]');
  if(cancelarAcessoLavouraBtn) cancelarAcessoLavouraBtn.onclick = ()=>{
    editDraft._criandoAcessoLavoura = false;
    state.acessoLavouraError = '';
    render();
  };
  const confirmarAcessoLavouraBtn = document.querySelector('[data-confirmar-acesso-lavoura]');
  if(confirmarAcessoLavouraBtn) confirmarAcessoLavouraBtn.onclick = async ()=>{
    const nome = document.getElementById('f-nomeacessolavoura').value.trim();
    const usuario = document.getElementById('f-usuarioacessolavoura').value.trim();
    const senha = document.getElementById('f-senhaacessolavoura').value;
    if(!nome || !usuario || !senha || senha.length<6){
      state.acessoLavouraError = 'Preencha nome, usuário e senha (mín. 6 caracteres).';
      render(); return;
    }
    state.acessoLavouraLoading = true; state.acessoLavouraError = ''; render();
    // Mesma Edge Function que a tela de Usuários já usa (criar-usuario-cana,
    // reaproveitada — Lavoura e Matriz escrevem no mesmo profiles/auth).
    const { data, error } = await db.functions.invoke('criar-usuario-cana', { body: { nome, usuario, senha } });
    if(error || data?.error){
      let msg = data?.error || error?.message || 'Falha ao criar usuário.';
      if(error?.context && typeof error.context.json === 'function'){
        try { const corpo = await error.context.json(); if(corpo?.error) msg = corpo.error; } catch(e){}
      }
      state.acessoLavouraError = msg;
      state.acessoLavouraLoading = false;
      render();
      return;
    }
    editDraft._criandoAcessoLavoura = false;
    state.acessoLavouraLoading = false;
    // Recarrega profiles pra pegar o id novo e já deixar selecionado.
    const { data: novosPerfis } = await db.from('profiles').select('*').order('nome');
    state.perfis = (novosPerfis||[]).map(rowToPerfil);
    const criado = state.perfis.find(p=>p.usuario===usuario);
    if(criado) editDraft.perfilId = criado.id;
    render();
  };

  document.querySelectorAll('[data-excluir-funcionario]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('Excluir este funcionário? Essa ação não pode ser desfeita.')) return;
      const id = Number(el.dataset.excluirFuncionario);
      const {error} = await db.from('funcionarios').delete().eq('id', id);
      if(error){ alert('Não foi possível excluir este funcionário: ' + error.message); return; }
      await loadAll();
    };
  });

  // ---- usuários ----
  const novoUsuarioBtn = document.querySelector('[data-novo-usuario]');
  if(novoUsuarioBtn) novoUsuarioBtn.onclick = ()=>{
    editDraft = {nome:'', usuario:'', senha:''};
    state.usuarioError = '';
    state.modal = {type:'usuario'}; render();
  };
  document.querySelectorAll('[data-editar-usuario]').forEach(el=>{
    el.onclick = ()=>{
      const perfil = state.perfis.find(p=>p.id===el.dataset.editarUsuario);
      editDraft = {_perfilId: perfil.id, nome: perfil.nome, usuario: perfil.usuario, papel: perfil.papel, ativo: perfil.ativo};
      state.modal = {type:'papelUsuario'}; render();
    };
  });
  const criarUsuarioBtn = document.querySelector('[data-criar-usuario]');
  if(criarUsuarioBtn){
    criarUsuarioBtn.onclick = async ()=>{
      const nome = document.getElementById('f-nomeusuario').value.trim();
      const usuario = document.getElementById('f-usuario').value.trim();
      const senha = document.getElementById('f-senhausuario').value;
      if(!nome || !usuario || !senha){ state.usuarioError = 'Preencha nome, usuário e senha.'; render(); return; }
      state.usuarioLoading = true; state.usuarioError = ''; render();
      // Reaproveita a mesma Edge Function do AE Lavoura — não faz sentido
      // publicar uma "criar-usuario-matriz" própria só pra isso, já que os
      // dois apps escrevem no mesmo profiles/auth do projeto compartilhado.
      const { data, error } = await db.functions.invoke('criar-usuario-cana', { body: { nome, usuario, senha } });
      state.usuarioLoading = false;
      if(error || data?.error){
        let msg = data?.error || error?.message || 'Falha ao criar usuário.';
        if(error?.context && typeof error.context.json === 'function'){
          try { const corpo = await error.context.json(); if(corpo?.error) msg = corpo.error; } catch(e){}
        }
        state.usuarioError = msg;
        render();
        return;
      }
      state.modal = null; editDraft = null;
      await loadAll();
    };
  }

  // ---- fechar overlay ----
  document.querySelectorAll('[data-close], [data-close-overlay]').forEach(el=>{
    el.onclick = (e)=>{
      if(el.dataset.closeOverlay!==undefined && e.target!==el) return;
      state.modal = null; editDraft = null; state.usuarioError = '';
      render();
    };
  });
  document.querySelectorAll('[data-stop]').forEach(el=>{ el.onclick = (e)=> e.stopPropagation(); });

  // ---- salvar (fazenda / app / papelUsuario / trocarSenha) ----
  const saveBtn = document.querySelector('[data-save]');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const type = saveBtn.dataset.save;
      let error;
      if(type==='fazenda'){
        const campos = {
          nome: document.getElementById('f-nomefazenda').value.trim() || 'Sem nome',
          estado: document.getElementById('f-estadofazenda').value || '',
          areaHa: document.getElementById('f-areafazenda').value,
        };
        const row = fazendaToRow(campos);
        let fazendaId = editDraft._editId;
        if(fazendaId){
          ({error} = await db.from('fazendas').update(row).eq('id', fazendaId));
        } else {
          const res = await db.from('fazendas').insert(row).select().single();
          error = res.error;
          if(!error) fazendaId = res.data.id;
        }
        // Sincroniza a área de cada atividade em fazenda_atividades — uma
        // linha por atividade, área independente (pode passar da área
        // total da fazenda, de propósito, em caso de integração
        // lavoura-pecuária). Atividade com valor em branco/0 é removida.
        if(!error && fazendaId){
          for(const [key] of ATIVIDADES_FAZENDA){
            const el = document.querySelector(`[data-atividade-input="${key}"]`);
            const valor = Number(el?.value)||0;
            if(valor>0){
              ({error} = await db.from('fazenda_atividades').upsert({fazenda_id:fazendaId, atividade:key, area_ha:valor}, {onConflict:'fazenda_id,atividade'}));
            } else {
              ({error} = await db.from('fazenda_atividades').delete().eq('fazenda_id', fazendaId).eq('atividade', key));
            }
            if(error) break;
          }
        }
      } else if(type==='centro'){
        const nome = document.getElementById('f-nomecentro').value.trim();
        if(!nome){ alert('Informe o nome do centro de custo.'); return; }
        const row = centroCustoToRow({
          nome,
          // sempre global — ver o texto no modal. A coluna fazenda_id é
          // resquício de quando cada app tinha seu próprio banco e a tabela
          // exigia fazenda; lavoura_05 zerou o que existia e o banco agora
          // recusa nome repetido.
          fazendaId: '',
          ativo: document.getElementById('f-ativocentro').checked,
          // frente e resquicio do desenho anterior a unificacao: hoje quem
          // diz a que atividade o gasto pertence e o proprio lancamento.
          // Preservada na edicao para nao apagar o que ja esta gravado.
          frente: editDraft.frente || null,
          tipo: document.getElementById('f-tipocentro')?.value || '',
          subcategoria: document.getElementById('f-subcategoriacentro')?.value || '',
        });
        if(editDraft._editId){
          ({error} = await db.from('centros_custo').update(row).eq('id', editDraft._editId));
        } else {
          ({error} = await db.from('centros_custo').insert(row));
        }
      } else if(type==='funcionario'){
        const campos = {
          nome: document.getElementById('f-nomefuncionario').value.trim() || 'Sem nome',
          cargo: lerCargo('f-cargofuncionario', 'f-cargooutrofuncionario'),
          dataAdmissao: document.getElementById('f-admissaofuncionario').value || '',
          ativo: document.getElementById('f-ativofuncionario').checked,
          // Só o admin carrega a lista de logins (a RLS de profiles só
          // devolve a própria linha para os demais). Sem esta guarda, quem
          // não é admin abria o funcionário, o seletor vinha vazio, e
          // salvar gravava perfil_id = null: o vínculo com o login era
          // destruído em silêncio ao corrigir, por exemplo, só o cargo.
          // Mesma classe do bug do mes — campo que o formulário não
          // conseguiu carregar sendo escrito como nulo.
          perfilId: document.getElementById('f-perfilfuncionario')
                      ? (document.getElementById('f-perfilfuncionario').value || '')
                      : (editDraft.perfilId || ''),
          observacao: document.getElementById('f-obsfuncionario').value.trim(),
        };
        const row = funcionarioToRow(campos);
        let funcionarioId = editDraft._editId;
        if(funcionarioId){
          ({error} = await db.from('funcionarios').update(row).eq('id', funcionarioId));
        } else {
          const res = await db.from('funcionarios').insert(row).select().single();
          error = res.error;
          if(!error) funcionarioId = res.data.id;
        }
        // Mesma lógica da fazenda: uma linha por atividade em
        // funcionario_atividades, % independente (não precisa somar 100 —
        // dá pra estar alocado em mais de uma atividade ao mesmo tempo).
        if(!error && funcionarioId){
          for(const [key] of ATIVIDADES_FAZENDA){
            const el = document.querySelector(`[data-atividade-func-input="${key}"]`);
            const valor = Number(el?.value)||0;
            if(valor>0){
              ({error} = await db.from('funcionario_atividades').upsert({funcionario_id:funcionarioId, atividade:key, percentual:valor}, {onConflict:'funcionario_id,atividade'}));
            } else {
              ({error} = await db.from('funcionario_atividades').delete().eq('funcionario_id', funcionarioId).eq('atividade', key));
            }
            if(error) break;
          }
        }
        // Permissões do login vinculado, se o bloco estava visível.
        // Depois da unificação é um profiles só: grava direto, com a
        // sessão do próprio admin. Antes isto eram duas gravações, e a da
        // Pecuária dependia de uma Edge Function no outro projeto.
        if(!error && campos.perfilId && document.getElementById('f-papelperfilfuncionario')){
          const papelPerfil = document.getElementById('f-papelperfilfuncionario').value;
          const ativoPerfil = document.getElementById('f-ativoperfilfuncionario').checked;
          const permissoesPerfil = {};
          document.querySelectorAll('[data-perm-modulo]').forEach(sel=>{ permissoesPerfil[sel.dataset.permModulo] = sel.value; });
          const { error: erroPerm } = await db.from('profiles').update({papel: papelPerfil, ativo: ativoPerfil, permissoes: permissoesPerfil}).eq('id', campos.perfilId);
          if(erroPerm) alert('Funcionário salvo, mas as permissões não foram gravadas: ' + erroPerm.message);
        }
      } else if(type==='lancamento'){
        const campos = lerLancamentoDoFormulario(editDraft);
        // Obrigatórios de verdade: sem eles o lançamento não serve pra
        // nenhum relatório depois. Melhor barrar aqui do que descobrir na
        // hora de fechar o custo por hectare.
        const faltando = [];
        if(!campos.atividade) faltando.push('atividade');
        if(!campos.centroCustoId) faltando.push('centro de custo');
        if(!campos.descricao) faltando.push('descrição');
        if(!(Number(campos.valor) > 0)) faltando.push('valor (maior que zero)');
        if(campos.tipo !== 'despesa' && !campos.data) faltando.push('data');
        if(faltando.length){
          state.erroLancamento = 'Preencha: ' + faltando.join(', ') + '.';
          editDraft = campos;
          render();
          return;
        }
        state.erroLancamento = '';
        const row = lancamentoToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('lancamentos_financeiros').update(row).eq('id', editDraft._editId));
        } else {
          ({error} = await db.from('lancamentos_financeiros').insert(row));
        }
      } else if(type==='titulo'){
        await salvarTitulo(); return;
      } else if(type==='baixa'){
        await salvarBaixa(); return;
      } else if(type==='papelUsuario'){
        const papel = document.getElementById('f-papelusuario').value;
        const ativo = document.getElementById('f-ativousuario').checked;
        ({error} = await db.from('profiles').update({papel, ativo}).eq('id', editDraft._perfilId));
      } else if(type==='trocarSenha'){
        const senhaAtual = document.getElementById('f-senhaatual').value;
        const novaSenha = document.getElementById('f-novasenha').value;
        const confirmarSenha = document.getElementById('f-confirmarsenha').value;
        if(!senhaAtual || !novaSenha || !confirmarSenha){ alert('Preencha todos os campos.'); return; }
        if(novaSenha.length<6){ alert('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
        if(novaSenha!==confirmarSenha){ alert('A confirmação não bate com a nova senha.'); return; }
        const email = `${state.perfil.usuario}@${DOMINIO_LOGIN}`;
        const { error: erroSenhaAtual } = await db.auth.signInWithPassword({ email, password: senhaAtual });
        if(erroSenhaAtual){ alert('Senha atual incorreta.'); return; }
        ({error} = await db.auth.updateUser({ password: novaSenha }));
        if(error){ alert('Não foi possível trocar a senha: ' + error.message); return; }
        state.modal = null; editDraft = null;
        alert('Senha alterada com sucesso.');
        render();
        return;
      }
      if(error){ alert('Não foi possível salvar: ' + error.message); return; }
      state.modal = null; editDraft = null;
      await loadAll();
    };
  }

  // donuts de Resultados: hover sincronizado entre gráfico e legenda + tooltip
  const tooltip = document.getElementById('painel-tooltip');
  const clearHovers = ()=>{
    document.querySelectorAll('.donut-slice.hover, .legenda-row.hover').forEach(el=>el.classList.remove('hover'));
  };
  document.querySelectorAll('[data-slice-idx]').forEach(el=>{
    const idx = el.dataset.sliceIdx;
    el.addEventListener('pointerenter', ()=>{
      clearHovers();
      el.classList.add('hover');
      const row = document.querySelector(`[data-legenda-idx="${idx}"]`);
      if(row) row.classList.add('hover');
      if(tooltip){
        tooltip.innerHTML = `<div class="v">R$ ${el.dataset.tipValor}</div><div class="l">${el.dataset.tipNome} · ${el.dataset.tipPct}%</div>`;
        tooltip.style.display = 'block';
      }
    });
    el.addEventListener('pointermove', (e)=>{
      if(tooltip){ tooltip.style.left = (e.clientX+14)+'px'; tooltip.style.top = (e.clientY+14)+'px'; }
    });
    el.addEventListener('pointerleave', ()=>{ clearHovers(); if(tooltip) tooltip.style.display = 'none'; });
    el.addEventListener('focus', ()=>{
      clearHovers();
      el.classList.add('hover');
      const row = document.querySelector(`[data-legenda-idx="${idx}"]`);
      if(row) row.classList.add('hover');
    });
    el.addEventListener('blur', clearHovers);
  });
  document.querySelectorAll('[data-legenda-idx]').forEach(el=>{
    const idx = el.dataset.legendaIdx;
    el.addEventListener('pointerenter', ()=>{
      clearHovers();
      el.classList.add('hover');
      const slice = document.querySelector(`[data-slice-idx="${idx}"]`);
      if(slice) slice.classList.add('hover');
    });
    el.addEventListener('pointerleave', clearHovers);
  });
  // Clique numa fatia do donut (ou linha da legenda) abre o detalhe do que
  // compõe aquele valor. A chave é "panelId-idx" — panelId (ex:
  // "donut-despesa") também tem hífen, então separamos só no último hífen.
  const abrirDetalheOperacao = (chave)=>{
    const idx = Number(chave.slice(chave.lastIndexOf('-')+1));
    const panelId = chave.slice(0, chave.lastIndexOf('-'));
    const slug = OPERACOES_ORDEM[idx];
    if(!slug) return;
    state.modal = {type:'detalheOperacao', panelId, slug};
    render();
  };
  document.querySelectorAll('[data-slice-idx]').forEach(el=>{
    el.addEventListener('click', ()=>abrirDetalheOperacao(el.dataset.sliceIdx));
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); abrirDetalheOperacao(el.dataset.sliceIdx); } });
  });
  document.querySelectorAll('[data-legenda-idx]').forEach(el=>{
    el.style.cursor = 'pointer';
    el.addEventListener('click', ()=>abrirDetalheOperacao(el.dataset.legendaIdx));
  });

  // filtro de período (Mês / Ano / Safra)
  document.querySelectorAll('[data-periodo-tipo]').forEach(el=>{
    el.onclick = ()=>{ state.periodo.tipo = el.dataset.periodoTipo; render(); };
  });
  const periodoMesEl = document.getElementById('f-periodo-mes');
  if(periodoMesEl) periodoMesEl.onchange = (e)=>{ if(e.target.value){ state.periodo.mes = e.target.value; render(); } };
  const periodoAnoEl = document.getElementById('f-periodo-ano');
  if(periodoAnoEl) periodoAnoEl.onchange = (e)=>{ state.periodo.ano = Number(e.target.value); render(); };
  const periodoSafraEl = document.getElementById('f-periodo-safra');
  if(periodoSafraEl) periodoSafraEl.onchange = (e)=>{ state.periodo.safra = Number(e.target.value); render(); };

  // "por hectare": clicar num valor abre o gráfico dos últimos 12 meses
  document.querySelectorAll('[data-grafico-op]').forEach(el=>{
    el.onclick = ()=>{
      state.modal = {type:'graficoOperacao', slug: el.dataset.graficoOp, metrica: el.dataset.graficoMetrica};
      render();
    };
  });
  // tooltip das barras do gráfico (reaproveita o mesmo tooltip dos donuts)
  document.querySelectorAll('[data-gbar-valor]').forEach(el=>{
    el.addEventListener('pointerenter', ()=>{
      if(tooltip){ tooltip.innerHTML = `<div class="v">${el.dataset.gbarValor}</div><div class="l">${el.dataset.gbarLabel}</div>`; tooltip.style.display = 'block'; }
    });
    el.addEventListener('pointermove', (e)=>{
      if(tooltip){ tooltip.style.left = (e.clientX+14)+'px'; tooltip.style.top = (e.clientY+14)+'px'; }
    });
    el.addEventListener('pointerleave', ()=>{ if(tooltip) tooltip.style.display = 'none'; });
  });
}

initAuth();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
