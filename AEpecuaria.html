/* ---- Financeiro: Por Curral ---- */
// Custo diário/mensal por lote ativo (ração+pasto+cria + fatia do custo
// fixo do mês, tudo amortizado pelos dias já passados) -- usado em
// Financeiro > Por Lote e no Relatório de Reprodução (custo diário
// aproximado por animal, pra estimar o custo de manutenção de um
// bezerro do nascimento até a desmama).
function custosDiariosPorLote(){
  const d = dadosFinanceiro();

  const lotesAtivos = state.lotes.filter(l=>!l.dataFim);
  const diasDecorridosMes = Number(d.hoje.split('-')[2]);
  const inicioMesStr = d.mes+'-01';
  // Um lote que começou no meio do mês (animais chegaram há poucos dias) não
  // pode ser tratado como se já existisse o mês inteiro — nem pra diluir seu
  // próprio gasto (abaixo) nem pra ratear o custo fixo entre os lotes de uma
  // área (logo a seguir). Dias que esse lote específico já existe dentro do
  // mês (desde o início dele ou desde o dia 1, o que for depois, até hoje).
  function diasAtivosNoMes(lote){
    const inicioEfetivo = (lote.dataInicio && lote.dataInicio>inicioMesStr) ? lote.dataInicio : inicioMesStr;
    const diaInicio = Number(inicioEfetivo.slice(8,10));
    return Math.max(1, diasDecorridosMes-diaInicio+1);
  }

  // O custo fixo de cada área (dadosFinanceiro já rateia despesa por
  // despesa entre Confinamento/Pasto/Cria) ainda precisa ser dividido entre
  // os lotes daquela área — não só pelo número de animais de cada um, mas
  // ponderado também pelos dias que cada lote já existe no mês (animal ×
  // dia). Sem isso, um lote que chegou há poucos dias entraria na conta com
  // o mesmo peso de um lote que está lá o mês inteiro, tomando uma fatia
  // maior do que o tempo real que ele consumiu esse custo compartilhado.
  const pesoAnimalDiasPorTipo = tipo => lotesAtivos.filter(l=>loteTipo(l)===tipo).reduce((a,l)=>a+Number(l.numeroAnimais||0)*diasAtivosNoMes(l), 0);
  const pesoAnimalDiasPorAreaMes = {confinamento: pesoAnimalDiasPorTipo('confinamento'), pasto: pesoAnimalDiasPorTipo('pasto'), reproducao: pesoAnimalDiasPorTipo('reproducao')};
  const fixoAreaMes = {confinamento: d.fixoConfinamento, pasto: d.fixoPasto, reproducao: d.fixoCria};
  function fixoLoteAlocado(lote, fixoDaAreaNoPeriodo){
    const tipo = loteTipo(lote);
    const totalPesoArea = pesoAnimalDiasPorAreaMes[tipo];
    const pesoLote = Number(lote.numeroAnimais||0)*diasAtivosNoMes(lote);
    return totalPesoArea>0 ? fixoDaAreaNoPeriodo*(pesoLote/totalPesoArea) : 0;
  }

  // Janela do custo VARIÁVEL médio/dia (ração+pasto+cria) -- cada atividade
  // tem um ciclo bem diferente, então cada uma tem sua própria janela (o
  // custo fixo acima continua só do mês corrente, isso não muda):
  // Confinamento é um ciclo curto (60-120 dias) -- soma desde a entrada do
  // lote, sem limite de mês. Pasto e Cria ficam meses a anos -- soma desde
  // 1º de janeiro do ano corrente (ou desde a entrada, se entrou depois),
  // resetando a cada ano novo pra não arrastar custo de anos passados.
  const inicioAnoStr = d.mes.slice(0,4)+'-01-01';
  function inicioJanelaVariavel(lote){
    if(loteTipo(lote)==='confinamento') return lote.dataInicio || inicioMesStr;
    return (lote.dataInicio && lote.dataInicio>inicioAnoStr) ? lote.dataInicio : inicioAnoStr;
  }
  function diasJanelaVariavel(lote){
    const inicio = inicioJanelaVariavel(lote);
    return Math.max(1, Math.round((new Date(d.hoje+'T00:00:00') - new Date(inicio+'T00:00:00'))/86400000) + 1);
  }

  const custosMesPorLote = lotesAtivos.map(l=>{
    const racao = state.saidasRacao.filter(s=>s.data.startsWith(d.mes) && s.loteId===l.id).reduce((a,s)=>a+custoSaidaRacao(s),0);
    const pasto = state.pasto.filter(p=>p.data.startsWith(d.mes) && p.loteId===l.id).reduce((a,p)=>a+custoPasto(p),0);
    const reproducao = state.reproducao.filter(r=>r.data.startsWith(d.mes) && r.loteId===l.id).reduce((a,r)=>a+custoReproducao(r),0);
    const variavel = racao + pasto + reproducao;
    const fixoAlocado = fixoLoteAlocado(l, fixoAreaMes[loteTipo(l)]);
    const total = variavel + fixoAlocado;
    const porAnimal = l.numeroAnimais>0 ? total/l.numeroAnimais : 0;
    const arrobas = arrobasProduzidasNoMes(l.id, d.mes, l.numeroAnimais);
    const custoPorArroba = arrobas>0 ? total/arrobas : null;
    return {lote:l, racao, pasto, reproducao, fixoAlocado, total, porAnimal, arrobas, custoPorArroba};
  }).sort((a,b)=> b.total-a.total);

  // Média diária real (não "só hoje" nem "só esse mês"): ração/pasto/cria
  // não são lançados todo santo dia -- mostrar só o valor de hoje ou só o
  // total do mês corrente deixava a conta furada ou reiniciando toda hora.
  // Cada lote soma o que já gastou na SUA janela (definida acima -- desde
  // a entrada pro Confinamento, desde o ano corrente pro Pasto/Cria) e
  // divide pelos dias dessa mesma janela.
  const custosPorLote = lotesAtivos.map(l=>{
    const inicioJanela = inicioJanelaVariavel(l);
    const racaoTotal = state.saidasRacao.filter(s=>s.data>=inicioJanela && s.data<=d.hoje && s.loteId===l.id).reduce((a,s)=>a+custoSaidaRacao(s),0);
    const pastoTotal = state.pasto.filter(p=>p.data>=inicioJanela && p.data<=d.hoje && p.loteId===l.id).reduce((a,p)=>a+custoPasto(p),0);
    const reproducaoTotal = state.reproducao.filter(r=>r.data>=inicioJanela && r.data<=d.hoje && r.loteId===l.id).reduce((a,r)=>a+custoReproducao(r),0);
    const dias = diasJanelaVariavel(l);
    const racao = racaoTotal/dias;
    const pasto = pastoTotal/dias;
    const reproducao = reproducaoTotal/dias;
    const fixoAlocado = fixoLoteAlocado(l, fixoAreaMes[loteTipo(l)]/30);
    const total = racao + pasto + reproducao + fixoAlocado;
    const porAnimal = l.numeroAnimais>0 ? total/l.numeroAnimais : 0;
    // Custo teórico: o que a dieta padrão do lote (kg/animal/dia × preço)
    // diz que deveria custar, pra comparar com o que foi realmente lançado
    // em Saída de Ração -- ajuda a achar dia sem lançamento (puxa a média
    // real pra baixo) ou dieta cadastrada desatualizada.
    const dietaPadrao = l.dietaId ? state.dietas.find(x=>x.id===l.dietaId) : null;
    const custoTeoricoDia = dietaPadrao ? calcDieta(dietaPadrao).custoAnimalDia*Number(l.numeroAnimais||0) : null;
    const variavelReal = racao + pasto + reproducao;
    const pctDoTeorico = (custoTeoricoDia!=null && custoTeoricoDia>0) ? (variavelReal/custoTeoricoDia*100) : null;
    return {lote:l, racao, pasto, reproducao, fixoAlocado, total, porAnimal, custoTeoricoDia, pctDoTeorico};
  }).sort((a,b)=> b.total-a.total);

  // Mesmos dados de custosMesPorLote, só que somados por área (Confinamento/
  // Pasto/Cria) em vez de por lote individual — pra comparar categorias.
  const custoPorAreaMes = ['confinamento','pasto','reproducao'].map(tipo=>{
    const lotesArea = custosMesPorLote.filter(r=>loteTipo(r.lote)===tipo);
    const totalAnimais = lotesArea.reduce((a,r)=>a+Number(r.lote.numeroAnimais||0),0);
    const totalCusto = lotesArea.reduce((a,r)=>a+r.total,0);
    const totalArrobas = lotesArea.reduce((a,r)=>a+(r.arrobas||0),0);
    return {
      tipo, label: TIPO_PESAGEM_LABEL[tipo], numeroLotes: lotesArea.length, totalAnimais, totalCusto, totalArrobas,
      custoPorArroba: totalArrobas>0 ? totalCusto/totalArrobas : null,
      custoPorAnimal: totalAnimais>0 ? totalCusto/totalAnimais : null,
    };
  }).filter(r=>r.numeroLotes>0);

  return {custosMesPorLote, custosPorLote, custoPorAreaMes};
}

/* ===================== RELATÓRIO DE REPRODUÇÃO ===================== */
// Custo por bezerro desmamado: soma o custo do protocolo de inseminação
// daquela vaca específica (quando encontrado) com a fatia de ração/pasto
// (gasto real do lote entre o nascimento e a desmama, exato pelas datas
// dos lançamentos) e uma estimativa de custo fixo (taxa diária atual do
// lote × dias) -- o app não guarda o histórico de quantos animais o lote
// tinha em cada mês passado, então o custo fixo é sempre uma aproximação
// (mesmo critério já usado em outras contas do ano no app).
function diasEntreDatas(a, b){
  return Math.max(1, Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000));
}
// Encontra a inseminação mais recente daquela vaca (mesmo lote + número da
// vaca) até a data do parto -- é a que mais provavelmente resultou nesse
// nascimento. Não há um vínculo explícito gravado, então é uma dedução.
function inseminacaoDoParto(parto){
  const candidatas = state.reproducao.filter(r=>r.loteId===parto.loteId && r.numeroVaca && r.numeroVaca===parto.numeroMae && r.data<=parto.data);
  if(candidatas.length===0) return null;
  return candidatas.reduce((a,b)=> a.data>=b.data ? a : b);
}
function custoBezerroDesmama(desmama, custosPorLoteList){
  const parto = state.partos.find(p=>p.id===desmama.partoId);
  if(!parto) return null;
  const lote = state.lotes.find(l=>l.id===parto.loteId);
  const dias = diasEntreDatas(parto.data, desmama.data);
  const insem = inseminacaoDoParto(parto);
  const custoProtocolo = insem ? Number(insem.custo)||0 : 0;
  const racaoPeriodo = state.saidasRacao.filter(s=>s.loteId===parto.loteId && s.data>=parto.data && s.data<=desmama.data).reduce((a,s)=>a+custoSaidaRacao(s),0);
  const pastoPeriodo = state.pasto.filter(p=>p.loteId===parto.loteId && p.data>=parto.data && p.data<=desmama.data).reduce((a,p)=>a+custoPasto(p),0);
  const custoVariavelPorAnimal = lote && lote.numeroAnimais>0 ? (racaoPeriodo+pastoPeriodo)/lote.numeroAnimais : 0;
  const listaCustos = custosPorLoteList || custosDiariosPorLote().custosPorLote;
  const diarioLote = lote ? listaCustos.find(r=>r.lote.id===lote.id) : null;
  // fixoAlocado é o custo fixo diário do LOTE INTEIRO, não por cabeça — a
  // prova está em custosDiariosPorLote(), que logo depois faz
  // porAnimal = total/l.numeroAnimais a partir dele.
  //
  // Aqui faltava essa divisão. A ração e o pasto acima já eram divididos
  // por numeroAnimais e o fixo não, então o custo do bezerro vinha
  // multiplicado exatamente pelo número de animais do lote: num lote de
  // cria com 100 vacas, um bezerro de 210 dias aparecia com R$ 210.000 em
  // vez de R$ 2.100. O erro ia junto para o "custo médio por bezerro" e
  // para a coluna Total da tabela de Reprodução.
  const custoFixoPeriodo = (lote && lote.numeroAnimais > 0)
    ? (diarioLote ? diarioLote.fixoAlocado : 0) * dias / lote.numeroAnimais
    : 0;
  const custoTotal = custoProtocolo + custoVariavelPorAnimal + custoFixoPeriodo;
  return {parto, lote, desmama, dias, custoProtocolo, custoVariavelPorAnimal, custoFixoPeriodo, custoTotal, temInseminacao: !!insem};
}
// Taxa de prenhez = vacas prenhas ÷ vacas já diagnosticadas (prenha+vazia)
// daquele lote -- inseminações sem diagnóstico ainda não entram na conta.
function taxasPrenhezPorLote(){
  const lotes = state.lotes.filter(l=>loteTipo(l)==='reproducao');
  return lotes.map(l=>{
    const insem = state.reproducao.filter(r=>r.loteId===l.id).length;
    const dgs = state.diagnosticos.filter(d=>d.loteId===l.id);
    const prenha = dgs.filter(d=>d.resultado==='prenha').length;
    const vazia = dgs.filter(d=>d.resultado==='vazia').length;
    const diagnosticadas = prenha+vazia;
    const taxa = diagnosticadas>0 ? prenha/diagnosticadas*100 : null;
    return {lote:l, insem, prenha, vazia, diagnosticadas, taxa};
  }).filter(r=>r.insem>0 || r.diagnosticadas>0);
}
// Taxa de desmame = bezerros desmamados ÷ bezerros nascidos (partos)
// daquele lote.
function taxasDesmamePorLote(){
  const lotes = state.lotes.filter(loteElegivelParaParto);
  return lotes.map(l=>{
    const nascidos = state.partos.filter(p=>p.loteId===l.id).length;
    const desmamados = state.desmamas.filter(d=>{ const p=state.partos.find(pp=>pp.id===d.partoId); return p && p.loteId===l.id; }).length;
    const taxa = nascidos>0 ? desmamados/nascidos*100 : null;
    return {lote:l, nascidos, desmamados, taxa};
  }).filter(r=>r.nascidos>0);
}

// Lançamentos de alimentação de um lote (Saída de Ração pra Confinamento/
// Cria, Pasto pra lote de Pasto), normalizados em {data, quantidade}, dentro
// de uma janela de datas -- usado pelo diagnóstico abaixo.
function lancamentosAlimentacaoDoLote(lote, inicioJanela, hoje){
  if(loteTipo(lote)==='pasto'){
    return state.pasto.filter(p=>p.loteId===lote.id && p.data>=inicioJanela && p.data<=hoje).map(p=>({data:p.data, quantidade:Number(p.quantidade)}));
  }
  return state.saidasRacao.filter(s=>s.loteId===lote.id && s.data>=inicioJanela && s.data<=hoje).map(s=>({data:s.data, quantidade:Number(s.quantidadeKg)}));
}
// Agrupa uma lista de datas (YYYY-MM-DD) em intervalos contínuos, pra não
// listar dia por dia numa janela longa -- datas seguidas viram um intervalo só.
function agruparDatasEmIntervalos(datas){
  if(datas.length===0) return [];
  const ordenadas = [...datas].sort();
  const intervalos = [];
  let inicio = ordenadas[0], fim = ordenadas[0];
  for(let i=1;i<ordenadas.length;i++){
    const diffDias = Math.round((new Date(ordenadas[i]+'T00:00:00') - new Date(fim+'T00:00:00'))/86400000);
    if(diffDias===1){ fim = ordenadas[i]; }
    else { intervalos.push({inicio, fim}); inicio = ordenadas[i]; fim = ordenadas[i]; }
  }
  intervalos.push({inicio, fim});
  return intervalos;
}
// Varre, pra cada lote ativo, a mesma janela usada no custo médio diário
// (desde a entrada pro Confinamento, desde 1º de janeiro pro Pasto/Cria) --
// procurando (1) dias corridos sem nenhum lançamento de alimentação (puxam a
// média pra baixo, sem aparecer como erro em lugar nenhum) e (2) lançamentos
// cuja quantidade foge muito da mediana do próprio lote (menos da metade ou
// mais do dobro -- possível erro de digitação, tipo esquecer um zero).
function diagnosticoLancamentosPorLote(){
  const d = dadosFinanceiro();
  const lotesAtivos = state.lotes.filter(l=>!l.dataFim);
  const inicioAnoStr = d.mes.slice(0,4)+'-01-01';
  const inicioMesStr = d.mes+'-01';
  return lotesAtivos.map(l=>{
    const inicioJanela = loteTipo(l)==='confinamento' ? (l.dataInicio || inicioMesStr) : ((l.dataInicio && l.dataInicio>inicioAnoStr) ? l.dataInicio : inicioAnoStr);
    const lancamentos = lancamentosAlimentacaoDoLote(l, inicioJanela, d.hoje).sort((a,b)=>a.data.localeCompare(b.data));
    const datasComLancamento = new Set(lancamentos.map(x=>x.data));

    const diasFaltantesArr = [];
    let cursor = new Date(inicioJanela+'T00:00:00');
    const fimDate = new Date(d.hoje+'T00:00:00');
    while(cursor<=fimDate){
      const dataStr = cursor.toISOString().slice(0,10);
      if(!datasComLancamento.has(dataStr)) diasFaltantesArr.push(dataStr);
      cursor.setDate(cursor.getDate()+1);
    }
    const intervalosFaltantes = agruparDatasEmIntervalos(diasFaltantesArr);

    const quantidadesOrdenadas = lancamentos.map(x=>x.quantidade).filter(q=>q>0).sort((a,b)=>a-b);
    const mediana = quantidadesOrdenadas.length>0 ? quantidadesOrdenadas[Math.floor(quantidadesOrdenadas.length/2)] : null;
    const foraPadrao = mediana ? lancamentos.filter(x=>x.quantidade>0 && (x.quantidade>mediana*2 || x.quantidade<mediana*0.5)).map(x=>({...x, pctMediana:x.quantidade/mediana*100})) : [];

    return {lote:l, inicioJanela, diasFaltantes:diasFaltantesArr.length, intervalosFaltantes, mediana, foraPadrao};
  });
}

  <p class="hint" style="margin:-14px 0 22px;">"Custo variável" junta ração, pasto e cria numa coisa só — um curral só tem custo na categoria da sua própria atividade (ex: Confinamento nunca tem custo de Pasto), então mostrar as três colunas separadas só deixava a tabela cheia de R$ 0,00. Não é o gasto de hoje especificamente (ração/pasto/cria não são lançados todo dia), e cada atividade tem sua própria janela de tempo, pelo ciclo bem diferente de cada uma: no <strong>Confinamento</strong> (ciclo curto) soma tudo que já foi gasto desde a <strong>entrada do lote</strong>, sem resetar por mês; no <strong>Pasto</strong> e na <strong>Cria</strong> (ciclo de meses a anos) soma desde <strong>1º de janeiro do ano corrente</strong> (ou desde a entrada, se entrou depois), resetando a cada ano novo. O custo fixo continua sendo só do mês corrente (mensal ÷ 30), rateado entre os currais na proporção de animais × dias que cada um já existe no mês — isso não mudou. <strong>"Custo teórico da dieta"</strong> é quanto deveria custar se o lote inteiro comesse a dieta padrão cadastrada (kg/animal/dia × preço × nº de animais) — compare com o "Custo variável" real ao lado: se o "% do teórico" estiver bem abaixo de 100%, é sinal de que faltou lançar Saída de Ração em algum dia (o que puxa a média real pra baixo) ou que a dieta padrão cadastrada está desatualizada em relação ao que é realmente dado.</p>

  <p class="eyebrow" style="margin-bottom:10px;">Custo total do mês por curral (ração + pasto + cria + fatia do custo fixo)</p>
  <div class="card" style="margin-bottom:22px;">
    ${custosMesPorLote.length===0 ? Empty('Nenhum lote ativo','Cadastre lotes em Confinamento, Pasto ou Cria para ver o custo total do mês de cada um aqui.') : `
    <table>
      <thead><tr><th>Curral</th><th>Nº animais</th><th>Ração+Pasto+Cria no mês</th><th>Custo fixo alocado</th><th>Total no mês</th><th>Custo/animal no mês</th><th>@ produzidas</th><th>Custo/@</th></tr></thead>
      <tbody>
        ${custosMesPorLote.map(r=>`
          <tr>
            <td><strong>${esc(r.lote.nome)}</strong></td>
            <td class="mono">${fmtInt(r.lote.numeroAnimais)}</td>
            <td class="mono">R$ ${fmt(r.racao+r.pasto+r.reproducao)}</td>
            <td class="mono">R$ ${fmt(r.fixoAlocado)}</td>
            <td class="mono">R$ ${fmt(r.total)}</td>
            <td class="mono">R$ ${fmt(r.porAnimal,2)}</td>
            <td class="mono">${r.arrobas!==null ? fmt(r.arrobas,1)+' @' : '—'}</td>
            <td class="mono">${r.custoPorArroba!==null ? 'R$ '+fmt(r.custoPorArroba,2) : '—'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`}
  </div>
  <p class="hint" style="margin:-14px 0 22px;">O custo fixo de cada curral é alocado na proporção de animais × dias que ele já existe no mês, em relação ao total dos lotes ativos da mesma atividade — assim um lote que chegou há poucos dias não carrega uma fatia do custo fixo do mês inteiro, só da parte proporcional ao tempo que ele já está na fazenda. "@ produzidas" vem do ganho de peso do lote no mês (Pesagem) ÷ 30 kg × nº de animais — sem pesagem cadastrada no mês, aparece "—".</p>

  <p class="eyebrow" style="margin-bottom:10px;">Custo por @ produzida — por área</p>
  <div class="card">
    ${custoPorAreaMes.length===0 ? Empty('Nenhum lote ativo','Cadastre lotes em Confinamento, Pasto ou Cria para comparar o custo por @ produzida entre as áreas.') : `
    <table>
      <thead><tr><th>Área</th><th>Lotes</th><th>Nº animais</th><th>Total no mês</th><th>Custo/animal</th><th>@ produzidas</th><th>Custo/@</th></tr></thead>
      <tbody>
        ${custoPorAreaMes.map(r=>`
          <tr>
            <td><strong>${r.label}</strong></td>
            <td class="mono">${r.numeroLotes}</td>
            <td class="mono">${fmtInt(r.totalAnimais)}</td>
            <td class="mono">R$ ${fmt(r.totalCusto)}</td>
            <td class="mono">${r.custoPorAnimal!==null ? 'R$ '+fmt(r.custoPorAnimal,2) : '—'}</td>
            <td class="mono">${r.totalArrobas>0 ? fmt(r.totalArrobas,1)+' @' : '—'}</td>
            <td class="mono">${r.custoPorArroba!==null ? 'R$ '+fmt(r.custoPorArroba,2) : '—'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`}
  </div>
  <p class="hint" style="margin-top:12px;">Soma dos lotes de cada área (mesmos dados da tabela "Por Lote" acima) — útil pra comparar, por exemplo, se o Confinamento está produzindo @ mais barata que o Pasto.</p>

  <p class="eyebrow" style="margin-bottom:10px;">Diagnóstico de lançamentos (Saída de Ração / Pasto)</p>
  <div class="card">
    ${diagnostico.length===0 ? Empty('Nenhum lote ativo','Cadastre lotes em Confinamento, Pasto ou Cria para conferir os lançamentos aqui.') : `

      <thead><tr><th>Curral</th><th>Janela analisada</th><th>Dias sem lançamento</th><th>Lançamentos fora do padrão</th></tr></thead>

          <tr>

          </tr>
          ${r.diasFaltantes>0 ? `<tr><td colspan="4"><p class="hint" style="margin:4px 0 8px;">Sem lançamento em: ${r.intervalosFaltantes.map(iv=>iv.inicio===iv.fim ? iv.inicio.split('-').reverse().join('/') : `${iv.inicio.split('-').reverse().join('/')} a ${iv.fim.split('-').reverse().join('/')}`).join(', ')}</p></td></tr>` : ''}
          ${r.foraPadrao.length>0 ? `<tr><td colspan="4"><p class="hint" style="margin:4px 0 8px;">Fora do padrão (mediana do lote: ${fmt(r.mediana,0)} kg): ${r.foraPadrao.map(f=>`${f.data.split('-').reverse().join('/')} — ${fmt(f.quantidade,0)} kg (${fmt(f.pctMediana,0)}% da mediana)`).join(', ')}</p></td></tr>` : ''}
        `).join('')}
      </tbody>
    </table>`}

  <p class="hint" style="margin-top:12px;">"Dias sem lançamento" conta dias corridos, dentro da mesma janela usada no custo médio diário acima, sem nenhuma Saída de Ração/Pasto lançada pro lote — cada dia faltando puxa a média (e o "% do teórico" da tabela acima) pra baixo. "Fora do padrão" lista lançamentos com menos da metade ou mais do dobro da quantidade mediana lançada pro mesmo lote — pode ser erro de digitação (esqueceu um zero, ou lançou no lote errado) ou uma mudança real que vale a pena conferir.</p>`;
}

function PageFinanceiroCustosFixos(){
  const busca = state.searchDespesas.toLowerCase();
  const mesAtual = mesAtualStr();
  const acumuladoMes = fixosDoMes(mesAtual);
  const mesesDisponiveis = [...new Set(state.custosFixos.map(c=>c.mes).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
  const list = [...state.custosFixos].filter(c=>
    (!busca || c.nome.toLowerCase().includes(busca) || (c.categoria||'').toLowerCase().includes(busca) || (c.descricao||'').toLowerCase().includes(busca) || (c.fornecedor||'').toLowerCase().includes(busca))
    && (!state.filtroMesDespesas || (state.filtroMesDespesas==='__recorrente__' ? !c.mes : c.mes===state.filtroMesDespesas))
  ).sort((a,b)=>{
    if(!a.mes && b.mes) return -1;
    if(a.mes && !b.mes) return 1;
    return (b.mes||'').localeCompare(a.mes||'');
  });
  return `
  <div class="stat-row" style="margin-bottom:14px;">
    <div class="stat-card"><div class="stat-label">Despesas acumuladas em ${mesLabel(mesAtual)}</div><div class="stat-value">R$ ${fmt(acumuladoMes)}</div></div>
  </div>
  <p class="hint" style="margin:-6px 0 14px;">Soma dos custos fixos que valem para o mês atual — cada centro de custo usa o valor cadastrado especificamente para ${mesLabel(mesAtual)} quando existe, senão o valor recorrente.</p>
  <div class="field-row" style="margin-bottom:14px;">
    <div class="field" style="max-width:340px;">
      <input type="text" placeholder="Buscar por nome, centro de custo ou fornecedor..." value="${state.searchDespesas}" data-search-despesas="1"/>

      <select data-filtro-mes-despesas="1">

        <option value="__recorrente__" ${state.filtroMesDespesas==='__recorrente__'?'selected':''}>Só recorrentes</option>
        ${mesesDisponiveis.map(m=>`<option value="${m}" ${state.filtroMesDespesas===m?'selected':''}>${mesLabel(m)}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="card">
    ${list.length===0 ? Empty(state.custosFixos.length===0 ? 'Nenhuma despesa cadastrada' : 'Nenhuma despesa encontrada', state.custosFixos.length===0 ? 'Cadastre as despesas da operação, como mão de obra, energia, manutenção ou nutrição — recorrentes ou de um mês específico.' : 'Nenhuma despesa bate com essa busca/filtro.') : `
    <table>
      <thead><tr><th>Nome</th><th>Centro de custo</th><th>Fornecedor</th><th>Mês</th><th>Data</th><th>Área</th><th>Valor</th><th>Observação</th><th></th></tr></thead>
      <tbody>
        ${list.map(c=>`
          <tr>
            <td><strong>${esc(c.nome)}</strong>${c.descricao ? `<div class="hint" style="margin-top:2px;">${esc(c.descricao)}</div>` : ''}</td>
            <td>${esc(c.categoria) || '—'}</td>
            <td>${esc(c.fornecedor) || '—'}</td>
            <td>${c.mes ? `<span class="pill pill-cat">${mesLabel(c.mes)}</span>` : `<span class="pill pill-ok">Recorrente</span>`}</td>
            <td class="mono">${c.data ? c.data.split('-').reverse().join('/') : '—'}</td>
            <td>${areasLabel(c.areas)}</td>
            <td class="mono">R$ ${fmt(c.valorMensal)}</td>
            <td>${esc(c.observacao) || '—'}</td>
            <td style="display:flex; gap:6px;">

            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`}
  </div>
  <p class="hint" style="margin:14px 0 0;">"Recorrente" é o valor mensal atual, usado em qualquer mês que não tenha um custo fixo próprio cadastrado. Cadastrar um custo fixo com um mês específico (ex: a partir de um relatório histórico) substitui o recorrente só naquele mês, para refletir o gasto real.</p>`;
}
function mesLabel(mesStr){
  const [ano, m] = mesStr.split('-');
  return `${NOMES_MES[Number(m)-1]}/${ano}`;
}

  if(state.modal.type==='animal') return ModalAnimal();
  if(state.modal.type==='morteAnimal') return ModalMorteAnimal();
  if(state.modal.type==='saidaRacao') return ModalSaidaRacao();
  if(state.modal.type==='saidaRacaoCria') return ModalSaidaRacaoCria();
  if(state.modal.type==='cocho') return ModalCocho();
  if(state.modal.type==='pasto') return ModalPasto();
  if(state.modal.type==='reproducaoCusto') return ModalReproducaoCusto();
  if(state.modal.type==='diagnosticoGestacional') return ModalDiagnostico();
  if(state.modal.type==='parto') return ModalParto();
  if(state.modal.type==='desmama') return ModalDesmama();
  if(state.modal.type==='pesagem') return ModalPesagem();
  if(state.modal.type==='venda') return ModalVenda();
  if(state.modal.type==='precoArroba') return ModalPrecoArroba();
  if(state.modal.type==='metaMargem') return ModalMetaMargem();
  if(state.modal.type==='usuario') return ModalUsuario();
  if(state.modal.type==='permissoes') return ModalPermissoes();
  if(state.modal.type==='trocarSenha') return ModalTrocarSenha();
  if(state.modal.type==='pendencias') return ModalPendencias();
  if(state.modal.type==='detalheGrafico') return ModalDetalheGrafico();
  return '';
}

function ModalLote(){
  const d = editDraft;
  const modoNovo = !d._editId ? (d.modoEntrada||'novo')==='novo' : true;
  // Só oferece destino (lote novo) ou lote existente que essa pessoa pode
  // editar -- mesma regra usada em lotesElegiveisManejo()/ModalAnimal, sem
  // isso dava pra criar/somar animais num módulo sem permissão nenhuma.
  const destinosPermitidosLote = ['confinamento','pasto','cria'].filter(t=>podeCriarLote() || temPermissao(t,'editar'));
  const lotesExistentesPermitidos = state.lotes.filter(l=>!l.dataFim && (podeCriarLote() || temPermissao(TIPO_MODULO[loteTipo(l)],'editar')));
  const numerosAnimaisListaAtual = !d._editId ? parseNumerosAnimais(d.numerosAnimais||'') : [];
  const loteExistenteAtualLote = !modoNovo ? state.lotes.find(l=>l.id==d.loteExistenteId) : null;
  const sexoLoteAtualLote = modoNovo ? (d.sexo||'') : (loteExistenteAtualLote?.sexo||'');
  const algumAnimalNovoLote = numerosAnimaisListaAtual.some(n=>!animalCadastrado(n, (sexoLoteAtualLote==='macho'||sexoLoteAtualLote==='femea') ? sexoLoteAtualLote : undefined));
  const precisaSexoAnimalNovoLote = algumAnimalNovoLote && sexoLoteAtualLote!=='macho' && sexoLoteAtualLote!=='femea';
  const camposAnimalNovoLote = algumAnimalNovoLote ? `
        <div class="field-row">
          ${precisaSexoAnimalNovoLote ? `<div class="field"><label>Sexo dos animais novos (obrigatório)</label>
            <select id="f-sexoanimaisnovos">
              <option value="" ${!d.sexoAnimaisNovos?'selected':''}>— Selecione —</option>
              <option value="macho" ${d.sexoAnimaisNovos==='macho'?'selected':''}>Machos</option>
              <option value="femea" ${d.sexoAnimaisNovos==='femea'?'selected':''}>Fêmeas</option>
            </select>
          </div>` : ''}
          <div class="field"><label>Raça dos animais novos (obrigatório)</label>
            <select id="f-racaanimaisnovos">
              <option value="" ${!d.racaAnimaisNovos?'selected':''}>— Selecione —</option>
              <option value="angus" ${d.racaAnimaisNovos==='angus'?'selected':''}>Angus</option>
              <option value="nelore" ${d.racaAnimaisNovos==='nelore'?'selected':''}>Nelore</option>
              <option value="outro" ${d.racaAnimaisNovos==='outro'?'selected':''}>Outro</option>
            </select>
          </div>
        </div>
        <p class="hint" style="margin-top:-6px;">Um ou mais números listados ainda não estão cadastrados — precisa informar ${precisaSexoAnimalNovoLote?'sexo e raça':'a raça'} deles pra numerar.</p>
  ` : '';
  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal" data-stop="1">
      <div class="modal-head"><h3>${d._editId?'Editar lote':'Nova entrada de animais'}</h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body">
        ${!d._editId ? `
        <div class="field"><label>Esses animais vão para</label>
          <select id="f-modoentrada">
            <option value="novo" ${modoNovo?'selected':''}>Um lote novo</option>
            <option value="existente" ${!modoNovo?'selected':''}>Um lote já existente</option>
          </select>
        </div>
        ` : ''}
        ${modoNovo ? `
        <div class="field"><label>Identificação do lote</label><input id="f-nome" value="${esc(d.nome)}" placeholder="Ex: Lote 12 / Curral 3"/></div>
        <div class="field"><label>Destino</label>
          <select id="f-destino">
            ${destinosPermitidosLote.map(t=>`<option value="${t}" ${d.destino===t?'selected':''}>${DESTINO_LOTE_LABEL[t]}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Sexo do lote (opcional)</label>
          <select id="f-sexolote">
            <option value="" ${!d.sexo?'selected':''}>— Não informado —</option>
            <option value="femea" ${d.sexo==='femea'?'selected':''}>Fêmeas</option>
            <option value="macho" ${d.sexo==='macho'?'selected':''}>Machos</option>
            <option value="misto" ${d.sexo==='misto'?'selected':''}>Misto</option>
          </select>
        </div>
        ${d.destino==='confinamento' ? `<p class="hint">Um lote de Confinamento marcado como Fêmeas passa a poder registrar partos (Novo parto), pro caso de vaca de cria alocada no Confinamento.</p>` : ''}
        <div class="field"><label>Dieta padrão (opcional)</label>
          <select id="f-dietalote">
            <option value="" ${!d.dietaId?'selected':''}>— Nenhuma (escolher na hora do lançamento) —</option>
            ${state.dietas.map(x=>`<option value="${x.id}" ${d.dietaId==x.id?'selected':''}>${esc(x.nome)} (${DIETA_TIPO_LABEL[x.tipo]||'Confinamento'})</option>`).join('')}
          </select>
        </div>
        <p class="hint">Ao lançar Saída de Ração pra esse lote, essa dieta já vem selecionada — ainda dá pra trocar na hora, se precisar.</p>
        <div class="field-row">
          <div class="field"><label>Nº de animais</label><input id="f-numanimais" type="number" step="1" value="${d.numeroAnimais}"/></div>
          <div class="field"><label>Data de início</label><input id="f-datainicio" type="date" value="${d.dataInicio}"/></div>
        </div>
        ${!d._editId ? `<div class="field"><label>Peso médio dos animais (opcional)</label><input id="f-pesoentrada" type="number" step="0.1" value="${d.pesoMedioEntrada||''}" placeholder="Ex: 220"/></div>
        <p class="hint">Se informado, já registra a primeira pesagem do lote com esse peso.</p>
        <div class="field"><label>Números dos animais (opcional)</label><textarea id="f-numerosanimais" rows="2" placeholder="Ex: 128, 129, 130">${esc(d.numerosAnimais||'')}</textarea></div>
        <p class="hint">Se já souber os números desses animais, liste aqui (separados por vírgula, espaço ou linha) — não precisa listar todos, só quem você for numerando agora (clique no lote depois pra ver e completar aos poucos).</p>
        ${camposAnimalNovoLote}` : ''}
        <div class="field"><label>Data de encerramento (opcional)</label><input id="f-datafim" type="date" value="${d.dataFim||''}"/></div>
        <p class="hint">Deixe a data de encerramento em branco enquanto o lote estiver ativo.</p>
        ` : `
        <div class="field"><label>Lote de destino</label>
          <select id="f-loteexistente">
            ${lotesExistentesPermitidos.map(l=>`<option value="${l.id}" ${d.loteExistenteId==l.id?'selected':''}>${esc(l.nome)} (${DESTINO_LOTE_LABEL[l.destino]||l.destino})</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label>Nº de animais chegando</label><input id="f-qtdentrada" type="number" step="1" value="${d.qtdEntrada}"/></div>
          <div class="field"><label>Peso médio dos animais chegando (kg)</label><input id="f-pesoentrada" type="number" step="0.1" value="${d.pesoMedioEntrada||''}" placeholder="Ex: 220"/></div>
        </div>
        <div class="field"><label>Data de entrada</label><input id="f-dataentrada" type="date" value="${d.dataEntrada}"/></div>
        <div class="field"><label>Números dos animais chegando (opcional)</label><textarea id="f-numerosanimais" rows="2" placeholder="Ex: 128, 129, 130">${esc(d.numerosAnimais||'')}</textarea></div>
        <p class="hint">O número de animais soma no lote escolhido, e o peso médio do lote é recalculado por média ponderada (peso e quantidade de quem já estava + de quem está chegando). Se já souber os números, liste aqui (separados por vírgula, espaço ou linha) — não precisa listar todos.</p>
        ${camposAnimalNovoLote}
        `}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="1">Cancelar</button>
        <button class="btn btn-primary" data-save="lote">${d._editId?'Salvar alterações':'Salvar'}</button>
      </div>
    </div>
  </div>`;
}

function ModalPesagem(){
  const d = editDraft;
  const lotesTipo = state.lotes.filter(l=>loteTipo(l)===d.tipo);
  const entradas = d.entradasPesagem||[];
  const mediaCalculada = entradas.length>0 ? entradas.reduce((a,e)=>a+Number(e.pesoKg),0)/entradas.length : null;
  const numeroAtual = (d.pesagemNumeroDraft||'').trim();
  const sexoLoteFixoPesagem = sexoFixoDoLote(d.loteId);
  const animalNovoPesagem = numeroAtual && !animalCadastrado(numeroAtual, sexoLoteFixoPesagem||undefined);
  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal" data-stop="1">
      <div class="modal-head"><h3>${d._editId?'Editar pesagem':'Nova pesagem'}</h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body">
        <div class="field"><label>Lote (${TIPO_PESAGEM_LABEL[d.tipo]})</label>
          <select id="f-lotepesagem">
            ${lotesTipo.map(l=>`<option value="${l.id}" ${d.loteId==l.id?'selected':''}>${esc(l.nome)}</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label>Data</label><input id="f-datapesagem" type="date" value="${d.data}"/></div>
          ${d._editId ? `<div class="field"><label>Peso médio por animal (kg)</label><input id="f-pesomedio" type="number" step="0.1" value="${d.pesoMedioKg}"/></div>` : ''}
        </div>
        ${!d._editId ? `
        <div class="field-row">
          <div class="field"><label>Número do animal (opcional)</label><input id="f-numeropesado" value="${esc(numeroAtual)}" placeholder="Ex: 128"/></div>
          <div class="field"><label>Peso (kg)</label><input id="f-pesopesado" type="number" step="0.1" placeholder="Ex: 320" value="${d.pesoPesadoDraft||''}"/></div>
        </div>
        ${animalNovoPesagem ? `
        <div class="field-row">
          ${!sexoLoteFixoPesagem ? `<div class="field"><label>Sexo (animal novo -- obrigatório)</label>
            <select id="f-sexopesado">
              <option value="" ${!d.sexoPesadoDraft?'selected':''}>— Selecione —</option>
              <option value="macho" ${d.sexoPesadoDraft==='macho'?'selected':''}>Macho</option>
              <option value="femea" ${d.sexoPesadoDraft==='femea'?'selected':''}>Fêmea</option>
            </select>
          </div>` : ''}
          <div class="field"><label>Raça (animal novo -- obrigatório)</label>
            <select id="f-racapesado">
              <option value="" ${!d.racaPesadoDraft?'selected':''}>— Selecione —</option>
              <option value="angus" ${d.racaPesadoDraft==='angus'?'selected':''}>Angus</option>
              <option value="nelore" ${d.racaPesadoDraft==='nelore'?'selected':''}>Nelore</option>
              <option value="outro" ${d.racaPesadoDraft==='outro'?'selected':''}>Outro</option>
            </select>
          </div>
        </div>
        <p class="hint" style="margin-top:-6px;">Animal ${esc(numeroAtual)} ainda não está cadastrado — precisa informar ${!sexoLoteFixoPesagem?'sexo e raça':'a raça'} pra numerar ele.</p>
        ` : ''}
        <button type="button" class="btn btn-ghost btn-sm" data-add-pesagem-animal="1">+ Adicionar e ir pro próximo</button>
        ${entradas.length>0 ? `
        <table style="margin-top:12px;">
          <thead><tr><th>Número</th><th>Peso</th><th></th></tr></thead>
          <tbody>
            ${entradas.map((en,idx)=>`
              <tr>
                <td class="mono">${en.numero ? esc(en.numero) : '<span class="hint">— sem número —</span>'}${en.raca?` <span class="hint">(novo · ${RACA_TOURO_LABEL[en.raca]})</span>`:''}</td>
                <td class="mono">${fmt(Number(en.pesoKg),1)} kg</td>
                <td><button type="button" class="btn-ghost btn-sm" data-del-pesagem-animal="${idx}">Remover</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <p class="hint" style="margin-top:8px;"><strong>${entradas.length} animal(is) pesado(s) — média: ${fmt(mediaCalculada,1)} kg</strong> (essa é a média que vira o peso do lote).</p>
        ` : `<p class="hint">Lance o peso de cada animal (o número é opcional — sem número, o peso ainda entra na média, só não numera o animal). Não precisa pesar todo o lote.</p>`}
        ` : ''}
        <div class="field"><label>Observação (opcional)</label><textarea id="f-obspesagem" rows="2" placeholder="Ex: lote pronto pra abate">${esc(d.observacao)}</textarea></div>
        <p class="hint">O ganho desde a última pesagem (GMD) e a arroba produzida são calculados automaticamente a partir da média do lote.</p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="1">Cancelar</button>
        <button class="btn btn-primary" data-save="pesagem" ${!d._editId && entradas.length===0 ? 'disabled' : ''}>${d._editId?'Salvar alterações':'Salvar pesagem'}</button>
      </div>
    </div>
  </div>`;
}

function ModalVenda(){
  const d = editDraft;
  // Mostra lote de qualquer atividade (Confinamento/Pasto/Cria) — inclui o
  // lote já selecionado mesmo se ele não estiver mais ativo/com animais
  // (caso de editar uma venda cujo lote já fechou por causa dela mesma).
  const lotesDisponiveis = state.lotes.filter(l=>(!l.dataFim && Number(l.numeroAnimais||0)>0) || l.id==d.loteId);
  const lote = lotesDisponiveis.find(l=>l.id==d.loteId);
  const tipoVenda = d.tipoVenda || 'arroba';
  const arrobas = arrobasVenda(d);
  const valorTotal = valorVenda(d);
  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal" data-stop="1">
      <div class="modal-head"><h3>${d._editId?'Editar venda':'Nova venda'}</h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body">
        <div class="field"><label>Lote</label>
          <select id="f-lotevenda">
            ${lotesDisponiveis.map(l=>`<option value="${l.id}" ${d.loteId==l.id?'selected':''}>${esc(l.nome)} (${TIPO_PESAGEM_LABEL[loteTipo(l)]} · ${fmtInt(l.numeroAnimais)} animais)</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label>Data</label><input id="f-datavenda" type="date" value="${d.data}"/></div>
          <div class="field"><label>Quantidade de animais</label><input id="f-qtdvenda" type="number" step="1" value="${d.quantidade}"/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Categoria da venda</label>
            <select id="f-categoriavenda">
              <option value="bezerro" ${d.categoria==='bezerro'?'selected':''}>Venda de bezerro</option>
              <option value="abate" ${!d.categoria||d.categoria==='abate'?'selected':''}>Abate</option>
              <option value="venda_viva" ${d.categoria==='venda_viva'?'selected':''}>Venda viva (não abate)</option>
            </select>
          </div>
          <div class="field"><label>Sexo</label>
            <select id="f-sexovenda">
              <option value="" ${!d.sexo?'selected':''}>— Selecione —</option>
              <option value="macho" ${d.sexo==='macho'?'selected':''}>Macho</option>
              <option value="femea" ${d.sexo==='femea'?'selected':''}>Fêmea</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Tipo de venda</label>
          <select id="f-tipovenda">
            <option value="arroba" ${tipoVenda==='arroba'?'selected':''}>Abate — valor da arroba (peso de carcaça)</option>
            <option value="cabeca" ${tipoVenda==='cabeca'?'selected':''}>Venda por animal (valor fechado por cabeça)</option>
            <option value="kg" ${tipoVenda==='kg'?'selected':''}>Venda por kg (peso vivo)</option>
          </select>
        </div>
        ${tipoVenda==='arroba' ? `
        <div class="field-row">
          <div class="field"><label>Arrobas totais (@, do relatório do frigorífico)</label><input id="f-arrobasvenda" type="text" inputmode="decimal" value="${d.arrobasTotais}"/></div>
          <div class="field"><label>Valor da arroba paga (R$/@)</label><input id="f-valorarrobavenda" type="text" inputmode="decimal" value="${d.valorArroba}"/></div>
        </div>
        ` : ''}
        ${tipoVenda==='cabeca' ? `
        <div class="field"><label>Valor por animal (R$)</label><input id="f-valorporanimalvenda" type="text" inputmode="decimal" value="${d.valorPorAnimal}"/></div>
        ` : ''}
        ${tipoVenda==='kg' ? `
        <div class="field-row">
          <div class="field"><label>Peso por animal (kg, peso vivo)</label><input id="f-pesovenda" type="text" inputmode="decimal" value="${d.pesoMedioKg}"/></div>
          <div class="field"><label>Valor do kg (R$/kg)</label><input id="f-valorkgvenda" type="text" inputmode="decimal" value="${d.valorKg}"/></div>
        </div>
        ` : ''}
        <div class="total-bar ok">
          <span>${tipoVenda==='arroba' ? `${fmt(arrobas,2)} @ produzidas` : `${fmtInt(Number(d.quantidade)||0)} animais`}</span><span>R$ ${fmt(valorTotal)}</span>
        </div>
        <p class="hint">${tipoVenda==='arroba' ? 'Total de @ já calculado pelo frigorífico (rendimento de carcaça) — lance o valor do relatório, não o peso. Valor da arroba é o preço realmente pago nessa venda, não a estimativa diária mostrada em Financeiro.' : tipoVenda==='cabeca' ? 'Valor fechado por animal, sem depender de peso.' : 'Valor por kg de peso vivo — comum em venda de bezerros/animais magros.'} Ao salvar, desconta ${fmtInt(Number(d.quantidade)||0)} animais do número de animais do lote${lote && Number(d.quantidade||0)>=Number(lote.numeroAnimais||0) && Number(d.quantidade||0)>0 ? ' (encerra o lote automaticamente, já que zera os animais)' : ''} e lança o valor total como receita em Resultados.</p>
        <div class="field"><label>Observação (opcional)</label><textarea id="f-obsvenda" rows="2">${esc(d.observacao||'')}</textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="1">Cancelar</button>
        <button class="btn btn-primary" data-save="venda">${d._editId?'Salvar alterações':'Registrar venda'}</button>
      </div>
    </div>
  </div>`;
}

// Detalhe de uma fatia dos gráficos de Resultados: lista despesa por
// despesa o que compõe aquele valor, com botão de editar cada uma (reabre
// o cadastro de Despesas — dá pra trocar o centro de custo ou a área dali
// mesmo, sem precisar ir em Financeiro procurar o lançamento).
function ModalDetalheGrafico(){
  const {panelId, idx} = state.modal;
  const entry = (state.paineisResultadosDados[panelId]||[])[idx];
  if(!entry){
    return `<div class="overlay" data-close-overlay="1"><div class="modal" data-stop="1">
      <div class="modal-head"><h3>Detalhe</h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body"><p class="hint">Esse gráfico foi atualizado — feche e clique na fatia de novo.</p></div>
      <div class="modal-foot"><button class="btn btn-ghost" data-close="1">Fechar</button></div>
    </div></div>`;
  }
  const ehPorArea = panelId==='area' || panelId==='area-ano';
  const itens = [...(entry.itens||[])].sort((a,b)=>b.valor-a.valor);
  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal" data-stop="1">
      <div class="modal-head"><h3>${esc(entry.nome)}</h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body">
        <p class="hint" style="margin-bottom:14px;">R$ ${fmt(entry.valor)} (${fmt(entry.pct,1)}% do total)${ehPorArea ? ' — valor já rateado pra essa área; uma despesa "Geral" aparece aqui só com a fatia que cabe a essa área, não o valor cheio.' : ''}</p>
        ${itens.length===0 ? `<p class="hint">Sem despesas cadastradas detalhadas pra essa fatia.</p>` : `
        <table>
          <thead><tr><th>Despesa</th><th>Mês</th><th>Valor${ehPorArea ? ' (nessa área)' : ''}</th><th></th></tr></thead>
          <tbody>
            ${itens.map(it=>`
              <tr>
                <td><strong>${esc(it.nome)}</strong></td>
                <td>${it.mes ? `<span class="pill pill-cat">${mesLabel(it.mes)}</span>` : `<span class="pill pill-ok">Recorrente</span>`}</td>
                <td class="mono">R$ ${fmt(it.valor)}</td>
                <td></td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="1">Fechar</button>
      </div>
    </div>
  </div>`;
}

/* ===================== EVENTOS ===================== */
function attachEvents(){
  const loginForm = document.querySelector('[data-login-form]');
  if(loginForm){
    loginForm.onsubmit = (e)=>{ e.preventDefault(); fazerLogin(); };
    const uEl = document.querySelector('[data-login-usuario]');
    const sEl = document.querySelector('[data-login-senha]');
    if(uEl) uEl.oninput = (e)=>{ state.loginDraft.usuario = e.target.value; };
    if(sEl) sEl.oninput = (e)=>{ state.loginDraft.senha = e.target.value; };
  }
  document.querySelectorAll('[data-logout]').forEach(el=>{
    el.onclick = ()=> fazerLogout();
  });
  document.querySelectorAll('[data-retry-perfil]').forEach(el=>{
    el.onclick = async ()=>{
      await loadPerfil();
      render();
      if(state.perfil?.ativo) loadAll();
    };
  });
  if(state.modal?.type==='movimento'){
    const tipoMovEl = document.getElementById('f-tipo');
    if(tipoMovEl) tipoMovEl.onchange = (e)=>{
      // Trocar Entrada/Saída re-renderiza (mostra/esconde o campo de preço
      // pago) -- sem sincronizar antes, ingrediente/data/quantidade/preço
      // já preenchidos eram perdidos.
      const ingEl = document.getElementById('f-ing');
      const dataEl = document.getElementById('f-data');
      const qtdEl = document.getElementById('f-qtd');
      const precoEl = document.getElementById('f-precoentrada');
      if(ingEl) editDraft.ingredienteId = Number(ingEl.value);
      if(dataEl) editDraft.data = dataEl.value;
      if(qtdEl) editDraft.quantidade = qtdEl.value;
      if(precoEl) editDraft.precoKg = precoEl.value;
      editDraft.tipo = e.target.value;
      render();
    };
  }
  document.querySelectorAll('[data-trocar-senha-abrir]').forEach(el=>{
    el.onclick = ()=>{
      editDraft = {senhaAtual:'', novaSenha:'', confirmarSenha:''};
      state.modal = {type:'trocarSenha'};
      render();
    };
  });
  document.querySelectorAll('[data-ver-pendencias]').forEach(el=>{
    el.onclick = ()=>{ state.modal = {type:'pendencias'}; render(); };
  });
  document.querySelectorAll('[data-tentar-sincronizar]').forEach(el=>{
    el.onclick = async ()=>{
      state.modal = null;
      render();
      await tentarSincronizarFila();
    };
  });
  document.querySelectorAll('[data-descartar-pendencia]').forEach(el=>{
    el.onclick = ()=>{
      const fila = lerFilaOffline().filter(item=>item.queueId!==el.dataset.descartarPendencia);
      salvarFilaOffline(fila);
      render();
    };
  });
  document.querySelectorAll('[data-novo-usuario]').forEach(el=>{
    el.onclick = ()=>{
      editDraft = {nome:'', usuario:'', senha:''};
      state.usuarioError = '';
      state.modal = {type:'usuario'};
      render();
    };
  });
  document.querySelectorAll('[data-editar-usuario]').forEach(el=>{
    el.onclick = ()=>{
      const perfil = state.perfis.find(p=>p.id===el.dataset.editarUsuario);
      editDraft = {_perfilId: perfil.id, nome: perfil.nome, usuario: perfil.usuario, papel: perfil.papel, ativo: perfil.ativo, permissoes: {...perfil.permissoes}};
      state.modal = {type:'permissoes'};
      render();
    };
  });
  const criarUsuarioBtn = document.querySelector('[data-criar-usuario]');
  if(criarUsuarioBtn){
    criarUsuarioBtn.onclick = async ()=>{
      const nome = document.getElementById('f-nomeusuario').value.trim();
      const usuario = document.getElementById('f-usuario').value.trim();
      const senha = document.getElementById('f-senhausuario').value;
      if(!nome || !usuario || !senha){ state.usuarioError = 'Preencha nome, usuário e senha.'; render(); return; }
      state.usuarioLoading = true; state.usuarioError = ''; render();
      // Edge Function do projeto único. A antiga 'criar-usuario' vivia no
      // projeto separado da Pecuária, que saiu de cena na unificação — quem
      // cria conta agora é a mesma função que o Lavoura e a Matriz usam.
      const { data, error } = await db.functions.invoke('criar-usuario-cana', { body: { nome, usuario, senha } });
      state.usuarioLoading = false;
      if(error || data?.error){
        let msg = data?.error || error?.message || 'Falha ao criar usuário.';
        if(error?.context && typeof error.context.json === 'function'){
          try { const corpo = await error.context.json(); if(corpo?.error) msg = corpo.error; } catch(e){}
        }
        state.usuarioError = msg;
        render();
        return;
      }
      state.modal = null; editDraft = null;
      await loadAll();
    };
  }
  const searchEl = document.querySelector('[data-search]');
  if(searchEl){
    searchEl.oninput = (e)=>{ state.search = e.target.value; render();
      // refocus + cursor at end after re-render
      const s = document.querySelector('[data-search]');
      s.focus(); s.setSelectionRange(s.value.length, s.value.length);
    };
  }
  const searchDespesasEl = document.querySelector('[data-search-despesas]');
  if(searchDespesasEl){
    searchDespesasEl.oninput = (e)=>{ state.searchDespesas = e.target.value; render();
      const s = document.querySelector('[data-search-despesas]');
      s.focus(); s.setSelectionRange(s.value.length, s.value.length);
    };
  }

      const v = state.vendas.find(x=>x.id===Number(el.dataset.editVenda));
      const lote = state.lotes.find(l=>l.id===v.loteId);
      // guarda a quantidade/lote originais à parte: o preview ao vivo do
      // formulário sobrescreve editDraft.quantidade/loteId a cada tecla, e a
      // reversão no lote antigo precisa do valor de antes da edição, não do
      // que está sendo digitado agora.
      editDraft = {...v, tipo: lote?loteTipo(lote):'confinamento', _editId: v.id, _quantidadeOriginal: v.quantidade, _loteIdOriginal: v.loteId,
        arrobasTotais: v.tipoVenda==='arroba' ? arrobasVenda(v) : ''};

  document.querySelectorAll('[data-del-venda]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('Excluir esta venda? Essa ação não pode ser desfeita -- o número de animais volta a somar no lote de origem.')) return;
      const id = Number(el.dataset.delVenda);
      const venda = state.vendas.find(x=>x.id===id);
      // Apaga o abate (o registro que define a venda) PRIMEIRO -- se isso
      // falhar (RLS, rede), nada mais é tocado, então não sobra nenhum
      // estado pela metade. Só depois de confirmar que a venda sumiu de
      // verdade é que mexe na receita vinculada e no total de animais do
      // lote -- e se algum desses dois passos falhar, avisa exatamente o
      // que precisa conferir manualmente, em vez de recarregar em silêncio.
      const {error: erroAbate} = await db.from('abates').delete().eq('id', id);
      if(erroAbate){ alert('Não foi possível excluir a venda: ' + erroAbate.message); return; }
      const {error: erroReceita} = await db.from('lancamentos_financeiros').delete().eq('abate_id', id);
      if(erroReceita) alert('A venda foi excluída, mas não deu pra remover a receita vinculada: ' + erroReceita.message + ' -- confira em Financeiro > Receitas.');
      if(venda && venda.loteId){
        const lote = state.lotes.find(l=>l.id===venda.loteId);
        if(lote){
          const novoNumero = Number(lote.numeroAnimais||0)+Number(venda.quantidade||0);
          const updLote = {numero_animais: novoNumero};
          // O lote pode ter sido marcado como encerrado (data_fim) por essa
          // venda ter zerado os animais -- voltando a ter animais, reabre.
          if(novoNumero>0 && lote.dataFim) updLote.data_fim = null;
          const {error: erroLote} = await db.from('lotes').update(updLote).eq('id', lote.id);
          if(erroLote) alert('A venda foi excluída, mas não deu pra atualizar o total de animais do lote: ' + erroLote.message + ' -- confira em Lotes.');
        }
      }
      await loadAll();
    };
  });
  document.querySelectorAll('[data-toggle-diet]').forEach(el=>{
    el.onclick = ()=>{
      const id = Number(el.dataset.toggleDiet);
      state.openDietId = state.openDietId===id ? null : id;
      render();
    };
  });

  // modal generic close
  document.querySelectorAll('[data-close], [data-close-overlay]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.dataset.stop) return;
      state.modal = null; editDraft=null; render();
    };
  });
  const stopEl = document.querySelector('[data-stop]');
  if(stopEl) stopEl.onclick = (e)=> e.stopPropagation();

  // dieta item add/remove/change — Nome/Categoria/Kg só são lidos do DOM no
  // salvar, então antes de re-renderizar (o que redesenha o formulário a
  // partir do editDraft) é preciso salvar o que já foi digitado nesses
  // campos, senão o re-render (pra mostrar a nova linha de ingrediente) apaga
  // o que a pessoa já tinha escrito.
  function sincronizarCamposDieta(){
    const nomeEl = document.getElementById('f-nome');
    const categoriaEl = document.getElementById('f-categoria');
    const kgEl = document.getElementById('f-kganimal');
    const tipoEl = document.getElementById('f-tipodieta');
    const estoqueMinEl = document.getElementById('f-estoqueminpronta');
    const consumoEl = document.getElementById('f-consumodieta');
    if(nomeEl) editDraft.nome = nomeEl.value;
    if(categoriaEl) editDraft.categoriaAnimal = categoriaEl.value;
    if(kgEl) editDraft.kgAnimalDia = kgEl.value;
    if(tipoEl) editDraft.tipo = tipoEl.value;
    if(estoqueMinEl) editDraft.estoqueMinPronta = estoqueMinEl.value;
    if(consumoEl) editDraft.consumoDireto = consumoEl.value==='direto';
  }
  document.querySelectorAll('[data-item-add]').forEach(el=>{
    el.onclick = ()=>{ sincronizarCamposDieta(); editDraft.itens.push({ingredienteId:state.ingredientes[0]?.id||'', pct:''}); render(); };
  });
  document.querySelectorAll('[data-item-del]').forEach(el=>{
    el.onclick = ()=>{ sincronizarCamposDieta(); editDraft.itens.splice(Number(el.dataset.itemDel),1); render(); };
  });
  document.querySelectorAll('[data-item-ing]').forEach(el=>{
    el.onchange = (e)=>{ editDraft.itens[Number(el.dataset.itemIng)].ingredienteId = Number(e.target.value); };
  });
  document.querySelectorAll('[data-item-pct]').forEach(el=>{
    el.oninput = (e)=>{ editDraft.itens[Number(el.dataset.itemPct)].pct = e.target.value; };
  });

  // venda: recalcula @/valor total ao vivo conforme digita (refoca depois
  // do re-render, senão perde o foco a cada tecla — mesmo truque já usado na
  // busca de Ingredientes/Despesas). Campos de peso/valor são type="text"
  // (aceitam vírgula decimal), então usam setSelectionRange igual à busca;
  // quantidade continua type="number" (inteiro, sem vírgula), sem isso.
  function refazVendaInput(id, campo, decimal){
    const el = document.getElementById(id);
    if(!el) return;
    el.oninput = (e)=>{
      sincronizarDataObsVenda();
      editDraft[campo] = e.target.value;
      render();
      const s = document.getElementById(id);
      s.focus();
      if(decimal) s.setSelectionRange(s.value.length, s.value.length);
    };
  }
  // Data e observação não têm sincronização própria (só são lidas do DOM
  // no salvar) -- precisam ser copiadas pro editDraft antes de qualquer
  // onchange que re-renderiza o modal, senão o que já foi digitado ali some.
  function sincronizarDataObsVenda(){
    const dataEl = document.getElementById('f-datavenda');
    const obsEl = document.getElementById('f-obsvenda');
    const categoriaEl = document.getElementById('f-categoriavenda');
    const sexoEl = document.getElementById('f-sexovenda');
    if(dataEl) editDraft.data = dataEl.value;
    if(obsEl) editDraft.observacao = obsEl.value;
    if(categoriaEl) editDraft.categoria = categoriaEl.value;
    if(sexoEl) editDraft.sexo = sexoEl.value;
  }
  const loteVendaEl = document.getElementById('f-lotevenda');
  if(loteVendaEl) loteVendaEl.onchange = (e)=>{
    sincronizarDataObsVenda();
    editDraft.loteId = Number(e.target.value);
    // Sexo acompanha o lote quando ele é fixo (Confinamento/Pasto com sexo
    // definido) -- troca de lote muda o que está sendo vendido de verdade.
    // Lote misto (sem sexo fixo) não mexe no que já estava selecionado.
    const sexoFixoNovoLote = sexoFixoDoLote(editDraft.loteId);
    if(sexoFixoNovoLote) editDraft.sexo = sexoFixoNovoLote;
    render();
  };
  const categoriaVendaEl = document.getElementById('f-categoriavenda');
  if(categoriaVendaEl) categoriaVendaEl.onchange = (e)=>{ sincronizarDataObsVenda(); editDraft.categoria = e.target.value; render(); };
  const sexoVendaEl = document.getElementById('f-sexovenda');
  if(sexoVendaEl) sexoVendaEl.onchange = (e)=>{ sincronizarDataObsVenda(); editDraft.sexo = e.target.value; render(); };
  const tipoVendaEl = document.getElementById('f-tipovenda');
  if(tipoVendaEl) tipoVendaEl.onchange = (e)=>{ sincronizarDataObsVenda(); editDraft.tipoVenda = e.target.value; render(); };
  refazVendaInput('f-qtdvenda', 'quantidade');
  refazVendaInput('f-pesovenda', 'pesoMedioKg', true);
  refazVendaInput('f-arrobasvenda', 'arrobasTotais', true);
  refazVendaInput('f-valorarrobavenda', 'valorArroba', true);
  refazVendaInput('f-valorporanimalvenda', 'valorPorAnimal', true);
  refazVendaInput('f-valorkgvenda', 'valorKg', true);

  // Lote define uma dieta padrão (aba Lotes) -- trocar o lote na Saída de
  // Ração já pré-seleciona a dieta certa, um campo a menos pra errar no
  // campo. Continua editável (dá pra trocar na hora), só não salva em
  // branco (checado no data-save). Preserva o que já foi digitado nos
  // outros campos antes de re-renderizar (esse modal não tinha nenhum
  // oninput vivo até aqui, ao contrário do modal de Venda acima).
  if(state.modal && (state.modal.type==='saidaRacao' || state.modal.type==='saidaRacaoCria')){
    const loteRacaoEl = document.getElementById('f-lote');
    if(loteRacaoEl) loteRacaoEl.onchange = (e)=>{
      const novoLoteId = Number(e.target.value);
      const lote = state.lotes.find(l=>l.id===novoLoteId);
      const qtdEl = document.getElementById('f-qtdracao');
      const dataEl = document.getElementById('f-data');
      if(qtdEl) editDraft.quantidadeKg = qtdEl.value;
      if(dataEl && !dataEl.disabled) editDraft.data = dataEl.value;
      editDraft.loteId = novoLoteId;
      editDraft.dietaId = lote?.dietaId || '';
      render();
    };
  }
  if(state.modal && state.modal.type==='pasto'){
    const lotePastoEl = document.getElementById('f-lote');
    if(lotePastoEl) lotePastoEl.onchange = (e)=>{
      const novoLoteId = Number(e.target.value);
      const lote = state.lotes.find(l=>l.id===novoLoteId);
      const qtdEl = document.getElementById('f-qtdpasto');
      const dataEl = document.getElementById('f-data');
      if(qtdEl) editDraft.quantidade = qtdEl.value;
      if(dataEl) editDraft.data = dataEl.value;
      editDraft.loteId = novoLoteId;
      editDraft.dietaId = lote?.dietaId || '';
      render();
    };
  }
  if(state.modal && state.modal.type==='lote'){
    // Único ponto de sincronização pra todos os onchange desse modal que
    // re-renderizam (destino/sexo/lote existente/números/modo de entrada) --
    // cada um listava manualmente os campos-irmão pra copiar antes do
    // render(), e era fácil esquecer um (ex: números dos animais nunca
    // entrava na lista do "Destino", ou sexo/raça dos animais novos nunca
    // entravam em nenhuma). Lê tudo que existe no DOM agora, então cobre
    // qualquer campo, inclusive os que só aparecem condicionalmente.
    function sincronizarCamposLote(){
      const ids = {
        nome:'nome', numanimais:'numeroAnimais', datainicio:'dataInicio', datafim:'dataFim',
        sexolote:'sexo', dietalote:'dietaId', pesoentrada:'pesoMedioEntrada', numerosanimais:'numerosAnimais',
        sexoanimaisnovos:'sexoAnimaisNovos', racaanimaisnovos:'racaAnimaisNovos',
        loteexistente:'loteExistenteId', qtdentrada:'qtdEntrada', dataentrada:'dataEntrada',
      };
      for(const [elId, campo] of Object.entries(ids)){
        const el = document.getElementById('f-'+elId);
        if(el) editDraft[campo] = el.value;
      }
    }
    const destinoLoteEl = document.getElementById('f-destino');
    if(destinoLoteEl) destinoLoteEl.onchange = (e)=>{
      sincronizarCamposLote();
      editDraft.destino = e.target.value;
      // a dieta padrão é filtrada por tipo (confinamento/pasto/cria) -- ao
      // trocar o destino, a lista de opções muda, então zera a seleção em
      // vez de manter um id que pode nem aparecer mais nas opções.
      editDraft.dietaId = '';
      render();
    };
    const sexoLoteEl = document.getElementById('f-sexolote');
    if(sexoLoteEl) sexoLoteEl.onchange = (e)=>{
      sincronizarCamposLote();
      editDraft.sexo = e.target.value;
      render();
    };
    const loteExistenteEl = document.getElementById('f-loteexistente');
    if(loteExistenteEl) loteExistenteEl.onchange = (e)=>{
      sincronizarCamposLote();
      editDraft.loteExistenteId = e.target.value;
      render();
    };
    const numerosAnimaisEl = document.getElementById('f-numerosanimais');
    if(numerosAnimaisEl) numerosAnimaisEl.onchange = (e)=>{
      sincronizarCamposLote();
      editDraft.numerosAnimais = e.target.value;
      render();
    };
    document.querySelectorAll('#f-sexoanimaisnovos, #f-racaanimaisnovos').forEach(el=>{
      el.onchange = (e)=>{
        sincronizarCamposLote();
        editDraft[el.id==='f-sexoanimaisnovos'?'sexoAnimaisNovos':'racaAnimaisNovos'] = e.target.value;
        render();
      };
    });
    // "Novo lote" x "Lote já existente" -- só existe na criação (não no
    // editar), pra decidir se essa entrada de animais vira um lote novo ou
    // soma na quantidade (com peso recalculado por média ponderada) de um
    // lote que já existe.
    const modoEntradaEl = document.getElementById('f-modoentrada');
    if(modoEntradaEl) modoEntradaEl.onchange = (e)=>{
      sincronizarCamposLote();
      editDraft.modoEntrada = e.target.value;
      render();
    };
  }
  if(state.modal && state.modal.type==='diagnosticoGestacional'){
    const resultadoDgEl = document.getElementById('f-resultadodg');
    if(resultadoDgEl) resultadoDgEl.onchange = (e)=>{
      editDraft.loteId = document.getElementById('f-lote').value;
      editDraft.numeroVaca = document.getElementById('f-numvaca').value;
      editDraft.data = document.getElementById('f-data').value;
      editDraft.racaVaca = document.getElementById('f-racavaca')?.value;
      const previsaoEl = document.getElementById('f-previsaoparto');
      if(previsaoEl) editDraft.previsaoParto = previsaoEl.value;
      editDraft.resultado = e.target.value;
      render();
    };
    // Trocar o número da vaca atualiza a raça pro que já se conhece dela
    // (ou limpa, se for um número novo) -- evita ficar com a raça da vaca
    // anterior grudada no campo.
    const numVacaDgEl = document.getElementById('f-numvaca');
    if(numVacaDgEl) numVacaDgEl.onchange = (e)=>{
      editDraft.loteId = document.getElementById('f-lote').value;
      editDraft.numeroVaca = e.target.value;
      editDraft.data = document.getElementById('f-data').value;
      const previsaoEl = document.getElementById('f-previsaoparto');
      if(previsaoEl) editDraft.previsaoParto = previsaoEl.value;
      editDraft.resultado = document.getElementById('f-resultadodg').value;
      editDraft.racaVaca = racaConhecida(e.target.value, 'femea');
      render();
    };
  }
  if(state.modal && state.modal.type==='reproducaoCusto'){
    // Mesma lógica do Diagnóstico -- trocar o número da vaca atualiza a
    // raça pra que já se conhece dela (ou limpa, se for um número novo).
    const numVacaInsemEl = document.getElementById('f-numvaca');
    if(numVacaInsemEl) numVacaInsemEl.onchange = (e)=>{
      editDraft.loteId = document.getElementById('f-lote').value;
      editDraft.numeroVaca = e.target.value;
      editDraft.data = document.getElementById('f-data').value;
      editDraft.racaTouro = document.getElementById('f-racatouro').value;
      editDraft.qualInseminacao = document.getElementById('f-qualinsem').value;
      editDraft.custo = document.getElementById('f-custoreproducao').value;
      editDraft.racaVaca = racaConhecida(e.target.value, 'femea');
      render();
    };
  }
  if(state.modal && state.modal.type==='parto'){
    // Mesma lógica -- trocar o número da mãe atualiza a raça conhecida dela.
    // IMPORTANTE: captura o lote selecionado ANTES de re-renderizar, senão
    // o <select> do lote (que usa editDraft.loteId pra marcar "selected")
    // volta pro valor antigo assim que a pessoa digita/sai do campo do
    // número da mãe, mesmo já tendo trocado o lote na tela -- e o parto
    // acaba sendo salvo no lote errado.
    const numMaeEl = document.getElementById('f-numeromae');
    if(numMaeEl) numMaeEl.onchange = (e)=>{
      editDraft.loteId = document.getElementById('f-lote').value;
      editDraft.numeroMae = e.target.value;
      editDraft.data = document.getElementById('f-data').value;
      editDraft.sexoBezerro = document.getElementById('f-sexobezerro').value;
      editDraft.racaBezerro = document.getElementById('f-racabezerro').value;
      editDraft.racaMae = racaConhecida(e.target.value, 'femea');
      render();
    };
  }
  // Lote/parto só existem no formulário na criação (não na edição, onde
  // ficam desabilitados) -- trocar o lote refaz a lista de partos ainda
  // sem desmama daquele lote.
  if(state.modal && state.modal.type==='desmama' && !editDraft._editId){
    const loteDesmamaEl = document.getElementById('f-lote');
    if(loteDesmamaEl) loteDesmamaEl.onchange = (e)=>{
      editDraft.data = document.getElementById('f-data').value;
      editDraft.pesoKg = document.getElementById('f-pesodesmama').value;
      editDraft.loteId = Number(e.target.value);
      const partosDoLote = partosSemDesmama(editDraft.loteId, null);
      editDraft.partoId = partosDoLote[0]?.id || '';
      // Trocou de lote -> é outro bezerro. A raça vem pré-preenchida com a
      // que foi lançada no parto (se tiver); a pessoa ainda pode trocar.
      editDraft.raca = partosDoLote[0]?.racaBezerro || '';
      render();
    };
    const partoDesmamaEl = document.getElementById('f-parto');
    if(partoDesmamaEl) partoDesmamaEl.onchange = (e)=>{
      editDraft.data = document.getElementById('f-data').value;
      editDraft.pesoKg = document.getElementById('f-pesodesmama').value;
      editDraft.partoId = Number(e.target.value)||'';
      const partoEscolhido = state.partos.find(p=>p.id===editDraft.partoId);
      editDraft.raca = partoEscolhido?.racaBezerro || '';
      render();
    };
  }
  if(state.modal && state.modal.type==='pesagem' && !editDraft._editId){
    const numPesadoEl = document.getElementById('f-numeropesado');
    if(numPesadoEl) numPesadoEl.onchange = (e)=>{
      // Mesmo cuidado do parto/inseminação/diagnóstico -- captura o lote (e
      // data/observação) ANTES de re-renderizar, senão o <select> do lote
      // volta pro valor antigo assim que a pessoa digita o número do animal
      // e sai do campo, mesmo já tendo trocado o lote na tela -- e os
      // animais pesados entram no lote errado.
      editDraft.loteId = Number(document.getElementById('f-lotepesagem').value);
      editDraft.data = document.getElementById('f-datapesagem').value;
      const obsEl0 = document.getElementById('f-obspesagem');
      if(obsEl0) editDraft.observacao = obsEl0.value;
      sincronizarDraftPesagemAnimal();
      editDraft.pesagemNumeroDraft = e.target.value;
      render();
      const numEl2 = document.getElementById('f-numeropesado');
      if(numEl2) numEl2.focus();
    };
    // Peso/sexo/raça do animal sendo pesado agora também não tinham
    // value= nenhum -- qualquer re-render (corrigir o número, remover uma
    // linha da tabela de já pesados) apagava o que já tinha sido digitado
    // pro animal atual.
    function sincronizarDraftPesagemAnimal(){
      const pesoEl = document.getElementById('f-pesopesado');
      const sexoEl = document.getElementById('f-sexopesado');
      const racaEl = document.getElementById('f-racapesado');
      if(pesoEl) editDraft.pesoPesadoDraft = pesoEl.value;
      if(sexoEl) editDraft.sexoPesadoDraft = sexoEl.value;
      if(racaEl) editDraft.racaPesadoDraft = racaEl.value;
    }
    const addPesagemAnimalBtn = document.querySelector('[data-add-pesagem-animal]');
    if(addPesagemAnimalBtn) addPesagemAnimalBtn.onclick = ()=>{
      const numEl = document.getElementById('f-numeropesado');
      const pesoEl = document.getElementById('f-pesopesado');
      const numero = (numEl.value||'').trim();
      const peso = pesoEl.value;
      if(!peso || Number(peso)<=0){ alert('Informe um peso maior que zero.'); return; }
      const loteIdAtual = Number(document.getElementById('f-lotepesagem').value);
      const sexoFixo = sexoFixoDoLote(loteIdAtual);
      let sexoNovo = '', racaNovo = '';
      if(numero && !animalCadastrado(numero, sexoFixo||undefined)){
        const sexoEl = document.getElementById('f-sexopesado');
        sexoNovo = sexoFixo || (sexoEl ? sexoEl.value : '');
        racaNovo = document.getElementById('f-racapesado')?.value || '';
        const erroAnimalPesagem = validarAnimalNovo(numero, sexoNovo, racaNovo);
        if(erroAnimalPesagem){ alert(erroAnimalPesagem); return; }
      }
      editDraft.loteId = loteIdAtual;
      editDraft.data = document.getElementById('f-datapesagem').value;
      editDraft.observacao = document.getElementById('f-obspesagem').value;
      editDraft.entradasPesagem = [...(editDraft.entradasPesagem||[]), {numero, pesoKg: Number(peso), sexo:sexoNovo||undefined, raca:racaNovo||undefined}];
      editDraft.pesagemNumeroDraft = '';
      editDraft.pesoPesadoDraft = '';
      editDraft.sexoPesadoDraft = '';
      editDraft.racaPesadoDraft = '';
      render();
      const numEl2 = document.getElementById('f-numeropesado');
      if(numEl2) numEl2.focus();
    };
    document.querySelectorAll('[data-del-pesagem-animal]').forEach(el=>{
      el.onclick = ()=>{
        const idx = Number(el.dataset.delPesagemAnimal);
        editDraft.loteId = Number(document.getElementById('f-lotepesagem').value);
        editDraft.data = document.getElementById('f-datapesagem').value;
        editDraft.observacao = document.getElementById('f-obspesagem').value;
        sincronizarDraftPesagemAnimal();
        editDraft.entradasPesagem = (editDraft.entradasPesagem||[]).filter((_,i)=>i!==idx);
        render();
      };
    });
  }

  // ---- Manejo (sequência guiada por lote) ----
  if(state.page==='manejoInicio' && !state.manejoAtivo && !state.manejoDetalheId && editDraft && editDraft._manejoSetup){
    function capturarSetupManejo(){
      editDraft.loteId = Number(document.getElementById('f-lotemanejo').value);
      editDraft.data = document.getElementById('f-datamanejo').value;
      const mudaLoteEl0 = document.getElementById('f-mudalotemanejo');
      if(mudaLoteEl0) editDraft.mudaLote = mudaLoteEl0.value==='sim';
      const destEl = document.getElementById('f-lotedestinomanejo');
      if(destEl) editDraft.loteDestinoId = Number(destEl.value);
      editDraft.vacinacao = document.getElementById('f-vacinacaomanejo').checked;
      editDraft.vermifugacao = document.getElementById('f-vermifugacaomanejo').checked;
    }
    const loteManejoEl = document.getElementById('f-lotemanejo');
    if(loteManejoEl) loteManejoEl.onchange = ()=>{
      capturarSetupManejo();
      // Muda o lote -- a lista de ações disponíveis pode mudar (ex: saiu de
      // um lote de Cria pra um de Confinamento sem permissão de Cria), então
      // o PageManejoInicio já poda editDraft.acoes de novo no próximo render.
      render();
    };
    document.querySelectorAll('[data-acao-manejo]').forEach(el=>{
      el.onchange = ()=>{
        capturarSetupManejo();
        const acao = el.dataset.acaoManejo;
        const acoes = new Set(editDraft.acoes);
        if(el.checked) acoes.add(acao); else acoes.delete(acao);
        editDraft.acoes = [...acoes];
        render();
      };
    });
    const mudaLoteEl = document.getElementById('f-mudalotemanejo');
    if(mudaLoteEl) mudaLoteEl.onchange = (e)=>{
      capturarSetupManejo();
      editDraft.mudaLote = e.target.value==='sim';
      render();
    };
    const iniciarBtn = document.querySelector('[data-iniciar-manejo]');
    if(iniciarBtn) iniciarBtn.onclick = async ()=>{
      if(iniciarBtn.disabled) return;
      iniciarBtn.disabled = true;
      try{
        const loteId = Number(document.getElementById('f-lotemanejo').value);
        const data = document.getElementById('f-datamanejo').value;
        const mudaLote = document.getElementById('f-mudalotemanejo').value==='sim';
        const loteDestinoId = mudaLote ? Number(document.getElementById('f-lotedestinomanejo').value) : null;
        const vacinacao = document.getElementById('f-vacinacaomanejo').checked;
        const vermifugacao = document.getElementById('f-vermifugacaomanejo').checked;
        // Repoda por permissão aqui também (defesa em profundidade -- a UI já
        // só oferece ação permitida, mas não custa checar de novo no submit).
        const loteAtualManejo = state.lotes.find(l=>l.id===loteId);
        const acoes = editDraft.acoes.filter(acao=>acaoManejoPermitida(acao, loteAtualManejo));
        if(!data){ alert('Informe a data do manejo.'); return; }
        if(acoes.length===0 && !mudaLote){ alert('Marque ao menos uma ação, ou ative "Vai mudar de lote" pra um manejo só de troca de lote.'); return; }
        if(mudaLote && !loteDestinoId){ alert('Selecione o lote de destino.'); return; }
        const res = await db.from('manejos').insert(manejoToRow({data, loteId, loteDestinoId, acoes, vacinacao, vermifugacao, status:'aberto', totalAnimais:0})).select().single();
        if(res.error){ alert('Não foi possível iniciar o manejo: ' + res.error.message); return; }
        let pesagemId = null;
        if(acoes.includes('pesagem')){
          const resPesagem = await db.from('pesagens').insert(pesagemToRow({data, loteId, pesoMedioKg:0, observacao:'Lançado via Manejo', manejoId: res.data.id})).select().single();
          if(resPesagem.error){ alert('Manejo iniciado, mas não deu pra preparar a pesagem: ' + resPesagem.error.message); }
          else pesagemId = resPesagem.data.id;
        }
        const lote = state.lotes.find(l=>l.id===loteId);
        state.manejoAtivo = {
          id: res.data.id, loteId, loteNome: lote?.nome||'', loteDestinoId, acoes, vacinacao, vermifugacao, data,

  if(state.manejoAtivo){

    // campos de "animal novo") -- sincroniza tudo antes, senão o que já
    // tinha sido preenchido pra esse mesmo animal se perdia.
    function sincronizarDraftManejo(){
      const d = state.manejoAtivo.draftAtual || (state.manejoAtivo.draftAtual = {});
      const sexoEl = document.getElementById('f-sexomanejo');
      const racaEl = document.getElementById('f-racamanejo');
      const pesoEl = document.getElementById('f-pesomanejo');
      const racaTouroEl = document.getElementById('f-racatouromanejo');
      const resultadoEl = document.getElementById('f-resultadomanejo');
      const partoDesmamaEl = document.getElementById('f-partodesmamamanejo');
      const pesoDesmamaEl = document.getElementById('f-pesodesmamamanejo');
      const racaDesmamaEl = document.getElementById('f-racadesmamamanejo');
      if(sexoEl) d.sexo = sexoEl.value;
      if(racaEl) d.raca = racaEl.value;
      if(pesoEl) d.peso = pesoEl.value;
      if(racaTouroEl) d.racaTouro = racaTouroEl.value;
      if(resultadoEl) d.resultado = resultadoEl.value;
      if(partoDesmamaEl) d.partoDesmama = partoDesmamaEl.value;
      if(pesoDesmamaEl) d.pesoDesmama = pesoDesmamaEl.value;
      if(racaDesmamaEl) d.racaDesmama = racaDesmamaEl.value;
    }
    const numManejoEl = document.getElementById('f-numanimalmanejo');
    if(numManejoEl) numManejoEl.onchange = (e)=>{
      sincronizarDraftManejo();
      state.manejoAtivo.numeroAtualDraft = e.target.value;

    if(salvarAnimalManejoBtn) salvarAnimalManejoBtn.onclick = async ()=>{
      if(salvarAnimalManejoBtn.disabled) return;

        await salvarAnimalManejo();
      } finally {
        salvarAnimalManejoBtn.disabled = false;
      }
