    async function salvarAnimalManejo(){
      const m = state.manejoAtivo;
      const acoesAtivas = m.acoes;
      const numEl = document.getElementById('f-numanimalmanejo');
      const numero = (numEl.value||'').trim();
      const precisaNumero = acoesAtivas.some(a=>['inseminacao','diagnostico','protocoloIA'].includes(a)) || !!m.loteDestinoId;
      if(precisaNumero && !numero){ alert('Informe o número do animal — obrigatório pra inseminação, diagnóstico, protocolo de inseminação ou mudança de lote.'); return; }
      // Mesmo raciocínio do template: o sexo fixo é do lote de destino
      // (quando o manejo move de lote), não do lote sendo manejado.
      const sexoFixo = sexoFixoDoLote(m.loteDestinoId || m.loteId);
      // Já parte do sexo fixo do lote (quando ele não é misto) mesmo pra
      // animal já cadastrado -- sem isso, o upsertAnimal mais abaixo ia sem
      // sexo pra desambiguar, e um número repetido entre macho e fêmea
      // podia achar o animal errado.
      let sexoNovo = sexoFixo || '', racaNovo = '';
      const eraNovo = numero && !animalCadastrado(numero, sexoFixo||undefined);
      if(eraNovo){
        const sexoEl = document.getElementById('f-sexomanejo');
        sexoNovo = sexoFixo || (sexoEl ? sexoEl.value : '');
        racaNovo = document.getElementById('f-racamanejo')?.value || '';
        const erroAnimalManejo = validarAnimalNovo(numero, sexoNovo, racaNovo);
        if(erroAnimalManejo){ alert(erroAnimalManejo); return; }
      }
      const pesoVal = acoesAtivas.includes('pesagem') ? document.getElementById('f-pesomanejo').value : null;
      if(acoesAtivas.includes('pesagem') && (!pesoVal || Number(pesoVal)<=0)){ alert('Informe um peso maior que zero.'); return; }
      const racaTouroVal = acoesAtivas.includes('inseminacao') ? document.getElementById('f-racatouromanejo').value : '';
      if(acoesAtivas.includes('inseminacao') && !racaTouroVal){ alert('Selecione a raça do touro.'); return; }
      const resultadoVal = acoesAtivas.includes('diagnostico') ? document.getElementById('f-resultadomanejo').value : '';
      let partoIdVal = null, racaDesmamaVal = '', pesoDesmamaVal = null;
      if(acoesAtivas.includes('desmama')){
        partoIdVal = Number(document.getElementById('f-partodesmamamanejo').value)||null;
        racaDesmamaVal = document.getElementById('f-racadesmamamanejo').value;
        pesoDesmamaVal = document.getElementById('f-pesodesmamamanejo').value;
        if(!partoIdVal){ alert('Selecione qual bezerro está sendo desmamado.'); return; }
        if(!racaDesmamaVal){ alert('Selecione a raça do bezerro.'); return; }
        if(!pesoDesmamaVal || Number(pesoDesmamaVal)<=0){ alert('Informe o peso da desmama.'); return; }
      }
      const loteAlvo = m.loteDestinoId || m.loteId;
      // Rastreia o que essa tentativa específica já inseriu, pra desfazer se
      // um passo mais adiante falhar -- sem isso, um "Salvar" repetido
      // depois de uma falha no meio (rede ruim no curral) duplicava peso,
      // custo de inseminação etc. dos passos que já tinham dado certo antes
      // do que falhou.
      const feitoNestaLeva = {};
      const mediaPesoAntes = m.animaisFeitos.length>0
        ? m.animaisFeitos.map(a=>a.peso).filter(p=>p!=null).reduce((a,p,_,arr)=>a+p/arr.length,0)
        : null;
      async function desfazerFeitoNestaLeva(){
        if(feitoNestaLeva.pesagemAnimalId){
          await db.from('pesagens_animais').delete().eq('id', feitoNestaLeva.pesagemAnimalId);
          await db.from('pesagens').update({peso_medio_kg: mediaPesoAntes}).eq('id', m.pesagemId);
        }
        if(feitoNestaLeva.reproducaoId) await db.from('reproducao_custos').delete().eq('id', feitoNestaLeva.reproducaoId);
        if(feitoNestaLeva.diagnosticoId) await db.from('diagnosticos_gestacionais').delete().eq('id', feitoNestaLeva.diagnosticoId);
        if(feitoNestaLeva.protocoloId) await db.from('protocolos_inseminacao').delete().eq('id', feitoNestaLeva.protocoloId);
        if(feitoNestaLeva.desmamaId) await db.from('desmamas').delete().eq('id', feitoNestaLeva.desmamaId);
      }
      // Se veio mesmo do lote de origem (pra contar certo na "Mudança de
      // lote" ao finalizar) -- precisa checar ANTES do upsertAnimal, que já
      // move o loteId em cache pro destino. Animal novo (nunca cadastrado)
      // conta como "veio de lá": ele já estava fisicamente nesse lote, só
      // não tinha número ainda. Um animal já cadastrado só conta se o lote
      // dele ATUAL for realmente o de origem -- rebipar por engano um
      // animal que já estava no destino (ou de um terceiro lote) não pode
      // descontar do lote de origem um animal que nunca esteve lá.
      const animalAntesDoManejo = numero ? animalCadastrado(numero, sexoNovo||undefined) : null;
      const veioDoOrigem = !animalAntesDoManejo || animalAntesDoManejo.loteId===m.loteId;
      // Só precisa mover a CONTAGEM se o animal realmente ainda não estava
      // no lote de destino -- num retry (depois de um passo mais adiante
      // ter falhado numa tentativa anterior pra esse mesmo animal), o
      // upsertAnimal já tinha movido ele antes, e mover a contagem nesta
      // tentativa de novo contaria em dobro.
      const precisaMoverContagem = !!m.loteDestinoId && veioDoOrigem && (!animalAntesDoManejo || animalAntesDoManejo.loteId!==loteAlvo);
      if(numero){
        const resAnimalManejo = await upsertAnimal(numero, loteAlvo, {sexo: sexoNovo||undefined, raca: racaNovo||undefined});
        if(resAnimalManejo.error){ alert('Não deu pra atualizar o cadastro do animal: ' + resAnimalManejo.error.message); return; }
        // Sem loadAll() nesse loop (custaria uma rodada de rede completa a
        // cada animal, pesado no celular no meio do curral) -- atualiza o
        // cache local igual o upsertAnimal em leva faz, pra próxima
        // checagem de animalCadastrado() já enxergar esse animal.
        if(eraNovo){
          state.animais.push({id: resAnimalManejo.data?.id, numero, loteId: loteAlvo, sexo: sexoNovo, raca: racaNovo, criadoPor: autorAtual()||''});
        } else {
          const existente = animalCadastrado(numero, sexoNovo||undefined);
          if(existente){ existente.loteId = loteAlvo; if(sexoNovo) existente.sexo = sexoNovo; if(racaNovo) existente.raca = racaNovo; }
        }
        // Ajusta o total de animais dos dois lotes NA HORA, animal por
        // animal -- não espera "Finalizar manejo" pra fazer isso em lote.
        // Se a sessão for abandonada no meio (bateria, app fecha), os
        // animais já processados até ali já deixam a contagem dos dois
        // lotes certa, em vez de ficar desincronizada até alguém finalizar
        // um manejo que talvez nunca seja retomado.
        if(precisaMoverContagem){
          const loteOrigemManejo = state.lotes.find(l=>l.id===m.loteId);
          const loteDestinoManejo = state.lotes.find(l=>l.id===m.loteDestinoId);
          const novoOrigem = Math.max(0, Number(loteOrigemManejo?.numeroAnimais||0)-1);
          const novoDestino = Number(loteDestinoManejo?.numeroAnimais||0)+1;
          const erroOrigemManejo = loteOrigemManejo ? (await db.from('lotes').update({numero_animais: novoOrigem}).eq('id', m.loteId)).error : null;
          const erroDestinoManejo = loteDestinoManejo ? (await db.from('lotes').update({numero_animais: novoDestino}).eq('id', m.loteDestinoId)).error : null;
          if(erroOrigemManejo || erroDestinoManejo){
            alert('O animal foi movido, mas não deu pra atualizar o total de animais dos lotes: ' + (erroOrigemManejo||erroDestinoManejo).message);
          } else {
            if(loteOrigemManejo) loteOrigemManejo.numeroAnimais = novoOrigem;
            if(loteDestinoManejo) loteDestinoManejo.numeroAnimais = novoDestino;
          }
        }
      }
      const registro = {numero, veioDoOrigem};
      if(acoesAtivas.includes('pesagem')){
        const resPesoAnimalManejo = await db.from('pesagens_animais').insert({pesagem_id:m.pesagemId, numero_animal:numero||null, peso_kg:Number(pesoVal)}).select().single();
        if(resPesoAnimalManejo.error){ alert('Não foi possível salvar o peso: ' + resPesoAnimalManejo.error.message); await desfazerFeitoNestaLeva(); return; }
        feitoNestaLeva.pesagemAnimalId = resPesoAnimalManejo.data.id;
        registro.peso = Number(pesoVal);
        const todosPesos = [...m.animaisFeitos.map(a=>a.peso).filter(p=>p!=null), registro.peso];
        const mediaPeso = todosPesos.reduce((a,p)=>a+p,0)/todosPesos.length;
        const resMediaManejo = await db.from('pesagens').update({peso_medio_kg:mediaPeso}).eq('id', m.pesagemId);
        if(resMediaManejo.error){ alert('Não foi possível atualizar a média de peso: ' + resMediaManejo.error.message); await desfazerFeitoNestaLeva(); return; }
      }
      if(acoesAtivas.includes('inseminacao')){
        const resInsemManejo = await db.from('reproducao_custos').insert(reproducaoCustoToRow({data:m.data, loteId:m.loteId, numeroVaca:numero, racaTouro:racaTouroVal, qualInseminacao:'', custo:null, manejoId:m.id})).select().single();
        if(resInsemManejo.error){ alert('Não foi possível salvar a inseminação: ' + resInsemManejo.error.message); await desfazerFeitoNestaLeva(); return; }
        feitoNestaLeva.reproducaoId = resInsemManejo.data.id;
        registro.racaTouro = racaTouroVal;
      }
      if(acoesAtivas.includes('diagnostico')){
        const resDiagManejo = await db.from('diagnosticos_gestacionais').insert(diagnosticoToRow({data:m.data, loteId:m.loteId, numeroVaca:numero, resultado:resultadoVal, previsaoParto:null, manejoId:m.id})).select().single();
        if(resDiagManejo.error){ alert('Não foi possível salvar o diagnóstico: ' + resDiagManejo.error.message); await desfazerFeitoNestaLeva(); return; }
        feitoNestaLeva.diagnosticoId = resDiagManejo.data.id;
        registro.resultado = resultadoVal;
      }
      if(acoesAtivas.includes('protocoloIA')){
        const resProtManejo = await db.from('protocolos_inseminacao').insert(protocoloInseminacaoToRow({manejoId:m.id, loteId:m.loteId, numeroAnimal:numero, data:m.data})).select().single();
        if(resProtManejo.error){ alert('Não foi possível salvar o protocolo: ' + resProtManejo.error.message); await desfazerFeitoNestaLeva(); return; }
        feitoNestaLeva.protocoloId = resProtManejo.data.id;
      }
      if(acoesAtivas.includes('desmama')){
        const resDesmManejo = await db.from('desmamas').insert(desmamaToRow({partoId:partoIdVal, data:m.data, raca:racaDesmamaVal, pesoKg:Number(pesoDesmamaVal), manejoId:m.id})).select().single();
        if(resDesmManejo.error){ alert('Não foi possível salvar a desmama: ' + resDesmManejo.error.message); await desfazerFeitoNestaLeva(); return; }
        feitoNestaLeva.desmamaId = resDesmManejo.data.id;
        // Sem isso, o mesmo parto continuaria aparecendo como "disponível"
        // no seletor pro próximo animal desse mesmo manejo (partosSemDesmama
        // só enxerga o que já veio do loadAll -- e aqui não tem loadAll no
        // meio da sequência), deixando desmamar o mesmo bezerro duas vezes.
        state.desmamas.push({id:resDesmManejo.data.id, partoId:partoIdVal, data:m.data, raca:racaDesmamaVal, pesoKg:Number(pesoDesmamaVal), criadoPor:autorAtual()||'', manejoId:m.id});
        registro.pesoDesmama = Number(pesoDesmamaVal);
      }
      m.animaisFeitos.push(registro);
      m.numeroAtualDraft = '';
      m.draftAtual = {};
      render();
      const numEl2 = document.getElementById('f-numanimalmanejo');
      if(numEl2) numEl2.focus();
    }
    const finalizarManejoBtn = document.querySelector('[data-finalizar-manejo]');
    if(finalizarManejoBtn) finalizarManejoBtn.onclick = async ()=>{
      const m = state.manejoAtivo;
      if(m.animaisFeitos.length===0 && !confirm('Nenhum animal foi lançado nesse manejo ainda. Finalizar mesmo assim?')) return;
      const {error: erroFinalizarManejo} = await db.from('manejos').update({status:'finalizado', total_animais:m.animaisFeitos.length}).eq('id', m.id);
      if(erroFinalizarManejo){ alert('Não foi possível finalizar o manejo: ' + erroFinalizarManejo.message); return; }
      // O total de animais dos lotes de origem/destino (quando o manejo
      // muda de lote) já é ajustado animal por animal em
      // salvarAnimalManejo(), na hora que cada um é processado -- não
      // precisa mais fazer isso em lote aqui. Antes, se a sessão fosse
      // abandonada no meio (bateria, app fecha) antes de "Finalizar", a
      // contagem dos dois lotes ficava desincronizada pra sempre, mesmo os
      // animais já tendo sido movidos de verdade em `animais.lote_id`.
      state.manejoAtivo = null;
      await loadAll();
    };
  }

  document.querySelectorAll('[data-ver-manejo]').forEach(el=>{
    el.onclick = ()=>{ state.manejoDetalheId = Number(el.dataset.verManejo); render(); };
  });
  const voltarManejoDetalheBtn = document.querySelector('[data-voltar-manejo-detalhe]');
  if(voltarManejoDetalheBtn) voltarManejoDetalheBtn.onclick = ()=>{ state.manejoDetalheId = null; render(); };

  // save handlers
  const saveBtn = document.querySelector('[data-save]');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const type = saveBtn.dataset.save;
      let error = null;
      if(type==='ingrediente'){
        // o campo de preço só existe no formulário pra quem pode ver valores
        // (souAdmin) — sem ele, preserva o preço que já estava salvo.
        const precoInput = document.getElementById('f-preco');
        const campos = {
          nome: document.getElementById('f-nome').value || 'Sem nome',
          categoria: document.getElementById('f-categoria').value,
          fornecedor: document.getElementById('f-fornecedor').value,
          unidade: document.getElementById('f-unidade').value,
          ms: Number(document.getElementById('f-ms').value)||0,
          pb: Number(document.getElementById('f-pb').value)||0,
          ndt: Number(document.getElementById('f-ndt').value)||0,
          precoKg: precoInput ? Number(precoInput.value)||0 : Number(editDraft.precoKg)||0,
          estoqueMin: Number(document.getElementById('f-min').value)||0,
        };
        const row = ingredienteToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('ingredientes').update(row).eq('id', editDraft._editId));
        } else {
          ({error} = await db.from('ingredientes').insert(row));
        }
      } else if(type==='movimento'){
        const tipoMov = document.getElementById('f-tipo').value;
        const precoEntradaEl = document.getElementById('f-precoentrada');
        const campos = {
          data: document.getElementById('f-data').value,
          ingredienteId: Number(document.getElementById('f-ing').value),
          tipo: tipoMov,
          quantidade: Number(document.getElementById('f-qtd').value)||0,
          precoKg: (tipoMov==='entrada' && precoEntradaEl && precoEntradaEl.value) ? Number(precoEntradaEl.value) : null,
          // Editar uma movimentação existente (inclusive uma gerada por
          // "Ajustar estoque") preserva a marca de ajuste -- não tem campo
          // no formulário pra trocar isso, e uma "Nova movimentação" lançada
          // por aqui nunca é ajuste (editDraft.ajuste vem undefined = false).
          ajuste: !!editDraft.ajuste,
        };
        const row = movimentoToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('movimentos').update(row).eq('id', editDraft._editId));
          // Corrigir uma entrada (quantidade, preço ou o PRÓPRIO ingrediente
          // errados) precisa refletir no preço médio do ingrediente --
          // recalcula do zero, repetindo a média ponderada sobre TODAS as
          // movimentações dele em ordem cronológica (não só "empurra" o
          // preço de novo, senão o valor de antes da correção continua
          // contaminando o preço atual).
          if(!error){
            // editDraft.ingredienteId nunca é reescrito por um onchange do
            // campo "Ingrediente" (só f-tipo tem um) -- continua com o valor
            // ORIGINAL da movimentação até aqui, então dá pra comparar com o
            // que está no formulário agora pra saber se o ingrediente mudou.
            const ingredienteIdAntigo = editDraft.ingredienteId;
            const movEditada = {...campos, id:editDraft._editId};
            const ing = getIng(campos.ingredienteId);
            if(ing){
              // state.movimentos (em memória) ainda lista essa linha sob o
              // ingrediente ANTIGO -- filtra ela fora de lá e soma a versão
              // editada (já no ingrediente novo) manualmente, senão a troca
              // de ingrediente nunca entra na conta do ingrediente novo.
              const movsIngrediente = state.movimentos
                .filter(m=>m.ingredienteId===campos.ingredienteId && m.id!==editDraft._editId)
                .concat([movEditada]);
              const precoRecalc = recomputarPrecoIngrediente(movsIngrediente, ing.unidade);
              if(precoRecalc!=null && precoRecalc!==Number(ing.precoKg)){
                await db.from('ingredientes').update({preco_kg: precoRecalc}).eq('id', campos.ingredienteId);
              }
            }
            // Ingrediente trocado -- o ANTIGO também precisa recalcular,
            // agora SEM essa movimentação (que não é mais dele).
            if(ingredienteIdAntigo && ingredienteIdAntigo!==campos.ingredienteId){
              const ingAntigo = getIng(ingredienteIdAntigo);
              if(ingAntigo){
                const movsIngredienteAntigo = state.movimentos.filter(m=>m.ingredienteId===ingredienteIdAntigo && m.id!==editDraft._editId);
                const precoRecalcAntigo = recomputarPrecoIngrediente(movsIngredienteAntigo, ingAntigo.unidade);
                if(precoRecalcAntigo!=null && precoRecalcAntigo!==Number(ingAntigo.precoKg)){
                  await db.from('ingredientes').update({preco_kg: precoRecalcAntigo}).eq('id', ingredienteIdAntigo);
                }
              }
            }
          }
        } else {
          ({error} = await db.from('movimentos').insert(row));
          // Uma entrada com preço informado recalcula o preço/kg do ingrediente
          // pela média ponderada -- só numa entrada nova, nunca ao editar um
          // lançamento existente (ali quem recalcula é o bloco de cima).
          // Usa a MESMA função do editar (recomputarPrecoIngrediente, replay
          // cronológico de tudo) em vez de uma conta separada "contra o
          // saldo de hoje" -- as duas fórmulas podiam divergir (ex: uma
          // entrada nova com data retroativa não deveria se misturar com o
          // preço de HOJE, e sim com o preço de quando ela aconteceu).
          if(!error && campos.tipo==='entrada' && campos.precoKg){
            const ing = getIng(campos.ingredienteId);
            if(ing){
              const movsIngrediente = state.movimentos
                .filter(m=>m.ingredienteId===campos.ingredienteId)
                .concat([{...campos, id:Infinity}]);
              const precoRecalc = recomputarPrecoIngrediente(movsIngrediente, ing.unidade);
              if(precoRecalc!=null) await db.from('ingredientes').update({preco_kg: precoRecalc}).eq('id', campos.ingredienteId);
            }
          }

      } else if(type==='ajusteEstoque'){
        const ingredienteId = Number(editDraft.ingredienteId);

        if(!validarObrigatorios([[novoSaldoRaw,'Novo saldo']])) return;
        const saldoAtual = saldoIngrediente(ingredienteId);
        const novoSaldo = Number(novoSaldoRaw)||0;
        const diferenca = novoSaldo - saldoAtual;
        if(diferenca!==0 && ing){
          const row = movimentoToRow({
            data: document.getElementById('f-data').value,
            ingredienteId,
            tipo: diferenca>0 ? 'entrada' : 'saida',
            quantidade: Math.abs(diferenca),
            precoKg: null,
            ajuste: true,
          });
          ({error} = await db.from('movimentos').insert(row));

      } else if(type==='dieta'){
        const campos = {
          nome: document.getElementById('f-nome').value || 'Sem nome',
          tipo: document.getElementById('f-tipodieta').value,
          categoriaAnimal: document.getElementById('f-categoria').value,

          itens: editDraft.itens.map(it=>({ingredienteId:Number(it.ingredienteId), pct:Number(it.pct)||0})),
        };
        const pctTotalDieta = campos.itens.reduce((a,it)=>a+it.pct,0);
        if(Math.abs(pctTotalDieta-100)>0.01){
          alert(`A composição soma ${fmt(pctTotalDieta,1)}%, precisa somar 100% pra salvar. Ajuste os percentuais dos ingredientes antes de continuar — senão o desconto de estoque nos lançamentos com essa dieta fica errado.`);

      } else if(type==='lote'){
        const modoEntradaEl = document.getElementById('f-modoentrada');
        const modoEntrada = modoEntradaEl ? modoEntradaEl.value : 'novo';
        const numerosAnimaisLista = parseNumerosAnimais(document.getElementById('f-numerosanimais')?.value);
        const sexoNovosVal = document.getElementById('f-sexoanimaisnovos')?.value || '';
        const racaNovosVal = document.getElementById('f-racaanimaisnovos')?.value || '';
        if(numerosAnimaisLista.length>0){
          const loteAlvoParaValidar = modoEntrada==='existente'
            ? state.lotes.find(l=>l.id===Number(document.getElementById('f-loteexistente')?.value))
            : null;
          const sexoLoteParaValidar = modoEntrada==='existente' ? (loteAlvoParaValidar?.sexo||'') : (document.getElementById('f-sexolote')?.value||'');
          for(const numero of numerosAnimaisLista){
            const sexoParaEsse = (sexoLoteParaValidar==='macho'||sexoLoteParaValidar==='femea') ? sexoLoteParaValidar : sexoNovosVal;
            const erroAnimalLote = validarAnimalNovo(numero, sexoParaEsse, racaNovosVal);
            if(erroAnimalLote){ alert(erroAnimalLote); return; }
          }
        }
        // Registra (ou move) cada número listado pra composição do lote --
        // usa o sexo do próprio lote como padrão do animal, quando o lote
        // tem um sexo definido (não misto); senão usa o sexo informado pros
        // animais novos. A validação acima já garante que animal novo tem
        // sexo e raça antes de chegar aqui.
        async function registrarNumerosAnimais(loteIdDestino, sexoLote){
          const criadosNestaLeva = [];
          for(const numero of numerosAnimaisLista){
            const numeroNorm = String(numero).trim().toLowerCase();
            const sexoLoteFixoReg = (sexoLote==='macho'||sexoLote==='femea') ? sexoLote : undefined;
            const ehNovo = !animalCadastrado(numero, sexoLoteFixoReg) && !criadosNestaLeva.find(a=>a.numero.toLowerCase()===numeroNorm && (!sexoLoteFixoReg || a.sexo===sexoLoteFixoReg));
            const sexoParaEsse = sexoLoteFixoReg || (ehNovo ? sexoNovosVal : undefined);
            // Raça informada aqui só se aplica a quem está sendo numerado
            // agora — não sobrescreve a raça de um animal que já existia e
            // só está sendo movido de lote.
            const extra = {sexo: sexoParaEsse||undefined};
            if(ehNovo) extra.raca = racaNovosVal||undefined;
            const res = await upsertAnimal(numero, loteIdDestino, extra, criadosNestaLeva);
            if(res.error) return res.error;
          }
          return null;
        }
        if(!editDraft._editId && modoEntrada==='existente'){
          // Entrada de animais num lote que já existe -- soma a quantidade e
          // recalcula o peso médio do lote por média ponderada (peso × qtd de
          // quem já estava + peso × qtd de quem está chegando), em vez de
          // criar um lote novo do zero.
          const loteExistenteIdVal = document.getElementById('f-loteexistente').value;
          const qtdEntradaVal = document.getElementById('f-qtdentrada').value;
          const pesoEntradaVal = document.getElementById('f-pesoentrada').value;
          const dataEntradaVal = document.getElementById('f-dataentrada').value;
          if(!validarObrigatorios([[loteExistenteIdVal,'Lote de destino'],[qtdEntradaVal,'Nº de animais chegando'],[pesoEntradaVal,'Peso médio dos animais chegando'],[dataEntradaVal,'Data de entrada']])) return;
          const loteAlvo = state.lotes.find(l=>l.id===Number(loteExistenteIdVal));
          const qtdNova = Number(qtdEntradaVal);
          const pesoNovo = Number(pesoEntradaVal);
          const qtdAntiga = Number(loteAlvo?.numeroAnimais||0);
          const qtdTotal = qtdAntiga + qtdNova;
          const historico = pesagensDoLote(loteAlvo.id);
          const pesoAntigo = historico.length>0 ? Number(historico[historico.length-1].pesoMedioKg) : null;
          // Sem pesagem anterior pra ponderar, o peso informado na entrada
          // vira o peso atual do lote inteiro.
          const pesoPonderado = pesoAntigo!==null ? ((qtdAntiga*pesoAntigo) + (qtdNova*pesoNovo)) / qtdTotal : pesoNovo;
          ({error} = await db.from('lotes').update({numero_animais: qtdTotal}).eq('id', loteAlvo.id));
          if(!error){
            ({error} = await db.from('pesagens').insert({
              lote_id: loteAlvo.id, data: dataEntradaVal, peso_medio_kg: pesoPonderado,
              observacao: `Entrada de ${qtdNova} animal(is) (peso médio informado: ${fmt(pesoNovo,1)} kg) — peso médio do lote recalculado por média ponderada.`,
            }));

            // Salvar de novo duplicaria a entrada, já que a parte principal
            // já tinha sido gravada).
            const erroAnimais = await registrarNumerosAnimais(loteAlvo.id, loteAlvo.sexo);
            if(erroAnimais) alert('A entrada foi salva, mas não deu pra registrar um dos números de animal: ' + erroAnimais.message);
          }

          const campos = {
            nome: document.getElementById('f-nome').value || 'Sem nome',
            numeroAnimais: Number(document.getElementById('f-numanimais').value)||0,
            dataInicio: document.getElementById('f-datainicio').value,
            dataFim: document.getElementById('f-datafim').value || null,
            destino: document.getElementById('f-destino').value,
            dietaId: document.getElementById('f-dietalote').value ? Number(document.getElementById('f-dietalote').value) : null,
            sexo: document.getElementById('f-sexolote').value || null,
          };
          const row = loteToRow(campos);
          if(editDraft._editId){
            ({error} = await db.from('lotes').update(row).eq('id', editDraft._editId));
          } else {
            const pesoInicialEl = document.getElementById('f-pesoentrada');
            const pesoInicialVal = pesoInicialEl ? pesoInicialEl.value : '';
            const res = await db.from('lotes').insert(row).select().single();
            error = res.error;
            if(!error && pesoInicialVal && Number(pesoInicialVal)>0 && res.data){
              // Best-effort a partir daqui -- o lote já foi criado com
              // sucesso; se a pesagem inicial falhar, NÃO pode deixar
              // "error" setado (isso deixaria o modal aberto e um clique de
              // novo em Salvar criaria um SEGUNDO lote duplicado, já que o
              // lote em si já foi gravado).
              const resPeso = await db.from('pesagens').insert({
                lote_id: res.data.id, data: campos.dataInicio, peso_medio_kg: Number(pesoInicialVal),
                observacao: 'Peso médio na entrada dos animais.',
              });
              if(resPeso.error) alert('O lote foi salvo, mas não deu pra registrar o peso inicial: ' + resPeso.error.message + ' -- lance a primeira pesagem manualmente.');
            }
            if(!error && numerosAnimaisLista.length>0 && res.data){
              const erroAnimais = await registrarNumerosAnimais(res.data.id, campos.sexo);
              if(erroAnimais) alert('O lote foi salvo, mas não deu pra registrar um dos números de animal: ' + erroAnimais.message);
            }
          }
        }
      } else if(type==='animal'){
        const numeroAnimalVal = document.getElementById('f-numeroanimal').value.trim();

        if(!validarObrigatorios([[numeroAnimalVal,'Número do animal'],[loteAnimalVal,'Lote'],[sexoAnimalVal,'Sexo'],[racaAnimalVal,'Raça']])) return;
        const animalComEsseNumero = animalCadastrado(numeroAnimalVal, sexoAnimalVal);

      } else if(type==='morteAnimal'){

        if(!animalMorte){ alert('Animal não encontrado.'); return; }
        ({error} = await db.from('animais').update({status:'morto', data_morte:dataMorteVal}).eq('id', animalMorte.id));
        if(!error && animalMorte.loteId){
          const lote = state.lotes.find(l=>l.id===animalMorte.loteId);

            if(erroLote) alert('A morte foi registrada, mas não deu pra atualizar o total de animais do lote: ' + erroLote.message);
          }
        }
      } else if(type==='saidaRacao' || type==='saidaRacaoCria'){
        const dietaIdVal = document.getElementById('f-dieta').value;
        const dietaId = Number(dietaIdVal);
        const loteId = Number(document.getElementById('f-lote').value);
        // A data de um lançamento já registrado só pode ser alterada por
        // Administrador/Proprietário — o campo fica desabilitado na tela pra
        // quem não é, e aqui ignoramos qualquer valor diferente do original
        // por segurança (o input desabilitado não deveria mudar mesmo).
        const data = (editDraft._editId && !souAdmin()) ? editDraft.data : document.getElementById('f-data').value;
        const qtdRacaoVal = document.getElementById('f-qtdracao').value;
        // Dieta em branco (lote sem dieta padrão vinculada e ninguém trocou
        // manualmente) não pode ser lançada -- é exatamente o erro que essa
        // vinculação lote->dieta existe pra evitar (dieta errada ou faltando).
        if(!validarObrigatorios([[data,'Data'],[qtdRacaoVal,'Quantidade (kg)'],[dietaIdVal,'Dieta']])) return;
        if(Number(qtdRacaoVal)<=0){ alert('A quantidade precisa ser maior que zero.'); return; }
        const incompletaRacao = composicaoIncompleta(dietaId);
        if(incompletaRacao){
          alert(`A dieta "${incompletaRacao.dieta.nome}" tem uma composição que soma ${fmt(incompletaRacao.pctTotal,1)}%, não 100% — ajuste em Formulação de Dietas antes de lançar, senão o desconto de estoque fica errado.`);
          return;
        }
        const quantidadeKg = Number(qtdRacaoVal);
        if(editDraft._editId){
          const row = {data, dieta_id: dietaId, lote_id: loteId, quantidade_kg: quantidadeKg};
          const saidaId = editDraft._editId;
          ({error} = await db.from('saidas_racao').update(row).eq('id', saidaId));
          // Quem decide se desconta o ingrediente cru é a dieta escolhida
          // (consumo direto), não mais o tipo (Confinamento/Cria) -- refaz
          // os movimentos dessa saída do zero com os valores novos (limpa
          // antes de tudo, pro caso de ter trocado pra uma dieta "produzida
          // e guardada" e não sobrar movimento antigo órfão).
          const dieta = state.dietas.find(x=>x.id===dietaId);
          // ORDEM IMPORTA: insere os movimentos novos ANTES de apagar os
          // antigos, e só apaga se o insert tiver dado certo.
          //
          // Na ordem inversa, uma falha no insert (rede caindo no meio,
          // RLS) deixava a saída salva com a quantidade nova e ZERO
          // movimentos de estoque: o saldo do ingrediente subia como se o
          // consumo não tivesse acontecido, sem nenhum aviso além do alert
          // genérico. Assim, o pior caso é um desconto duplicado que ainda
          // dá para ver e corrigir — melhor que um consumo que sumiu.
          if(!error && dieta && dieta.consumoDireto){
            const movs = dieta.itens.filter(it=>it.ingredienteId).map(it=>{
              const ing = getIng(it.ingredienteId);
              const consumoKg = quantidadeKg*it.pct/100;
              return {
                data, ingrediente_id: it.ingredienteId, tipo: 'saida',
                quantidade: kgParaUnidade(consumoKg, ing?.unidade), saida_racao_id: saidaId,
              };
            });
            if(movs.length){
              const res = await db.from('movimentos').insert(movs).select('id');
              error = res.error;
              if(!error){
                // apaga só os ANTIGOS: os recém-inseridos ficam de fora
                const novos = (res.data||[]).map(m=>m.id);
                let del = db.from('movimentos').delete().eq('saida_racao_id', saidaId);
                if(novos.length) del = del.not('id', 'in', `(${novos.join(',')})`);
                await del;
              }
            } else if(!error){
              await db.from('movimentos').delete().eq('saida_racao_id', saidaId);
            }
          } else if(!error){
            // dieta produzida e guardada: não desconta ingrediente cru,
            // então é só limpar o que tiver sobrado da dieta anterior
            await db.from('movimentos').delete().eq('saida_racao_id', saidaId);
          }
        } else {
          const resultado = await salvarOuEnfileirar(type, {dietaId, loteId, data, quantidadeKg});
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='cocho'){
        const dataCochoVal = document.getElementById('f-data').value;
        if(!validarObrigatorios([[dataCochoVal,'Data']])) return;
        const campos = {
          loteId: Number(document.getElementById('f-lote').value),
          data: dataCochoVal,
          nota: Number(editDraft.nota)||2,
          observacao: document.getElementById('f-obs').value,
        };
        if(editDraft._editId){
          ({error} = await db.from('leituras_cocho').update(leituraCochoToRow(campos)).eq('id', editDraft._editId));

          const resultado = await salvarOuEnfileirar(type, campos);

            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='pasto'){
        const loteId = Number(document.getElementById('f-lote').value);
        const dietaIdVal = document.getElementById('f-dietapasto').value;
        const dietaId = Number(dietaIdVal);
        const data = document.getElementById('f-data').value;
        const qtdPastoVal = document.getElementById('f-qtdpasto').value;
        if(!validarObrigatorios([[data,'Data'],[qtdPastoVal,'Quantidade'],[dietaIdVal,'Dieta']])) return;
        if(Number(qtdPastoVal)<=0){ alert('A quantidade precisa ser maior que zero.'); return; }
        const incompletaPasto = composicaoIncompleta(dietaId);
        if(incompletaPasto){
          alert(`A dieta "${incompletaPasto.dieta.nome}" tem uma composição que soma ${fmt(incompletaPasto.pctTotal,1)}%, não 100% — ajuste em Formulação de Dietas antes de lançar, senão o desconto de estoque fica errado.`);
          return;
        }
        const quantidade = Number(qtdPastoVal);
        if(editDraft._editId){
          const row = {data, lote_id: loteId, dieta_id: dietaId, quantidade};
          const pastoId = editDraft._editId;
          ({error} = await db.from('pasto').update(row).eq('id', pastoId));
          // Mesma lógica da Saída de Ração: quem decide se desconta o
          // ingrediente cru é a dieta escolhida (consumo direto) -- refaz
          // os movimentos do zero com os valores novos.
          const dietaPasto = state.dietas.find(x=>x.id===dietaId);
          if(!error) await db.from('movimentos').delete().eq('pasto_id', pastoId);
          if(!error && dietaPasto && dietaPasto.consumoDireto){
            const movs = dietaPasto.itens.filter(it=>it.ingredienteId).map(it=>{
              const ing = getIng(it.ingredienteId);
              const consumoKg = quantidade*it.pct/100;

            });
            if(movs.length){
              ({error} = await db.from('movimentos').insert(movs));
            }
          }
        } else {
          const resultado = await salvarOuEnfileirar(type, {loteId, dietaId, data, quantidade});
          if(resultado.enfileirado){

            state.modal = null; editDraft = null; render();

      } else if(type==='producaoRacao'){

        if(!validarObrigatorios([[data,'Data'],[qtdProduzidaVal,'Quantidade produzida']])) return;

        const incompletaProducao = composicaoIncompleta(dietaId);
        if(incompletaProducao){
          alert(`A dieta "${incompletaProducao.dieta.nome}" tem uma composição que soma ${fmt(incompletaProducao.pctTotal,1)}%, não 100% — ajuste em Formulação de Dietas antes de lançar, senão o desconto de estoque fica errado.`);

        const quantidadeKg = Number(qtdProduzidaVal);
        if(editDraft._editId){

          ({error} = await db.from('producoes_racao').update(row).eq('id', producaoId));
          if(!error) await db.from('movimentos').delete().eq('producao_racao_id', producaoId);
          if(!error && dieta){
            const movs = dieta.itens.filter(it=>it.ingredienteId).map(it=>{

              ({error} = await db.from('movimentos').insert(movs));

          }

            state.modal = null; editDraft = null; render();

      } else if(type==='venda'){
        const loteId = Number(document.getElementById('f-lotevenda').value);

        const qtdVal = document.getElementById('f-qtdvenda').value;
        const tipoVenda = document.getElementById('f-tipovenda').value;
        const categoria = document.getElementById('f-categoriavenda').value;
        const sexo = document.getElementById('f-sexovenda').value;

        if(Number(qtdVal)<=0){ alert('A quantidade de animais precisa ser maior que zero.'); return; }
        const quantidade = Number(qtdVal);
        let pesoMedioKg=0, valorArroba=0, valorPorAnimal=0, valorKg=0, arrobasTotais='';
        if(tipoVenda==='cabeca'){
          valorPorAnimal = numDecimal(document.getElementById('f-valorporanimalvenda').value);
          if(valorPorAnimal<=0){ alert('O valor por animal precisa ser maior que zero.'); return; }
        } else if(tipoVenda==='kg'){

          valorKg = numDecimal(document.getElementById('f-valorkgvenda').value);
          if(pesoMedioKg<=0){ alert('O peso por animal precisa ser maior que zero.'); return; }
          if(valorKg<=0){ alert('O valor do kg precisa ser maior que zero.'); return; }
        } else {
          arrobasTotais = numDecimal(document.getElementById('f-arrobasvenda').value);
          valorArroba = numDecimal(document.getElementById('f-valorarrobavenda').value);
          if(arrobasTotais<=0){ alert('As arrobas totais precisam ser maiores que zero.'); return; }
          if(valorArroba<=0){ alert('O valor da arroba precisa ser maior que zero.'); return; }
          // Peso de carcaça por animal continua gravado (derivado das @ ÷ 15
          // × quantidade) — histórico e "kg carcaça" na lista de vendas
          // dependem dele, mesmo sem a pessoa digitar peso diretamente.
          pesoMedioKg = (arrobasTotais * KG_POR_ARROBA_CARCACA) / quantidade;
        }
        const campos = {quantidade, tipoVenda, pesoMedioKg, valorArroba, valorPorAnimal, valorKg, arrobasTotais};
        const arrobas = tipoVenda==='arroba' ? arrobasVenda(campos) : null;
        const valorTotal = valorVenda(campos);
        if(editDraft._editId){
          const vendaId = editDraft._editId;
          const loteAntigoId = editDraft._loteIdOriginal;
          const quantidadeAntiga = Number(editDraft._quantidadeOriginal||0);
          // Atualiza abate e receita PRIMEIRO -- só mexe no número de animais
          // dos lotes depois que os dois confirmarem sucesso. Antes o
          // "desfaz" no lote antigo era gravado logo de cara, e se abates/
          // receitas falhassem em seguida, ficava um número de animais
          // inflado no banco sem a edição de verdade ter ido adiante (e sem
          // aviso, já que o app não recarrega o estado nesse erro).
          const row = {data, lote_id: loteId, quantidade, tipo_venda: tipoVenda, peso_medio_kg: pesoMedioKg||null, valor_arroba: valorArroba||null, valor_por_animal: valorPorAnimal||null, valor_kg: valorKg||null, categoria: categoria||null, sexo: sexo||null, observacao};
          ({error} = await db.from('abates').update(row).eq('id', vendaId));
          if(!error){
            const lote = state.lotes.find(l=>l.id===loteId);
            const descricao = `${TIPO_VENDA_LABEL[tipoVenda]||'Venda'} — ${lote?lote.nome:'Lote'} (${fmtInt(quantidade)} animais)`;
            // mes tem que acompanhar a data: a tabela tem a restricao
          // mes_bate_com_data. Sem esta linha, mudar a data de uma venda
          // para outro mes gravava o abate e fazia a receita ser recusada -
          // e o fluxo nao desfazia o abate. A venda aparecia em agosto e a
          // receita continuava em julho.
          const receitaRow = {data, mes: data ? data.slice(0,7) : null,
                              lote_id:loteId, descricao, arrobas, valor:valorTotal};
            const resReceita = await db.from('lancamentos_financeiros').update(receitaRow).eq('abate_id', vendaId).select();
            error = resReceita.error;
            // .update() com filtro que não bate nenhuma linha "funciona"
            // sem erro (0 linhas afetadas) -- se a receita vinculada já
            // tinha sumido por algum motivo, recria em vez de deixar a
            // venda editada sem receita nenhuma batendo com ela.
            if(!error && (!resReceita.data || resReceita.data.length===0)){
              // tipo, atividade e centro_custo_id sao NOT NULL: sem eles o
            // insert morria com "null value in column tipo", deixando a
            // venda editada e SEM receita - exatamente o estado que este
            // bloco existe para evitar.
            if(state.centroVendasId == null){
              alert('Não foi possível recriar a receita desta venda: o centro de custo "Vendas" não foi encontrado. A venda não foi alterada.');
              return;
            }
            ({error} = await db.from('lancamentos_financeiros').insert({
              ...receitaRow, abate_id:vendaId,
              tipo:'receita', atividade:'pecuaria', centro_custo_id: state.centroVendasId,
            }));
            }
          }
          if(!error && loteAntigoId && loteAntigoId!==loteId){
            // Lote mudou -- desfaz no antigo (soma de volta os animais dessa venda)
            const loteAntigo = state.lotes.find(l=>l.id===loteAntigoId);
            if(loteAntigo){
              const novoNumeroAntigo = Number(loteAntigo.numeroAnimais||0)+quantidadeAntiga;
              const updLoteAntigo = {numero_animais: novoNumeroAntigo};
              if(novoNumeroAntigo>0 && loteAntigo.dataFim) updLoteAntigo.data_fim = null;
              ({error} = await db.from('lotes').update(updLoteAntigo).eq('id', loteAntigoId));
            }
          }
          if(!error){
            const lote = state.lotes.find(l=>l.id===loteId);
            if(lote){
              const baseAnimais = loteId===loteAntigoId ? Number(lote.numeroAnimais||0)+quantidadeAntiga : Number(lote.numeroAnimais||0);
              const novoNumero = Math.max(0, baseAnimais-quantidade);
              const updLote = {numero_animais: novoNumero};
              if(novoNumero===0 && !lote.dataFim) updLote.data_fim = data;
              else if(novoNumero>0 && lote.dataFim) updLote.data_fim = null;
              ({error} = await db.from('lotes').update(updLote).eq('id', lote.id));
            }
          }
        } else {
          const resultado = await salvarOuEnfileirar(type, {loteId, data, quantidade, tipoVenda, pesoMedioKg, arrobasTotais, valorArroba, valorPorAnimal, valorKg, categoria, sexo, observacao});
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='reproducaoCusto'){
        const dataReprodVal = document.getElementById('f-data').value;
        const numVacaVal = document.getElementById('f-numvaca').value;
        const racaVacaVal = document.getElementById('f-racavaca').value;
        const racaTouroVal = document.getElementById('f-racatouro').value;
        const qualInsemVal = document.getElementById('f-qualinsem').value;
        const custoVal = document.getElementById('f-custoreproducao').value;
        if(!validarObrigatorios([[dataReprodVal,'Data'],[numVacaVal,'Número da vaca'],[racaTouroVal,'Raça do touro'],[custoVal,'Custo do protocolo']])) return;
        if(Number(custoVal)<=0){ alert('O custo precisa ser maior que zero.'); return; }
        // Vaca ainda não cadastrada -- não dá pra lançar sem a raça dela
        // (sexo já é sempre fêmea, isso o próprio lançamento já garante).
        const erroAnimalVaca = validarAnimalNovo(numVacaVal, 'femea', racaVacaVal);
        if(erroAnimalVaca){ alert(erroAnimalVaca); return; }
        const campos = {
          loteId: Number(document.getElementById('f-lote').value),
          data: dataReprodVal,
          numeroVaca: numVacaVal,
          racaVaca: racaVacaVal,
          racaTouro: racaTouroVal,
          qualInseminacao: qualInsemVal,
          custo: Number(custoVal),
        };
        if(editDraft._editId){
          ({error} = await db.from('reproducao_custos').update(reproducaoCustoToRow(campos)).eq('id', editDraft._editId));
          // A vaca inseminada entra (ou é movida) na composição do lote --
          // é sempre fêmea. Não bloqueia o save (best-effort, mesmo motivo
          // do gancho de entrada de animais). No caminho de criação isso já
          // roda dentro de executarInsertLancamento (também no caso de
          // sincronizar depois de ficar offline); aqui é só o caminho de
          // edição, que não passa por lá.
          if(!error){
            const resAnimalInsem = await upsertAnimal(numVacaVal, campos.loteId, {sexo:'femea', raca:racaVacaVal||undefined});
            if(resAnimalInsem.error) alert('A inseminação foi salva, mas não deu pra atualizar o cadastro da vaca: ' + resAnimalInsem.error.message);
          }
        } else {
          const resultado = await salvarOuEnfileirar(type, campos);
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
          if(!error && resultado.avisoAnimal) alert('A inseminação foi salva, mas não deu pra atualizar o cadastro da vaca: ' + resultado.avisoAnimal);
        }
      } else if(type==='diagnosticoGestacional'){
        const dataDgVal = document.getElementById('f-data').value;
        const numVacaDgVal = document.getElementById('f-numvaca').value;
        const racaVacaDgVal = document.getElementById('f-racavaca').value;
        const resultadoVal = document.getElementById('f-resultadodg').value;
        if(!validarObrigatorios([[dataDgVal,'Data'],[numVacaDgVal,'Número da vaca'],[resultadoVal,'Resultado']])) return;
        const erroAnimalVacaDg = validarAnimalNovo(numVacaDgVal, 'femea', racaVacaDgVal);
        if(erroAnimalVacaDg){ alert(erroAnimalVacaDg); return; }
        const previsaoPartoEl = document.getElementById('f-previsaoparto');
        const campos = {
          loteId: Number(document.getElementById('f-lote').value),
          data: dataDgVal,
          numeroVaca: numVacaDgVal,
          racaVaca: racaVacaDgVal,
          resultado: resultadoVal,
          previsaoParto: previsaoPartoEl ? previsaoPartoEl.value : '',
        };
        if(editDraft._editId){
          ({error} = await db.from('diagnosticos_gestacionais').update(diagnosticoToRow(campos)).eq('id', editDraft._editId));
          // Mesmo gancho da inseminação (upsertAnimal best-effort) -- só o
          // caminho de edição, que não passa por executarInsertLancamento.
          if(!error){
            const resAnimalDg = await upsertAnimal(numVacaDgVal, campos.loteId, {sexo:'femea', raca:racaVacaDgVal||undefined});
            if(resAnimalDg.error) alert('O diagnóstico foi salvo, mas não deu pra atualizar o cadastro da vaca: ' + resAnimalDg.error.message);
          }
        } else {
          const resultado = await salvarOuEnfileirar(type, campos);
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
          if(!error && resultado.avisoAnimal) alert('O diagnóstico foi salvo, mas não deu pra atualizar o cadastro da vaca: ' + resultado.avisoAnimal);
        }
      } else if(type==='parto'){
        const dataPartoVal = document.getElementById('f-data').value;
        const numeroMaeVal = document.getElementById('f-numeromae').value;
        const racaMaeVal = document.getElementById('f-racamae').value;
        if(!validarObrigatorios([[dataPartoVal,'Data'],[numeroMaeVal,'Número da mãe']])) return;
        const erroAnimalMae = validarAnimalNovo(numeroMaeVal, 'femea', racaMaeVal);
        if(erroAnimalMae){ alert(erroAnimalMae); return; }
        const campos = {
          loteId: Number(document.getElementById('f-lote').value),
          data: dataPartoVal,
          numeroMae: numeroMaeVal,
          racaMae: racaMaeVal,
          sexoBezerro: document.getElementById('f-sexobezerro').value,
          racaBezerro: document.getElementById('f-racabezerro').value,
        };
        if(editDraft._editId){
          ({error} = await db.from('partos').update(partoToRow(campos)).eq('id', editDraft._editId));
          // Mesmo gancho da inseminação/diagnóstico (upsertAnimal best-effort)
          // -- só o caminho de edição, que não passa por executarInsertLancamento.
          if(!error){
            const resAnimalParto = await upsertAnimal(numeroMaeVal, campos.loteId, {sexo:'femea', raca:racaMaeVal||undefined});
            if(resAnimalParto.error) alert('O parto foi salvo, mas não deu pra atualizar o cadastro da mãe: ' + resAnimalParto.error.message);
          }
        } else {
          const resultado = await salvarOuEnfileirar(type, campos);
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
          if(!error && resultado.avisoAnimal) alert('O parto foi salvo, mas não deu pra atualizar o cadastro da mãe: ' + resultado.avisoAnimal);
        }
      } else if(type==='desmama'){
        const dataDesmamaVal = document.getElementById('f-data').value;
        const racaVal = document.getElementById('f-racadesmama').value;
        const pesoVal = document.getElementById('f-pesodesmama').value;
        if(!editDraft._editId && !editDraft.partoId){ alert('Selecione o bezerro (parto) que está sendo desmamado.'); return; }
        if(!validarObrigatorios([[dataDesmamaVal,'Data da desmama'],[racaVal,'Raça'],[pesoVal,'Peso']])) return;
        if(Number(pesoVal)<=0){ alert('O peso precisa ser maior que zero.'); return; }
        const campos = {
          partoId: editDraft._editId ? editDraft.partoId : Number(document.getElementById('f-parto').value),
          data: dataDesmamaVal,
          raca: racaVal,
          pesoKg: Number(pesoVal),
        };
        if(editDraft._editId){
          ({error} = await db.from('desmamas').update(desmamaToRow(campos)).eq('id', editDraft._editId));
        } else {
          const resultado = await salvarOuEnfileirar(type, campos);
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='pesagem'){
        const dataPesagemVal = document.getElementById('f-datapesagem').value;
        const loteIdPesagemVal = Number(document.getElementById('f-lotepesagem').value);
        if(!editDraft._editId){
          const entradasPesagem = editDraft.entradasPesagem||[];
          if(!validarObrigatorios([[dataPesagemVal,'Data']])) return;
          if(entradasPesagem.length===0){ alert('Adicione ao menos um peso antes de salvar.'); return; }
          const mediaCalculada = entradasPesagem.reduce((a,en)=>a+Number(en.pesoKg),0)/entradasPesagem.length;
          const observacaoIndividualVal = document.getElementById('f-obspesagem').value;
          const campos = {
            loteId: loteIdPesagemVal, data: dataPesagemVal, pesoMedioKg: mediaCalculada, observacao: observacaoIndividualVal,
            entradasPesagem,
          };
          const resultado = await salvarOuEnfileirar(type, campos);
          if(resultado.enfileirado){
            alert('Sem conexão — a pesagem foi salva neste aparelho e será enviada automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
          if(!error && resultado.avisoAnimal) alert('A pesagem foi salva, mas não deu pra atualizar o cadastro de um dos animais: ' + resultado.avisoAnimal);
        } else {
          const pesoVal = document.getElementById('f-pesomedio').value;
          if(!validarObrigatorios([[dataPesagemVal,'Data'],[pesoVal,'Peso médio por animal']])) return;
          if(Number(pesoVal)<=0){ alert('O peso precisa ser maior que zero.'); return; }
          const campos = {
            loteId: loteIdPesagemVal,
            data: dataPesagemVal,
            pesoMedioKg: Number(pesoVal),
            observacao: document.getElementById('f-obspesagem').value,
          };
          ({error} = await db.from('pesagens').update(pesagemToRow(campos)).eq('id', editDraft._editId));
        }
      } else if(type==='precoArroba'){
        const data = document.getElementById('f-dataarroba').value;
        const valorMachoStr = document.getElementById('f-valorarrobamacho').value;
        const valorFemeaStr = document.getElementById('f-valorarrobafemea').value;
        // Sempre confere direto contra o state pra ESSA data (não confia no
        // _editId capturado quando o modal abriu, que fica errado se a
        // pessoa trocar a data pra um dia que já tem cotação -- isso
        // inseria uma linha duplicada em vez de atualizar). Só usa o
        // _editId já salvo neste mesmo clique de Salvar se ele foi
        // capturado pra essa mesma data (retry depois de uma falha
        // parcial: o macho já foi inserido mas o state local ainda não
        // sabe, já que não rolou loadAll() no meio do save).
        const machoIdAtual = (editDraft._editIdMachoData===data && editDraft._editIdMacho) ? editDraft._editIdMacho : (state.precosArroba.find(p=>p.data===data && (p.sexo||'macho')==='macho')?.id || null);
        const femeaIdAtual = (editDraft._editIdFemeaData===data && editDraft._editIdFemea) ? editDraft._editIdFemea : (state.precosArroba.find(p=>p.data===data && p.sexo==='femea')?.id || null);
        if(valorMachoStr!==''){
          const row = precoArrobaToRow({data, valor:Number(valorMachoStr)||0, sexo:'macho'});
          if(machoIdAtual){
            ({error} = await db.from('precos_arroba').update(row).eq('id', machoIdAtual));
            if(!error){ editDraft._editIdMacho = machoIdAtual; editDraft._editIdMachoData = data; }
          } else {
            const res = await db.from('precos_arroba').insert(row).select().single();
            error = res.error;
            if(!error && res.data){ editDraft._editIdMacho = res.data.id; editDraft._editIdMachoData = data; }
          }
        }
        if(!error && valorFemeaStr!==''){
          const row = precoArrobaToRow({data, valor:Number(valorFemeaStr)||0, sexo:'femea'});
          if(femeaIdAtual){
            ({error} = await db.from('precos_arroba').update(row).eq('id', femeaIdAtual));
            if(!error){ editDraft._editIdFemea = femeaIdAtual; editDraft._editIdFemeaData = data; }
          } else {
            const res = await db.from('precos_arroba').insert(row).select().single();
            error = res.error;
            if(!error && res.data){ editDraft._editIdFemea = res.data.id; editDraft._editIdFemeaData = data; }
          }
        }
      } else if(type==='metaMargem'){
        const pct = Number(document.getElementById('f-metamargem').value)||0;
        ({error} = await db.from('config_financeiro').upsert({id:1, meta_margem_pct:pct}));
      } else if(type==='permissoes'){
        // Só admin/proprietário pode mexer no papel/permissões de alguém --
        // o botão que abre esse modal já é só admin (PageAdminUsuarios),
        // mas é um write sensível o bastante (dá pra virar admin de si
        // mesmo) pra não confiar só no botão escondido.
        if(!souAdmin()){ alert('Só administrador ou proprietário pode alterar permissões.'); return; }
        const papel = document.getElementById('f-papelusuario').value;
        const ativo = document.getElementById('f-ativousuario').checked;
        // Parte das permissoes que a pessoa JA TEM e sobrescreve so os
        // modulos mostrados nesta tela. Com o banco unificado, profiles.permissoes
        // guarda os modulos dos tres apps no mesmo jsonb — montar o objeto do
        // zero aqui apagaria silenciosamente os modulos dos outros apps.
        const permissoes = {...(editDraft.permissoes || {})};
        document.querySelectorAll('[data-perm-modulo]').forEach(sel=>{ permissoes[sel.dataset.permModulo] = sel.value; });
        ({error} = await db.from('profiles').update({papel, ativo, permissoes}).eq('id', editDraft._perfilId));
      } else if(type==='trocarSenha'){
        const senhaAtual = document.getElementById('f-senhaatual').value;
        const novaSenha = document.getElementById('f-novasenha').value;
        const confirmarSenha = document.getElementById('f-confirmarsenha').value;
        if(!senhaAtual || !novaSenha || !confirmarSenha){ alert('Preencha todos os campos.'); return; }
        if(novaSenha.length<6){ alert('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
        if(novaSenha!==confirmarSenha){ alert('A confirmação não bate com a nova senha.'); return; }
        const email = `${state.perfil.usuario}@${DOMINIO_LOGIN}`;
        const { error: erroSenhaAtual } = await db.auth.signInWithPassword({ email, password: senhaAtual });
        if(erroSenhaAtual){ alert('Senha atual incorreta.'); return; }
        ({error} = await db.auth.updateUser({ password: novaSenha }));
        if(error){ alert('Não foi possível trocar a senha: ' + error.message); return; }
        state.modal = null; editDraft = null;
        alert('Senha alterada com sucesso.');
        render();
        return;
      }
      if(error){
        alert('Não foi possível salvar: ' + error.message);
        return;
      }
      state.modal = null; editDraft = null;
      await loadAll();
    };
  }

  // painel de resultados: hover sincronizado entre gráfico e legenda
  const tooltip = document.getElementById('painel-tooltip');
  const clearHovers = ()=>{
    document.querySelectorAll('.donut-slice.hover, .legenda-row.hover').forEach(el=>el.classList.remove('hover'));
  };
  document.querySelectorAll('[data-slice-idx]').forEach(el=>{
    const idx = el.dataset.sliceIdx;
    el.addEventListener('pointerenter', ()=>{
      clearHovers();
      el.classList.add('hover');
      const row = document.querySelector(`[data-legenda-idx="${idx}"]`);
      if(row) row.classList.add('hover');
      if(tooltip){
        // dataset.* decodifica entidades HTML na leitura -- mesmo o atributo
        // tendo sido escrito com esc(), reinjetar direto aqui desfaria esse
        // escape (um nome de centro de custo tipo "<img onerror=...>"
        // executaria no hover). Escapa de novo antes de virar innerHTML.
        tooltip.innerHTML = `<div class="v">R$ ${esc(el.dataset.tipValor)}</div><div class="l">${esc(el.dataset.tipNome)} · ${esc(el.dataset.tipPct)}%</div>`;
        tooltip.style.display = 'block';
      }
    });
    el.addEventListener('pointermove', (e)=>{
      if(tooltip){ tooltip.style.left = (e.clientX+14)+'px'; tooltip.style.top = (e.clientY+14)+'px'; }
    });
    el.addEventListener('pointerleave', ()=>{
      clearHovers();
      if(tooltip) tooltip.style.display = 'none';
    });
    el.addEventListener('focus', ()=>{
      clearHovers();
      el.classList.add('hover');
      const row = document.querySelector(`[data-legenda-idx="${idx}"]`);
      if(row) row.classList.add('hover');
    });
    el.addEventListener('blur', clearHovers);
  });
  document.querySelectorAll('[data-legenda-idx]').forEach(el=>{
    const idx = el.dataset.legendaIdx;
    el.addEventListener('pointerenter', ()=>{
      clearHovers();
      el.classList.add('hover');
      const slice = document.querySelector(`[data-slice-idx="${idx}"]`);
      if(slice) slice.classList.add('hover');
    });
    el.addEventListener('pointerleave', clearHovers);
  });
  // Clique numa fatia do donut ou linha da legenda abre o detalhe (as
  // despesas que compõem aquela fatia, com botão de editar cada uma).
  // A chave é "painelId-idx" — o painelId em si pode ter hífen (ex:
  // "area-ano"), então separamos só no último hífen (o idx nunca tem).
  const abrirDetalheFatia = (chave)=>{
    const idx = Number(chave.slice(chave.lastIndexOf('-')+1));
    const panelId = chave.slice(0, chave.lastIndexOf('-'));
    const entry = (state.paineisResultadosDados[panelId]||[])[idx];
    if(!entry) return;
    state.modal = {type:'detalheGrafico', panelId, idx};
    render();
  };
  document.querySelectorAll('[data-slice-idx]').forEach(el=>{
    el.addEventListener('click', ()=>abrirDetalheFatia(el.dataset.sliceIdx));
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); abrirDetalheFatia(el.dataset.sliceIdx); } });
  });
  document.querySelectorAll('[data-legenda-idx]').forEach(el=>{
    el.addEventListener('click', ()=>abrirDetalheFatia(el.dataset.legendaIdx));
  });
}

initAuth();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js'));
}

// tenta sincronizar a fila offline assim que o navegador avisar que voltou
// a conexão, e periodicamente como reforço (o evento 'online' nem sempre
// dispara de forma confiável em todo dispositivo/navegador).
window.addEventListener('online', tentarSincronizarFila);
setInterval(tentarSincronizarFila, 30000);
// se sobrou algo pendente de uma sessão anterior (app fechado antes de
// sincronizar), tenta assim que o app abre de novo.
setTimeout(tentarSincronizarFila, 3000);
</script>
