<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AE Pecuária</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-pecuaria-192.png">
<link rel="apple-touch-icon" href="icon-pecuaria-192.png">
<meta name="theme-color" content="#173D2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-escuro:#173D2E;
    --verde-medio:#158A4C;
    --verde-vivo:#00BE5E;
    --verde-vivo-escuro:#008C31;
    --verde-claro:#DFF6E8;
    --grafite:#1A2430;
    --cinza:#5B6B7A;
    --cinza-claro:#E1E7EE;
    --cinza-bg:#F5F7FA;
    --chip-bg:#F0F1F3;
    --chip-color:#6B7280;
    --branco:#FFFFFF;
    --trigo:#C9862B;
    --alerta:#C0432B;
    --alerta-bg:#FBEAE6;
    --ok-bg:#E3F1EA;
    --bom:#008C31;
    --bom-bg:#DFF6E8;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,42,74,0.04), 0 8px 24px rgba(15,42,74,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--cinza-bg);
    color:var(--grafite);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--verde-claro); color:var(--verde-escuro);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  .app{display:flex; flex-direction:column; height:100vh; overflow:hidden;}
  /* ---------- TOPBAR + TABSROW ---------- */
  .topbar{background:var(--verde-escuro); padding:0 28px; display:flex; align-items:center; gap:20px; height:60px; flex-shrink:0;}
  .brand{display:flex; align-items:center; gap:10px; color:#fff;}
  .brand-mark{width:26px; height:26px; flex-shrink:0;}
  .brand-name{font-family:'Fraunces',serif; font-weight:700; font-size:18px; letter-spacing:0.2px;}
  .topbar-user{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .topbar-user-nome{color:rgba(255,255,255,0.85); font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px;}
  .avatar{width:28px; height:28px; border-radius:50%; background:var(--verde-vivo); color:#0B2318; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;}
  .btn-sair{background:rgba(255,255,255,0.1); border:none; color:#fff; padding:7px 11px; border-radius:8px; font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .btn-sair:hover{background:rgba(255,255,255,0.2);}
  .btn-pendencias{
    background:rgba(201,138,43,0.16); border:1px solid rgba(201,138,43,0.4); color:#8A5A12;
    padding:7px 11px; border-radius:8px; font-size:11.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .btn-pendencias:hover{background:rgba(201,138,43,0.26);}
  .tabsrow{background:var(--branco); border-bottom:1px solid var(--cinza-claro); display:flex; gap:6px; padding:10px 20px; overflow-x:auto; flex-shrink:0;}
  .nav-item{display:flex; align-items:center; gap:7px; font-family:'Inter',sans-serif; font-size:13px; font-weight:700; color:var(--cinza); background:none; border:none; padding:9px 14px; border-radius:10px; cursor:pointer; white-space:nowrap; transition:background 0.12s, color 0.12s;}
  .nav-item svg{opacity:0.72; flex-shrink:0;}
  .nav-item:hover{background:var(--cinza-bg); color:var(--verde-escuro);}
  .nav-item.active{background:var(--verde-vivo); color:#0B2318;}
  .nav-item.active svg{opacity:1;}
  /* ---------- MAIN ---------- */
  .main{flex:1; padding:28px 32px 60px 32px; max-width:1280px; width:100%; margin:0 auto; overflow-y:auto;}
  .page-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--verde-medio); font-weight:700; margin:0 0 4px 0;}
  h1{font-family:'Fraunces',serif; font-size:26px; font-weight:700; margin:0; color:var(--grafite); letter-spacing:-0.2px;}
  .page-desc{color:var(--cinza); font-size:13.5px; margin-top:6px; max-width:600px;}
  .btn{
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700; padding:10px 18px; border-radius:10px;
    border:none; cursor:pointer; transition:filter 0.15s, transform 0.1s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--verde-vivo); outline-offset:2px;}
  .btn-primary{background:var(--verde-vivo); color:#0B2318;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:var(--branco); color:var(--verde-escuro); border:1px solid var(--cinza-claro);}
  .btn-ghost:hover{background:var(--cinza-bg);}
  .btn-danger-ghost{background:var(--branco); color:var(--alerta); border:1px solid var(--cinza-claro); padding:6px 10px; font-size:12px;}
  .btn-danger-ghost:hover{background:var(--alerta-bg);}
  .btn-sm{padding:7px 13px; font-size:12.5px;}
  .link-nome{background:none; border:none; padding:0; margin:0; font:inherit; font-weight:600; color:var(--verde-escuro); cursor:pointer; text-align:left;}
  .link-nome:hover{color:var(--verde-vivo-escuro); text-decoration:underline;}

  .cadastro-opcoes{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
  @media (max-width:640px){.cadastro-opcoes{grid-template-columns:1fr;}}
  .cadastro-opcao{
    display:flex; flex-direction:column; align-items:flex-start; gap:12px;
    text-align:left; background:var(--branco); border:1px solid var(--cinza-claro);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:30px 26px;
    cursor:pointer; font-family:inherit; transition:border-color .15s, transform .15s;
    min-height:100px;
  }
  .cadastro-opcao:hover{border-color:var(--verde-vivo); transform:translateY(-2px);}
  .cadastro-opcao-icone{
    display:flex; align-items:center; justify-content:center; width:58px; height:58px;
    border-radius:50%; background:var(--verde-claro); color:var(--verde-escuro); flex-shrink:0;
  }
  .cadastro-opcao-titulo{font-size:19px; font-weight:700; color:var(--verde-escuro);}
  .cadastro-opcao-desc{font-size:14.5px; color:var(--cinza); line-height:1.55;}

  .manejo-acoes-check{display:flex; flex-wrap:wrap; gap:10px 20px; margin-top:8px;}
  .manejo-check{display:flex; align-items:center; gap:9px; font-size:15px; font-weight:500; color:var(--grafite); cursor:pointer; padding:6px 0;}
  .manejo-check input{width:22px; height:22px; accent-color:var(--verde-vivo); flex-shrink:0;}
  .manejo-topbar{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  /* Telas de Manejo/Cadastro são feitas pra bater no curral, com o celular
     na mão -- campos e botões maiores que o resto do app, pra não errar o
     toque nem precisar dar zoom. */
  .campo-grande label{font-size:14.5px;}
  .campo-grande input, .campo-grande select{font-size:19px; padding:15px 14px; border-radius:10px; font-weight:600;}
  .btn-lg{font-size:16px; padding:16px 22px; border-radius:12px;}

  .card{background:var(--branco); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--cinza-claro); overflow-x:auto;}
  .card-pad{padding:22px 24px;}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  .stat-card{background:var(--branco); border:1px solid var(--cinza-claro); border-radius:var(--radius); padding:18px 20px;}
  .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:0.7px; color:var(--cinza); font-weight:700;}
  .stat-value{font-family:'IBM Plex Mono',monospace; font-size:23px; font-weight:600; color:var(--grafite); margin-top:8px; font-variant-numeric:tabular-nums;}
  .stat-value.alerta{color:var(--alerta);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--cinza); font-weight:700; padding:13px 14px; border-bottom:1px solid var(--cinza-claro); white-space:nowrap;}
  td{padding:13px 14px; border-bottom:1px solid var(--cinza-claro); color:var(--grafite); vertical-align:middle; font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background 0.12s ease;}
  tbody tr:hover td{background:var(--cinza-bg);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .pill{display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;}
  .pill-ok{background:var(--ok-bg); color:var(--verde-vivo-escuro);}
  .pill-alerta{background:var(--alerta-bg); color:var(--alerta);}
  .pill-cat{background:var(--chip-bg); color:var(--chip-color); border-radius:8px; font-weight:600;}
  .pill-warn{background:#F3E7D4; color:var(--trigo);}

  /* silo gauge */
  .silo-wrap{display:flex; align-items:center; gap:8px;}
  .silo{
    width:14px; height:30px;
    border:1.5px solid var(--verde-escuro);
    border-radius:3px;
    position:relative;
    overflow:hidden;
    background:var(--cinza-claro);
    flex-shrink:0;
  }
  .silo-fill{
    position:absolute; bottom:0; left:0; right:0;
    background:var(--verde-medio);
  }
  .silo-fill.alerta{background:var(--alerta);}

  /* form modal */
  @keyframes overlayIn{from{opacity:0;} to{opacity:1;}}
  @keyframes modalIn{from{opacity:0; transform:translateY(10px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  .overlay{position:fixed; inset:0; background:rgba(23,61,46,0.4); display:flex; align-items:flex-start; justify-content:center; padding:50px 20px; overflow-y:auto; z-index:50; animation:overlayIn 0.15s ease-out;}
  .modal{background:var(--branco); border-radius:16px; width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,0.25); animation:modalIn 0.22s cubic-bezier(0.16,1,0.3,1);}
  .modal-head{padding:20px 24px; border-bottom:1px solid var(--cinza-claro); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h3{font-family:'Fraunces',serif; font-size:18px; margin:0; color:var(--grafite);}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--cinza);font-size:20px; line-height:1;}
  .modal-body{padding:22px 24px; display:flex; flex-direction:column; gap:14px; max-height:70vh; overflow-y:auto;}
  .modal-foot{padding:16px 24px; border-top:1px solid var(--cinza-claro); display:flex; justify-content:flex-end; gap:10px;}
  .field{display:flex; flex-direction:column; gap:5px; min-width:0;}
  /* max-width (não só min-width/width) porque o input[type=date] do Safari
     (iOS) ignora min-width/width dentro de grid/flex e usa a largura
     "natural" dele -- que muda de tamanho com o formato de data por
     extenso do idioma ("1 de set. de 2026" é bem mais largo que
     09/01/2026) -- e estoura pra fora da caixa, empurrando/sobrepondo o
     campo vizinho. max-width é a propriedade que o Safari respeita pra
     essa caixa em particular. */
  .field select, .field input:not([type="checkbox"]):not([type="radio"]){min-width:0; width:100%; max-width:100%;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  label{font-size:12px; font-weight:600; color:var(--grafite);}
  input, select, textarea{font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 12px; border:1px solid var(--cinza-claro); border-radius:9px; background:var(--branco); color:var(--grafite); outline:none; width:100%;}
  input:focus, select:focus, textarea:focus{border-color:var(--verde-vivo); box-shadow:0 0 0 3px rgba(0,190,94,0.14);}
  .hint{font-size:11px; color:var(--cinza);}
  .composicao-row{
    display:grid; grid-template-columns: 1fr 90px 32px; gap:8px; align-items:center;
  }
  .total-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; border-radius:8px; background:var(--cinza-bg); font-size:13px;
  }
  .total-bar.ok{color:var(--verde-vivo-escuro); font-weight:600;}
  .total-bar.warn{color:var(--trigo); font-weight:600;}

  .empty{text-align:center; padding:50px 20px; color:var(--cinza);}
  .empty h4{font-family:'Fraunces',serif; color:var(--grafite); margin:10px 0 6px 0; font-size:16px;}
  .diet-card{
    border:1px solid var(--cinza-claro); border-radius:var(--radius); margin-bottom:14px; overflow:hidden;
    transition:box-shadow 0.2s;
  }
  .diet-head{
    padding:16px 20px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; background:var(--branco); transition:background 0.15s;
  }
  .diet-head:hover{background:var(--cinza-bg);}
  .diet-title{font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; color:var(--verde-escuro);}
  .diet-sub{font-size:12px; color:var(--cinza); margin-top:2px;}
  .diet-metrics{display:flex; gap:22px;}
  .diet-metric{text-align:right;}
  .diet-metric .v{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--verde-escuro); font-size:14px;}
  .diet-metric .l{font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--cinza);}
  .diet-body{padding:0 20px 18px 20px; border-top:1px solid var(--cinza-claro); background:var(--cinza-bg);}
  .chev{transition:transform 0.15s;}
  .chev.open{transform:rotate(180deg);}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
  .search{display:flex; align-items:center; gap:8px; background:var(--branco); border:1px solid var(--cinza-claro); border-radius:10px; padding:9px 13px; width:260px;}
  .search input{border:none; padding:0; flex:1;}
  .search input:focus{box-shadow:none;}

  /* sub-abas dentro de um grupo (ex: Ingredientes / Estoque) */
  .subtabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
  .subtab{font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--cinza); background:var(--branco); border:1px solid var(--cinza-claro); padding:8px 14px; border-radius:20px; cursor:pointer; white-space:nowrap;}
  .subtab:hover{color:var(--verde-escuro);}
  .subtab.active{color:#fff; background:var(--verde-escuro); border-color:var(--verde-escuro);}

  /* botão flutuante de ação rápida */
  .fab-wrap{position:fixed; bottom:28px; right:28px; z-index:60; display:flex; flex-direction:column; align-items:flex-end; gap:10px;}
  .fab-btn{
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:var(--verde-vivo); color:#0B2318; font-size:26px; line-height:1;
    box-shadow:0 8px 24px rgba(23,61,46,0.3), 0 2px 8px rgba(0,190,94,0.3);
    transition:filter 0.15s, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .fab-btn:hover{filter:brightness(1.06); transform:translateY(-2px) rotate(90deg); box-shadow:0 10px 30px rgba(23,61,46,0.38), 0 3px 10px rgba(0,190,94,0.35);}
  .fab-btn:active{transform:scale(0.94);}
  .fab-menu{
    display:flex; flex-direction:column; gap:6px; background:var(--branco);
    border:1px solid var(--cinza-claro); border-radius:12px; padding:10px; box-shadow:var(--shadow);
  }
  .fab-menu-item{
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; text-align:left;
    padding:10px 14px; border-radius:8px; border:none; background:none; cursor:pointer;
    color:var(--verde-escuro); white-space:nowrap;
  }
  .fab-menu-item:hover{background:var(--cinza-bg);}

  /* seletor de nota da leitura de cocho */
  .nota-picker{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .nota-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:12px 6px; border-radius:8px; border:1.5px solid var(--cinza-claro); background:var(--branco);
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .nota-btn .n{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; color:var(--verde-escuro);}
  .nota-btn .l{font-size:10.5px; color:var(--cinza); text-align:center; line-height:1.3;}
  .nota-btn.active{border-color:var(--verde-vivo); background:var(--ok-bg);}

  /* painel de resultados (gráfico de rosca + legenda) */
  .painel-resultados{display:flex; gap:32px; align-items:center; flex-wrap:wrap;}
  .donut-wrap{flex-shrink:0;}
  .donut-svg{display:block;}
  .donut-slice{cursor:pointer; transition:opacity 0.15s;}
  .donut-slice:hover, .donut-slice.hover{opacity:0.82;}
  .donut-slice:focus{outline:2px solid var(--verde-vivo); outline-offset:2px;}
  .donut-label{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; fill:#fff; pointer-events:none;}
  .donut-center-value{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; fill:var(--verde-escuro);}
  .donut-center-label{font-family:'Inter',sans-serif; font-size:10px; fill:var(--cinza); text-transform:uppercase; letter-spacing:0.5px;}
  .painel-legenda{flex:1; min-width:260px; display:flex; flex-direction:column; gap:2px;}
  .legenda-row{
    display:grid; grid-template-columns:12px 1fr auto auto; align-items:center; gap:10px;
    padding:7px 8px; border-radius:6px; cursor:pointer;
  }
  .legenda-row:hover, .legenda-row.hover{background:var(--cinza-bg);}
  .legenda-swatch{width:12px; height:12px; border-radius:3px;}
  .legenda-nome{font-size:13px; color:var(--grafite);}
  .legenda-valor{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--grafite); font-variant-numeric:tabular-nums;}
  .legenda-pct{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--cinza); min-width:48px; text-align:right; font-variant-numeric:tabular-nums;}
  .painel-tooltip{
    position:fixed; pointer-events:none; z-index:80; display:none; max-width:220px;
    background:var(--verde-escuro); color:#fff; padding:8px 12px; border-radius:8px;
    font-size:12.5px; box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .painel-tooltip .v{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;}
  .painel-tooltip .l{font-size:11px; color:rgba(255,255,255,0.75); margin-top:2px;}

  /* ---------- DEMONSTRATIVO DESPESA x RECEITA ---------- */
  .demonstrativo-bars{display:flex; flex-direction:column; gap:14px; margin-bottom:18px;}
  .demo-bar-row{display:grid; grid-template-columns:70px 1fr 120px; align-items:center; gap:12px;}
  .demo-bar-label{font-size:12px; font-weight:600; color:var(--cinza); text-transform:uppercase; letter-spacing:0.5px;}
  .demo-bar-track{background:var(--cinza-claro); border-radius:20px; height:14px; overflow:hidden;}
  .demo-bar-fill{height:100%; border-radius:20px; transition:width 0.3s;}
  .demo-bar-despesa{background:var(--cinza);}
  .demo-bar-receita{background:var(--bom);}
  .demo-bar-valor{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--grafite); text-align:right; font-variant-numeric:tabular-nums;}
  .demo-resultado{
    display:flex; align-items:center; gap:10px; padding:14px 18px; border-radius:var(--radius);
  }
  .demo-resultado-ok{background:var(--bom-bg); color:var(--bom);}
  .demo-resultado-critico{background:var(--alerta-bg); color:var(--alerta);}
  .demo-resultado-icone{font-size:16px; line-height:1;}
  .demo-resultado-label{font-size:13px; font-weight:600; flex:1;}
  .demo-resultado-valor{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700;}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--cinza-bg);}
  .login-card{background:var(--branco); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.12); border:1px solid var(--cinza-claro); padding:40px 36px; width:100%; max-width:360px; animation:modalIn 0.28s cubic-bezier(0.16,1,0.3,1);}
  .login-brand{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
  .login-brand .brand-name{color:var(--grafite); font-family:'Fraunces',serif; font-weight:700; font-size:19px;}
  .login-field{margin-bottom:16px; display:flex; flex-direction:column; gap:5px;}
  .login-field input{width:100%;}
  .login-error{background:var(--alerta-bg); color:var(--alerta); font-size:13px; padding:10px 12px; border-radius:9px; margin-bottom:16px;}
  .login-btn{width:100%; margin-top:6px; justify-content:center;}

/* ===================== SUPABASE ===================== */

// unificação. Antes eram dois projetos Supabase separados, o que obrigava
// cada pessoa a ter dois logins e exigia policies de leitura anônima para
// um app enxergar os dados do outro. Agora é um login só e as policies
// abertas foram removidas.
const db = supabase.createClient(
  'https://kmkystqgpvmzrccxvyaz.supabase.co',
  'sb_publishable_YclssD8pzNZhWO_Om0anMg_SwaZHQOa'
);

// dbLavoura era o cliente extra que lia o projeto do Lavoura de fora. Não
// existe mais: as tabelas de lá (fazendas, fazenda_atividades) agora estão
// no mesmo banco e são lidas pelo próprio db, com sessão autenticada.
const dbLavoura = db;

function rowToIngrediente(r){ return {id:r.id, nome:r.nome, categoria:r.categoria, fornecedor:r.fornecedor, unidade:r.unidade, ms:r.ms, pb:r.pb, ndt:r.ndt, precoKg:r.preco_kg, estoqueMin:r.estoque_min, obs:r.obs||''}; }
function ingredienteToRow(i){ return {nome:i.nome, categoria:i.categoria, fornecedor:i.fornecedor, unidade:i.unidade, ms:i.ms, pb:i.pb, ndt:i.ndt, preco_kg:i.precoKg, estoque_min:i.estoqueMin, obs:manter(i.obs)}; }
function rowToMovimento(r){ return {id:r.id, data:r.data, ingredienteId:r.ingrediente_id, tipo:r.tipo, quantidade:r.quantidade, precoKg:r.preco_kg, ajuste:!!r.ajuste}; }
function movimentoToRow(m){ return {data:m.data, ingrediente_id:m.ingredienteId, tipo:m.tipo, quantidade:m.quantidade, preco_kg:m.precoKg||null, ajuste:!!m.ajuste}; }
function rowToDieta(r){ return {id:r.id, nome:r.nome, categoriaAnimal:r.categoria_animal, kgAnimalDia:r.kg_animal_dia, itens:r.itens||[], tipo:r.tipo||'confinamento', estoqueMinPronta:r.estoque_min_pronta||0, consumoDireto:!!r.consumo_direto}; }
function dietaToRow(d){ return {nome:d.nome, categoria_animal:d.categoriaAnimal, kg_animal_dia:d.kgAnimalDia, itens:d.itens, tipo:d.tipo||'confinamento', estoque_min_pronta:d.estoqueMinPronta||0, consumo_direto:!!d.consumoDireto}; }

function loteToRow(l){ return {nome:l.nome, numero_animais:l.numeroAnimais, data_inicio:l.dataInicio, data_fim:l.dataFim||null, destino:l.destino, dieta_id:l.dietaId||null, sexo:l.sexo||null}; }
function rowToSaidaRacao(r){ return {id:r.id, data:r.data, dietaId:r.dieta_id, loteId:r.lote_id, quantidadeKg:r.quantidade_kg, criadoPor:r.criado_por||'', criadoEm:r.criado_em||null}; }
function rowToLeituraCocho(r){ return {id:r.id, data:r.data, loteId:r.lote_id, nota:r.nota, observacao:r.observacao||'', criadoPor:r.criado_por||''}; }
function leituraCochoToRow(l){ return {data:l.data, lote_id:l.loteId, nota:l.nota, observacao:l.observacao||''}; }
function rowToPasto(r){ return {id:r.id, data:r.data, loteId:r.lote_id, dietaId:r.dieta_id, quantidade:r.quantidade, criadoPor:r.criado_por||''}; }
/* ===================== UPDATE PARCIAL SEM APAGAR O QUE NAO ESTA NA TELA
 * Varias telas montam o objeto de salvamento SO com os campos do
 * formulario. Quando o toRow escreve `campo: x.campo || null`, um campo que
 * o formulario nao tem vira null no banco - e o dado some sem ninguem
 * pedir.
 *
 * Foi o que acontecia com manejo_id: editar uma pesagem ou uma inseminacao
 * pelas telas de Confinamento/Cria desfazia o vinculo com o Manejo, e a
 * planilha do manejo passava a mostrar "-" em todas as linhas, apesar dos
 * pesos individuais continuarem gravados. Sem tela nenhuma para refazer o
 * vinculo: perda permanente.
 *
 * `manter` devolve undefined quando o campo nao foi informado. O
 * supabase-js serializa em JSON, e JSON.stringify descarta chaves com
 * undefined - entao a coluna simplesmente NAO entra no update e o banco
 * preserva o que ja tinha. Informar null continua apagando de proposito. */
function manter(valor){ return valor === undefined ? undefined : (valor || null); }

function rowToReproducaoCusto(r){ return {id:r.id, data:r.data, loteId:r.lote_id, numeroVaca:r.numero_vaca||'', racaTouro:r.raca_touro||'', qualInseminacao:r.qual_inseminacao||'', item:r.item, custo:r.custo, criadoPor:r.criado_por||'', manejoId:r.manejo_id||null}; }
function reproducaoCustoToRow(r){ return {data:r.data, lote_id:r.loteId, numero_vaca:r.numeroVaca, raca_touro:r.racaTouro, qual_inseminacao:r.qualInseminacao, custo:r.custo, manejo_id:manter(r.manejoId)}; }
function rowToDiagnostico(r){ return {id:r.id, data:r.data, loteId:r.lote_id, numeroVaca:r.numero_vaca||'', resultado:r.resultado, previsaoParto:r.previsao_parto||'', criadoPor:r.criado_por||'', manejoId:r.manejo_id||null}; }
function diagnosticoToRow(d){ return {data:d.data, lote_id:d.loteId, numero_vaca:d.numeroVaca, resultado:d.resultado, previsao_parto: d.resultado==='prenha' ? (d.previsaoParto||null) : null, manejo_id:manter(d.manejoId)}; }
function rowToParto(r){ return {id:r.id, data:r.data, loteId:r.lote_id, numeroMae:r.numero_mae, sexoBezerro:r.sexo_bezerro, racaBezerro:r.raca_bezerro, criadoPor:r.criado_por||''}; }
function partoToRow(p){ return {data:p.data, lote_id:p.loteId, numero_mae:p.numeroMae, sexo_bezerro:p.sexoBezerro, raca_bezerro:p.racaBezerro||null}; }
function rowToDesmama(r){ return {id:r.id, partoId:r.parto_id, data:r.data, raca:r.raca||'', pesoKg:r.peso_kg, criadoPor:r.criado_por||'', manejoId:r.manejo_id||null}; }
function desmamaToRow(d){ return {parto_id:d.partoId, data:d.data, raca:d.raca, peso_kg:d.pesoKg, manejo_id:manter(d.manejoId)}; }
function rowToManejo(r){ return {id:r.id, data:r.data, loteId:r.lote_id, loteDestinoId:r.lote_destino_id||null, acoes:r.acoes||[], vacinacao:!!r.vacinacao, vermifugacao:!!r.vermifugacao, status:r.status||'aberto', totalAnimais:r.total_animais||0, criadoPor:r.criado_por||''}; }
function manejoToRow(m){ return {data:m.data, lote_id:m.loteId, lote_destino_id:m.loteDestinoId||null, acoes:m.acoes||[], vacinacao:!!m.vacinacao, vermifugacao:!!m.vermifugacao, status:m.status||'aberto', total_animais:m.totalAnimais||0}; }
function rowToProtocoloInseminacao(r){ return {id:r.id, manejoId:r.manejo_id, loteId:r.lote_id, numeroAnimal:r.numero_animal, data:r.data, criadoPor:r.criado_por||''}; }
function protocoloInseminacaoToRow(p){ return {manejo_id:p.manejoId, lote_id:p.loteId, numero_animal:p.numeroAnimal, data:p.data}; }
function rowToAnimal(r){ return {id:r.id, numero:r.numero, loteId:r.lote_id, sexo:r.sexo||'', raca:r.raca||'', status:r.status||'ativo', dataMorte:r.data_morte||null, criadoPor:r.criado_por||''}; }
function animalToRow(a){ return {numero:a.numero, lote_id:a.loteId, sexo:a.sexo||null, raca:a.raca||null}; }
// Animal já cadastrado com esse número. O número SOZINHO não identifica o
// animal -- pode haver macho e fêmea com o mesmo número (são dois animais
// diferentes que por acaso repetem o número do brinco). Passe sexo pra
// achar só o desse sexo; sem sexo, acha qualquer um com esse número (uso
// só informativo -- nunca pra decidir se é "o mesmo" animal antes de
// gravar, isso é o que causava a troca de sexo/lote de um animal por outro
// só porque compartilhavam número).
function animalCadastrado(numero, sexo){
  const numeroNorm = String(numero||'').trim();
  if(!numeroNorm) return null;
  return state.animais.find(a=>a.numero.toLowerCase()===numeroNorm.toLowerCase() && (!sexo || a.sexo===sexo)) || null;
}
// Raça já conhecida desse número+sexo, se ele já tiver cadastro -- usado pra
// pré-preencher o campo de raça nos formulários que referenciam um animal
// (Inseminação, Diagnóstico, Parto), sem obrigar redigitar o que já se sabe.
function racaConhecida(numero, sexo){
  const a = animalCadastrado(numero, sexo);
  return a ? (a.raca||'') : '';
}
// Todo lançamento que referencia um número de animal (Inseminação,
// Diagnóstico, Parto, Pesagem individual, Nova entrada de animais) precisa
// ou já ter o animal (nesse número+sexo) cadastrado, ou informar sexo+raça
// ali mesmo -- não dá pra criar um cadastro pela metade nem duplicar.
// Retorna null se pode prosseguir, ou a mensagem de erro pra mostrar (e
// bloquear o lançamento inteiro, não só o cadastro do animal).
function validarAnimalNovo(numero, sexo, raca){
  const numeroNorm = String(numero||'').trim();
  if(!numeroNorm) return null; // sem número aqui -- quem valida isso é validarObrigatorios
  if(animalCadastrado(numeroNorm, sexo)) return null; // já existe esse número+sexo, upsertAnimal só atualiza
  if(!sexo || !raca) return `O animal número ${numeroNorm} ainda não está cadastrado. Informe sexo e raça dele antes de lançar.`;
  return null;
}
// Cadastra ou move um animal pro lote informado, por número+sexo -- número
// sozinho NÃO é único na fazenda (pode repetir entre macho e fêmea), então
// a identidade do animal é o par número+sexo: se já existir um animal com
// esse número+sexo, só atualiza o lote (e raça, quando informada); senão,
// cria um cadastro novo -- nunca funde um macho e uma fêmea que só
// coincidem no número.
// Usado pelos ganchos em outros lançamentos (Nova entrada de animais,
// Nova inseminação, Peso por animal) -- não existe cadastro direto de
// animal, só edição de um que já foi criado por um desses ganchos.
// criadosNestaLeva (opcional) é uma lista local passada pelo chamador
// quando vários números são processados em série na MESMA operação (ex:
// colar vários números de uma vez) -- sem isso, dois números iguais na
// mesma leva criariam dois cadastros, porque state.animais só é atualizado
// depois que TUDO termina e a tela recarrega (loadAll), não a cada
// iteração do laço.
async function upsertAnimal(numero, loteId, extra, criadosNestaLeva){
  const numeroNorm = String(numero||'').trim();
  if(!numeroNorm) return {error:null};
  extra = extra || {};
  const jaNestaLeva = criadosNestaLeva && criadosNestaLeva.find(a=>a.numero.toLowerCase()===numeroNorm.toLowerCase() && (!extra.sexo || a.sexo===extra.sexo));
  if(!extra.sexo && !jaNestaLeva){
    // Sem sexo informado pra desambiguar: se esse número já existe em MAIS
    // DE UM sexo, animalCadastrado(numero) (sem sexo) acharia um dos dois
    // às cegas -- teria fundido o cadastro errado. Bloqueia nesse caso em
    // vez de arriscar.
    const sexosDistintos = new Set(
      state.animais.filter(a=>a.numero.toLowerCase()===numeroNorm.toLowerCase()).map(a=>a.sexo||'?')
    );
    if(sexosDistintos.size > 1){
      return {error:{message:`Existe mais de um animal ${numeroNorm} cadastrado (sexos diferentes) -- informe o sexo pra confirmar qual é.`}};
    }
  }
  const existente = jaNestaLeva || animalCadastrado(numeroNorm, extra.sexo);
  const row = {numero: numeroNorm, lote_id: loteId};
  if(extra.sexo) row.sexo = extra.sexo;
  if(extra.raca) row.raca = extra.raca;
  if(existente){
    return await db.from('animais').update(row).eq('id', existente.id);
  }
  if(!extra.sexo || !extra.raca){
    return {error:{message:`O animal ${numeroNorm} ainda não está cadastrado -- informe sexo e raça antes de lançar.`}};
  }
  const res = await db.from('animais').insert({...row, criado_por:autorAtual()}).select().single();
  if(!res.error && criadosNestaLeva) criadosNestaLeva.push({numero:numeroNorm, id:res.data?.id, sexo:extra.sexo});
  return res;
}
// "128, 129 130\n131" -> ['128','129','130','131'] -- aceita vírgula, espaço
// ou linha como separador, pra não exigir um formato rígido de digitação.
function parseNumerosAnimais(texto){
  return String(texto||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
}
function rowToPesagem(r){ return {id:r.id, data:r.data, loteId:r.lote_id, pesoMedioKg:r.peso_medio_kg, observacao:r.observacao||'', criadoPor:r.criado_por||'', manejoId:r.manejo_id||null}; }
function pesagemToRow(p){ return {data:p.data, lote_id:p.loteId, peso_medio_kg:p.pesoMedioKg, observacao:p.observacao||'', manejo_id:manter(p.manejoId)}; }
function rowToPesagemAnimal(r){ return {id:r.id, pesagemId:r.pesagem_id, numeroAnimal:r.numero_animal, pesoKg:r.peso_kg}; }
function rowToProducaoRacao(r){ return {id:r.id, data:r.data, dietaId:r.dieta_id, quantidadeKg:r.quantidade_kg, criadoPor:r.criado_por||''}; }
function producaoRacaoToRow(p){ return {data:p.data, dieta_id:p.dietaId, quantidade_kg:p.quantidadeKg}; }
// Guardado na tabela "abates" (nome antigo, de quando só existia venda por
// abate) — mantido por já estar em produção; agora cobre qualquer venda de
// animais (abate por @, por animal ou por kg vivo), diferenciada por tipoVenda.
function rowToVenda(r){ return {id:r.id, data:r.data, loteId:r.lote_id, quantidade:r.quantidade, tipoVenda:r.tipo_venda||'arroba', pesoMedioKg:r.peso_medio_kg, valorArroba:r.valor_arroba, valorPorAnimal:r.valor_por_animal, valorKg:r.valor_kg, categoria:r.categoria||'', sexo:r.sexo||'', observacao:r.observacao||'', criadoPor:r.criado_por||''}; }
function vendaToRow(v){ return {data:v.data, lote_id:v.loteId, quantidade:v.quantidade, tipo_venda:v.tipoVenda||'arroba', peso_medio_kg:v.pesoMedioKg||null, valor_arroba:v.valorArroba||null, valor_por_animal:v.valorPorAnimal||null, valor_kg:v.valorKg||null, categoria:v.categoria||null, sexo:v.sexo||null, observacao:v.observacao||''}; }
function rowToPrecoArroba(r){ return {id:r.id, data:r.data, valor:r.valor, sexo:r.sexo||'macho'}; }
function precoArrobaToRow(p){ return {data:p.data, valor:p.valor, sexo:p.sexo||'macho'}; }
// Sugestões de centro de custo e fornecedor pra preencher os datalists dos
// campos de Despesa/Investimento -- lista inicial vem de um comparativo com
// o plano de contas real da fazenda (ERP Conag), pra já nascer com opções
// consistentes; qualquer nome novo digitado pelo usuário some pra lista viva
// via fornecedoresConhecidos()/centrosCustoConhecidos() abaixo.
const CENTROS_CUSTO_SUGERIDOS = [
  'Armazenagem & Logística', 'Combustíveis da Operação Agropecuária', 'Custas Contratuais',
  'Despesas com a Casa-Sede', 'Despesas com Instalações', 'Despesas com Veículos',
  'Energia Elétrica de Infraestrutura Operacional', 'Insumos Agrícolas', 'Insumos Pecuários',
  'Manutenção de Tratores, Caminhões, Máquinas, Equipamentos e Implementos',
  'Manutenção e Reparo de Infraestruturas', 'Mão-de-obra de Operacional',
  'Refeitório, Restaurantes & Alimentação', 'Serviços Profissionais',
  'Serviços Técnicos Profissionais (Consultorias de Campo)',
  'Terceirização de Serviços Agropecuários', 'Tributos e Contribuições',
];
const CENTROS_CUSTO_INVESTIMENTO_SUGERIDOS = ['Investimento em Animais', 'Investimento em Ativos'];
function fornecedoresConhecidos(){
  const vistos = new Set();
  state.custosFixos.forEach(c=>{ if(c.fornecedor) vistos.add(c.fornecedor); });
  state.investimentos.forEach(i=>{ if(i.fornecedor) vistos.add(i.fornecedor); });
  return [...vistos].sort((a,b)=>a.localeCompare(b));
}
function centrosCustoConhecidos(){
  const vistos = new Set(CENTROS_CUSTO_SUGERIDOS);
  state.custosFixos.forEach(c=>{ if(c.categoria) vistos.add(c.categoria); });
  return [...vistos].sort((a,b)=>a.localeCompare(b));
}
function centrosCustoInvestimentoConhecidos(){
  const vistos = new Set(CENTROS_CUSTO_INVESTIMENTO_SUGERIDOS);
  state.investimentos.forEach(i=>{ if(i.categoria) vistos.add(i.categoria); });
  return [...vistos].sort((a,b)=>a.localeCompare(b));
}
// Fazenda agora é cadastrada só no AE Matriz (tabela fazendas do projeto do
// Lavoura). Este app só lê fazenda_atividades filtrando atividade='pecuaria'
// — cada linha já é a área de pecuária daquela fazenda (não a área total
// dela), o que permite integração lavoura-pecuária (mesma área contando
// como pasto E como lavoura no Matriz) sem inflar o hectare aqui. area_ha
// vira "hectares" pra não precisar mexer no resto do código que já usa
// esse nome de campo.
function rowToFazenda(r){ return {id:r.fazenda_id, nome:r.fazendas?.nome||'', hectares:r.area_ha}; }
function rowToPerfil(r){ return {id:r.id, nome:r.nome, usuario:r.usuario, papel:r.papel, permissoes:r.permissoes||{}, ativo:r.ativo}; }

/* O .range(0, 19999) que estava aqui era um TETO, nao paginacao: pedia as
 * 20.000 primeiras de uma vez. Duas falhas.
 *
 * A primeira: o PostgREST tem um limite proprio de linhas por resposta
 * (db-max-rows, 1000 por padrao nos projetos Supabase) que vale
 * INDEPENDENTEMENTE do Range pedido. Se esse limite ainda estiver no padrao,
 * o corte silencioso que o comentario abaixo descreve continua acontecendo.
 *
 * A segunda: 20.000 e um teto fixo. movimentos ganha uma linha por
 * ingrediente a cada trato de dieta de consumo direto, e pesagens_animais
 * uma por animal pesado - as duas alcancam esse numero em poucos anos, e
 * dali em diante o app passaria a somar errado sem avisar.
 *
 * Paginando de verdade, os dois problemas somem: pede de mil em mil ate a
 * resposta vir incompleta, que e o sinal de que acabou. */
async function buscarTudo(consulta){
  const PAGINA = 1000;
  let todas = [], de = 0;
  while(true){
    const { data, error } = await consulta().range(de, de + PAGINA - 1);
    if(error) return { data: todas, error };
    todas = todas.concat(data || []);
    if(!data || data.length < PAGINA) break;
    de += PAGINA;
  }
  return { data: todas, error: null };
}

async function loadAll(){
  // .range() é obrigatório em toda consulta -- sem ele, o Supabase corta a
  // resposta em 1000 linhas por padrão (a API nem avisa, só devolve as 1000

  // passa de 1000 linhas com o tempo, isso fazia lançamentos novos (com o
  // id mais alto) somem simplesmente por ficarem de fora desse corte --
  // pareciam "não salvar", mas na verdade só não voltavam na consulta.

// render() substitui o innerHTML inteiro a cada mudança de estado -- inclusive
// pra coisas pequenas tipo abrir/fechar um grupo de movimentações ou o painel
// de uma dieta. Trocar o DOM inteiro sem cuidado faz o navegador perder a
// âncora de scroll e pular a tela pro topo (bug reportado: clicar na setinha
// pra expandir "sobe" a tela). Guardamos a página renderizada por último pra
// saber se é uma navegação de verdade (aí sim volta pro topo) ou só uma
// atualização na mesma página (aí mantém o scroll onde a pessoa estava).
let ultimaPaginaRenderizada = null;
function render(){
  const root = document.getElementById('root');
  const scrollY = window.scrollY;
  // No desktop quem rola é a .main interna (overflow-y:auto), não a janela
  // -- só no mobile (≤760px) o .app vira overflow:visible e a janela passa
  // a rolar. Guardamos os dois; o innerHTML troca a .main inteira, então
  // depois do render precisamos reencontrar a NOVA .main e restaurar nela.
  const mainScrollTop = document.querySelector('.main')?.scrollTop || 0;
  const mesmaPagina = ultimaPaginaRenderizada === state.page;

  if(!state.authChecked){
    root.innerHTML = `<div class="login-loading">Carregando...</div>`;
    return;
  }
  if(!state.session){
    root.innerHTML = LoginPage();
    attachEvents();
    return;
  }
  if(!state.perfil || !state.perfil.ativo){
    root.innerHTML = AguardandoLiberacao();
    attachEvents();
    return;
  }

  const grupos = gruposVisiveis();
  const semModulos = grupos.length===0;
  // Página restrita (soAdmin) e o perfil não é proprietário/admin -- pode
  // acontecer se o papel mudar (ou for rebaixado) enquanto essa página
  // ainda está aberta; redireciona pra primeira página permitida.
  if(!semModulos && !paginaVisivel(GROUPS[currentGroupKey()]?.pages.find(p=>p.key===state.page) || {})){
    state.page = primeiraPaginaVisivel();
  }
  // Se qualquer Page/Modal explodir (erro de JS), melhor mostrar o erro e
  // deixar a navegação (Topbar/TabsRow) funcionando do que travar a tela
  // inteira sem pista nenhuma do que aconteceu.
  let conteudo;
  try{
    conteudo = `
        ${semModulos ? Empty('Nenhum módulo liberado','Fale com o administrador do sistema para liberar o acesso aos módulos.') : `
        ${Header()}
        ${SubTabs()}
        ${state.page==='ingredientes' ? PageIngredientes() : ''}
        ${state.page==='estoque' ? PageEstoque() : ''}
        ${state.page==='dietas' ? PageDietas() : ''}
        ${state.page==='estoqueRacao' ? PageEstoqueRacao() : ''}
        ${state.page==='lotesGeral' ? PageLotesGeral() : ''}
        ${state.page==='cadastroInicio' ? PageCadastroInicio() : ''}
        ${state.page==='manejoInicio' ? PageManejoInicio() : ''}
        ${state.page==='loteDetalhe' ? PageLoteDetalhe() : ''}
        ${state.page==='vendasGeral' ? PageVendasGeral() : ''}
        ${state.page==='lotes' ? PageLotes('confinamento') : ''}
        ${state.page==='racao' ? PageSaidaRacao('confinamento') : ''}
        ${state.page==='cocho' ? PageCocho() : ''}
        ${state.page==='lotesPasto' ? PageLotes('pasto') : ''}
        ${state.page==='pasto' ? PagePasto() : ''}
        ${state.page==='lotesReproducao' ? PageLotes('reproducao') : ''}
        ${state.page==='racaoCria' ? PageSaidaRacao('reproducao') : ''}
        ${state.page==='reproducaoGeral' ? PageReproducaoGeral() : ''}
        ${state.page==='pesagemConfinamento' ? PagePesagem('confinamento') : ''}
        ${state.page==='pesagemPasto' ? PagePesagem('pasto') : ''}
        ${state.page==='pesagemReproducao' ? PagePesagem('reproducao') : ''}
        ${state.page==='financeiroResumo' ? PageFinanceiroResumo() : ''}
        ${state.page==='financeiroCurral' ? PageFinanceiroCurral() : ''}
        ${state.page==='resultadosReproducao' ? PageResultadosReproducao() : ''}
        ${state.page==='financeiroCustosFixos' ? PageFinanceiroCustosFixos() : ''}
        ${state.page==='resultadosInvestimentos' ? PageResultadosInvestimentos() : ''}
        ${state.page==='resultadosResumo' ? PageResultadosResumo() : ''}
        ${state.page==='resultadosReceitas' ? PageResultadosReceitas() : ''}
        ${state.page==='adminUsuarios' ? PageAdminUsuarios() : ''}
        `}
    `;
  } catch(e){
    console.error('Erro ao montar a tela:', e);
    conteudo = `<div class="card" style="margin:20px;">
      <h3 style="color:var(--alerta);">Ocorreu um erro ao carregar esta tela</h3>
      <p class="hint">Mande um print desta mensagem: <strong>${String(e && e.message || e)}</strong></p>
      <button class="btn btn-ghost btn-sm" data-voltar-erro="1" style="margin-top:10px;">Voltar pro início</button>
    </div>`;
  }
  let modalHtml = '';
  if(state.modal){
    try{ modalHtml = Modal(); }
    catch(e){
      console.error('Erro ao abrir modal:', e);
      state.modal = null;
      alert('Ocorreu um erro ao abrir esta janela: ' + String(e && e.message || e));
    }
  }
  root.innerHTML = `
    <div class="app">
      ${Topbar()}
      ${TabsRow()}
      <div class="main">${conteudo}</div>
    </div>
    ${modalHtml}
    ${!semModulos && !state.modal ? FabMenu() : ''}
  `;

  // EXCLUIR E SO DE ADMIN OU PROPRIETARIO, em todo o app - a mesma regra
  // que o banco aplica em pode_excluir().
  //
  // Varre o DOM depois de montar, em vez de condicionar cada botao um a
  // um. Sao dezenas de botoes espalhados; um esquecido viraria um clique
  // que NAO da erro nenhum: a RLS nega o delete em silencio (apaga zero
  // linhas sem reclamar), a tela recarrega e o registro continua la. A
  // pessoa clica de novo achando que nao pegou.
  //
  // As linhas que o app apaga por conta propria (movimentos ao editar uma
  // saida de racao, desfazer um manejo que falhou) nao passam por botao,
  // entao continuam funcionando para quem nao e dono.
  if(!podeExcluir()){
    root.querySelectorAll('[class*="danger"], button, a').forEach(el=>{
      for(const attr of el.attributes){
        if(attr.name.startsWith('data-del-')){ el.remove(); return; }
      }
    });
  }
  attachEvents();
  ultimaPaginaRenderizada = state.page;
  // Mesma página (ex: expandiu um grupo, abriu um modal) -- restaura o
  // scroll exatamente onde estava, tanto na janela (mobile) quanto na nova
  // .main (desktop). Página diferente (navegação de verdade) -- sobe pro
  // topo nos dois, como se espera ao abrir uma tela nova.
  window.scrollTo(0, mesmaPagina ? scrollY : 0);
  const novaMain = document.querySelector('.main');
  if(novaMain) novaMain.scrollTop = mesmaPagina ? mainScrollTop : 0;
}

const DOMINIO_LOGIN = 'aeagropecuaria.local';
// chave = grupo de abas deste app; valor = chave da permissão em profiles.
// Financeiro e Resultados usam prefixo pec_ porque, no banco unificado, o
// Lavoura também tem módulos com esses nomes e com outro significado — sem
// o prefixo, dar acesso ao financeiro de um liberaria o do outro.
const MODULOS_GROUP = {insumos:'insumos', dietas:'dietas', confinamento:'confinamento', pasto:'pasto', reproducao:'cria', financeiro:'pec_financeiro', resultados:'pec_resultados'};
// tipo (mesma chave usada por loteTipo()) -> rótulo de tela e módulo de permissão
const TIPO_PESAGEM_LABEL = {confinamento:'Confinamento', pasto:'Pasto', reproducao:'Cria'};
const TIPO_MODULO = {confinamento:'confinamento', pasto:'pasto', reproducao:'cria'};
const DIETA_TIPO_LABEL = {confinamento:'Confinamento', cria:'Cria', pasto:'Pasto'};
const ACAO_MODULOS = {
  ingrediente:['insumos'], movimento:['insumos'],
  dieta:['dietas'], producaoRacao:['dietas'],
  lote:['confinamento','pasto','cria'],
  saidaRacao:['confinamento'], cocho:['confinamento'],
  pasto:['pasto'],
  saidaRacaoCria:['cria'], reproducaoCusto:['cria'], diagnosticoGestacional:['cria'], parto:['cria','confinamento'], desmama:['cria','confinamento'],
  pesagem:['confinamento','pasto','cria'],
  custoFixo:['pec_financeiro'], precoArroba:['pec_financeiro'],
  // Receita agora se lança pela aba Financeiro (não mais só Resultados) --
  // ver o rateio "resultados"/margem continua exclusivo de Resultados.
  receita:['pec_financeiro','pec_resultados'], metaMargem:['pec_resultados'], investimento:['pec_resultados'],
};
// Ações que "Manejo: Editar" libera sozinho, sem precisar da permissão do
// módulo do lote (Confinamento/Pasto/Cria) -- não é todo ACAO_MODULOS, só
// as de manejo de verdade (Insumos/Dietas/Financeiro continuam exigindo a
// permissão própria deles).
const MANEJO_ACAO_TYPES = new Set(['reproducaoCusto','diagnosticoGestacional','parto','desmama','pesagem']);
// Dentro do Manejo, cada ação pertence a um módulo diferente -- entrar no
// Manejo só pede editar em QUALQUER área (confinamento/pasto/cria), mas
// isso não deveria liberar TODAS as ações pra todo mundo: um colaborador só
// de Confinamento não devia conseguir marcar "Inseminação" (é de Cria), por
// exemplo. Pesagem/Desmama seguem o tipo do lote selecionado (podem
// acontecer em qualquer área); Protocolo/Inseminação/Diagnóstico são sempre
// de reprodução, então sempre exigem Cria especificamente.
function acaoManejoPermitida(acao, lote){
  if(!lote) return false;
  // "Manejo: Editar" libera qualquer ação em qualquer lote sozinho, sem
  // olhar o tipo -- confirmado com o Eduardo em 01/09/2026 (antes essa
  // chave só controlava se a aba Manejo aparecia).
  if(temPermissao('manejo','editar')) return true;
  const moduloDoLote = TIPO_MODULO[loteTipo(lote)];
  if(acao==='pesagem') return temPermissao(moduloDoLote,'editar');
  if(acao==='desmama') return temPermissao('cria','editar') || temPermissao(moduloDoLote,'editar');
  return temPermissao('cria','editar'); // protocoloIA, inseminacao, diagnostico
}

function normalizeUsuario(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,''); }
function souAdmin(){ return state.perfil?.papel === 'admin' || state.perfil?.papel === 'proprietario'; }
// Excluir e so de admin ou proprietario, em todo o app. Mesma regra que o
// banco aplica em pode_excluir(); aqui e so para nao mostrar um botao que
// vai falhar - e falhar calado, porque a RLS nega delete sem dar erro.
function podeExcluir(){
  return state.perfil?.papel === 'admin' || state.perfil?.papel === 'proprietario';
}
// Colaborador pode editar (quando tiver permissão do módulo), mas nunca
// pode excluir nada -- o botão Excluir some pra esse papel em toda a tela,
// mesmo onde antes aparecia junto com o Editar.
function souColaborador(){ return state.perfil?.papel === 'colaborador'; }
// Acesso de cargo (admin/consultor) OU permissão explícita em "Lotes (visão
// geral)"/"Cadastro" -- essas 2 chaves antes só controlavam se a aba
// aparecia (grupoVisivel), sem liberar nada de verdade: um colaborador
// com "Cadastro: Editar" via a aba mas não conseguia criar lote/animal
// (só Confinamento/Pasto/Cria editar resolvia isso). Confirmado com o
// Eduardo em 01/09/2026 -- agora as duas realmente criam/editam lote e
// animal sozinhas, sem precisar da permissão do módulo do lote também.
function podeCriarLote(){ return souAdmin() || state.perfil?.papel === 'consultor' || temPermissao('lotesGeral','editar') || temPermissao('cadastro','editar'); }
// Consultor formula dieta e precisa saber/lançar preço de insumo, custo de
// dieta/ração/pasto e valor em estoque pra isso -- mas não deve ver o
// financeiro geral da fazenda (custo por curral, receitas/despesas,
// investimentos etc.), que continua só admin/proprietário via souAdmin().
function podeVerPrecoInsumo(){ return souAdmin() || state.perfil?.papel === 'consultor'; }
function temPermissao(modulo, nivel){
  if(!state.perfil) return false;
  if(souAdmin()) return true;
  const atual = state.perfil.permissoes?.[modulo];
  if(nivel==='visualizar') return atual==='visualizar' || atual==='editar';
  return atual==='editar';
}
function podeEditarAcao(type){
  // "Manejo: Editar" libera as ações de manejo (ver MANEJO_ACAO_TYPES)
  // sozinho -- não as de Insumos/Dietas/Financeiro, que continuam exigindo
  // a permissão própria delas.
  if(MANEJO_ACAO_TYPES.has(type) && temPermissao('manejo','editar')) return true;
  return (ACAO_MODULOS[type]||[]).some(m=>temPermissao(m,'editar'));
}
// Venda (abate, venda por animal ou por kg) lança uma Receita
// automaticamente (módulo Resultados, mantido separado do resto de
// propósito pra controlar quem vê receita/resultado da operação) — por
// isso exige editar tanto no módulo do lote (Confinamento/Pasto/Cria)
// quanto em Resultados, não só um dos dois. "Vendas: Editar" é um atalho
// à parte pra essa mesma ação -- combinado com nenhuma outra permissão,
// já basta (confirmado com o Eduardo em 01/09/2026: antes só controlava
// se a aba aparecia, sem liberar a venda de fato).
function podeRegistrarVenda(tipo){
  return temPermissao('vendas','editar') || (temPermissao(TIPO_MODULO[tipo],'editar') && temPermissao('pec_resultados','editar'));
}
function grupoVisivel(key){
  if(key==='admin') return souAdmin();
  // Cada regra de cargo abaixo (consultor, podeCriarLote, editar em alguma
  // área) continua valendo como ATALHO adicional -- só o admin liberando a
  // permissão explícita do módulo (tabela em Administração > Usuários) nunca
  // tira acesso de quem já tinha por cargo.
  if(key==='lotesGeral') return temPermissao('lotesGeral','visualizar') || souAdmin() || state.perfil?.papel==='consultor';
  if(key==='vendas') return temPermissao('vendas','visualizar') || temPermissao('confinamento','visualizar') || temPermissao('pasto','visualizar') || temPermissao('cria','visualizar');
  if(key==='cadastro') return temPermissao('cadastro','visualizar') || podeCriarLote() || podeEditarAcao('lote');
  if(key==='manejo') return temPermissao('manejo','visualizar') || temPermissao('confinamento','editar') || temPermissao('pasto','editar') || temPermissao('cria','editar');
  return temPermissao(MODULOS_GROUP[key], 'visualizar');
}
// Algumas páginas dentro de um grupo visível são mais sensíveis que o resto
// do grupo (detalhamento de custo/margem) e ficam restritas a proprietário/
// administrador mesmo pra quem tem a permissão do módulo (ex: Resultados)
// liberada -- por isso o corte é feito por página (soAdmin), não só por grupo.
function paginaVisivel(pagina){
  return !pagina.soAdmin || souAdmin();
}
function paginasVisiveisDoGrupo(grupo){
  return grupo ? grupo.pages.filter(paginaVisivel) : [];
}
function gruposVisiveis(){
  return Object.entries(GROUPS).filter(([key])=>grupoVisivel(key));
}
function primeiraPaginaVisivel(){
  const grupos = gruposVisiveis();
  // Abre em Resultados por padrão pra quem tem acesso (a primeira coisa que
  // se quer ver ao logar); quem não tem acesso cai no primeiro grupo visível
  // de qualquer jeito, como antes.
  const resultados = grupos.find(([key])=>key==='resultados');
  const paginasResultados = resultados ? paginasVisiveisDoGrupo(resultados[1]) : [];
  if(paginasResultados[0]) return paginasResultados[0].key;
  const paginas = grupos[0] ? paginasVisiveisDoGrupo(grupos[0][1]) : [];
  return paginas[0] ? paginas[0].key : null;
}

// Perfil (nome/papel/permissões) fica salvo neste aparelho depois de toda
// busca com sucesso — se depois a busca falhar por falta de conexão (não
// por um erro real, tipo perfil removido), usamos o último salvo em vez de
// mostrar "sem acesso liberado" pra quem só está sem sinal.
const PERFIL_CACHE_KEY = 'aepecuaria_perfil_cache_v1';
function lerPerfilCache(uid){
  try{
    const cache = JSON.parse(localStorage.getItem(PERFIL_CACHE_KEY)||'null');
    return (cache && cache.uid===uid) ? cache.perfil : null;
  }catch(e){ return null; }
}
function salvarPerfilCache(uid, perfil){
  try{ localStorage.setItem(PERFIL_CACHE_KEY, JSON.stringify({uid, perfil})); }
  catch(e){ /* localStorage indisponível (modo privado etc.) — sem o que fazer aqui */ }
}
async function loadPerfil(){
  const uid = state.session?.user?.id;
  if(!uid){ state.perfil = null; state.perfilErroRede = false; return; }
  const { data, error } = await db.from('profiles').select('*').eq('id', uid).single();
  state.perfilErroRede = false;
  if(data){
    state.perfil = rowToPerfil(data);
    salvarPerfilCache(uid, state.perfil);
  } else if(error && pareceErroDeRede(error)){
    const cache = lerPerfilCache(uid);
    if(cache){ state.perfil = cache; }
    else { state.perfil = null; state.perfilErroRede = true; }
  } else {
    state.perfil = null;
  }
  if(state.perfil && state.perfil.ativo && !gruposVisiveis().some(([k])=>k===currentGroupKey())){
    const primeira = primeiraPaginaVisivel();
    if(primeira) state.page = primeira;
  }
}

async function initAuth(){
  const { data } = await db.auth.getSession();
  state.session = data.session;
  if(state.session) await loadPerfil();
  state.authChecked = true;
  render();
  if(state.session && state.perfil?.ativo) loadAll();

  let primeiroEvento = true;
  db.auth.onAuthStateChange(async (event, newSession)=>{
    // o primeiro disparo (INITIAL_SESSION) já foi tratado acima; e o disparo
    // logo após o login manual também já foi tratado em fazerLogin()
    if(primeiroEvento){ primeiroEvento = false; return; }
    if(event==='SIGNED_IN' && state.session?.access_token===newSession?.access_token) return;
    state.session = newSession;
    if(newSession){
      await loadPerfil();
      render();
      if(state.perfil?.ativo) loadAll();
    } else {
      state.perfil = null;
      render();
    }
  });
}

async function fazerLogin(){
  const usuario = normalizeUsuario(state.loginDraft.usuario);
  const senha = state.loginDraft.senha;
  if(!usuario || !senha){ state.loginError = 'Informe usuário e senha.'; render(); return; }
  state.loginLoading = true; state.loginError = ''; render();
  const email = `${usuario}@${DOMINIO_LOGIN}`;
  const { data, error } = await db.auth.signInWithPassword({ email, password: senha });
  state.loginLoading = false;
  if(error){
    state.loginError = 'Usuário ou senha inválidos.';
    render();
    return;
  }
  state.session = data.session;
  await loadPerfil();
  state.loginDraft = {usuario:'', senha:''};
  render();
  if(state.perfil?.ativo) loadAll();
}

async function fazerLogout(){
  await db.auth.signOut();
  state.session = null;
  state.perfil = null;
  state.page = 'financeiroCustosFixos';
  render();
}

/* ===================== HELPERS ===================== */
function fmt(n, dec=2){ return Number(n||0).toLocaleString('pt-BR', {minimumFractionDigits:dec, maximumFractionDigits:dec}); }
function fmtInt(n){ return Number(n||0).toLocaleString('pt-BR'); }
// Toda tela é montada com innerHTML a partir de texto livre do usuário
// (observação, nome, item etc.) — sem escapar, um <script> ou onerror=
// digitado num campo executaria na sessão de quem visualizar a tela.
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Valida campos obrigatórios de um lançamento antes de salvar — campos:
// [[valorBruto, rótulo], ...]. Barra o salvamento com um alerta claro se
// algum estiver em branco (observação nunca entra aqui, é sempre opcional).
function validarObrigatorios(campos){
  for(const [valor, rotulo] of campos){
    if(valor===null || valor===undefined || String(valor).trim()===''){
      alert(`Preencha o campo "${rotulo}" antes de salvar.`);
      return false;
    }
  }
  return true;
}
function getIng(id){ return state.ingredientes.find(i=>i.id===Number(id)); }

/* ===================== FILA OFFLINE (lançamentos sem sinal) ===================== */
// Lançamentos de campo (ração, cocho, pasto, reprodução, parto, pesagem) não
// podem se perder quando não há sinal de internet no curral/pasto. Se o
// salvamento falhar por causa de rede (não por um erro real do servidor),
// o lançamento é guardado neste aparelho (localStorage) e reenviado
// automaticamente assim que a conexão voltar — nunca fica só na memória,
// senão se perderia ao fechar a aba antes de sincronizar.
const FILA_OFFLINE_KEY = 'aepecuaria_fila_offline_v1';
const LANCAMENTO_LABEL = {
  saidaRacao:'Saída de ração', saidaRacaoCria:'Saída de ração (Cria)', cocho:'Leitura de cocho',
  pasto:'Saída de ração (Pasto)', reproducaoCusto:'Inseminação', diagnosticoGestacional:'Diagnóstico gestacional', parto:'Parto', desmama:'Desmama',
  pesagem:'Pesagem',
};
function lerFilaOffline(){
  try{ return JSON.parse(localStorage.getItem(FILA_OFFLINE_KEY)||'[]'); }
  catch(e){ return []; }
}
// Retorna se conseguiu gravar de verdade — quem chama precisa saber, senão
// mostraria "salvo neste aparelho" pra um lançamento que na verdade se
// perdeu (localStorage indisponível em modo privado, ou cheio).
function salvarFilaOffline(fila){
  try{ localStorage.setItem(FILA_OFFLINE_KEY, JSON.stringify(fila)); return true; }
  catch(e){ return false; }
}
function enfileirarLancamento(type, campos){
  const lote = campos.loteId ? state.lotes.find(l=>l.id===campos.loteId) : null;
  const fila = lerFilaOffline();
  fila.push({
    queueId: `${Date.now()}_${Math.random().toString(36).slice(2,8)}`,
    type, campos,
    label: `${LANCAMENTO_LABEL[type]||type}${lote?' · '+lote.nome:''}`,
    criadoEm: new Date().toISOString(),
  });
  return salvarFilaOffline(fila);
}
// Distingue "sem conexão" (vale a pena guardar e tentar de novo depois) de
// um erro real do servidor (dado inválido, RLS etc. — tentar de novo não
// vai resolver, então não faz sentido enfileirar).
function pareceErroDeRede(err){
  if(typeof navigator!=='undefined' && navigator.onLine===false) return true;
  if(err && err.name==='TypeError') return true;
  const msg = String((err && err.message) || err || '').toLowerCase();
  return msg.includes('failed to fetch') || msg.includes('network') || msg.includes('load failed') || msg.includes('conexão');
}
// Executa de fato o insert (+ efeitos colaterais, como descontar estoque) de
// um lançamento novo — usado tanto pelo salvamento normal quanto por essa
// mesma função sendo chamada de novo depois, ao sincronizar a fila.
// Nome de quem está logado no momento do lançamento — grava em cada
// lançamento de campo pra saber quem fez, sem afetar edições posteriores
// (só o insert grava; editar não troca o autor original).
function autorAtual(){ return state.perfil?.nome || state.perfil?.usuario || null; }
// Insere um lançamento de "saída de ração" -- Confinamento, Cria ou Pasto,
// não importa mais, quem decide como descontar o estoque é a própria dieta
// escolhida: "consumo direto" desconta os insumos crus na hora (via
// movimentos, igual sempre foi o Confinamento); senão, só grava a saída,
// consumindo do estoque de ração pronta dessa dieta (quem descontou o
// insumo cru foi a Produção de Ração, antes). Desfaz a linha se o desconto
// falhar -- sem isso, um reenfileiramento por falha de rede duplicaria o
// lançamento inteiro no retry.
async function inserirSaidaComDesconto(tabela, fkCol, row, campos){
  const res = await db.from(tabela).insert(row).select().single();
  if(res.error) return {error:res.error};
  const novoId = res.data.id;
  const dieta = campos._dietaSnapshot || state.dietas.find(x=>x.id===campos.dietaId);
  if(dieta && dieta.consumoDireto){
    const quantidadeBase = campos.quantidadeKg!==undefined ? campos.quantidadeKg : campos.quantidade;
    const movs = (dieta.itens||[]).filter(it=>it.ingredienteId).map(it=>{
      const ing = getIng(it.ingredienteId);
      const consumoKg = quantidadeBase*it.pct/100;
      return {data:campos.data, ingrediente_id:it.ingredienteId, tipo:'saida', quantidade:kgParaUnidade(consumoKg, ing?.unidade), [fkCol]:novoId};
    });
    if(movs.length){
      const {error} = await db.from('movimentos').insert(movs);
      if(error){
        await db.from(tabela).delete().eq('id', novoId);
        return {error};
      }
    }
  }
  return {error:null};
}
async function executarInsertLancamento(type, campos){
  if(type==='saidaRacao' || type==='saidaRacaoCria'){
    const row = {data:campos.data, dieta_id:campos.dietaId, lote_id:campos.loteId, quantidade_kg:campos.quantidadeKg, criado_por:autorAtual(), criado_em:new Date().toISOString()};
    return await inserirSaidaComDesconto('saidas_racao', 'saida_racao_id', row, campos);
  }
  if(type==='cocho'){
    const {error} = await db.from('leituras_cocho').insert({...leituraCochoToRow(campos), criado_por:autorAtual()});
    return {error};
  }
  if(type==='pasto'){
    const row = {data:campos.data, lote_id:campos.loteId, dieta_id:campos.dietaId, quantidade:campos.quantidade, criado_por:autorAtual()};
    return await inserirSaidaComDesconto('pasto', 'pasto_id', row, campos);
  }
  if(type==='producaoRacao'){
    const dieta = campos._dietaSnapshot || state.dietas.find(x=>x.id===campos.dietaId);
    const row = {data:campos.data, dieta_id:campos.dietaId, quantidade_kg:campos.quantidadeKg, criado_por:autorAtual()};
    const res = await db.from('producoes_racao').insert(row).select().single();
    if(res.error) return {error:res.error};
    const producaoId = res.data.id;
    if(dieta){
      const movs = dieta.itens.filter(it=>it.ingredienteId).map(it=>{
        const ing = getIng(it.ingredienteId);
        const consumoKg = campos.quantidadeKg*it.pct/100;
        return {data:campos.data, ingrediente_id:it.ingredienteId, tipo:'saida', quantidade:kgParaUnidade(consumoKg, ing?.unidade), producao_racao_id:producaoId};
      });
      if(movs.length){
        const {error} = await db.from('movimentos').insert(movs);
        if(error){
          // Mesma lógica da Saída de Ração acima: sem o desconto de estoque,
          // não faz sentido deixar a produção salva sozinha, e desfazer evita
          // que um reenfileiramento duplique a produção no retry.
          await db.from('producoes_racao').delete().eq('id', producaoId);
          return {error};
        }
      }
    }
    return {error:null};
  }
  if(type==='venda'){
    const lote = state.lotes.find(l=>l.id===campos.loteId);
    const row = {...vendaToRow(campos), criado_por:autorAtual()};
    const res = await db.from('abates').insert(row).select().single();
    if(res.error) return {error:res.error};
    const vendaId = res.data.id;
    const arrobas = campos.tipoVenda==='arroba' ? arrobasVenda(campos) : null;
    const valorTotal = valorVenda(campos);
    const descricao = `${TIPO_VENDA_LABEL[campos.tipoVenda]||'Venda'} — ${lote?lote.nome:'Lote'} (${fmtInt(campos.quantidade)} animais)`;
    // A receita da venda nasce aqui porque vender e uma acao operacional.
    // Vai para a mesma tabela que o Matriz usa, marcada como pecuaria e
    // ligada ao abate — e o que permite editar ou apagar a venda depois e
    // a receita acompanhar.
    const receitaRow = {tipo:'receita', atividade:'pecuaria', fazenda_id:null,
      centro_custo_id: state.centroVendasId,
      data:campos.data, mes:campos.data ? campos.data.slice(0,7) : null,
      lote_id:campos.loteId, descricao, arrobas, valor:valorTotal,
      observacao:null, abate_id:vendaId, criado_por:autorAtual()};
    if(!state.centroVendasId){
      await db.from('abates').delete().eq('id', vendaId);
      return {error:{message:'Centro de custo "Vendas" não encontrado. Peça para recriá-lo no cadastro de Centros de Custo.'}};
    }
    const {error:errReceita} = await db.from('lancamentos_financeiros').insert(receitaRow);
    if(errReceita){
      // Sem a receita, a venda fica pela metade -- desfaz o abate pra não
      // duplicar tudo se isso for reenfileirado por falha de rede e tentado
      // de novo depois (mesmo motivo do rollback em saidaRacao/producaoRacao).
      await db.from('abates').delete().eq('id', vendaId);
      return {error:errReceita};
    }
    if(lote){
      const novoNumero = Math.max(0, Number(lote.numeroAnimais||0) - Number(campos.quantidade||0));
      const updLote = {numero_animais: novoNumero};
      if(novoNumero===0 && !lote.dataFim) updLote.data_fim = campos.data;
      const {error:errLote} = await db.from('lotes').update(updLote).eq('id', lote.id);
      if(errLote){
        await db.from('lancamentos_financeiros').delete().eq('abate_id', vendaId);
        await db.from('abates').delete().eq('id', vendaId);
        return {error:errLote};
      }
    }
    return {error:null};
  }
  if(type==='reproducaoCusto'){
    const {error} = await db.from('reproducao_custos').insert({...reproducaoCustoToRow(campos), criado_por:autorAtual()});
    if(error) return {error};
    // A vaca inseminada entra (ou é movida) na composição do lote -- é
    // sempre fêmea. Best-effort (não bloqueia nem contamina o erro
    // retornado, senão um reenfileiramento por falha de rede duplicaria o
    // lançamento). Roda AQUI (não só no caminho de salvamento imediato) pra
    // também acontecer quando isso for sincronizado depois da fila offline
    // -- senão a vaca nunca era cadastrada nesse caso.
    const resAnimal = await upsertAnimal(campos.numeroVaca, campos.loteId, {sexo:'femea', raca:campos.racaVaca||undefined});
    return {error:null, avisoAnimal: resAnimal.error ? resAnimal.error.message : null};
  }
  if(type==='diagnosticoGestacional'){
    const {error} = await db.from('diagnosticos_gestacionais').insert({...diagnosticoToRow(campos), criado_por:autorAtual()});
    if(error) return {error};
    const resAnimal = await upsertAnimal(campos.numeroVaca, campos.loteId, {sexo:'femea', raca:campos.racaVaca||undefined});
    return {error:null, avisoAnimal: resAnimal.error ? resAnimal.error.message : null};
  }
  if(type==='parto'){
    const {error} = await db.from('partos').insert({...partoToRow(campos), criado_por:autorAtual()});
    if(error) return {error};
    const resAnimal = await upsertAnimal(campos.numeroMae, campos.loteId, {sexo:'femea', raca:campos.racaMae||undefined});
    return {error:null, avisoAnimal: resAnimal.error ? resAnimal.error.message : null};
  }
  if(type==='desmama'){
    const {error} = await db.from('desmamas').insert({...desmamaToRow(campos), criado_por:autorAtual()});
    return {error};
  }
  if(type==='pesagem'){
    const res = await db.from('pesagens').insert(pesagemToRow(campos)).select().single();
    if(res.error) return {error: res.error};
    const entradas = campos.entradasPesagem||[];
    if(entradas.length>0){
      const linhasAnimais = entradas.map(en=>({pesagem_id: res.data.id, numero_animal: en.numero || null, peso_kg: Number(en.pesoKg)}));
      const resAnimais = await db.from('pesagens_animais').insert(linhasAnimais);
      if(resAnimais.error){
        // Sem o detalhe por animal a pesagem fica incompleta (é a parte que
        // forma a própria média) -- desfaz a linha já criada em vez de
        // deixar "pela metade", senão salvar de novo depois duplicaria.
        await db.from('pesagens').delete().eq('id', res.data.id);
        return {error: resAnimais.error};
      }
    }
    const loteDaPesagem = state.lotes.find(l=>l.id===campos.loteId);
    const sexoLotePesagem = loteDaPesagem && (loteDaPesagem.sexo==='macho'||loteDaPesagem.sexo==='femea') ? loteDaPesagem.sexo : null;
    // Upsert do cadastro de animal, aqui sim, é só efeito colateral
    // (best-effort) -- não desfaz a pesagem (já correta e completa) se uma
    // dessas atualizações falhar. Roda tanto no salvamento imediato quanto
    // no replay da fila offline, como os outros tipos.
    const criadosNestaLeva = [];
    let avisoAnimal = null;
    for(const en of entradas){
      if(!en.numero) continue;
      const resAnimal = await upsertAnimal(en.numero, campos.loteId, {sexo: en.sexo||sexoLotePesagem||undefined, raca: en.raca||undefined}, criadosNestaLeva);
      if(resAnimal.error){ avisoAnimal = resAnimal.error.message; break; }
    }
    return {error:null, avisoAnimal};
  }
  return {error:{message:'Tipo de lançamento desconhecido: '+type}};
}
// Tenta salvar de verdade; se falhar por rede, guarda na fila offline em vez
// de mostrar erro — do ponto de vista de quem está usando, "salvou" mesmo
// assim (só que localmente, até a internet voltar).
const ERRO_FILA_INDISPONIVEL = {message:'Sem conexão, e não foi possível guardar o lançamento neste aparelho (armazenamento local indisponível ou cheio). Nada foi salvo — anote os dados e tente lançar de novo.'};
async function salvarOuEnfileirar(type, campos){
  // Saída de Ração e Produção descontam estoque na proporção da composição
  // da dieta NA HORA do lançamento. Se isso acabar indo pra fila offline e
  // só sincronizar depois, precisa usar essa composição de agora — não a
  // que a dieta tiver quando a sincronização rodar (pode ter sido editada
  // nesse meio tempo) — por isso o snapshot é tirado aqui, antes de
  // qualquer tentativa, e viaja junto com o lançamento se ele for enfileirado.
  if((type==='saidaRacao' || type==='saidaRacaoCria' || type==='pasto' || type==='producaoRacao') && !campos._dietaSnapshot){
    const dietaAgora = state.dietas.find(x=>x.id===campos.dietaId);
    if(dietaAgora) campos = {...campos, _dietaSnapshot:{itens: dietaAgora.itens, consumoDireto: dietaAgora.consumoDireto}};
  }
  try{
    const resultado = await executarInsertLancamento(type, campos);
    if(!resultado.error) return {ok:true, avisoAnimal: resultado.avisoAnimal};
    if(pareceErroDeRede(resultado.error)){
      if(!enfileirarLancamento(type, campos)) return {ok:false, error:ERRO_FILA_INDISPONIVEL};
      return {ok:true, enfileirado:true};
    }
    return {ok:false, error:resultado.error};
  } catch(err){
    if(pareceErroDeRede(err)){
      if(!enfileirarLancamento(type, campos)) return {ok:false, error:ERRO_FILA_INDISPONIVEL};
      return {ok:true, enfileirado:true};
    }
    return {ok:false, error:err};
  }
}
let sincronizandoFila = false;
async function tentarSincronizarFila(){
  if(sincronizandoFila) return;
  const filaInicial = lerFilaOffline();
  if(filaInicial.length===0) return;
  if(typeof navigator!=='undefined' && navigator.onLine===false) return;
  sincronizandoFila = true;
  const pendentes = [...filaInicial];
  const falhasReais = [];
  // Lançamentos que salvaram certinho, mas cujo cadastro do animal (mãe/
  // vaca) ligado a eles falhou -- na sincronização imediata isso vira um
  // alert() na hora; aqui na fila offline não tinha nenhum aviso, então o
  // parto/inseminação/diagnóstico ficava salvo pra sempre com o cadastro do
  // animal quebrado (ou faltando) e ninguém ficava sabendo.
  const avisosAnimais = [];
  // queueIds que realmente terminaram de processar (sucesso ou falha real) --
  // usado no final pra remover só esses da fila, sem sobrescrever com um
  // snapshot velho (ver comentário abaixo).
  const processados = new Set();
  let algumSucesso = false;
  let i = 0;
  while(i < pendentes.length){
    const item = pendentes[i];
    let resultado;
    try{
      resultado = await executarInsertLancamento(item.type, item.campos);
    } catch(err){
      resultado = {error: err};
    }
    if(!resultado.error){
      if(resultado.avisoAnimal) avisosAnimais.push(`${item.label}: ${resultado.avisoAnimal}`);
      pendentes.splice(i,1);
      processados.add(item.queueId);
      algumSucesso = true;
    } else if(pareceErroDeRede(resultado.error)){
      break; // ainda sem sinal — para por aqui, mantém esse e os seguintes na fila
    } else {
      falhasReais.push(item.label);
      pendentes.splice(i,1); // erro real do servidor: não adianta insistir
      processados.add(item.queueId);
    }
  }
  // Não escreve "pendentes" direto -- ele vem do snapshot tirado ANTES dos
  // awaits acima, então não sabe de nenhum lançamento novo que tenha sido
  // enfileirado nesse meio tempo (enfileirarLancamento faz sua própria
  // leitura+escrita, que rodaria intercalada com essa sincronização). Relê
  // o estado atual da fila e só tira dali quem realmente terminou de
  // processar, preservando qualquer item novo que tenha entrado.
  const filaAtual = lerFilaOffline();
  const filaFinal = filaAtual.filter(item => !processados.has(item.queueId));
  salvarFilaOffline(filaFinal);
  sincronizandoFila = false;
  // Essa sincronização roda sozinha a cada 30s em segundo plano -- se
  // re-renderizasse com um modal aberto (a pessoa lançando outra coisa
  // nesse meio tempo), o formulário inteiro seria substituído a partir do
  // editDraft e qualquer campo sem sincronização ao vivo perderia o que já
  // tinha sido digitado. Com modal aberto, não mexe na tela agora -- os
  // dados sincronizados aparecem no próximo loadAll (ex: quando a pessoa
  // fechar o modal e essa rotina rodar de novo, ou na próxima ação normal).
  if(!state.modal){
    if(algumSucesso) await loadAll(); else render();
  }
  if(falhasReais.length>0){
    alert(`Alguns lançamentos pendentes não puderam ser enviados e foram descartados da fila (dado inválido ou registro relacionado removido):\n\n${falhasReais.join('\n')}\n\nSerá preciso lançar de novo.`);
  }
  if(avisosAnimais.length>0){
    alert(`Alguns lançamentos foram sincronizados, mas não deu pra atualizar o cadastro do animal ligado a eles:\n\n${avisosAnimais.join('\n')}\n\nConfira o número na aba Cadastro e corrija manualmente se precisar.`);
  }
}

// Traduz o destino explícito do lote (aba Lotes) para a chave interna usada nas páginas ('reproducao' = Cria).
function loteTipo(lote){
  return lote.destino==='cria' ? 'reproducao' : (lote.destino||'pasto');
}

/* LOTE QUE PODE RECEBER LANÇAMENTO
 *
 * Um lote encerrado (com data de fim) ou zerado (sem animal) não come
 * ração, não tem leitura de cocho e não recebe suplementação no pasto.
 * Antes, só a tela de Venda checava isso — ração, cocho e pasto listavam
 * qualquer lote do tipo certo, então dava para lançar ração para um lote
 * encerrado e o custo ia parar num lote que não existe mais.
 *
 * ao editar: o lote já gravado continua na lista mesmo se hoje não
 * qualificaria. Sem isso, abrir para corrigir a data de um lançamento
 * antigo trocaria o lote dele calado, para o primeiro da lista.
 */
function lotesQueRecebem(tipo, loteJaEscolhido){
  return state.lotes.filter(l =>
    loteTipo(l)===tipo && (
      (!l.dataFim && Number(l.numeroAnimais||0) > 0)
      || (loteJaEscolhido != null && String(l.id) === String(loteJaEscolhido))
    ));
}

// Lote de Cria é sempre elegível pra parto (só tem vaca). Lote de
// Confinamento também vira elegível quando o sexo dele é cadastrado como
// Fêmeas -- casos de vaca de cria alocada no Confinamento em vez do Cria.
function loteElegivelParaParto(lote){
  return loteTipo(lote)==='reproducao' || (loteTipo(lote)==='confinamento' && lote.sexo==='femea');
}

// "Preço por kg" é sempre por quilo; quantidades guardadas em "ton" precisam
// ser convertidas para kg antes de multiplicar pelo preço.
function qtdEmKg(qtd, unidade){ return unidade==='ton' ? Number(qtd||0)*1000 : Number(qtd||0); }
function kgParaUnidade(qtdKg, unidade){ return unidade==='ton' ? qtdKg/1000 : qtdKg; }

function saldoIngrediente(id){
  let saldo = 0;
  state.movimentos.filter(m=>m.ingredienteId===id).forEach(m=>{
    saldo += m.tipo==='entrada' ? m.quantidade : -m.quantidade;
  });
  return saldo;
}
// Consumo médio diário de saída de UM ingrediente -- soma tudo que já saiu
// (na mesma unidade do ingrediente) e divide pelos dias entre a primeira e
// a última saída registrada. null quando nunca teve saída (nada pra tirar
// média ainda). Não conta as saídas geradas por um "Ajustar estoque" --
// aquilo é correção de erro de lançamento/contagem física, não consumo real,
// e contar junto infla a média sem motivo.
function consumoMedioDiario(id){
  const saidas = state.movimentos.filter(m=>m.ingredienteId===id && m.tipo==='saida' && !m.ajuste).sort((a,b)=>a.data.localeCompare(b.data));
  // Com só 1 saída não dá pra calcular uma média por dia de verdade --
  // diasEntreDatas(mesma data, mesma data) clampa em 1, e a conta acaba
  // mostrando a quantidade INTEIRA daquela única saída como se fosse o
  // consumo "por dia", inflando a estimativa (ex: uma saída de 5.000kg
  // aparecia como "5.000 kg/dia").
  if(saidas.length<2) return null;
  const total = saidas.reduce((a,m)=>a+Number(m.quantidade||0),0);
  const dias = diasEntreDatas(saidas[0].data, saidas[saidas.length-1].data);
  return total/dias;
}
// Repete a média ponderada do zero sobre a lista de movimentações (em
// ordem cronológica) de UM ingrediente — usado quando uma entrada existente
// é corrigida, pra não deixar o valor errado de antes contaminando o preço
// atual. Retorna null se nenhuma entrada da lista tinha preço informado
// (nesse caso o preço do ingrediente não deve ser mexido).
function recomputarPrecoIngrediente(movs, unidade){
  const ordenados = movs.slice().sort((a,b)=> String(a.data).localeCompare(String(b.data)) || (a.id||0)-(b.id||0));
  let estoqueKg = 0, preco = null;
  ordenados.forEach(m=>{
    const qtdKg = qtdEmKg(m.quantidade, unidade);
    if(m.tipo==='entrada'){
      if(m.precoKg){
        preco = (estoqueKg>0 && preco!=null) ? (estoqueKg*preco + qtdKg*m.precoKg)/(estoqueKg+qtdKg) : m.precoKg;
      }
      estoqueKg += qtdKg;
    } else {
      estoqueKg -= qtdKg;
    }
  });
  return preco;
}

// Dietas que fazem sentido controlar por estoque de ração pronta (produzida
// em lote e guardada). Quem é "consumo direto" é formulada e servida na
// hora, sem virar um lote guardado, então não entra aqui. Não depende mais
// da área (Confinamento/Cria/Pasto) -- qualquer dieta pode ser "produzida
// e guardada", a própria dieta decide.
function dietasComEstoquePronto(){
  return state.dietas.filter(d=>!d.consumoDireto);
}

// Estoque (kg) de ração já pronta/misturada de uma dieta: soma das produções
// registradas menos o que já foi consumido (Saída de Ração ou Pasto que
// usaram essa dieta). A produção é quem desconta o ingrediente cru do
// estoque (ver executarInsertLancamento) — o consumo diário só desconta
// daqui, sem tocar o estoque de ingrediente de novo.
function estoqueRacaoPronta(dietaId){
  const produzido = state.producoesRacao.filter(p=>p.dietaId===dietaId).reduce((a,p)=>a+Number(p.quantidadeKg||0),0);
  const consumidoRacao = state.saidasRacao.filter(s=>s.dietaId===dietaId).reduce((a,s)=>a+Number(s.quantidadeKg||0),0);
  const consumidoPasto = state.pasto.filter(p=>p.dietaId===dietaId).reduce((a,p)=>a+Number(p.quantidade||0),0);
  return produzido - consumidoRacao - consumidoPasto;
}
