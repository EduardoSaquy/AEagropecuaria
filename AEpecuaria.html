function FabMenu(){
  const actions = [
    {type:'ingrediente', label:'Novo ingrediente'},
    {type:'movimento', label:'Nova movimentação de estoque'},
    {type:'dieta', label:'Nova dieta'},
    {type:'producaoRacao', label:'Nova produção de ração'},
    {type:'saidaRacao', label:'Nova saída de ração'},
    {type:'cocho', label:'Nova leitura de cocho'},
    {type:'pasto', label:'Nova saída de ração (Pasto)'},
    {type:'saidaRacaoCria', label:'Nova saída de ração (Cria)'},
    {type:'reproducaoCusto', label:'Nova inseminação'},
    {type:'diagnosticoGestacional', label:'Novo diagnóstico gestacional'},
    {type:'parto', label:'Novo parto'},
    // Desmama e Pesagem só são lançadas pelo Manejo agora (fluxo guiado por
    // animal) -- tirado daqui de propósito, não é esquecimento. As telas
    // continuam mostrando o histórico e permitindo editar/excluir um
    // lançamento já feito, só não abrem mais um formulário avulso novo.
    {type:'venda', label:'Nova venda'},
    // Despesa, receita avulsa e investimento saem daqui: passaram a ser
    // lancados no AE Matriz, que enxerga as tres atividades e permite
    // comparar custo entre elas. A venda continua aqui porque e acao
    // operacional -- ela e que gera a receita, automaticamente.
    {type:'precoArroba', label:'Atualizar preço da arroba'},
    {type:'metaMargem', label:'Definir meta de margem'},
  ].filter(a=>{
    if(a.type==='venda') return currentGroupKey()==='vendas' && (podeRegistrarVenda('confinamento') || podeRegistrarVenda('pasto') || podeRegistrarVenda('reproducao'));
    const nestaAba = (ACAO_MODULOS[a.type]||[]).includes(MODULOS_GROUP[currentGroupKey()]);
    return nestaAba && podeEditarAcao(a.type);
  });
  if(actions.length===0) return '';
  return `
  <div class="fab-wrap">
    ${state.fabOpen ? `
    <div class="fab-menu">
      ${actions.map(a=>`<button class="fab-menu-item" data-fab-action="${a.type}">+ ${a.label}</button>`).join('')}
    </div>` : ''}
    <button class="fab-btn" data-fab-toggle="1" aria-label="Adicionar">${state.fabOpen ? '&times;' : '+'}</button>
  </div>`;
}

// Agrupa movimentações (entrada/saída) por insumo, pra não listar todo
// lançamento diário direto na tela -- cada grupo mostra só a última
// movimentação daquele insumo, e expande pro histórico completo (todos os
// meses, não só um) quando o usuário clica.
function agruparMovimentos(rows, tipo){
  const porInsumo = {};
  rows.filter(m=>m.tipo===tipo).forEach(m=>{
    const key = `${tipo}:${m.ingredienteId}`;
    const ing = getIng(m.ingredienteId);
    // Entrada guarda o preço realmente pago naquela compra (se informado);
    // saída não tem preço próprio (nunca é pedido no formulário), então usa
    // o preço médio atual do ingrediente como aproximação -- igual ao resto
    // da tela (valor em estoque, custo de dieta etc).
    const precoUnit = (tipo==='entrada' && m.precoKg) ? m.precoKg : (ing?.precoKg||0);
    const valor = qtdEmKg(m.quantidade, ing?.unidade) * precoUnit;
    if(!porInsumo[key]) porInsumo[key] = {key, ingredienteId:m.ingredienteId, itens:[]};
    porInsumo[key].itens.push({...m, precoUnit, valor});
  });
  return Object.values(porInsumo).map(g=>{
    const itens = g.itens.sort((a,b)=> b.data.localeCompare(a.data) || b.id-a.id);
    return {...g, itens, ultimo: itens[0]};
  }).sort((a,b)=> b.ultimo.data.localeCompare(a.ultimo.data) || (getIng(a.ingredienteId)?.nome||'').localeCompare(getIng(b.ingredienteId)?.nome||''));
}

          <td class="mono">${g.itens.length}</td>

/* ===================== PÁGINA: DIETAS ===================== */
function calcDieta(d){
  let ms=0, pb=0, ndt=0, custoKg=0, pctTotal=0;
  d.itens.forEach(it=>{
    const ing = getIng(it.ingredienteId);
    if(!ing) return;
    const frac = it.pct/100;
    ms += ing.ms*frac;
    pb += ing.pb*frac;
    ndt += ing.ndt*frac;
    custoKg += ing.precoKg*frac;
    pctTotal += it.pct;
  });
  return {ms, pb, ndt, custoKg, pctTotal, custoAnimalDia: custoKg*d.kgAnimalDia};
}

// Se a composição de uma dieta não soma 100%, todo lançamento que a usa
// (Saída de Ração, Produção de Ração, Pasto) desconta só a fração
// correspondente do estoque de ingrediente cru — ex: composição somando
// 60% desconta só 60% da quantidade de ração realmente lançada, deixando
// "sobrar" ingrediente no estoque que na verdade já foi consumido. Por
// isso lançamentos com uma dieta incompleta são bloqueados. Soma o
// percentual direto de dieta.itens (não usa calcDieta/pctTotal, que
// ignora item cujo ingrediente foi excluído — aqui o que importa é só a
// soma dos percentuais cadastrados, não se o ingrediente ainda existe).
function composicaoIncompleta(dietaId){
  const dieta = state.dietas.find(d=>d.id===dietaId);
  if(!dieta) return null;
  const pctTotal = dieta.itens.reduce((a,it)=>a+Number(it.pct||0),0);
  return Math.abs(pctTotal-100)>0.01 ? {dieta, pctTotal} : null;
}

function manejoDetalheDados(manejoId){
  const m = state.manejos.find(x=>x.id===manejoId);
  if(!m) return null;
  const acoesAtivas = m.acoes;
  const linhas = {};
  function linha(numero){
    const key = numero || `__semnumero_${Object.keys(linhas).length}`;
    if(!linhas[key]) linhas[key] = {numero: numero||'', peso:null, racaTouro:'', resultado:'', pesoDesmama:null};
    return linhas[key];
  }
  if(acoesAtivas.includes('pesagem')){
    const pesagem = state.pesagens.find(p=>p.manejoId===manejoId);
    if(pesagem){
      state.pesagensAnimais.filter(pa=>pa.pesagemId===pesagem.id).forEach(pa=>{
        linha(pa.numeroAnimal).peso = pa.pesoKg;
      });
    }
  }
  if(acoesAtivas.includes('inseminacao')){
    state.reproducao.filter(r=>r.manejoId===manejoId).forEach(r=>{ linha(r.numeroVaca).racaTouro = r.racaTouro; });
  }
  if(acoesAtivas.includes('diagnostico')){
    state.diagnosticos.filter(dg=>dg.manejoId===manejoId).forEach(dg=>{ linha(dg.numeroVaca).resultado = dg.resultado; });
  }
  if(acoesAtivas.includes('desmama')){
    state.desmamas.filter(ds=>ds.manejoId===manejoId).forEach(ds=>{
      const parto = state.partos.find(p=>p.id===ds.partoId);
      linha(parto?.numeroMae ? `mãe ${parto.numeroMae}` : '').pesoDesmama = ds.pesoKg;
    });
  }
  if(acoesAtivas.includes('protocoloIA')){
    state.protocolosInseminacao.filter(p=>p.manejoId===manejoId).forEach(p=>{ linha(p.numeroAnimal); });
  }
  return {manejo:m, linhas: Object.values(linhas)};
}

/* ===================== PÁGINA: DETALHE DO LOTE (ANIMAIS + HISTÓRICO) ===================== */
// Histórico de pesagens de UM animal (pelo número), dentro das pesagens já
// registradas do lote -- cruza pesagens (evento, por lote) com
// pesagensAnimais (peso individual dentro daquele evento), em ordem
// cronológica.
// pesagensAnimaisDoLote (opcional) já vem filtrado só pelas pesagens desse
// lote -- evita varrer o state.pesagensAnimais inteiro (todos os lotes, todo
// o histórico da fazenda) uma vez pra cada animal do lote.
function historicoPesoAnimal(loteId, numeroAnimal, pesagensAnimaisDoLote){
  const lista = pesagensAnimaisDoLote || state.pesagensAnimais;
  return pesagensDoLote(loteId)
    .map(p=>{
      const pa = lista.find(x=>x.pesagemId===p.id && String(x.numeroAnimal)===String(numeroAnimal));
      return pa ? {data:p.data, pesoKg:Number(pa.pesoKg)} : null;
    })
    .filter(Boolean);
}
// GMD do animal: da primeira à última pesagem individual dele -- mesmo
// critério de "ganho desde a primeira pesagem" já usado no painel do lote.
function gmdAnimal(historico){
  if(historico.length<2) return null;
  const primeira = historico[0], ultima = historico[historico.length-1];
  return gmdEntre(primeira.pesoKg, ultima.pesoKg, primeira.data, ultima.data);
}
// Situação reprodutiva de UMA vaca (fêmea de Cria): pega o diagnóstico mais
// recente dela; se prenha, procura um parto registrado depois desse
// diagnóstico (a cria já nasceu, mostra sexo e data reais) -- senão mostra
// a previsão de parto do próprio diagnóstico.
function situacaoReprodutivaVaca(loteId, numero){
  const diagnosticos = state.diagnosticos.filter(d=>d.loteId===loteId && String(d.numeroVaca)===String(numero)).sort((a,b)=>a.data.localeCompare(b.data));
  const inseminacoes = state.reproducao.filter(r=>r.loteId===loteId && String(r.numeroVaca)===String(numero)).sort((a,b)=>a.data.localeCompare(b.data));
  const partos = state.partos.filter(p=>p.loteId===loteId && String(p.numeroMae)===String(numero)).sort((a,b)=>a.data.localeCompare(b.data));
  const ultimoDiagnostico = diagnosticos[diagnosticos.length-1] || null;
  const ultimaInseminacao = inseminacoes[inseminacoes.length-1] || null;
  let status, detalheStatus;
  if(!ultimoDiagnostico){
    status = 'sem-diagnostico';
    detalheStatus = 'Sem diagnóstico';
  } else if(ultimoDiagnostico.resultado==='vazia'){
    status = 'vazia';
    detalheStatus = 'Vazia';
  } else {
    const partoDoCiclo = partos.find(p=>p.data>=ultimoDiagnostico.data);
    if(partoDoCiclo){
      status = 'pariu';
      detalheStatus = `Prenha — pariu ${SEXO_BEZERRO_LABEL[partoDoCiclo.sexoBezerro]||''} em ${partoDoCiclo.data.split('-').reverse().join('/')}`;
    } else {
      status = 'prenha';
      detalheStatus = `Prenha${ultimoDiagnostico.previsaoParto ? ' — previsão de parto ' + ultimoDiagnostico.previsaoParto.split('-').reverse().join('/') : ''}`;
    }
  }
  return {ultimoDiagnostico, ultimaInseminacao, status, detalheStatus};
}

function PageLoteDetalhe(){
  const lote = state.lotes.find(l=>l.id===state.loteDetalheId);
  const voltarBtn = `<button class="btn btn-ghost btn-sm" data-voltar-lote-detalhe="1">← Voltar</button>`;
  if(!lote){
    return `<div class="toolbar">${voltarBtn}</div><div class="card">${Empty('Lote não encontrado','Esse lote pode ter sido excluído.')}</div>`;
  }
  const ehCria = loteTipo(lote)==='reproducao';
  const podeEditarAnimal = temPermissao(TIPO_MODULO[loteTipo(lote)],'editar');
  const animais = [...state.animais.filter(a=>a.loteId===lote.id)].sort((a,b)=>String(a.numero).localeCompare(String(b.numero), undefined, {numeric:true}));

  const pesagemIdsLote = new Set(pesagensDoLote(lote.id).map(p=>p.id));
  const pesagensAnimaisDoLote = state.pesagensAnimais.filter(pa=>pesagemIdsLote.has(pa.pesagemId));
  const rows = animais.map(a=>{
    const historico = historicoPesoAnimal(lote.id, a.numero, pesagensAnimaisDoLote);
    const ultima = historico[historico.length-1] || null;
    const gmd = gmdAnimal(historico);
    const reprod = (ehCria && a.sexo==='femea') ? situacaoReprodutivaVaca(lote.id, a.numero) : null;
    return {a, ultima, gmd, reprod};
  });

  return `
  <div class="toolbar">
    ${voltarBtn}
    <span class="hint">${esc(lote.nome)} · ${DESTINO_LOTE_LABEL[lote.destino]||lote.destino||'—'} · ${fmtInt(lote.numeroAnimais)} animal(is) cadastrado(s) no lote</span>
  </div>
  ${ContextoLoteDetalhe(lote, state.loteDetalheContexto)}
  <div class="card">
    ${rows.length===0 ? Empty('Nenhum animal numerado nesse lote ainda', 'Cadastre o número dos animais aos poucos — na Nova entrada de animais, na Nova inseminação ou pesando animal por animal (Pesagem) — pra aparecerem aqui com o histórico.') : `
    <table>
      <thead><tr>
        <th>Número</th><th>Sexo</th><th>Raça</th><th>Status</th><th>Última pesagem</th><th>GMD</th>
        ${ehCria?'<th>Situação reprodutiva</th><th>Última inseminação</th>':''}
        ${podeEditarAnimal?'<th></th>':''}
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr${r.a.status==='morto'?' style="opacity:.6;"':''}>
            <td class="mono"><strong>${esc(r.a.numero)}</strong></td>
            <td>${SEXO_BEZERRO_LABEL[r.a.sexo]||'<span class="hint">—</span>'}</td>
            <td>${RACA_TOURO_LABEL[r.a.raca]||'<span class="hint">—</span>'}</td>
            <td>${r.a.status==='morto' ? `<span class="pill pill-cat">Morto${r.a.dataMorte?' em '+r.a.dataMorte.split('-').reverse().join('/'):''}</span>` : `<span class="pill pill-ok">Ativo</span>`}</td>
            <td class="mono">${r.ultima ? `${fmt(r.ultima.pesoKg,1)} kg <span class="hint">(${r.ultima.data.split('-').reverse().join('/')})</span>` : '—'}</td>
            <td class="mono">${r.gmd!==null ? (r.gmd>=0?'+':'')+fmt(r.gmd,2)+' kg/dia' : '—'}</td>
            ${ehCria ? `
            <td><span class="${r.reprod ? 'pill '+(r.reprod.status==='vazia'||r.reprod.status==='sem-diagnostico'?'pill-cat':'pill-ok') : 'hint'}">${r.reprod ? r.reprod.detalheStatus : '—'}</span></td>
            <td class="mono">${r.reprod && r.reprod.ultimaInseminacao ? `${QUAL_INSEMINACAO_LABEL[r.reprod.ultimaInseminacao.qualInseminacao]||'—'} em ${r.reprod.ultimaInseminacao.data.split('-').reverse().join('/')}` : '—'}</td>
            ` : ''}
            ${podeEditarAnimal ? `
            <td style="display:flex; gap:6px;">
              <button class="btn-ghost btn-sm" data-edit-animal="${r.a.id}">Editar</button>
              ${r.a.status==='morto'
                ? (!souColaborador() ? `<button class="btn-ghost btn-sm" data-reverter-morte="${r.a.id}">Reverter morte</button>` : '')
                : `<button class="btn-ghost btn-sm" data-registrar-morte="${r.a.id}">Registrar morte</button>`}
              ${!souColaborador() ? `<button class="btn-danger-ghost" data-del-animal="${r.a.id}">Excluir</button>` : ''}
            </td>
            ` : ''}
          </tr>
        `).join('')}
      </tbody>
    </table>`}
  </div>`;
}

// Mostra os lançamentos daquela sub-aba específica (Parto/Inseminação/
// Diagnóstico/Desmama/Pesagem) filtrados pro lote, antes da tabela genérica
// de animais -- pra quando se clica no lote a partir de uma dessas telas, a
// informação relacionada àquele lançamento (sexo/raça do bezerro, data do
// parto, etc.) apareça primeiro, e não só o cadastro do animal.
function ContextoLoteDetalhe(lote, contexto){
  if(contexto==='parto'){
    const itens = state.partos.filter(p=>p.loteId===lote.id).sort((a,b)=>b.data.localeCompare(a.data));
    return `
    <p class="eyebrow" style="margin:0 0 10px;">Partos deste lote</p>
    <div class="card" style="margin-bottom:22px;">
      ${itens.length===0 ? Empty('Nenhum parto registrado neste lote','Registre um parto na aba Parto.') : `
      <table>
        <thead><tr><th>Data</th><th>Número da mãe</th><th>Sexo do bezerro</th><th>Raça do bezerro</th></tr></thead>
        <tbody>
          ${itens.map(p=>`
          <tr>
            <td class="mono">${p.data.split('-').reverse().join('/')}</td>
            <td class="mono">${esc(p.numeroMae)||'—'}</td>
            <td>${SEXO_BEZERRO_LABEL[p.sexoBezerro]||'—'}</td>
            <td>${RACA_TOURO_LABEL[p.racaBezerro]||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      `}
    </div>`;
  }
  if(contexto==='inseminacao'){
    const itens = state.reproducao.filter(r=>r.loteId===lote.id).sort((a,b)=>b.data.localeCompare(a.data));
    return `
    <p class="eyebrow" style="margin:0 0 10px;">Inseminações deste lote</p>
    <div class="card" style="margin-bottom:22px;">
      ${itens.length===0 ? Empty('Nenhuma inseminação registrada neste lote','Registre uma inseminação na aba Inseminação.') : `
      <table>
        <thead><tr><th>Data</th><th>Número da vaca</th><th>Raça do touro</th><th>Inseminação</th><th>Custo</th></tr></thead>
        <tbody>
          ${itens.map(r=>`
          <tr>
            <td class="mono">${r.data.split('-').reverse().join('/')}</td>
            <td class="mono">${esc(r.numeroVaca)||'—'}</td>
            <td>${RACA_TOURO_LABEL[r.racaTouro]||'—'}</td>
            <td>${QUAL_INSEMINACAO_LABEL[r.qualInseminacao]||'—'}</td>
            <td class="mono">R$ ${fmt(custoReproducao(r))}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      `}
    </div>`;
  }
  if(contexto==='diagnostico'){
    const itens = state.diagnosticos.filter(d=>d.loteId===lote.id).sort((a,b)=>b.data.localeCompare(a.data));
    return `
    <p class="eyebrow" style="margin:0 0 10px;">Diagnósticos deste lote</p>
    <div class="card" style="margin-bottom:22px;">
      ${itens.length===0 ? Empty('Nenhum diagnóstico registrado neste lote','Registre um diagnóstico na aba Diagnóstico Gestacional.') : `
      <table>
        <thead><tr><th>Data</th><th>Número da vaca</th><th>Resultado</th><th>Previsão de parto</th></tr></thead>
        <tbody>
          ${itens.map(d=>`
          <tr>
            <td class="mono">${d.data.split('-').reverse().join('/')}</td>
            <td class="mono">${esc(d.numeroVaca)||'—'}</td>
            <td><span class="pill ${d.resultado==='prenha'?'pill-ok':'pill-cat'}">${RESULTADO_DG_LABEL[d.resultado]||'—'}</span></td>
            <td class="mono">${d.previsaoParto ? d.previsaoParto.split('-').reverse().join('/') : '—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      `}
    </div>`;
  }
  if(contexto==='desmama'){
    const itens = state.desmamas.filter(d=>{ const p = state.partos.find(pp=>pp.id===d.partoId); return p && p.loteId===lote.id; }).sort((a,b)=>b.data.localeCompare(a.data));
    return `
    <p class="eyebrow" style="margin:0 0 10px;">Desmamas deste lote</p>
    <div class="card" style="margin-bottom:22px;">
      ${itens.length===0 ? Empty('Nenhuma desmama registrada neste lote','Registre uma desmama pelo Manejo.') : `
      <table>
        <thead><tr><th>Data</th><th>Número da mãe</th><th>Raça</th><th>Peso</th></tr></thead>
        <tbody>
          ${itens.map(d=>{
            const parto = state.partos.find(p=>p.id===d.partoId);
            return `
          <tr>
            <td class="mono">${d.data.split('-').reverse().join('/')}</td>
            <td class="mono">${esc(parto?.numeroMae)||'—'}</td>
            <td>${RACA_TOURO_LABEL[d.raca]||'—'}</td>
            <td class="mono">${fmt(Number(d.pesoKg),1)} kg</td>
          </tr>`;}).join('')}
        </tbody>
      </table>
      `}
    </div>`;
  }
  if(contexto==='pesagem'){
    const itens = pesagensDoLote(lote.id).slice().sort((a,b)=>b.data.localeCompare(a.data));
    return `
    <p class="eyebrow" style="margin:0 0 10px;">Pesagens deste lote</p>
    <div class="card" style="margin-bottom:22px;">
      ${itens.length===0 ? Empty('Nenhuma pesagem registrada neste lote','Registre uma pesagem pelo Manejo.') : `
      <table>
        <thead><tr><th>Data</th><th>Peso médio</th><th>Observação</th></tr></thead>
        <tbody>
          ${itens.map(p=>`
          <tr>
            <td class="mono">${p.data.split('-').reverse().join('/')}</td>
            <td class="mono">${fmt(Number(p.pesoMedioKg),1)} kg</td>
            <td>${esc(p.observacao)||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      `}
    </div>`;
  }
  return '';
}

// Descreve o preço de uma venda de acordo com o tipo, já que os campos que
// importam mudam (peso+arroba / só valor por animal / peso+valor do kg).
function detalhePrecoVenda(v){
  if(v.tipoVenda==='cabeca') return `R$ ${fmt(v.valorPorAnimal)} / animal`;
  if(v.tipoVenda==='kg') return `${fmt(Number(v.pesoMedioKg),1)} kg vivo × R$ ${fmt(v.valorKg)}/kg`;
  return `${fmt(arrobasVenda(v),2)} @ (${fmt(Number(v.pesoMedioKg),1)} kg carcaça) × R$ ${fmt(v.valorArroba)}/@`;
}

/* ===================== PÁGINA: SAÍDA DE RAÇÃO ===================== */
// Pode ter mais de um trato lançado no mesmo dia pro mesmo lote (manhã,
// tarde etc.) -- agrupa pra mostrar o total do dia numa linha só, com o
// detalhe trato a trato (e o horário de cada um) disponível ao expandir.
// Mantém a ordem de chegada da lista (já vem ordenada por data desc).
function agruparPorDiaLote(lista){
  const grupos = {};
  const ordem = [];
  lista.forEach(item=>{
    const key = item.data+'|'+item.loteId;
    if(!grupos[key]){ grupos[key] = {key, data:item.data, loteId:item.loteId, itens:[]}; ordem.push(key); }
    grupos[key].itens.push(item);
  });
  return ordem.map(key=>grupos[key]);
}
function PageSaidaRacao(tipo){
  const verValor = podeVerPrecoInsumo();
  const filtro = state.filtrosSaidaRacao[tipo] || {mes:'', loteId:'', dietaId:''};
  const listaTipo = state.saidasRacao
    .filter(s=>{ const lote = state.lotes.find(l=>l.id===s.loteId); return lote && loteTipo(lote)===tipo; });
  const lotesTipo = state.lotes.filter(l=>loteTipo(l)===tipo);
  // Dietas que já foram usadas em algum lançamento dessa área -- não dá
  // mais pra filtrar por dieta.tipo, já que qualquer dieta pode ser usada
  // em qualquer área agora.
  const dietasTipo = [...new Set(listaTipo.map(s=>s.dietaId))].map(id=>state.dietas.find(d=>d.id===id)).filter(Boolean);
  const mesesDisponiveis = [...new Set(listaTipo.map(s=>s.data.slice(0,7)))].sort((a,b)=>b.localeCompare(a));
  const list = listaTipo
    .filter(s=> !filtro.mes || s.data.startsWith(filtro.mes))
    .filter(s=> !filtro.loteId || String(s.loteId)===String(filtro.loteId))
    .filter(s=> !filtro.dietaId || String(s.dietaId)===String(filtro.dietaId))
    .sort((a,b)=> b.data.localeCompare(a.data));
  const temFiltro = !!(filtro.mes || filtro.loteId || filtro.dietaId);
  const rv = listaVisivelHoje('racao-'+tipo, list, undefined, temFiltro);
  const vazio = listaTipo.length===0
    ? (tipo==='reproducao'
      ? Empty('Nenhuma saída de ração registrada','Registre a ração feita a partir de uma dieta para os lotes de Cria, para descontar o estoque automaticamente.')
      : Empty('Nenhuma saída de ração registrada','Registre a ração feita a partir de uma dieta para descontar o estoque automaticamente.'))
    : (temFiltro
      ? Empty('Nenhuma saída de ração com esse filtro','Tente outro mês, lote ou dieta.')
      : Empty('Nenhuma saída de ração hoje','Clique em "Ver todos" acima pra ver o histórico completo.'));
  return `
  <div class="field-row" style="flex-wrap:wrap; margin-bottom:14px;">
    <div class="field" style="max-width:200px;">
      <select data-filtro-mes-racao="${tipo}">
        <option value="">Todos os meses</option>
        ${mesesDisponiveis.map(m=>`<option value="${m}" ${filtro.mes===m?'selected':''}>${mesLabel(m)}</option>`).join('')}
      </select>
    </div>
    <div class="field" style="max-width:220px;">
      <select data-filtro-lote-racao="${tipo}">
        <option value="">Todos os lotes</option>
        ${lotesTipo.map(l=>`<option value="${l.id}" ${String(filtro.loteId)===String(l.id)?'selected':''}>${esc(l.nome)}</option>`).join('')}
      </select>
    </div>
    <div class="field" style="max-width:220px;">
      <select data-filtro-dieta-racao="${tipo}">
        <option value="">Todas as dietas</option>
        ${dietasTipo.map(d=>`<option value="${d.id}" ${String(filtro.dietaId)===String(d.id)?'selected':''}>${esc(d.nome)}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="toolbar">
    <span class="hint">${list.length} saída(s) registrada(s)${temFiltro ? ' (filtrado)' : (rv.expandido?'':` · mostrando hoje (${rv.totalHoje})`)}</span>
    ${temFiltro ? '' : botaoToggleLista('racao-'+tipo, rv)}
  </div>
  <div class="card">
    ${rv.itens.length===0 ? vazio : `
    <table>
      <thead><tr>
        <th>Data</th><th>Dieta</th><th>Lote</th><th>Nº animais</th><th>Quantidade</th><th>Ração/animal</th>${verValor?'<th>Custo estimado</th>':''}<th>Lançado por</th><th>Lançado em</th><th></th>
      </tr></thead>
      <tbody>
        ${agruparPorDiaLote(rv.itens).map(g=>{
          const lote = state.lotes.find(l=>l.id===g.loteId);
          const numAnimais = Number(lote?.numeroAnimais||0);
          const racaoPorAnimal = (kg)=> numAnimais>0 ? `${fmt(kg/numAnimais,1)} kg` : '—';
          const linhaEntrada = (s, dentroDoGrupo)=>{
            const dieta = state.dietas.find(d=>d.id===s.dietaId);
            const custo = dieta ? calcDieta(dieta).custoKg * s.quantidadeKg : 0;
            return `<tr>
              <td class="mono">${dentroDoGrupo ? '' : s.data.split('-').reverse().join('/')}</td>
              <td>${dieta?esc(dieta.nome):'—'}</td>
              <td>${dentroDoGrupo ? '' : (lote?esc(lote.nome):'—')}</td>
              <td class="mono">${dentroDoGrupo ? '' : (numAnimais>0?fmtInt(numAnimais):'—')}</td>
              <td class="mono">${fmtInt(s.quantidadeKg)} kg</td>
              <td class="mono">${racaoPorAnimal(s.quantidadeKg)}</td>
              ${verValor?`<td class="mono">R$ ${fmt(custo)}</td>`:''}
              <td>${esc(s.criadoPor) || '—'}</td>
              <td class="mono">${s.criadoEm ? new Date(s.criadoEm).toLocaleString('pt-BR') : '—'}</td>
              <td style="display:flex; gap:6px;">
                ${temPermissao(tipo==='reproducao'?'cria':tipo,'editar') ? `
                ${!souColaborador() ? `<button class="btn-ghost btn-sm" data-edit-racao="${s.id}">Editar</button>` : ''}
                ${!souColaborador() ? `<button class="btn-danger-ghost" data-del-racao="${s.id}">Excluir</button>` : ''}
                ` : ''}
              </td>
            </tr>`;
          };
          if(g.itens.length===1) return linhaEntrada(g.itens[0], false);
          const totalKg = g.itens.reduce((a,s)=>a+Number(s.quantidadeKg||0),0);
          const totalCusto = g.itens.reduce((a,s)=>{ const dieta = state.dietas.find(d=>d.id===s.dietaId); return a + (dieta ? calcDieta(dieta).custoKg * s.quantidadeKg : 0); },0);
          const dietasDoGrupo = [...new Set(g.itens.map(s=>s.dietaId))];
          const nomeDieta = dietasDoGrupo.length===1 ? (state.dietas.find(d=>d.id===dietasDoGrupo[0])?.nome) : null;
          const expandido = !!state.gruposRacaoExpandidos[g.key];
          return `<tr>
            <td class="mono">${g.data.split('-').reverse().join('/')}</td>
            <td>${nomeDieta ? esc(nomeDieta) : `<span class="hint">Várias dietas</span>`}</td>
            <td>${lote?esc(lote.nome):'—'}</td>
            <td class="mono">${numAnimais>0?fmtInt(numAnimais):'—'}</td>
            <td class="mono"><strong>${fmtInt(totalKg)} kg</strong></td>
            <td class="mono"><strong>${racaoPorAnimal(totalKg)}</strong></td>
            ${verValor?`<td class="mono"><strong>R$ ${fmt(totalCusto)}</strong></td>`:''}
            <td colspan="2"><button class="btn-ghost btn-sm" data-toggle-grupo-racao="${g.key}">${g.itens.length} trato(s) ${expandido?'▲':'▼'}</button></td>
            <td></td>
          </tr>
          ${expandido ? g.itens
            .slice()
            .sort((a,b)=> (a.criadoEm||'').localeCompare(b.criadoEm||''))
            .map(s=>linhaEntrada(s, true)).join('') : ''}`;
        }).join('')}
      </tbody>
    </table>`}
  </div>`;
}

function custoPasto(p){
  const dieta = state.dietas.find(d=>d.id===p.dietaId);
  return dieta ? calcDieta(dieta).custoKg * p.quantidade : 0;
}
function PagePasto(){
  const verValor = podeVerPrecoInsumo();
  const filtro = state.filtrosSaidaRacao['pasto'] || {mes:'', loteId:'', dietaId:''};
  const listaTipo = state.pasto
    .filter(p=>{ const lote = state.lotes.find(l=>l.id===p.loteId); return lote && loteTipo(lote)==='pasto'; });
  const lotesTipo = state.lotes.filter(l=>loteTipo(l)==='pasto');
  // Dietas que já foram usadas em algum lançamento de Pasto -- não dá mais
  // pra filtrar por dieta.tipo, já que qualquer dieta pode ser usada em
  // qualquer área agora.
  const dietasTipo = [...new Set(listaTipo.map(p=>p.dietaId))].map(id=>state.dietas.find(d=>d.id===id)).filter(Boolean);
  const mesesDisponiveis = [...new Set(listaTipo.map(p=>p.data.slice(0,7)))].sort((a,b)=>b.localeCompare(a));
  const list = listaTipo
    .filter(p=> !filtro.mes || p.data.startsWith(filtro.mes))
    .filter(p=> !filtro.loteId || String(p.loteId)===String(filtro.loteId))
    .filter(p=> !filtro.dietaId || String(p.dietaId)===String(filtro.dietaId))
    .sort((a,b)=> b.data.localeCompare(a.data));
  const temFiltro = !!(filtro.mes || filtro.loteId || filtro.dietaId);
  // Só colapsa pra "só hoje" quando não tem filtro ativo -- se a pessoa já
  // filtrou por mês/lote/dieta, ela está procurando algo específico, não
  // faz sentido esconder atrás de "Ver todos".
  const rv = listaVisivelHoje('pasto', list, undefined, temFiltro);
  const vazio = listaTipo.length===0
    ? Empty('Nenhuma saída de ração (Pasto) registrada','Registre a mistura/dieta de pasto colocada no cocho de cada lote.')
    : (temFiltro
      ? Empty('Nenhuma saída de ração (Pasto) com esse filtro','Tente outro mês, lote ou dieta.')
      : Empty('Nenhuma saída de ração (Pasto) hoje','Clique em "Ver todos" acima pra ver o histórico completo.'));
  return `
  <div class="field-row" style="flex-wrap:wrap; margin-bottom:14px;">
    <div class="field" style="max-width:200px;">
      <select data-filtro-mes-racao="pasto">
        <option value="">Todos os meses</option>
        ${mesesDisponiveis.map(m=>`<option value="${m}" ${filtro.mes===m?'selected':''}>${mesLabel(m)}</option>`).join('')}
      </select>
    </div>
    <div class="field" style="max-width:220px;">
      <select data-filtro-lote-racao="pasto">
        <option value="">Todos os lotes</option>
        ${lotesTipo.map(l=>`<option value="${l.id}" ${String(filtro.loteId)===String(l.id)?'selected':''}>${esc(l.nome)}</option>`).join('')}
      </select>
    </div>
    <div class="field" style="max-width:220px;">
      <select data-filtro-dieta-racao="pasto">
        <option value="">Todas as dietas</option>
        ${dietasTipo.map(d=>`<option value="${d.id}" ${String(filtro.dietaId)===String(d.id)?'selected':''}>${esc(d.nome)}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="toolbar">
    <span class="hint">${list.length} saída(s) de ração (Pasto) registrada(s)${temFiltro ? ' (filtrado)' : (rv.expandido?'':` · mostrando hoje (${rv.totalHoje})`)}</span>
    ${temFiltro ? '' : botaoToggleLista('pasto', rv)}
  </div>
  <div class="card">
    ${rv.itens.length===0 ? vazio : `
    <table>
      <thead><tr>
        <th>Data</th><th>Lote</th><th>Nº animais</th><th>Dieta de pasto</th><th>Quantidade</th><th>Ração/animal</th>${verValor?'<th>Custo estimado</th>':''}<th>Lançado por</th><th></th>
      </tr></thead>
      <tbody>
        ${agruparPorDiaLote(rv.itens.map(p=>({...p, quantidadeKg:p.quantidade}))).map(g=>{
          const lote = state.lotes.find(l=>l.id===g.loteId);
          const numAnimais = Number(lote?.numeroAnimais||0);
          const racaoPorAnimal = (kg)=> numAnimais>0 ? `${fmt(kg/numAnimais,1)} kg` : '—';
          const linhaEntrada = (p, dentroDoGrupo)=>{
            const dieta = state.dietas.find(d=>d.id===p.dietaId);
            return `<tr>
              <td class="mono">${dentroDoGrupo ? '' : p.data.split('-').reverse().join('/')}</td>
              <td>${dentroDoGrupo ? '' : (lote?esc(lote.nome):'—')}</td>
              <td class="mono">${dentroDoGrupo ? '' : (numAnimais>0?fmtInt(numAnimais):'—')}</td>
              <td>${dieta?esc(dieta.nome):'—'}</td>
              <td class="mono">${fmtInt(p.quantidade)} kg</td>
              <td class="mono">${racaoPorAnimal(p.quantidade)}</td>
              ${verValor?`<td class="mono">R$ ${fmt(custoPasto(p))}</td>`:''}
              <td>${esc(p.criadoPor) || '—'}</td>
              <td style="display:flex; gap:6px;">
                ${temPermissao('pasto','editar') ? `
                <button class="btn-ghost btn-sm" data-edit-pasto="${p.id}">Editar</button>
                ${!souColaborador() ? `<button class="btn-danger-ghost" data-del-pasto="${p.id}">Excluir</button>` : ''}
                ` : ''}
              </td>
            </tr>`;
          };
          if(g.itens.length===1) return linhaEntrada(g.itens[0], false);
          const totalKg = g.itens.reduce((a,p)=>a+Number(p.quantidade||0),0);
          const totalCusto = g.itens.reduce((a,p)=>a+custoPasto(p),0);
          const dietasDoGrupo = [...new Set(g.itens.map(p=>p.dietaId))];
          const nomeDieta = dietasDoGrupo.length===1 ? (state.dietas.find(d=>d.id===dietasDoGrupo[0])?.nome) : null;
          const expandido = !!state.gruposRacaoExpandidos[g.key];
          return `<tr>
            <td class="mono">${g.data.split('-').reverse().join('/')}</td>
            <td>${lote?esc(lote.nome):'—'}</td>
            <td class="mono">${numAnimais>0?fmtInt(numAnimais):'—'}</td>
            <td>${nomeDieta ? esc(nomeDieta) : `<span class="hint">Várias dietas</span>`}</td>
            <td class="mono"><strong>${fmtInt(totalKg)} kg</strong></td>
            <td class="mono"><strong>${racaoPorAnimal(totalKg)}</strong></td>
            ${verValor?`<td class="mono"><strong>R$ ${fmt(totalCusto)}</strong></td>`:''}
            <td colspan="2"><button class="btn-ghost btn-sm" data-toggle-grupo-racao="${g.key}">${g.itens.length} trato(s) ${expandido?'▲':'▼'}</button></td>
          </tr>
          ${expandido ? g.itens.map(p=>linhaEntrada(p, true)).join('') : ''}`;
        }).join('')}
      </tbody>
    </table>`}
  </div>`;
}

function PainelResumoDiagnostico(lotesReprod){
  if(lotesReprod.length===0) return '';

    const prenha = dgs.filter(d=>d.resultado==='prenha').length;
    const vazia = dgs.filter(d=>d.resultado==='vazia').length;

  return `

function PainelResumoDesmama(lotesElegiveis){
  if(lotesElegiveis.length===0) return '';
  const linhas = lotesElegiveis.map(l=>{
    const desmamasLote = state.desmamas.filter(d=>{ const p=state.partos.find(pp=>pp.id===d.partoId); return p && p.loteId===l.id; });
    const pesoMedio = desmamasLote.length>0 ? desmamasLote.reduce((a,d)=>a+Number(d.pesoKg||0),0)/desmamasLote.length : null;
    return {lote:l, total:desmamasLote.length, pesoMedio};
  });
  return `
  <div class="card" style="margin-bottom:22px;">
    <table>
      <thead><tr><th>Lote</th><th>Total desmamado</th><th>Peso médio de desmama</th></tr></thead>
      <tbody>
        ${linhas.map(r=>`
          <tr>
            <td><button class="link-nome" data-ver-lote="${r.lote.id}">${esc(r.lote.nome)}</button></td>
            ${r.total===0 ? `<td class="mono" colspan="2">Nenhuma desmama registrada ainda</td>` : `
            <td class="mono">${fmtInt(r.total)}</td>
            <td class="mono">${fmt(r.pesoMedio,1)} kg</td>
            `}
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>`;
}

// Painel de resultado dos lotes: resumo (peso inicial x atual, ganho,
// GMD médio e @ produzidas) de cada lote lado a lado, sem precisar
// escolher/filtrar um lote de cada vez pra ver o resultado.
function PainelResultadoLotes(lotesTipo){
  const linhas = lotesTipo.map(l=>{
    const historico = pesagensDoLote(l.id);
    if(historico.length===0) return {lote:l, semDados:true};
    const primeira = historico[0], ultima = historico[historico.length-1];
    const ganhoTotal = Number(ultima.pesoMedioKg) - Number(primeira.pesoMedioKg);
    const gmdMedio = gmdEntre(Number(primeira.pesoMedioKg), Number(ultima.pesoMedioKg), primeira.data, ultima.data);
    const arrobaPorAnimal = ganhoTotal/KG_POR_ARROBA;
    const arrobaTotal = arrobaPorAnimal * Number(l.numeroAnimais||0);
    return {lote:l, semDados:false, primeira, ultima, ganhoTotal, gmdMedio, arrobaTotal};
  });
  return `
  <div class="card">
    <table>
      <thead><tr>
        <th>Lote</th><th>Nº animais</th><th>Peso inicial</th><th>Peso atual</th><th>Ganho no período</th><th>GMD médio</th><th>@ produzidas</th>
      </tr></thead>
      <tbody>
        ${linhas.map(r=>`
          <tr>
            <td><button class="link-nome" data-ver-lote="${r.lote.id}">${esc(r.lote.nome)}</button></td>
            <td class="mono">${fmtInt(r.lote.numeroAnimais)}</td>
            ${r.semDados ? `<td class="mono" colspan="5">Nenhuma pesagem registrada ainda</td>` : `
            <td class="mono">${fmt(Number(r.primeira.pesoMedioKg),1)} kg <span class="hint">(${r.primeira.data.split('-').reverse().join('/')})</span></td>
            <td class="mono">${fmt(Number(r.ultima.pesoMedioKg),1)} kg <span class="hint">(${r.ultima.data.split('-').reverse().join('/')})</span></td>
            <td class="mono">${r.ganhoTotal>=0?'+':''}${fmt(r.ganhoTotal,1)} kg</td>
            <td class="mono">${r.gmdMedio!==null?fmt(r.gmdMedio,3)+' kg/dia':'—'}</td>
            <td class="mono">${fmt(r.arrobaTotal,1)} @</td>
            `}
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>
  <p class="hint" style="margin:10px 0 18px;">Ganho e @ produzidas contam desde a primeira pesagem lançada de cada lote até a mais recente. 1 @ ≈ ${KG_POR_ARROBA} kg de peso vivo ganho.</p>`;
}

function PagePesagem(tipo){

  }

  const pesagensTipo = state.pesagens.filter(p=>{
    const lote = state.lotes.find(l=>l.id===p.loteId);
    return lote && loteTipo(lote)===tipo;
  }).sort((a,b)=> b.data.localeCompare(a.data) || b.id-a.id);
  const rv = listaVisivelHoje('pesagem-'+tipo, pesagensTipo);

  return `

    ${rv.itens.length===0 ? (pesagensTipo.length===0 ? Empty('Nenhuma pesagem registrada', 'Registre a pesagem de um lote pelo Manejo.') : Empty('Nenhuma pesagem hoje','Clique em "Ver todos" acima pra ver o histórico completo.')) : `
    <table>
      <thead><tr><th>Lote</th><th>Data</th><th>Peso médio</th><th>GMD desde a anterior</th><th>Animais pesados</th><th>Observação</th><th>Lançado por</th><th></th></tr></thead>
      <tbody>
        ${rv.itens.map(p=>{
          const lote = state.lotes.find(l=>l.id===p.loteId);
          const historico = lote ? pesagensDoLote(lote.id) : [];
          const idx = historico.findIndex(h=>h.id===p.id);

          const detalhesAnimais = state.pesagensAnimais.filter(pa=>pa.pesagemId===p.id);
          return `<tr>
            <td><strong>${lote?esc(lote.nome):'—'}</strong></td>

            <td class="mono">${gmd!==null ? (gmd>=0?'+':'')+fmt(gmd,2)+' kg/dia' : '—'}</td>
            <td>${detalhesAnimais.length>0 ? `<button class="btn-ghost btn-sm" data-toggle-pesagem-animais="${p.id}">${detalhesAnimais.length} animal(is) ${state.pesagemExpandidaId===p.id?'▲':'▼'}</button>` : '—'}</td>
            <td>${esc(p.observacao)||'—'}</td>
            <td>${esc(p.criadoPor) || '—'}</td>
            <td style="display:flex; gap:6px;">
              ${temPermissao(TIPO_MODULO[tipo],'editar') ? `
              <button class="btn-ghost btn-sm" data-edit-pesagem="${p.id}">Editar</button>
              ${!souColaborador() ? `<button class="btn-danger-ghost" data-del-pesagem="${p.id}">Excluir</button>` : ''}

            <table style="margin:4px 0;">
              <thead><tr><th>Número do animal</th><th>Peso</th></tr></thead>
              <tbody>${detalhesAnimais.map(pa=>`<tr><td class="mono">${esc(pa.numeroAnimal)}</td><td class="mono">${fmt(Number(pa.pesoKg),1)} kg</td></tr>`).join('')}</tbody>

function custoSaidaRacao(s){
  const dieta = state.dietas.find(d=>d.id===s.dietaId);
  return dieta ? calcDieta(dieta).custoKg * s.quantidadeKg : 0;
}
// Data/mês de hoje no fuso horário local do aparelho -- toISOString() sempre
// devolve em UTC, que diverge da data local desde a meia-noite UTC até a
// meia-noite local (no Brasil, UTC-3, isso é todo santo dia entre ~21h e
// 23h59: o dia já virou em UTC mas ainda é "hoje" pra quem está lançando).
// Usar toISOString() aqui fazia todo "hoje" (inclusive o colapso de listas
// pra "só hoje") ficar um dia adiantado nesse intervalo.
function hojeStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function mesAtualStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

// Colapsa uma lista de lançamentos pra mostrar só os de hoje por padrão --
// evita rolar uma lista longa só pra ver o que foi lançado agora. listId
// identifica a lista (uma chave fixa por aba) pra lembrar se o usuário já
// expandiu ela. dataField é o nome do campo de data em cada item (a
// maioria usa "data"; alguns registros de investimento usam o mesmo nome).
// bypass pula o colapso e devolve a lista inteira já "expandida" -- usado
// nas telas que já têm filtro de mês/lote/dieta próprio (Saída de Ração,
// Pasto): se a pessoa já filtrou por algo específico, não faz sentido
// esconder atrás de "Ver todos" de novo.
function listaVisivelHoje(listId, listaCompleta, dataAcessor, bypass){
  if(bypass) return {itens:listaCompleta, expandido:true, totalHoje:0, total:listaCompleta.length};
  const getData = typeof dataAcessor==='function' ? dataAcessor : (x=>x[dataAcessor||'data']);
  const expandido = !!state.listasExpandidas[listId];
  const hoje = hojeStr();
  const listaHoje = listaCompleta.filter(x=>getData(x)===hoje);
  return {
    itens: expandido ? listaCompleta : listaHoje,
    expandido,
    totalHoje: listaHoje.length,
    total: listaCompleta.length,
  };
}
// Botão "Ver todos (N)" / "Mostrar só hoje" -- some quando não há nada pra
// alternar (lista vazia).
function botaoToggleLista(listId, r){
  if(r.total===0) return '';
  return `<button class="btn-ghost btn-sm" data-toggle-lista="${listId}">${r.expandido ? 'Mostrar só hoje' : `Ver todos (${fmtInt(r.total)})`}</button>`;
}

/* paleta categórica validada (fixa, nunca ciclada) */
const SERIES_COLORS = ['#2a78d6','#008300','#e87ba4','#eda100','#1baf7a','#eb6834','#4a3aa7','#e34948'];

// A cor segue sempre a mesma categoria (nunca a posição no ranking do mês),
// para não trocar de cor quando um custo cresce/encolhe em relação aos outros.
// São dois gráficos com jobs diferentes — não fazem sentido misturados no
// mesmo painel: um compara as áreas de produção (Confinamento/Pasto/Cria),
// o outro compara os centros de custo fixo (Pessoal, Manutenção etc.).
const AREAS_PRODUCAO = ['Confinamento','Pasto','Cria'];
function coresPorArea(){
  const mapa = {};
  AREAS_PRODUCAO.forEach((nome,idx)=>{ mapa[nome] = SERIES_COLORS[idx]; });
  return mapa;
}
// No painel global, Confinamento/Pasto/Cria têm cor fixa reservada (mesma dos
// outros gráficos); as categorias de custo fixo (texto livre) recebem uma cor
// por ordem alfabética nos slots restantes, sem repetir cor entre elas.
// Centros de custo fixo têm cor própria (ordem alfabética) — não precisam
// reservar slots para Confinamento/Pasto/Cria porque esse gráfico não mistura
// os dois eixos (área x centro de custo): cada real do custo fixo pertence a
// exatamente uma categoria aqui, sem sobrepor com o gráfico de área.
function coresPorCentroCusto(nomes){
  const mapa = {};
  const unicos = [...new Set(nomes)].sort();
  unicos.forEach((nome,idx)=>{ mapa[nome] = SERIES_COLORS[idx % SERIES_COLORS.length]; });
  return mapa;
}

// Cada área (Confinamento/Pasto/Cria) já vem com o custo fixo diluído por
// cabeça somado (mesmo critério do Por Curral), então as 3 fatias juntas
// somam 100% do custo total do mês — sem precisar repetir os centros de
// custo fixo como fatias à parte.
function composicaoPorArea(confMes, pastoMes, criaMes, detalhesPorArea){
  detalhesPorArea = detalhesPorArea || {confinamento:[], pasto:[], cria:[]};
  const grupos = {};
  if(confMes>0) grupos['Confinamento'] = {valor:confMes, itens:detalhesPorArea.confinamento};
  if(pastoMes>0) grupos['Pasto'] = {valor:pastoMes, itens:detalhesPorArea.pasto};
  if(criaMes>0) grupos['Cria'] = {valor:criaMes, itens:detalhesPorArea.cria};
  let entries = Object.entries(grupos).map(([nome,g])=>({nome, valor:g.valor, itens:g.itens}));
  entries.sort((a,b)=>b.valor-a.valor);
  const cores = coresPorArea();
  const total = entries.reduce((a,e)=>a+e.valor,0);
  return entries.map(e=>({...e, pct: total>0 ? e.valor/total*100 : 0, cor: cores[e.nome]}));
}

// Painel de despesas por centro de custo — só o que está cadastrado em
// Despesas, sem misturar com o lançamento diário de ração/pasto/cria (que
// é custo operacional do dia a dia, já mostrado em Financeiro).
// Só os centros de custo desta lista aparecem como fatia própria no
// gráfico — qualquer outro nome, por maior ou menor que seja seu valor no
// mês/ano, cai em "Outros". Lista fixa escolhida pelo usuário (revisou
// todos os centros de custo cadastrados e escolheu os principais).
// Precisa ser o nome EXATO que fica salvo em categoria (mesma string de
// CENTROS_CUSTO_SUGERIDOS) -- a comparação abaixo é exata, então uma
// versão abreviada aqui (ex: "Armazenagem e Logística" sem o "&") nunca
// batia com o que era de fato salvo ("Armazenagem & Logística"), e a
// despesa caía sempre em "Outros" mesmo sendo de uma categoria principal.
// "Nutrição Animal" não tem correspondente em CENTROS_CUSTO_SUGERIDOS --
// mantido como está (pode ser um nome digitado à mão em despesas
// existentes; ajuste aqui se não for o nome real usado).
const CENTRO_CUSTO_SEMPRE_VISIVEL = [
  'Terceirização de Serviços Agropecuários',
  'Mão-de-obra de Operacional',
  'Combustíveis da Operação Agropecuária',
  'Insumos Agrícolas',
  'Nutrição Animal',
  'Manutenção de Tratores, Caminhões, Máquinas, Equipamentos e Implementos',
  'Serviços Profissionais',
  'Armazenagem & Logística',
  'Insumos Pecuários',
  'Manutenção e Reparo de Infraestruturas',
  'Refeitório, Restaurantes & Alimentação',
  'Serviços Técnicos Profissionais (Consultorias de Campo)',
  'Energia Elétrica de Infraestrutura Operacional',
];

function composicaoCentrosCusto(custosFixos, extras){
  const grupos = {};
  custosFixos.forEach(c=>{
    const cat = (c.categoria||'').trim() || 'Outros';
    if(!grupos[cat]) grupos[cat] = {valor:0, itens:[]};
    grupos[cat].valor += Number(c.valorMensal||0);
    grupos[cat].itens.push({id:c.id, nome:c.nome, mes:c.mes, valor:Number(c.valorMensal||0)});
  });
  (extras||[]).forEach(e=>{
    if(!grupos[e.nome]) grupos[e.nome] = {valor:0, itens:[]};
    grupos[e.nome].valor += Number(e.valor||0);
  });
  let entries = Object.entries(grupos).map(([nome,g])=>({nome, valor:g.valor, itens:g.itens})).filter(e=>e.valor>0);
  // Regra fixa (não por ranking de valor): só os nomes da lista aparecem
  // como fatia própria; qualquer outro nome cai em "Outros", nunca ganha
  // fatia própria mesmo que seja o maior valor do mês/ano — assim o
  // conjunto de fatias do gráfico não muda sozinho de um mês pro outro.
  let principais = entries.filter(e=>CENTRO_CUSTO_SEMPRE_VISIVEL.includes(e.nome));
  let resto = entries.filter(e=>!CENTRO_CUSTO_SEMPRE_VISIVEL.includes(e.nome));
  // A paleta de cores só tem SERIES_COLORS.length tons distintos -- com mais
  // fatias que isso (contando a própria "Outros", quando existir), duas
  // fatias diferentes acabavam com a mesma cor (a cor só repete depois de
  // esgotar a paleta). Se um mês tiver mais "principais" com valor do que
  // cores disponíveis, as de menor valor caem em "Outros" também (só nesse
  // mês) em vez de duas fatias ficarem visualmente idênticas.
  const vaiTerOutros = resto.length>0 || principais.length > SERIES_COLORS.length;
  const maxPrincipais = vaiTerOutros ? SERIES_COLORS.length-1 : SERIES_COLORS.length;
  if(principais.length > maxPrincipais){
    principais.sort((a,b)=>b.valor-a.valor);
    resto = [...resto, ...principais.slice(maxPrincipais)];
    principais = principais.slice(0, maxPrincipais);
  }
  const restoValor = resto.reduce((a,e)=>a+e.valor,0);
  const restoItens = [].concat(...resto.map(e=>e.itens));
  entries = [...principais];
  if(restoValor>0) entries.push({nome:'Outros', valor:restoValor, itens:restoItens});
  entries.sort((a,b)=>b.valor-a.valor);
  const cores = coresPorCentroCusto(entries.map(e=>e.nome));
  const total = entries.reduce((a,e)=>a+e.valor,0);
  return entries.map(e=>({...e, pct: total>0 ? e.valor/total*100 : 0, cor: cores[e.nome]}));
}

function polarXY(cx, cy, r, ang){ return [cx + r*Math.sin(ang), cy - r*Math.cos(ang)]; }
function donutSlicePath(cx, cy, rOut, rIn, a0, a1){
  const largeArc = (a1-a0) > Math.PI ? 1 : 0;
  const [x0,y0] = polarXY(cx,cy,rOut,a0);
  const [x1,y1] = polarXY(cx,cy,rOut,a1);
  const [x2,y2] = polarXY(cx,cy,rIn,a1);
  const [x3,y3] = polarXY(cx,cy,rIn,a0);
  return `M ${x0} ${y0} A ${rOut} ${rOut} 0 ${largeArc} 1 ${x1} ${y1} L ${x2} ${y2} A ${rIn} ${rIn} 0 ${largeArc} 0 ${x3} ${y3} Z`;
}

// O total usado pro donut (ângulo das fatias e valor no centro) vem sempre
// da soma das próprias entries — nunca de um total externo — pra garantir
// que as fatias sempre fechem o círculo e batam com os % da legenda, mesmo
// que o chamador tenha um "total geral" que inclua algo fora dessas entries
// (ex: um custo fixo não diluído por área, que não aparece no gráfico "por área").
function PainelResultados(entries, panelId, eyebrow, titulo, vazioMsg, labelPeriodo){
  labelPeriodo = labelPeriodo || 'no mês';
  // Guarda os dados desse painel (com o detalhe despesa-por-despesa de cada
  // fatia) pra o clique numa fatia/linha da legenda poder abrir o detalhe —
  // a única forma de recuperar isso depois, já que o SVG em si só tem o
  // índice da fatia, não os dados.
  state.paineisResultadosDados[panelId] = entries;
  if(entries.length===0){
    return `<div class="card" style="margin-bottom:22px;">${Empty(`Sem custos ${labelPeriodo==='no ano'?'no ano':'no mês'} para compor o gráfico`, vazioMsg)}</div>`;
  }
  const totalPeriodo = entries.reduce((a,e)=>a+e.valor,0);
  const cx=110, cy=110, rOut=100, rIn=64;
  const gap = entries.length>1 ? 0.025 : 0;
  let angle = 0;
  const slices = entries.map((e,idx)=>{
    const frac = totalPeriodo>0 ? e.valor/totalPeriodo : 0;
    const sweep = frac*Math.PI*2;
    const a0 = angle + gap/2;
    const a1 = angle + sweep - gap/2;
    angle += sweep;
    const path = donutSlicePath(cx,cy,rOut,rIn,a0,a1);
    const midAngle = (a0+a1)/2;
    const [lx,ly] = polarXY(cx,cy,(rOut+rIn)/2,midAngle);
    const showLabel = e.pct>=6;
    return `
      <path class="donut-slice" data-slice-idx="${panelId}-${idx}" data-tip-nome="${esc(e.nome)}" data-tip-valor="${fmt(e.valor)}" data-tip-pct="${fmt(e.pct,1)}"
        d="${path}" fill="${e.cor}" tabindex="0" role="img" aria-label="${esc(e.nome)}: R$ ${fmt(e.valor)}, ${fmt(e.pct,1)}% ${labelPeriodo}"></path>
      ${showLabel ? `<text class="donut-label" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${fmt(e.pct,0)}%</text>` : ''}
    `;
  }).join('');

  const legenda = entries.map((e,idx)=>`
    <div class="legenda-row" data-legenda-idx="${panelId}-${idx}">
      <span class="legenda-swatch" style="background:${e.cor}"></span>
      <span class="legenda-nome">${esc(e.nome)}</span>
      <span class="legenda-valor">R$ ${fmt(e.valor)}</span>
      <span class="legenda-pct">${fmt(e.pct,1)}%</span>
    </div>
  `).join('');

  return `
  <div class="card" style="margin-bottom:22px;">
    <div class="card-pad">
      <p class="eyebrow" style="margin:0 0 4px;">${eyebrow}</p>
      <h3 style="font-family:'Fraunces',serif; font-size:16px; color:var(--verde-escuro); margin:0 0 ${labelPeriodo==='no ano'?'4px':'16px'};">${titulo}</h3>
      ${labelPeriodo==='no ano' ? `<p class="hint" style="margin:0 0 16px;">Estimativa: soma, mês a mês, a despesa real cadastrada quando existe ou o valor recorrente atual como substituto — não é o gasto já efetivamente lançado, e sim uma projeção pro ano.</p>` : ''}
      <div class="painel-resultados">
        <div class="donut-wrap">
          <svg class="donut-svg" viewBox="0 0 220 220" width="220" height="220">
            ${slices}
            <text class="donut-center-value" x="110" y="104" text-anchor="middle">R$ ${fmt(totalPeriodo,0)}</text>
            <text class="donut-center-label" x="110" y="123" text-anchor="middle">${labelPeriodo}</text>
          </svg>
        </div>
        <div class="painel-legenda">${legenda}</div>
      </div>
    </div>
  </div>`;
}

// Saída de Ração é uma tabela só, compartilhada entre lotes de Confinamento e
// de Cria; para separar os dois no painel de resultados, é preciso checar o
// tipo do lote de destino de cada lançamento.
function racaoLoteTipo(s){ const lote = state.lotes.find(l=>l.id===s.loteId); return lote ? loteTipo(lote) : null; }

// 1 arroba ≈ 30 kg de peso vivo ganho (padrão de mercado — a arroba em si é
// uma medida de carcaça de 15 kg, mas o rendimento de carcaça de boi gordo
// gira em torno de 50%, então 30 kg de peso vivo vira ~1 @ de carcaça).
const KG_POR_ARROBA = 30;

// Numa venda por abate, o peso lançado é o peso de CARCAÇA vindo do
// frigorífico (não peso vivo) — então a conversão usa a arroba "cheia" de
// 15 kg, sem o desconto de rendimento de carcaça usado na Pesagem (que
// parte de peso vivo).
const KG_POR_ARROBA_CARCACA = 15;
const TIPO_VENDA_LABEL = {arroba:'Abate', cabeca:'Venda por animal', kg:'Venda por kg'};
const CATEGORIA_VENDA_LABEL = {bezerro:'Bezerro', abate:'Abate', venda_viva:'Venda viva'};
// Campos de peso/valor da Venda aceitam vírgula decimal (padrão brasileiro) —
// Number('480,5') dá NaN, então esses campos passam por aqui em vez de Number()
// direto. Valores já numéricos (vindos do banco) passam direto, sem mudança.
function numDecimal(v){
  if(typeof v === 'number') return v;
  if(v==null || v==='') return 0;
  return Number(String(v).replace(',','.')) || 0;
}
// Só faz sentido calcular @ na venda por abate (tipoVenda==='arroba') — nos
// outros dois tipos o preço já não depende de arroba nenhuma.
// O frigorífico já manda o total de @ pronto no relatório (rendimento de
// carcaça calculado por eles) — o formulário lança esse valor direto
// (v.arrobasTotais). pesoMedioKg fica só no rascunho de venda carregado do
// banco (venda já salva, sem o campo de digitação), daí o fallback.
function arrobasVenda(v){
  if(v.arrobasTotais!=null && v.arrobasTotais!=='') return numDecimal(v.arrobasTotais);
  return (numDecimal(v.pesoMedioKg)/KG_POR_ARROBA_CARCACA) * Number(v.quantidade||0);
}
// Valor total de uma venda, de acordo com o tipo escolhido:
// - 'arroba' (abate): arrobas de carcaça × valor da arroba paga.
// - 'cabeca' (venda por animal): valor fechado por animal × quantidade.
// - 'kg' (venda por peso vivo): peso por animal × quantidade × valor do kg.
function valorVenda(v){
  const qtd = Number(v.quantidade||0);
  if(v.tipoVenda==='cabeca') return qtd * numDecimal(v.valorPorAnimal);
  if(v.tipoVenda==='kg') return qtd * numDecimal(v.pesoMedioKg) * numDecimal(v.valorKg);
  return arrobasVenda(v) * numDecimal(v.valorArroba);
}

// Ignora pesagens com peso 0 -- é o placeholder que o Manejo cria de
// antemão pra "Pesagem" (antes de qualquer animal ser pesado de fato) e
// nunca é um peso real. Se o manejo for abandonado antes de pesar alguém
// (perda de conexão, fechar o app no meio do curral), esse placeholder
// fica parado com peso 0 pra sempre -- contá-lo como "peso inicial/final"
// zerava o ganho de peso e inflava @ produzidas/lote. Ele continua
// aparecendo normalmente na listagem de lançamentos (pra dar pra editar
// ou excluir), só não entra nas contas de ganho de peso.
function pesagensDoLote(loteId){
  return state.pesagens.filter(p=>p.loteId===loteId && Number(p.pesoMedioKg)>0).sort((a,b)=> a.data.localeCompare(b.data) || a.id-b.id);
}
// Ganho de peso (kg/dia) entre duas pesagens consecutivas do mesmo lote.
function gmdEntre(pesoAnterior, pesoAtual, dataAnterior, dataAtual){
  const dias = (new Date(dataAtual) - new Date(dataAnterior)) / 86400000;
  return dias>0 ? (pesoAtual-pesoAnterior)/dias : null;
}
// Peso do lote na pesagem mais recente até (incluirIgual=true) ou antes de
// (incluirIgual=false) uma data — usado pra "ganho de peso dentro do mês",
// que precisa do peso mais próximo de antes do mês começar.
function pesoNaData(loteId, dataLimite, incluirIgual){
  let resultado = null;
  pesagensDoLote(loteId).forEach(p=>{
    if(incluirIgual ? p.data<=dataLimite : p.data<dataLimite) resultado = p;
  });
  return resultado;
}
// Ganho de peso do lote dentro de um mês: usa a pesagem mais recente até o
// fim do mês menos a pesagem mais recente antes do mês começar; sem pesagem
// anterior ao mês, cai pra primeira x última pesagem dentro do próprio mês
// (se houver ao menos duas). Sem dado suficiente, retorna null.
function ganhoPesoNoMes(loteId, mesStr){
  const ano = Number(mesStr.slice(0,4)), mes = Number(mesStr.slice(5,7));
  const fimMes = new Date(ano, mes, 0).toISOString().slice(0,10);
  const inicioMes = `${mesStr}-01`;
  const final = pesoNaData(loteId, fimMes, true);
  if(!final) return null;
  let inicial = pesoNaData(loteId, inicioMes, false);
  if(!inicial){
    const doMes = state.pesagens.filter(p=>p.loteId===loteId && p.data.startsWith(mesStr) && Number(p.pesoMedioKg)>0).sort((a,b)=>a.data.localeCompare(b.data));
    if(doMes.length<2) return null;
    inicial = doMes[0];
  }
  if(inicial.data>=final.data) return null;
  return {ganhoKg: Number(final.pesoMedioKg)-Number(inicial.pesoMedioKg), dataInicial:inicial.data, dataFinal:final.data};
}
// @ produzidas por um lote num mês = ganho de peso (kg) ÷ 30 × nº de animais.
function arrobasProduzidasNoMes(loteId, mesStr, numeroAnimais){
  const ganho = ganhoPesoNoMes(loteId, mesStr);
  if(!ganho) return null;
  return (ganho.ganhoKg/KG_POR_ARROBA) * Number(numeroAnimais||0);
}
function arrobasProduzidasFazendaNoMes(mesStr){
  return state.lotes.filter(l=>!l.dataFim).reduce((a,l)=>{
    const arrobas = arrobasProduzidasNoMes(l.id, mesStr, l.numeroAnimais);
    return a + (arrobas||0);
  }, 0);
}

// Soma dos hectares de todas as fazendas cadastradas — usado pra calcular o
// resultado financeiro (receita/despesa/lucro) por hectare da operação
// inteira, sem precisar que lotes/despesas apontem pra uma fazenda específica.
function totalHectares(){ return state.fazendas.reduce((a,f)=>a+Number(f.hectares||0),0); }

// Arroba macho e fêmea têm cotações diferentes no mercado — cada uma tem seu
// próprio histórico (mesma tabela, diferenciada pela coluna "sexo"). Não usa
// esse valor pra abate/venda (que usa o valor realmente pago naquela venda
// específica, lançado junto com ela) — só serve de referência/indexador.
function precoArrobaAtual(sexo){
  const lista = state.precosArroba.filter(p=>(p.sexo||'macho')===sexo);
  if(lista.length===0) return null;
  return [...lista].sort((a,b)=> b.data.localeCompare(a.data) || b.id-a.id)[0];
}

const NOMES_MES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

// Mesmo filtro de racaoLoteTipo que dadosFinanceiro() usa pro mês --
// saidasRacao só conta pra Confinamento/Cria (Pasto tem seu próprio custo
// via state.pasto). Sem esse filtro, um lote que mudou de destino pra Pasto
// depois de já ter saídas de ração lançadas fazia o total do ano (que soma
// custoVariavelDoMes de cada mês) não bater com o total do mês corrente.
function custoVariavelDoMes(mesStr){
  const racao = state.saidasRacao.filter(s=>s.data.startsWith(mesStr) && (racaoLoteTipo(s)==='confinamento' || racaoLoteTipo(s)==='reproducao')).reduce((a,s)=>a+custoSaidaRacao(s),0);
  const pasto = state.pasto.filter(p=>p.data.startsWith(mesStr)).reduce((a,p)=>a+custoPasto(p),0);
  const reproducao = state.reproducao.filter(r=>r.data.startsWith(mesStr)).reduce((a,r)=>a+custoReproducao(r),0);
  return racao + pasto + reproducao;
}

// Custo fixo real daquele mês, se cadastrado (ex: importado de um relatório
// histórico); senão, cai para os custos fixos "recorrentes" (mes em branco),
// que representam o valor mensal atual/projetado. Essa escolha (mês
// específico vs. recorrente) é feita centro de custo por centro de custo —
// cada grupo (mesmo nome+categoria) tem seu próprio fallback independente,
// senão um centro de custo com lançamento de um mês faria os outros centros
// (sem lançamento próprio naquele mês) sumirem em vez de cair no recorrente.
function custosFixosDoMes(mesStr){
  const grupos = new Map();
  state.custosFixos.forEach(c=>{
    // as atividades entram na chave pra não misturar, no mesmo grupo de
    // fallback mês-específico/recorrente, duas "contas" que só coincidem de
    // nome e centro de custo mas têm atividades diferentes (ex: Insumos
    // Pecuários indireto vs. Insumos Pecuários — Reprodução, que é direto
    // da Cria).
    // A chave tem que ser a MESMA do vigentesNoMes() do AE Matriz, senão
    // as duas telas chegam a totais diferentes do mesmo mês lendo a mesma
    // tabela. A fazenda entrou por isso: sem ela, lançar uma conta de uma
    // fazenda apagava a recorrente da outra.
    const chaveAreas = (c.areas||[]).slice().sort().join(',');
    const chave = `${c.nome}||${c.categoria||''}||pecuaria||${c.fazendaId ?? ''}||${chaveAreas}`;
    if(!grupos.has(chave)) grupos.set(chave, []);
    grupos.get(chave).push(c);
  });
  const resultado = [];
  grupos.forEach(rows=>{
    const doMes = rows.filter(c=>c.mes===mesStr);
    resultado.push(...(doMes.length>0 ? doMes : rows.filter(c=>!c.mes)));
  });
  return resultado;
}
function fixosDoMes(mesStr){
  return custosFixosDoMes(mesStr).reduce((a,c)=>a+Number(c.valorMensal||0),0);
}
// O mês de uma receita vem do campo mes; a data é só reserva para
// lançamento antigo que não tenha o mes preenchido. Receita de competência
// mensal (histórico do Conag) tem mes e NÃO tem data — ler r.data direto
// derrubava a tela inteira com "Cannot read properties of null".
function mesDaReceita(r){ return r.mes || (r.data || '').slice(0,7); }
function receitaDoMes(mesStr){
  return state.receitas.filter(r=>mesDaReceita(r)===mesStr).reduce((a,r)=>a+Number(r.valor||0),0);
}
// Quanto de UMA despesa (já filtrada pro mês) cai em cada atividade —
// nenhuma atividade marcada (Geral) rateia por cabeça entre as três; uma
// marcada vai 100% pra ela; duas ou três marcadas rateiam por cabeça só
// entre as marcadas (ex: Pasto+Cria sem pesar no Confinamento). Usado tanto
// pra somar o total de cada área quanto pra listar, despesa por despesa, o
// que compõe cada fatia do gráfico "por área" (clique numa fatia pra ver
// o detalhe).
function alocarDespesaPorArea(c, ctx){
  const v = Number(c.valorMensal||0);
  const areas = (c.areas && c.areas.length) ? c.areas : ['confinamento','pasto','cria'];
  const resultado = {confinamento:0, pasto:0, cria:0};
  if(areas.length===1){
    resultado[areas[0]] = v;
    return resultado;
  }
  const animaisPorArea = {confinamento:ctx.animaisConfinamento, pasto:ctx.animaisPasto, cria:ctx.animaisCria};
  const totalAnimaisAreas = areas.reduce((a,ar)=>a+animaisPorArea[ar],0);
  if(totalAnimaisAreas>0){
    areas.forEach(ar=>{ resultado[ar] = v*(animaisPorArea[ar]/totalAnimaisAreas); });
  } else {
    // nenhuma das áreas marcadas tem animal ativo agora (ex: entre ciclos)
    // — sem cabeça pra ratear por cabeça, divide igual entre as áreas
    // marcadas, em vez de simplesmente sumir com o valor da despesa.
    const parteIgual = v/areas.length;
    areas.forEach(ar=>{ resultado[ar] = parteIgual; });
  }
  return resultado;
}
// Soma (e detalha, despesa por despesa) o custo fixo de cada área para um
// conjunto de linhas de despesa já filtradas pro(s) mês(es) desejado(s).
function alocarDespesasPorArea(rows, ctx){
  let confinamento=0, pasto=0, cria=0;
  const detalhes = {confinamento:[], pasto:[], cria:[]};
  rows.forEach(c=>{
    const aloc = alocarDespesaPorArea(c, ctx);
    confinamento += aloc.confinamento; pasto += aloc.pasto; cria += aloc.cria;
    if(aloc.confinamento>0) detalhes.confinamento.push({id:c.id, nome:c.nome, mes:c.mes, valor:aloc.confinamento});
    if(aloc.pasto>0) detalhes.pasto.push({id:c.id, nome:c.nome, mes:c.mes, valor:aloc.pasto});
    if(aloc.cria>0) detalhes.cria.push({id:c.id, nome:c.nome, mes:c.mes, valor:aloc.cria});
  });
  return {confinamento, pasto, cria, detalhes};
}

// Custo fixo não tem histórico por mês no app (só o valor mensal atual),
// então o mesmo total é aplicado a todos os meses do ano ao montar o
// comparativo — é uma aproximação, avisada na tela.
function comparativoMensal(){
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mesAtual = hoje.getMonth();
  const meses = [];
  for(let m=0; m<=mesAtual; m++){
    const mesStr = `${ano}-${String(m+1).padStart(2,'0')}`;
    // Só a despesa cadastrada entra no resultado financeiro do negócio --
    // ração/pasto/reprodução é custo de manejo do dia a dia (serve pra saber
    // o custo por animal, não pro lucro/prejuízo da operação como um todo;
    // o insumo que vira ração já é uma despesa quando é comprado).
    const despesa = fixosDoMes(mesStr);
    const receita = receitaDoMes(mesStr);
    meses.push({mesStr, label: `${NOMES_MES[m]}/${ano}`, despesa, receita, resultado: receita-despesa});
  }
  return meses;
}
function comparativoAnual(meses){
  const despesa = meses.reduce((a,m)=>a+m.despesa,0);
  const receita = meses.reduce((a,m)=>a+m.receita,0);
  return {despesa, receita, resultado: receita-despesa};
}

function mesesDoAnoAteAgora(){
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mesAtual = hoje.getMonth();
  const meses = [];
  for(let m=0; m<=mesAtual; m++) meses.push(`${ano}-${String(m+1).padStart(2,'0')}`);
  return meses;
}

// Mesmo critério de diluição por área do mês atual, somado por todos os
// meses do ano — usa a composição de lotes ativos de hoje pra ratear o
// custo fixo diluível de cada mês passado (aproximação, já que o app não
// guarda o histórico de quantos animais havia em cada mês).
function composicaoPorAreaAno(){
  const lotesAtivos = state.lotes.filter(l=>!l.dataFim);
  const totalAnimais = lotesAtivos.reduce((a,l)=>a+Number(l.numeroAnimais||0),0);
  const animaisPorTipo = tipo => lotesAtivos.filter(l=>loteTipo(l)===tipo).reduce((a,l)=>a+Number(l.numeroAnimais||0),0);
  const animaisConfinamento = animaisPorTipo('confinamento');
  const animaisPasto = animaisPorTipo('pasto');
  const animaisCria = animaisPorTipo('reproducao');
  const animaisPastoCria = animaisPasto + animaisCria;

  // Só a despesa cadastrada (fixo diluído/direto) entra aqui — o lançamento
  // diário de ração/pasto/cria é custo operacional do dia a dia, já visível
  // em Financeiro, e não deve se misturar no resultado por área/centro de
  // custo (que é sobre despesa formal, não sobre consumo diário).
  const ctxArea = {animaisConfinamento, animaisPasto, animaisCria, animaisPastoCria, totalAnimais};
  let confinamento=0, pasto=0, cria=0;
  const detalhesPorArea = {confinamento:[], pasto:[], cria:[]};
  mesesDoAnoAteAgora().forEach(mesStr=>{
    const aloc = alocarDespesasPorArea(custosFixosDoMes(mesStr), ctxArea);
    confinamento += aloc.confinamento;
    pasto += aloc.pasto;
    cria += aloc.cria;
    detalhesPorArea.confinamento.push(...aloc.detalhes.confinamento);
    detalhesPorArea.pasto.push(...aloc.detalhes.pasto);
    detalhesPorArea.cria.push(...aloc.detalhes.cria);
  });
  return composicaoPorArea(confinamento, pasto, cria, detalhesPorArea);
}

// Custos do ano por centro de custo — só despesa cadastrada (custos fixos),
// sem o lançamento diário de ração/pasto/cria (ver comentário acima).
function composicaoCentrosCustoAno(){
  const meses = mesesDoAnoAteAgora();
  const todosFixos = [].concat(...meses.map(m=>custosFixosDoMes(m)));
  return composicaoCentrosCusto(todosFixos);
}

function dadosFinanceiro(){
  const hoje = hojeStr();
  const mes = mesAtualStr();

  const racaoConfMes = state.saidasRacao.filter(s=>s.data.startsWith(mes) && racaoLoteTipo(s)==='confinamento').reduce((a,s)=>a+custoSaidaRacao(s),0);
  const racaoCriaMes = state.saidasRacao.filter(s=>s.data.startsWith(mes) && racaoLoteTipo(s)==='reproducao').reduce((a,s)=>a+custoSaidaRacao(s),0);
  const racaoMes = racaoConfMes + racaoCriaMes;
  const pastoMes = state.pasto.filter(p=>p.data.startsWith(mes)).reduce((a,p)=>a+custoPasto(p),0);
  const reproducaoMes = state.reproducao.filter(r=>r.data.startsWith(mes)).reduce((a,r)=>a+custoReproducao(r),0);
  const criaMes = racaoCriaMes + reproducaoMes;
  const variavelMes = racaoMes + pastoMes + reproducaoMes;
  const fixosMes = fixosDoMes(mes);
  const totalMes = variavelMes + fixosMes;

  const lotesAtivos = state.lotes.filter(l=>!l.dataFim);
  const totalAnimais = lotesAtivos.reduce((a,l)=>a+Number(l.numeroAnimais||0),0);

  // Média diária do mês (não "só hoje"): ração/pasto/cria não são lançados
  // todo santo dia — mostrar só o valor de hoje deixava esses cartões
  // zerados em qualquer dia sem lançamento exato, mesmo com gasto normal
  // recente. Mesmo critério já usado em Por Curral: total do mês até agora
  // ÷ dias já passados do mês.
  const fixoDiario = fixosMes/30;
  const diasDecorridosMes = Number(hoje.split('-')[2]);
  const custoVariavelMedioDia = variavelMes/diasDecorridosMes;
  const custoPorAnimalMedioDia = totalAnimais>0 ? custoVariavelMedioDia/totalAnimais : 0;
  const custoTotalPorAnimalMedioDia = totalAnimais>0 ? (custoVariavelMedioDia+fixoDiario)/totalAnimais : 0;
  const custoTotalPorAnimalMes = totalAnimais>0 ? totalMes/totalAnimais : 0;

  // Custo fixo (mão de obra, energia etc.) diluído por área, na proporção do
  // número de animais de cada uma — mesmo critério já usado em Por Curral.
  // Uma despesa com nenhuma atividade marcada (Geral) rateia por cabeça
  // entre as três; com uma marcada, vai 100% pra ela; com duas ou três
  // marcadas, rateia por cabeça só entre as marcadas.
  const animaisPorTipo = tipo => lotesAtivos.filter(l=>loteTipo(l)===tipo).reduce((a,l)=>a+Number(l.numeroAnimais||0),0);
  const animaisConfinamento = animaisPorTipo('confinamento');
  const animaisPasto = animaisPorTipo('pasto');
  const animaisCria = animaisPorTipo('reproducao');
  const ctxArea = {animaisConfinamento, animaisPasto, animaisCria};
  const alocacaoArea = alocarDespesasPorArea(custosFixosDoMes(mes), ctxArea);
  const fixoConfinamento = alocacaoArea.confinamento;
  const fixoPasto = alocacaoArea.pasto;
  const fixoCria = alocacaoArea.cria;
  const detalhesPorArea = alocacaoArea.detalhes;
  const custoTotalConfinamentoMes = racaoConfMes + fixoConfinamento;
  const custoTotalPastoMes = pastoMes + fixoPasto;
  const custoTotalCriaMes = criaMes + fixoCria;

  const valorEstoque = state.ingredientes.reduce((a,i)=>{
    const saldo = saldoIngrediente(i.id);
    return a + qtdEmKg(saldo, i.unidade)*i.precoKg;
  }, 0);

  const receitaMes = state.receitas.filter(r=>mesDaReceita(r)===mes).reduce((a,r)=>a+Number(r.valor||0),0);
  // Resultado financeiro (lucro/prejuízo) usa só a despesa cadastrada, não o
  // custo variável de ração/pasto/reprodução -- mesmo critério de comparativoMensal().
  const resultadoMes = receitaMes - fixosMes;
  const margemAtualPct = receitaMes>0 ? (resultadoMes/receitaMes*100) : null;

  const arrobasMes = arrobasProduzidasFazendaNoMes(mes);
  const custoPorArrobaMes = arrobasMes>0 ? totalMes/arrobasMes : null;

  // Acumulado do ano (janeiro até o mês atual) -- mesmo critério já usado no
  // "Por hectare" e nos painéis de Resultados: soma mês a mês em vez de só
  // mostrar o mês corrente, consolidando conforme o ano avança.
  const mesesAno = mesesDoAnoAteAgora();
  const variavelAno = mesesAno.reduce((a,m)=>a+custoVariavelDoMes(m),0);
  const fixosAno = mesesAno.reduce((a,m)=>a+fixosDoMes(m),0);
  const totalAno = variavelAno + fixosAno;
  const custoTotalPorAnimalAno = totalAnimais>0 ? totalAno/totalAnimais : 0;
  const arrobasAno = mesesAno.reduce((a,m)=>a+arrobasProduzidasFazendaNoMes(m),0);
  const custoPorArrobaAno = arrobasAno>0 ? totalAno/arrobasAno : null;

  return {hoje, mes,
    racaoConfMes, racaoCriaMes, racaoMes, pastoMes, reproducaoMes, criaMes, variavelMes, fixosMes, totalMes,
    fixoConfinamento, fixoPasto, fixoCria, detalhesPorArea,
    custoTotalConfinamentoMes, custoTotalPastoMes, custoTotalCriaMes, animaisConfinamento, animaisPasto, animaisCria, receitaMes, resultadoMes, margemAtualPct,
    totalAnimais, custoVariavelMedioDia, custoPorAnimalMedioDia, custoTotalPorAnimalMedioDia, custoTotalPorAnimalMes, valorEstoque, arrobasMes, custoPorArrobaMes,
    variavelAno, fixosAno, totalAno, custoTotalPorAnimalAno, arrobasAno, custoPorArrobaAno};
}
