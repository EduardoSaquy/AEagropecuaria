// Saída de Ração é uma tabela só, compartilhada entre lotes de Confinamento e
// de Cria; para separar os dois no painel de resultados, é preciso checar o
// tipo do lote de destino de cada lançamento.
function racaoLoteTipo(s){ const lote = state.lotes.find(l=>l.id===s.loteId); return lote ? loteTipo(lote) : null; }

// 1 arroba ≈ 30 kg de peso vivo ganho (padrão de mercado — a arroba em si é
// uma medida de carcaça de 15 kg, mas o rendimento de carcaça de boi gordo
// gira em torno de 50%, então 30 kg de peso vivo vira ~1 @ de carcaça).
const KG_POR_ARROBA = 30;

// Numa venda por abate, o peso lançado é o peso de CARCAÇA vindo do
// frigorífico (não peso vivo) — então a conversão usa a arroba "cheia" de
// 15 kg, sem o desconto de rendimento de carcaça usado na Pesagem (que
// parte de peso vivo).
const KG_POR_ARROBA_CARCACA = 15;
const TIPO_VENDA_LABEL = {arroba:'Abate', cabeca:'Venda por animal', kg:'Venda por kg'};
// Campos de peso/valor da Venda aceitam vírgula decimal (padrão brasileiro) —
// Number('480,5') dá NaN, então esses campos passam por aqui em vez de Number()
// direto. Valores já numéricos (vindos do banco) passam direto, sem mudança.
function numDecimal(v){
  if(typeof v === 'number') return v;
  if(v==null || v==='') return 0;
  return Number(String(v).replace(',','.')) || 0;
}
// Só faz sentido calcular @ na venda por abate (tipoVenda==='arroba') — nos
// outros dois tipos o preço já não depende de arroba nenhuma.
function arrobasVenda(v){ return (numDecimal(v.pesoMedioKg)/KG_POR_ARROBA_CARCACA) * Number(v.quantidade||0); }
// Valor total de uma venda, de acordo com o tipo escolhido:
// - 'arroba' (abate): arrobas de carcaça × valor da arroba paga.
// - 'cabeca' (venda por animal): valor fechado por animal × quantidade.
// - 'kg' (venda por peso vivo): peso por animal × quantidade × valor do kg.
function valorVenda(v){
  const qtd = Number(v.quantidade||0);
  if(v.tipoVenda==='cabeca') return qtd * numDecimal(v.valorPorAnimal);
  if(v.tipoVenda==='kg') return qtd * numDecimal(v.pesoMedioKg) * numDecimal(v.valorKg);
  return arrobasVenda(v) * numDecimal(v.valorArroba);
}

function pesagensDoLote(loteId){
  return state.pesagens.filter(p=>p.loteId===loteId).sort((a,b)=> a.data.localeCompare(b.data) || a.id-b.id);
}
// Ganho de peso (kg/dia) entre duas pesagens consecutivas do mesmo lote.
function gmdEntre(pesoAnterior, pesoAtual, dataAnterior, dataAtual){
  const dias = (new Date(dataAtual) - new Date(dataAnterior)) / 86400000;
  return dias>0 ? (pesoAtual-pesoAnterior)/dias : null;
}
// Peso do lote na pesagem mais recente até (incluirIgual=true) ou antes de
// (incluirIgual=false) uma data — usado pra "ganho de peso dentro do mês",
// que precisa do peso mais próximo de antes do mês começar.
function pesoNaData(loteId, dataLimite, incluirIgual){
  let resultado = null;
  pesagensDoLote(loteId).forEach(p=>{
    if(incluirIgual ? p.data<=dataLimite : p.data<dataLimite) resultado = p;
  });
  return resultado;
}
// Ganho de peso do lote dentro de um mês: usa a pesagem mais recente até o
// fim do mês menos a pesagem mais recente antes do mês começar; sem pesagem
// anterior ao mês, cai pra primeira x última pesagem dentro do próprio mês
// (se houver ao menos duas). Sem dado suficiente, retorna null.
function ganhoPesoNoMes(loteId, mesStr){
  const ano = Number(mesStr.slice(0,4)), mes = Number(mesStr.slice(5,7));
  const fimMes = new Date(ano, mes, 0).toISOString().slice(0,10);
  const inicioMes = `${mesStr}-01`;
  const final = pesoNaData(loteId, fimMes, true);
  if(!final) return null;
  let inicial = pesoNaData(loteId, inicioMes, false);
  if(!inicial){
    const doMes = state.pesagens.filter(p=>p.loteId===loteId && p.data.startsWith(mesStr)).sort((a,b)=>a.data.localeCompare(b.data));
    if(doMes.length<2) return null;
    inicial = doMes[0];
  }
  if(inicial.data>=final.data) return null;
  return {ganhoKg: Number(final.pesoMedioKg)-Number(inicial.pesoMedioKg), dataInicial:inicial.data, dataFinal:final.data};
}
// @ produzidas por um lote num mês = ganho de peso (kg) ÷ 30 × nº de animais.
function arrobasProduzidasNoMes(loteId, mesStr, numeroAnimais){
  const ganho = ganhoPesoNoMes(loteId, mesStr);
  if(!ganho) return null;
  return (ganho.ganhoKg/KG_POR_ARROBA) * Number(numeroAnimais||0);
}
function arrobasProduzidasFazendaNoMes(mesStr){
  return state.lotes.filter(l=>!l.dataFim).reduce((a,l)=>{
    const arrobas = arrobasProduzidasNoMes(l.id, mesStr, l.numeroAnimais);
    return a + (arrobas||0);
  }, 0);
}

// Soma dos hectares de todas as fazendas cadastradas — usado pra calcular o
// resultado financeiro (receita/despesa/lucro) por hectare da operação
// inteira, sem precisar que lotes/despesas apontem pra uma fazenda específica.
function totalHectares(){ return state.fazendas.reduce((a,f)=>a+Number(f.hectares||0),0); }

// Arroba macho e fêmea têm cotações diferentes no mercado — cada uma tem seu
// próprio histórico (mesma tabela, diferenciada pela coluna "sexo"). Não usa
// esse valor pra abate/venda (que usa o valor realmente pago naquela venda
// específica, lançado junto com ela) — só serve de referência/indexador.
function precoArrobaAtual(sexo){
  const lista = state.precosArroba.filter(p=>(p.sexo||'macho')===sexo);
  if(lista.length===0) return null;
  return [...lista].sort((a,b)=> b.data.localeCompare(a.data) || b.id-a.id)[0];
}

const NOMES_MES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function custoVariavelDoMes(mesStr){
  const racao = state.saidasRacao.filter(s=>s.data.startsWith(mesStr)).reduce((a,s)=>a+custoSaidaRacao(s),0);
  const pasto = state.pasto.filter(p=>p.data.startsWith(mesStr)).reduce((a,p)=>a+custoPasto(p),0);
  const reproducao = state.reproducao.filter(r=>r.data.startsWith(mesStr)).reduce((a,r)=>a+custoReproducao(r),0);
  return racao + pasto + reproducao;
}

// Custo fixo real daquele mês, se cadastrado (ex: importado de um relatório
// histórico); senão, cai para os custos fixos "recorrentes" (mes em branco),
// que representam o valor mensal atual/projetado. Essa escolha (mês
// específico vs. recorrente) é feita centro de custo por centro de custo —
// cada grupo (mesmo nome+categoria) tem seu próprio fallback independente,
// senão um centro de custo com lançamento de um mês faria os outros centros
// (sem lançamento próprio naquele mês) sumirem em vez de cair no recorrente.
function custosFixosDoMes(mesStr){
  const grupos = new Map();
  state.custosFixos.forEach(c=>{
    // as atividades entram na chave pra não misturar, no mesmo grupo de
    // fallback mês-específico/recorrente, duas "contas" que só coincidem de
    // nome e centro de custo mas têm atividades diferentes (ex: Insumos
    // Pecuários indireto vs. Insumos Pecuários — Reprodução, que é direto
    // da Cria).
    const chaveAreas = (c.areas||[]).slice().sort().join(',');
    const chave = `${c.nome}||${c.categoria||''}||${chaveAreas}`;
    if(!grupos.has(chave)) grupos.set(chave, []);
    grupos.get(chave).push(c);
  });
  const resultado = [];
  grupos.forEach(rows=>{
    const doMes = rows.filter(c=>c.mes===mesStr);
    resultado.push(...(doMes.length>0 ? doMes : rows.filter(c=>!c.mes)));
  });
  return resultado;
}
function fixosDoMes(mesStr){
  return custosFixosDoMes(mesStr).reduce((a,c)=>a+Number(c.valorMensal||0),0);
}
function receitaDoMes(mesStr){
  return state.receitas.filter(r=>r.data.startsWith(mesStr)).reduce((a,r)=>a+Number(r.valor||0),0);
}
// Quanto de UMA despesa (já filtrada pro mês) cai em cada atividade —
// nenhuma atividade marcada (Geral) rateia por cabeça entre as três; uma
// marcada vai 100% pra ela; duas ou três marcadas rateiam por cabeça só
// entre as marcadas (ex: Pasto+Cria sem pesar no Confinamento). Usado tanto
// pra somar o total de cada área quanto pra listar, despesa por despesa, o
// que compõe cada fatia do gráfico "por área" (clique numa fatia pra ver
// o detalhe).
function alocarDespesaPorArea(c, ctx){
  const v = Number(c.valorMensal||0);
  const areas = (c.areas && c.areas.length) ? c.areas : ['confinamento','pasto','cria'];
  const resultado = {confinamento:0, pasto:0, cria:0};
  if(areas.length===1){
    resultado[areas[0]] = v;
    return resultado;
  }
  const animaisPorArea = {confinamento:ctx.animaisConfinamento, pasto:ctx.animaisPasto, cria:ctx.animaisCria};
  const totalAnimaisAreas = areas.reduce((a,ar)=>a+animaisPorArea[ar],0);
  if(totalAnimaisAreas>0) areas.forEach(ar=>{ resultado[ar] = v*(animaisPorArea[ar]/totalAnimaisAreas); });
  return resultado;
}
// Soma (e detalha, despesa por despesa) o custo fixo de cada área para um
// conjunto de linhas de despesa já filtradas pro(s) mês(es) desejado(s).
function alocarDespesasPorArea(rows, ctx){
  let confinamento=0, pasto=0, cria=0;
  const detalhes = {confinamento:[], pasto:[], cria:[]};
  rows.forEach(c=>{
    const aloc = alocarDespesaPorArea(c, ctx);
    confinamento += aloc.confinamento; pasto += aloc.pasto; cria += aloc.cria;
    if(aloc.confinamento>0) detalhes.confinamento.push({id:c.id, nome:c.nome, mes:c.mes, valor:aloc.confinamento});
    if(aloc.pasto>0) detalhes.pasto.push({id:c.id, nome:c.nome, mes:c.mes, valor:aloc.pasto});
    if(aloc.cria>0) detalhes.cria.push({id:c.id, nome:c.nome, mes:c.mes, valor:aloc.cria});
  });
  return {confinamento, pasto, cria, detalhes};
}

// Custo fixo não tem histórico por mês no app (só o valor mensal atual),
// então o mesmo total é aplicado a todos os meses do ano ao montar o
// comparativo — é uma aproximação, avisada na tela.
function comparativoMensal(){
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mesAtual = hoje.getMonth();
  const meses = [];
  for(let m=0; m<=mesAtual; m++){
    const mesStr = `${ano}-${String(m+1).padStart(2,'0')}`;
    const despesa = custoVariavelDoMes(mesStr) + fixosDoMes(mesStr);
    const receita = receitaDoMes(mesStr);
    meses.push({mesStr, label: `${NOMES_MES[m]}/${ano}`, despesa, receita, resultado: receita-despesa});
  }
  return meses;
}
function comparativoAnual(meses){
  const despesa = meses.reduce((a,m)=>a+m.despesa,0);
  const receita = meses.reduce((a,m)=>a+m.receita,0);
  return {despesa, receita, resultado: receita-despesa};
}

function mesesDoAnoAteAgora(){
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mesAtual = hoje.getMonth();
  const meses = [];
  for(let m=0; m<=mesAtual; m++) meses.push(`${ano}-${String(m+1).padStart(2,'0')}`);
  return meses;
}

// Mesmo critério de diluição por área do mês atual, somado por todos os
// meses do ano — usa a composição de lotes ativos de hoje pra ratear o
// custo fixo diluível de cada mês passado (aproximação, já que o app não
// guarda o histórico de quantos animais havia em cada mês).
function composicaoPorAreaAno(){
  const lotesAtivos = state.lotes.filter(l=>!l.dataFim);
  const totalAnimais = lotesAtivos.reduce((a,l)=>a+Number(l.numeroAnimais||0),0);
  const animaisPorTipo = tipo => lotesAtivos.filter(l=>loteTipo(l)===tipo).reduce((a,l)=>a+Number(l.numeroAnimais||0),0);
  const animaisConfinamento = animaisPorTipo('confinamento');
  const animaisPasto = animaisPorTipo('pasto');
  const animaisCria = animaisPorTipo('reproducao');
  const animaisPastoCria = animaisPasto + animaisCria;

  // Só a despesa cadastrada (fixo diluído/direto) entra aqui — o lançamento
  // diário de ração/pasto/cria é custo operacional do dia a dia, já visível
  // em Financeiro, e não deve se misturar no resultado por área/centro de
  // custo (que é sobre despesa formal, não sobre consumo diário).
  const ctxArea = {animaisConfinamento, animaisPasto, animaisCria, animaisPastoCria, totalAnimais};
  let confinamento=0, pasto=0, cria=0;
  const detalhesPorArea = {confinamento:[], pasto:[], cria:[]};
  mesesDoAnoAteAgora().forEach(mesStr=>{
    const aloc = alocarDespesasPorArea(custosFixosDoMes(mesStr), ctxArea);
    confinamento += aloc.confinamento;
    pasto += aloc.pasto;
    cria += aloc.cria;
    detalhesPorArea.confinamento.push(...aloc.detalhes.confinamento);
    detalhesPorArea.pasto.push(...aloc.detalhes.pasto);
    detalhesPorArea.cria.push(...aloc.detalhes.cria);
  });
  return composicaoPorArea(confinamento, pasto, cria, detalhesPorArea);
}

// Custos do ano por centro de custo — só despesa cadastrada (custos fixos),
// sem o lançamento diário de ração/pasto/cria (ver comentário acima).
function composicaoCentrosCustoAno(){
  const meses = mesesDoAnoAteAgora();
  const todosFixos = [].concat(...meses.map(m=>custosFixosDoMes(m)));
  return composicaoCentrosCusto(todosFixos);
}

function dadosFinanceiro(){
  const hoje = hojeStr();
  const mes = mesAtualStr();

  const racaoConfMes = state.saidasRacao.filter(s=>s.data.startsWith(mes) && racaoLoteTipo(s)==='confinamento').reduce((a,s)=>a+custoSaidaRacao(s),0);
  const racaoCriaMes = state.saidasRacao.filter(s=>s.data.startsWith(mes) && racaoLoteTipo(s)==='reproducao').reduce((a,s)=>a+custoSaidaRacao(s),0);
  const racaoMes = racaoConfMes + racaoCriaMes;
  const pastoMes = state.pasto.filter(p=>p.data.startsWith(mes)).reduce((a,p)=>a+custoPasto(p),0);
  const reproducaoMes = state.reproducao.filter(r=>r.data.startsWith(mes)).reduce((a,r)=>a+custoReproducao(r),0);
  const criaMes = racaoCriaMes + reproducaoMes;
  const variavelMes = racaoMes + pastoMes + reproducaoMes;
  const fixosMes = fixosDoMes(mes);
  const totalMes = variavelMes + fixosMes;

  const lotesAtivos = state.lotes.filter(l=>!l.dataFim);
  const totalAnimais = lotesAtivos.reduce((a,l)=>a+Number(l.numeroAnimais||0),0);

  // Média diária do mês (não "só hoje"): ração/pasto/cria não são lançados
  // todo santo dia — mostrar só o valor de hoje deixava esses cartões
  // zerados em qualquer dia sem lançamento exato, mesmo com gasto normal
  // recente. Mesmo critério já usado em Por Curral: total do mês até agora
  // ÷ dias já passados do mês.
  const fixoDiario = fixosMes/30;
  const diasDecorridosMes = Number(hoje.split('-')[2]);
  const custoVariavelMedioDia = variavelMes/diasDecorridosMes;
  const custoPorAnimalMedioDia = totalAnimais>0 ? custoVariavelMedioDia/totalAnimais : 0;
  const custoTotalPorAnimalMedioDia = totalAnimais>0 ? (custoVariavelMedioDia+fixoDiario)/totalAnimais : 0;
  const custoTotalPorAnimalMes = totalAnimais>0 ? totalMes/totalAnimais : 0;

  // Custo fixo (mão de obra, energia etc.) diluído por área, na proporção do
  // número de animais de cada uma — mesmo critério já usado em Por Curral.
  // Uma despesa com nenhuma atividade marcada (Geral) rateia por cabeça
  // entre as três; com uma marcada, vai 100% pra ela; com duas ou três
  // marcadas, rateia por cabeça só entre as marcadas.
  const animaisPorTipo = tipo => lotesAtivos.filter(l=>loteTipo(l)===tipo).reduce((a,l)=>a+Number(l.numeroAnimais||0),0);
  const animaisConfinamento = animaisPorTipo('confinamento');
  const animaisPasto = animaisPorTipo('pasto');
  const animaisCria = animaisPorTipo('reproducao');
  const ctxArea = {animaisConfinamento, animaisPasto, animaisCria};
  const alocacaoArea = alocarDespesasPorArea(custosFixosDoMes(mes), ctxArea);
  const fixoConfinamento = alocacaoArea.confinamento;
  const fixoPasto = alocacaoArea.pasto;
  const fixoCria = alocacaoArea.cria;
  const detalhesPorArea = alocacaoArea.detalhes;
  const custoTotalConfinamentoMes = racaoConfMes + fixoConfinamento;
  const custoTotalPastoMes = pastoMes + fixoPasto;
  const custoTotalCriaMes = criaMes + fixoCria;

  const valorEstoque = state.ingredientes.reduce((a,i)=>{
    const saldo = saldoIngrediente(i.id);
    return a + qtdEmKg(saldo, i.unidade)*i.precoKg;
  }, 0);

  const receitaMes = state.receitas.filter(r=>r.data.startsWith(mes)).reduce((a,r)=>a+Number(r.valor||0),0);
  const resultadoMes = receitaMes - totalMes;
  const margemAtualPct = receitaMes>0 ? (resultadoMes/receitaMes*100) : null;

  const arrobasMes = arrobasProduzidasFazendaNoMes(mes);
  const custoPorArrobaMes = arrobasMes>0 ? totalMes/arrobasMes : null;

  return {hoje, mes,
    racaoConfMes, racaoCriaMes, racaoMes, pastoMes, reproducaoMes, criaMes, variavelMes, fixosMes, totalMes,
    fixoConfinamento, fixoPasto, fixoCria, detalhesPorArea,
    custoTotalConfinamentoMes, custoTotalPastoMes, custoTotalCriaMes, receitaMes, resultadoMes, margemAtualPct,

/* ---- Financeiro: Por Curral ---- */
function PageFinanceiroCurral(){
  const d = dadosFinanceiro();

  const lotesAtivos = state.lotes.filter(l=>!l.dataFim);
  const diasDecorridosMes = Number(d.hoje.split('-')[2]);
  const inicioMesStr = d.mes+'-01';
  // Um lote que começou no meio do mês (animais chegaram há poucos dias) não
  // pode ser tratado como se já existisse o mês inteiro — nem pra diluir seu
  // próprio gasto (abaixo) nem pra ratear o custo fixo entre os lotes de uma
  // área (logo a seguir). Dias que esse lote específico já existe dentro do
  // mês (desde o início dele ou desde o dia 1, o que for depois, até hoje).
  function diasAtivosNoMes(lote){
    const inicioEfetivo = (lote.dataInicio && lote.dataInicio>inicioMesStr) ? lote.dataInicio : inicioMesStr;
    const diaInicio = Number(inicioEfetivo.slice(8,10));
    return Math.max(1, diasDecorridosMes-diaInicio+1);
  }

  // O custo fixo de cada área (dadosFinanceiro já rateia despesa por
  // despesa entre Confinamento/Pasto/Cria) ainda precisa ser dividido entre
  // os lotes daquela área — não só pelo número de animais de cada um, mas
  // ponderado também pelos dias que cada lote já existe no mês (animal ×
  // dia). Sem isso, um lote que chegou há poucos dias entraria na conta com
  // o mesmo peso de um lote que está lá o mês inteiro, tomando uma fatia
  // maior do que o tempo real que ele consumiu esse custo compartilhado.
  const pesoAnimalDiasPorTipo = tipo => lotesAtivos.filter(l=>loteTipo(l)===tipo).reduce((a,l)=>a+Number(l.numeroAnimais||0)*diasAtivosNoMes(l), 0);
  const pesoAnimalDiasPorAreaMes = {confinamento: pesoAnimalDiasPorTipo('confinamento'), pasto: pesoAnimalDiasPorTipo('pasto'), reproducao: pesoAnimalDiasPorTipo('reproducao')};
  const fixoAreaMes = {confinamento: d.fixoConfinamento, pasto: d.fixoPasto, reproducao: d.fixoCria};
  function fixoLoteAlocado(lote, fixoDaAreaNoPeriodo){
    const tipo = loteTipo(lote);
    const totalPesoArea = pesoAnimalDiasPorAreaMes[tipo];
    const pesoLote = Number(lote.numeroAnimais||0)*diasAtivosNoMes(lote);
    return totalPesoArea>0 ? fixoDaAreaNoPeriodo*(pesoLote/totalPesoArea) : 0;
  }

  const custosMesPorLote = lotesAtivos.map(l=>{
    const racao = state.saidasRacao.filter(s=>s.data.startsWith(d.mes) && s.loteId===l.id).reduce((a,s)=>a+custoSaidaRacao(s),0);
    const pasto = state.pasto.filter(p=>p.data.startsWith(d.mes) && p.loteId===l.id).reduce((a,p)=>a+custoPasto(p),0);
    const reproducao = state.reproducao.filter(r=>r.data.startsWith(d.mes) && r.loteId===l.id).reduce((a,r)=>a+custoReproducao(r),0);
    const variavel = racao + pasto + reproducao;
    const fixoAlocado = fixoLoteAlocado(l, fixoAreaMes[loteTipo(l)]);
    const total = variavel + fixoAlocado;
    const porAnimal = l.numeroAnimais>0 ? total/l.numeroAnimais : 0;
    const arrobas = arrobasProduzidasNoMes(l.id, d.mes, l.numeroAnimais);
    const custoPorArroba = arrobas>0 ? total/arrobas : null;
    return {lote:l, racao, pasto, reproducao, fixoAlocado, total, porAnimal, arrobas, custoPorArroba};
  }).sort((a,b)=> b.total-a.total);

  // Média diária do mês (não "só hoje"): ração/pasto/cria não são lançados
  // todo santo dia (ex: ração feita a cada 3-4 dias) — mostrar só o valor de
  // hoje deixava a maioria dos currais com R$ 0,00 mesmo tendo gasto normal
  // recente. Em vez disso, pega o total já lançado no mês (custosMesPorLote,
  // acima) e divide pelos dias já passados do mês (1 até hoje) — dá a média
  // diária real até agora, sem os "buracos" dos dias sem lançamento.
  const custosPorLote = custosMesPorLote.map(r=>{
    const dias = diasAtivosNoMes(r.lote);
    const racao = r.racao/dias;
    const pasto = r.pasto/dias;
    const reproducao = r.reproducao/dias;
    const fixoAlocado = fixoLoteAlocado(r.lote, fixoAreaMes[loteTipo(r.lote)]/30);
    const total = racao + pasto + reproducao + fixoAlocado;
    const porAnimal = r.lote.numeroAnimais>0 ? total/r.lote.numeroAnimais : 0;
    return {lote:r.lote, racao, pasto, reproducao, fixoAlocado, total, porAnimal};
  }).sort((a,b)=> b.total-a.total);

  // Mesmos dados de custosMesPorLote, só que somados por área (Confinamento/
  // Pasto/Cria) em vez de por lote individual — pra comparar categorias.
  const custoPorAreaMes = ['confinamento','pasto','reproducao'].map(tipo=>{
    const lotesArea = custosMesPorLote.filter(r=>loteTipo(r.lote)===tipo);
    const totalAnimais = lotesArea.reduce((a,r)=>a+Number(r.lote.numeroAnimais||0),0);
    const totalCusto = lotesArea.reduce((a,r)=>a+r.total,0);
    const totalArrobas = lotesArea.reduce((a,r)=>a+(r.arrobas||0),0);
    return {
      tipo, label: TIPO_PESAGEM_LABEL[tipo], numeroLotes: lotesArea.length, totalAnimais, totalCusto, totalArrobas,
      custoPorArroba: totalArrobas>0 ? totalCusto/totalArrobas : null,
      custoPorAnimal: totalAnimais>0 ? totalCusto/totalAnimais : null,
    };
  }).filter(r=>r.numeroLotes>0);

  return `
  <p class="eyebrow" style="margin-bottom:10px;">Custo médio diário por curral no mês (ração + pasto + cria + fatia do custo fixo)</p>
  <div class="card" style="margin-bottom:22px;">
    ${custosPorLote.length===0 ? Empty('Nenhum lote ativo','Cadastre lotes em Confinamento, Pasto ou Cria para ver o custo médio diário de cada um aqui.') : `
    <table>
      <thead><tr><th>Curral</th><th>Nº animais</th><th>Custo variável (méd./dia)</th><th>Custo fixo (dia)</th><th>Total (méd./dia)</th><th>Custo/animal (méd./dia)</th></tr></thead>
      <tbody>
        ${custosPorLote.map(r=>`
          <tr>
            <td><strong>${r.lote.nome}</strong></td>
            <td class="mono">${fmtInt(r.lote.numeroAnimais)}</td>
            <td class="mono">R$ ${fmt(r.racao+r.pasto+r.reproducao)}</td>
            <td class="mono">R$ ${fmt(r.fixoAlocado)}</td>
            <td class="mono">R$ ${fmt(r.total)}</td>
            <td class="mono">R$ ${fmt(r.porAnimal,2)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`}
  </div>
  <p class="hint" style="margin:-14px 0 22px;">"Custo variável" junta ração, pasto e cria numa coisa só — um curral só tem custo na categoria da sua própria atividade (ex: Confinamento nunca tem custo de Pasto), então mostrar as três colunas separadas só deixava a tabela cheia de R$ 0,00. Não é o gasto de hoje especificamente (ração/pasto/cria não são lançados todo dia) — é o total já gasto no mês até agora dividido pelos dias já passados, pra dar uma média diária real em vez de mostrar R$ 0,00 nos dias sem lançamento. Um lote que começou no meio do mês divide só pelos dias que ele já existe, não pelos dias do mês inteiro. O custo fixo mensal é diluído por dia (mensal ÷ 30) e depois rateado entre os currais na proporção de animais × dias que cada um já existe no mês — mesmo critério do total do mês, abaixo.</p>

  <p class="eyebrow" style="margin-bottom:10px;">Custo total do mês por curral (ração + pasto + cria + fatia do custo fixo)</p>
  <div class="card" style="margin-bottom:22px;">
    ${custosMesPorLote.length===0 ? Empty('Nenhum lote ativo','Cadastre lotes em Confinamento, Pasto ou Cria para ver o custo total do mês de cada um aqui.') : `
    <table>
      <thead><tr><th>Curral</th><th>Nº animais</th><th>Ração+Pasto+Cria no mês</th><th>Custo fixo alocado</th><th>Total no mês</th><th>Custo/animal no mês</th><th>@ produzidas</th><th>Custo/@</th></tr></thead>
      <tbody>
        ${custosMesPorLote.map(r=>`
          <tr>
            <td><strong>${r.lote.nome}</strong></td>
            <td class="mono">${fmtInt(r.lote.numeroAnimais)}</td>
            <td class="mono">R$ ${fmt(r.racao+r.pasto+r.reproducao)}</td>
            <td class="mono">R$ ${fmt(r.fixoAlocado)}</td>
            <td class="mono">R$ ${fmt(r.total)}</td>
            <td class="mono">R$ ${fmt(r.porAnimal,2)}</td>
            <td class="mono">${r.arrobas!==null ? fmt(r.arrobas,1)+' @' : '—'}</td>
            <td class="mono">${r.custoPorArroba!==null ? 'R$ '+fmt(r.custoPorArroba,2) : '—'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`}
  </div>
  <p class="hint" style="margin:-14px 0 22px;">O custo fixo de cada curral é alocado na proporção de animais × dias que ele já existe no mês, em relação ao total dos lotes ativos da mesma atividade — assim um lote que chegou há poucos dias não carrega uma fatia do custo fixo do mês inteiro, só da parte proporcional ao tempo que ele já está na fazenda. "@ produzidas" vem do ganho de peso do lote no mês (Pesagem) ÷ 30 kg × nº de animais — sem pesagem cadastrada no mês, aparece "—".</p>

  <p class="eyebrow" style="margin-bottom:10px;">Custo por @ produzida — por área</p>
  <div class="card">
    ${custoPorAreaMes.length===0 ? Empty('Nenhum lote ativo','Cadastre lotes em Confinamento, Pasto ou Cria para comparar o custo por @ produzida entre as áreas.') : `
    <table>
      <thead><tr><th>Área</th><th>Lotes</th><th>Nº animais</th><th>Total no mês</th><th>Custo/animal</th><th>@ produzidas</th><th>Custo/@</th></tr></thead>
      <tbody>
        ${custoPorAreaMes.map(r=>`
          <tr>
            <td><strong>${r.label}</strong></td>
            <td class="mono">${r.numeroLotes}</td>
            <td class="mono">${fmtInt(r.totalAnimais)}</td>
            <td class="mono">R$ ${fmt(r.totalCusto)}</td>
            <td class="mono">${r.custoPorAnimal!==null ? 'R$ '+fmt(r.custoPorAnimal,2) : '—'}</td>
            <td class="mono">${r.totalArrobas>0 ? fmt(r.totalArrobas,1)+' @' : '—'}</td>

          </tr>
        `).join('')}

    </table>`}
  </div>
  <p class="hint" style="margin-top:12px;">Soma dos lotes de cada área (mesmos dados da tabela "Por Lote" acima) — útil pra comparar, por exemplo, se o Confinamento está produzindo @ mais barata que o Pasto.</p>`;

function PageFinanceiroCustosFixos(){
  const busca = state.searchDespesas.toLowerCase();
  const mesesDisponiveis = [...new Set(state.custosFixos.map(c=>c.mes).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
  const list = [...state.custosFixos].filter(c=>
    (!busca || c.nome.toLowerCase().includes(busca) || (c.categoria||'').toLowerCase().includes(busca) || (c.descricao||'').toLowerCase().includes(busca))
    && (!state.filtroMesDespesas || (state.filtroMesDespesas==='__recorrente__' ? !c.mes : c.mes===state.filtroMesDespesas))
  ).sort((a,b)=>{
    if(!a.mes && b.mes) return -1;
    if(a.mes && !b.mes) return 1;
    return (b.mes||'').localeCompare(a.mes||'');
  });

function mesLabel(mesStr){

function ModalVenda(){
  const d = editDraft;
  // Mostra lote de qualquer atividade (Confinamento/Pasto/Cria) — inclui o

  // (caso de editar uma venda cujo lote já fechou por causa dela mesma).
  const lotesDisponiveis = state.lotes.filter(l=>(!l.dataFim && Number(l.numeroAnimais||0)>0) || l.id==d.loteId);
  const lote = lotesDisponiveis.find(l=>l.id==d.loteId);
  const tipoVenda = d.tipoVenda || 'arroba';
  const arrobas = arrobasVenda(d);
  const valorTotal = valorVenda(d);
  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal" data-stop="1">
      <div class="modal-head"><h3>${d._editId?'Editar venda':'Nova venda'}</h3><button class="modal-close" data-close="1">&times;</button></div>

        <div class="field"><label>Lote</label>
          <select id="f-lotevenda">
            ${lotesDisponiveis.map(l=>`<option value="${l.id}" ${d.loteId==l.id?'selected':''}>${l.nome} (${TIPO_PESAGEM_LABEL[loteTipo(l)]} · ${fmtInt(l.numeroAnimais)} animais)</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label>Data</label><input id="f-datavenda" type="date" value="${d.data}"/></div>

        </div>
        <div class="field">
          <label>Tipo de venda</label>
          <select id="f-tipovenda">
            <option value="arroba" ${tipoVenda==='arroba'?'selected':''}>Abate — valor da arroba (peso de carcaça)</option>
            <option value="cabeca" ${tipoVenda==='cabeca'?'selected':''}>Venda por animal (valor fechado por cabeça)</option>
            <option value="kg" ${tipoVenda==='kg'?'selected':''}>Venda por kg (peso vivo)</option>
          </select>
        </div>
        ${tipoVenda==='arroba' ? `
        <div class="field-row">
          <div class="field"><label>Peso de carcaça por animal (kg, do frigorífico)</label><input id="f-pesovenda" type="text" inputmode="decimal" value="${d.pesoMedioKg}"/></div>
          <div class="field"><label>Valor da arroba paga (R$/@)</label><input id="f-valorarrobavenda" type="text" inputmode="decimal" value="${d.valorArroba}"/></div>
        </div>
        ` : ''}
        ${tipoVenda==='cabeca' ? `
        <div class="field"><label>Valor por animal (R$)</label><input id="f-valorporanimalvenda" type="text" inputmode="decimal" value="${d.valorPorAnimal}"/></div>
        ` : ''}
        ${tipoVenda==='kg' ? `
        <div class="field-row">
          <div class="field"><label>Peso por animal (kg, peso vivo)</label><input id="f-pesovenda" type="text" inputmode="decimal" value="${d.pesoMedioKg}"/></div>
          <div class="field"><label>Valor do kg (R$/kg)</label><input id="f-valorkgvenda" type="text" inputmode="decimal" value="${d.valorKg}"/></div>
        </div>
        ` : ''}
        <div class="total-bar ok">
          <span>${tipoVenda==='arroba' ? `${fmt(arrobas,2)} @ produzidas` : `${fmtInt(Number(d.quantidade)||0)} animais`}</span><span>R$ ${fmt(valorTotal)}</span>

        <p class="hint">${tipoVenda==='arroba' ? 'Peso de carcaça (não peso vivo) — 1 @ = 15 kg. Valor da arroba é o preço realmente pago nessa venda, não a estimativa diária mostrada em Financeiro.' : tipoVenda==='cabeca' ? 'Valor fechado por animal, sem depender de peso.' : 'Valor por kg de peso vivo — comum em venda de bezerros/animais magros.'} Ao salvar, desconta ${fmtInt(Number(d.quantidade)||0)} animais do número de animais do lote${lote && Number(d.quantidade||0)>=Number(lote.numeroAnimais||0) && Number(d.quantidade||0)>0 ? ' (encerra o lote automaticamente, já que zera os animais)' : ''} e lança o valor total como receita em Resultados.</p>

// Detalhe de uma fatia dos gráficos de Resultados: lista despesa por
// despesa o que compõe aquele valor, com botão de editar cada uma (reabre
// o cadastro de Despesas — dá pra trocar o centro de custo ou a área dali
// mesmo, sem precisar ir em Financeiro procurar o lançamento).
function ModalDetalheGrafico(){
  const {panelId, idx} = state.modal;
  const entry = (state.paineisResultadosDados[panelId]||[])[idx];
  if(!entry){
    return `<div class="overlay" data-close-overlay="1"><div class="modal" data-stop="1">
      <div class="modal-head"><h3>Detalhe</h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body"><p class="hint">Esse gráfico foi atualizado — feche e clique na fatia de novo.</p></div>
      <div class="modal-foot"><button class="btn btn-ghost" data-close="1">Fechar</button></div>
    </div></div>`;
  }
  const ehPorArea = panelId==='area' || panelId==='area-ano';
  const itens = [...(entry.itens||[])].sort((a,b)=>b.valor-a.valor);
  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal" data-stop="1">
      <div class="modal-head"><h3>${entry.nome}</h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body">
        <p class="hint" style="margin-bottom:14px;">R$ ${fmt(entry.valor)} (${fmt(entry.pct,1)}% do total)${ehPorArea ? ' — valor já rateado pra essa área; uma despesa "Geral" aparece aqui só com a fatia que cabe a essa área, não o valor cheio.' : ''}</p>
        ${itens.length===0 ? `<p class="hint">Sem despesas cadastradas detalhadas pra essa fatia.</p>` : `
        <table>
          <thead><tr><th>Despesa</th><th>Mês</th><th>Valor${ehPorArea ? ' (nessa área)' : ''}</th><th></th></tr></thead>
          <tbody>
            ${itens.map(it=>`
              <tr>
                <td><strong>${it.nome}</strong></td>
                <td>${it.mes ? `<span class="pill pill-cat">${mesLabel(it.mes)}</span>` : `<span class="pill pill-ok">Recorrente</span>`}</td>
                <td class="mono">R$ ${fmt(it.valor)}</td>
                <td>${temPermissao('financeiro','editar') && it.id ? `<button class="btn-ghost btn-sm" data-edit-custofixo="${it.id}">Editar</button>` : ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="1">Fechar</button>
      </div>
    </div>
  </div>`;
}

/* ===================== EVENTOS ===================== */
function attachEvents(){
  const loginForm = document.querySelector('[data-login-form]');
  if(loginForm){
    loginForm.onsubmit = (e)=>{ e.preventDefault(); fazerLogin(); };
    const uEl = document.querySelector('[data-login-usuario]');
    const sEl = document.querySelector('[data-login-senha]');
    if(uEl) uEl.oninput = (e)=>{ state.loginDraft.usuario = e.target.value; };
    if(sEl) sEl.oninput = (e)=>{ state.loginDraft.senha = e.target.value; };
  }
  document.querySelectorAll('[data-logout]').forEach(el=>{
    el.onclick = ()=> fazerLogout();
  });
  document.querySelectorAll('[data-retry-perfil]').forEach(el=>{
    el.onclick = async ()=>{
      await loadPerfil();
      render();
      if(state.perfil?.ativo) loadAll();
    };
  });
  if(state.modal?.type==='movimento'){
    const tipoMovEl = document.getElementById('f-tipo');
    if(tipoMovEl) tipoMovEl.onchange = (e)=>{ editDraft.tipo = e.target.value; render(); };
  }
  document.querySelectorAll('[data-trocar-senha-abrir]').forEach(el=>{
    el.onclick = ()=>{
      editDraft = {senhaAtual:'', novaSenha:'', confirmarSenha:''};
      state.modal = {type:'trocarSenha'};
      render();
    };
  });
  document.querySelectorAll('[data-ver-pendencias]').forEach(el=>{
    el.onclick = ()=>{ state.modal = {type:'pendencias'}; render(); };
  });
  document.querySelectorAll('[data-tentar-sincronizar]').forEach(el=>{
    el.onclick = async ()=>{
      state.modal = null;
      render();
      await tentarSincronizarFila();
    };
  });
  document.querySelectorAll('[data-descartar-pendencia]').forEach(el=>{
    el.onclick = ()=>{
      const fila = lerFilaOffline().filter(item=>item.queueId!==el.dataset.descartarPendencia);
      salvarFilaOffline(fila);
      render();
    };
  });
  document.querySelectorAll('[data-novo-usuario]').forEach(el=>{
    el.onclick = ()=>{
      editDraft = {nome:'', usuario:'', senha:''};
      state.usuarioError = '';
      state.modal = {type:'usuario'};
      render();
    };
  });
  document.querySelectorAll('[data-editar-usuario]').forEach(el=>{
    el.onclick = ()=>{
      const perfil = state.perfis.find(p=>p.id===el.dataset.editarUsuario);
      editDraft = {_perfilId: perfil.id, nome: perfil.nome, usuario: perfil.usuario, papel: perfil.papel, ativo: perfil.ativo, permissoes: {...perfil.permissoes}};
      state.modal = {type:'permissoes'};
      render();
    };
  });
  const criarUsuarioBtn = document.querySelector('[data-criar-usuario]');
  if(criarUsuarioBtn){
    criarUsuarioBtn.onclick = async ()=>{
      const nome = document.getElementById('f-nomeusuario').value.trim();
      const usuario = document.getElementById('f-usuario').value.trim();
      const senha = document.getElementById('f-senhausuario').value;
      if(!nome || !usuario || !senha){ state.usuarioError = 'Preencha nome, usuário e senha.'; render(); return; }
      state.usuarioLoading = true; state.usuarioError = ''; render();
      const { data, error } = await db.functions.invoke('criar-usuario', { body: { nome, usuario, senha } });
      state.usuarioLoading = false;
      if(error || data?.error){
        let msg = data?.error || error?.message || 'Falha ao criar usuário.';
        if(error?.context && typeof error.context.json === 'function'){
          try { const corpo = await error.context.json(); if(corpo?.error) msg = corpo.error; } catch(e){}
        }
        state.usuarioError = msg;
        render();
        return;
      }
      state.modal = null; editDraft = null;
      await loadAll();
    };
  }
  const searchEl = document.querySelector('[data-search]');
  if(searchEl){
    searchEl.oninput = (e)=>{ state.search = e.target.value; render();
      // refocus + cursor at end after re-render
      const s = document.querySelector('[data-search]');
      s.focus(); s.setSelectionRange(s.value.length, s.value.length);
    };
  }
  const searchDespesasEl = document.querySelector('[data-search-despesas]');
  if(searchDespesasEl){
    searchDespesasEl.oninput = (e)=>{ state.searchDespesas = e.target.value; render();
      const s = document.querySelector('[data-search-despesas]');
      s.focus(); s.setSelectionRange(s.value.length, s.value.length);
    };
  }
  const filtroMesDespesasEl = document.querySelector('[data-filtro-mes-despesas]');
  if(filtroMesDespesasEl){
    filtroMesDespesasEl.onchange = (e)=>{ state.filtroMesDespesas = e.target.value; render(); };
  }
  const filtroMesReceitasEl = document.querySelector('[data-filtro-mes-receitas]');
  if(filtroMesReceitasEl){
    filtroMesReceitasEl.onchange = (e)=>{ state.filtroMesReceitas = e.target.value; render(); };

  function setFiltroSaidaRacao(tipo, campo, valor){

  document.querySelectorAll('[data-filtro-mes-racao]').forEach(el=>{

  const stopEl = document.querySelector('[data-stop]');
  if(stopEl) stopEl.onclick = (e)=> e.stopPropagation();

  // dieta item add/remove/change — Nome/Categoria/Kg só são lidos do DOM no
  // salvar, então antes de re-renderizar (o que redesenha o formulário a
  // partir do editDraft) é preciso salvar o que já foi digitado nesses
  // campos, senão o re-render (pra mostrar a nova linha de ingrediente) apaga
  // o que a pessoa já tinha escrito.
  function sincronizarCamposDieta(){
    const nomeEl = document.getElementById('f-nome');
    const categoriaEl = document.getElementById('f-categoria');
    const kgEl = document.getElementById('f-kganimal');
    const tipoEl = document.getElementById('f-tipodieta');
    const estoqueMinEl = document.getElementById('f-estoqueminpronta');
    if(nomeEl) editDraft.nome = nomeEl.value;
    if(categoriaEl) editDraft.categoriaAnimal = categoriaEl.value;
    if(kgEl) editDraft.kgAnimalDia = kgEl.value;
    if(tipoEl) editDraft.tipo = tipoEl.value;
    if(estoqueMinEl) editDraft.estoqueMinPronta = estoqueMinEl.value;
  }
  document.querySelectorAll('[data-item-add]').forEach(el=>{
    el.onclick = ()=>{ sincronizarCamposDieta(); editDraft.itens.push({ingredienteId:state.ingredientes[0]?.id||'', pct:''}); render(); };
  });
  document.querySelectorAll('[data-item-del]').forEach(el=>{

  // venda: recalcula @/valor total ao vivo conforme digita (refoca depois
  // do re-render, senão perde o foco a cada tecla — mesmo truque já usado na
  // busca de Ingredientes/Despesas). Campos de peso/valor são type="text"
  // (aceitam vírgula decimal), então usam setSelectionRange igual à busca;
  // quantidade continua type="number" (inteiro, sem vírgula), sem isso.
  function refazVendaInput(id, campo, decimal){
    const el = document.getElementById(id);
    if(!el) return;
    el.oninput = (e)=>{
      editDraft[campo] = e.target.value;
      render();
      const s = document.getElementById(id);
      s.focus();
      if(decimal) s.setSelectionRange(s.value.length, s.value.length);
    };
  }
  const loteVendaEl = document.getElementById('f-lotevenda');
  if(loteVendaEl) loteVendaEl.onchange = (e)=>{ editDraft.loteId = Number(e.target.value); render(); };
  const tipoVendaEl = document.getElementById('f-tipovenda');
  if(tipoVendaEl) tipoVendaEl.onchange = (e)=>{ editDraft.tipoVenda = e.target.value; render(); };
  refazVendaInput('f-qtdvenda', 'quantidade');
  refazVendaInput('f-pesovenda', 'pesoMedioKg', true);
  refazVendaInput('f-valorarrobavenda', 'valorArroba', true);
  refazVendaInput('f-valorporanimalvenda', 'valorPorAnimal', true);
  refazVendaInput('f-valorkgvenda', 'valorKg', true);

  // save handlers
  const saveBtn = document.querySelector('[data-save]');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const type = saveBtn.dataset.save;
      let error = null;
      if(type==='ingrediente'){
        // o campo de preço só existe no formulário pra quem pode ver valores
        // (souAdmin) — sem ele, preserva o preço que já estava salvo.
        const precoInput = document.getElementById('f-preco');
        const campos = {
          nome: document.getElementById('f-nome').value || 'Sem nome',
          categoria: document.getElementById('f-categoria').value,
          fornecedor: document.getElementById('f-fornecedor').value,
          unidade: document.getElementById('f-unidade').value,
          ms: Number(document.getElementById('f-ms').value)||0,
          pb: Number(document.getElementById('f-pb').value)||0,
          ndt: Number(document.getElementById('f-ndt').value)||0,
          precoKg: precoInput ? Number(precoInput.value)||0 : Number(editDraft.precoKg)||0,
          estoqueMin: Number(document.getElementById('f-min').value)||0,
        };
        const row = ingredienteToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('ingredientes').update(row).eq('id', editDraft._editId));
        } else {
          ({error} = await db.from('ingredientes').insert(row));
        }
      } else if(type==='movimento'){
        const tipoMov = document.getElementById('f-tipo').value;
        const precoEntradaEl = document.getElementById('f-precoentrada');
        const campos = {
          data: document.getElementById('f-data').value,
          ingredienteId: Number(document.getElementById('f-ing').value),
          tipo: tipoMov,
          quantidade: Number(document.getElementById('f-qtd').value)||0,
          precoKg: (tipoMov==='entrada' && precoEntradaEl && precoEntradaEl.value) ? Number(precoEntradaEl.value) : null,
        };
        const row = movimentoToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('movimentos').update(row).eq('id', editDraft._editId));
        } else {
          ({error} = await db.from('movimentos').insert(row));
          // Uma entrada com preço informado recalcula o preço/kg do ingrediente
          // pela média ponderada entre o estoque que já tinha (antes dessa
          // entrada) e o que está entrando — só numa entrada nova, nunca ao
          // editar um lançamento existente.
          if(!error && campos.tipo==='entrada' && campos.precoKg){
            const ing = getIng(campos.ingredienteId);
            if(ing){
              const saldoAtualKg = qtdEmKg(saldoIngrediente(campos.ingredienteId), ing.unidade);
              const qtdEntradaKg = qtdEmKg(campos.quantidade, ing.unidade);
              const precoAtual = Number(ing.precoKg)||0;
              const precoPonderado = saldoAtualKg>0
                ? (saldoAtualKg*precoAtual + qtdEntradaKg*campos.precoKg) / (saldoAtualKg+qtdEntradaKg)
                : campos.precoKg;
              await db.from('ingredientes').update({preco_kg: precoPonderado}).eq('id', campos.ingredienteId);
            }
          }
        }
      } else if(type==='dieta'){
        const campos = {
          nome: document.getElementById('f-nome').value || 'Sem nome',
          tipo: document.getElementById('f-tipodieta').value,
          categoriaAnimal: document.getElementById('f-categoria').value,
          kgAnimalDia: Number(document.getElementById('f-kganimal').value)||0,
          estoqueMinPronta: Number(document.getElementById('f-estoqueminpronta').value)||0,
          itens: editDraft.itens.map(it=>({ingredienteId:Number(it.ingredienteId), pct:Number(it.pct)||0})),
        };
        const pctTotalDieta = campos.itens.reduce((a,it)=>a+it.pct,0);
        if(Math.abs(pctTotalDieta-100)>0.01){
          alert(`A composição soma ${fmt(pctTotalDieta,1)}%, precisa somar 100% pra salvar. Ajuste os percentuais dos ingredientes antes de continuar — senão o desconto de estoque nos lançamentos com essa dieta fica errado.`);
          return;
        }
        const row = dietaToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('dietas').update(row).eq('id', editDraft._editId));
          state.openDietId = editDraft._editId;
        } else {
          const res = await db.from('dietas').insert(row).select().single();
          error = res.error;
          if(res.data) state.openDietId = res.data.id;
        }
      } else if(type==='lote'){
        const campos = {
          nome: document.getElementById('f-nome').value || 'Sem nome',
          numeroAnimais: Number(document.getElementById('f-numanimais').value)||0,
          dataInicio: document.getElementById('f-datainicio').value,
          dataFim: document.getElementById('f-datafim').value || null,
          destino: document.getElementById('f-destino').value,
        };
        const row = loteToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('lotes').update(row).eq('id', editDraft._editId));
        } else {
          ({error} = await db.from('lotes').insert(row));
        }
      } else if(type==='saidaRacao' || type==='saidaRacaoCria'){
        const dietaId = Number(document.getElementById('f-dieta').value);
        const loteId = Number(document.getElementById('f-lote').value);
        // A data de um lançamento já registrado só pode ser alterada por
        // Administrador/Proprietário — o campo fica desabilitado na tela pra
        // quem não é, e aqui ignoramos qualquer valor diferente do original
        // por segurança (o input desabilitado não deveria mudar mesmo).
        const data = (editDraft._editId && !souAdmin()) ? editDraft.data : document.getElementById('f-data').value;
        const qtdRacaoVal = document.getElementById('f-qtdracao').value;
        if(!validarObrigatorios([[data,'Data'],[qtdRacaoVal,'Quantidade (kg)']])) return;
        if(Number(qtdRacaoVal)<=0){ alert('A quantidade precisa ser maior que zero.'); return; }
        const incompletaRacao = composicaoIncompleta(dietaId);
        if(incompletaRacao){
          alert(`A dieta "${incompletaRacao.dieta.nome}" tem uma composição que soma ${fmt(incompletaRacao.pctTotal,1)}%, não 100% — ajuste em Formulação de Dietas antes de lançar, senão o desconto de estoque fica errado.`);
          return;
        }
        const quantidadeKg = Number(qtdRacaoVal);
        if(editDraft._editId){
          const row = {data, dieta_id: dietaId, lote_id: loteId, quantidade_kg: quantidadeKg};
          const saidaId = editDraft._editId;
          ({error} = await db.from('saidas_racao').update(row).eq('id', saidaId));
          if(type==='saidaRacao'){
            // Confinamento desconta o ingrediente cru direto — refaz os
            // movimentos dessa saída com os valores novos (mesmo esquema
            // de antes de existir o estoque de ração pronta).
            const dieta = state.dietas.find(x=>x.id===dietaId);
            if(!error) await db.from('movimentos').delete().eq('saida_racao_id', saidaId);
            if(!error && dieta){
              const movs = dieta.itens.filter(it=>it.ingredienteId).map(it=>{
                const ing = getIng(it.ingredienteId);
                const consumoKg = quantidadeKg*it.pct/100;
                return {
                  data, ingrediente_id: it.ingredienteId, tipo: 'saida',
                  quantidade: kgParaUnidade(consumoKg, ing?.unidade), saida_racao_id: saidaId,
                };
              });
              if(movs.length){
                ({error} = await db.from('movimentos').insert(movs));
              }
            }
          }
        } else {
          const resultado = await salvarOuEnfileirar(type, {dietaId, loteId, data, quantidadeKg});
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='cocho'){
        const dataCochoVal = document.getElementById('f-data').value;
        if(!validarObrigatorios([[dataCochoVal,'Data']])) return;
        const campos = {
          loteId: Number(document.getElementById('f-lote').value),
          data: dataCochoVal,
          nota: Number(editDraft.nota)||2,
          observacao: document.getElementById('f-obs').value,
        };
        if(editDraft._editId){
          ({error} = await db.from('leituras_cocho').update(leituraCochoToRow(campos)).eq('id', editDraft._editId));
        } else {
          const resultado = await salvarOuEnfileirar(type, campos);
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='pasto'){
        const loteId = Number(document.getElementById('f-lote').value);
        const dietaId = Number(document.getElementById('f-dietapasto').value);
        const data = document.getElementById('f-data').value;
        const qtdPastoVal = document.getElementById('f-qtdpasto').value;
        if(!validarObrigatorios([[data,'Data'],[qtdPastoVal,'Quantidade']])) return;
        if(Number(qtdPastoVal)<=0){ alert('A quantidade precisa ser maior que zero.'); return; }
        const incompletaPasto = composicaoIncompleta(dietaId);
        if(incompletaPasto){
          alert(`A dieta "${incompletaPasto.dieta.nome}" tem uma composição que soma ${fmt(incompletaPasto.pctTotal,1)}%, não 100% — ajuste em Formulação de Dietas antes de lançar, senão o desconto de estoque fica errado.`);
          return;
        }
        const quantidade = Number(qtdPastoVal);
        if(editDraft._editId){
          const row = {data, lote_id: loteId, dieta_id: dietaId, quantidade};
          ({error} = await db.from('pasto').update(row).eq('id', editDraft._editId));
        } else {
          const resultado = await salvarOuEnfileirar(type, {loteId, dietaId, data, quantidade});
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='producaoRacao'){
        const dietaId = Number(document.getElementById('f-dietaproducao').value);
        const data = document.getElementById('f-data').value;
        const qtdProduzidaVal = document.getElementById('f-qtdproduzida').value;
        if(!validarObrigatorios([[data,'Data'],[qtdProduzidaVal,'Quantidade produzida']])) return;
        if(Number(qtdProduzidaVal)<=0){ alert('A quantidade precisa ser maior que zero.'); return; }
        const incompletaProducao = composicaoIncompleta(dietaId);
        if(incompletaProducao){
          alert(`A dieta "${incompletaProducao.dieta.nome}" tem uma composição que soma ${fmt(incompletaProducao.pctTotal,1)}%, não 100% — ajuste em Formulação de Dietas antes de lançar, senão o desconto de estoque fica errado.`);
          return;
        }
        const quantidadeKg = Number(qtdProduzidaVal);
        if(editDraft._editId){
          const dieta = state.dietas.find(x=>x.id===dietaId);
          const row = {data, dieta_id: dietaId, quantidade_kg: quantidadeKg};
          const producaoId = editDraft._editId;
          ({error} = await db.from('producoes_racao').update(row).eq('id', producaoId));
          if(!error) await db.from('movimentos').delete().eq('producao_racao_id', producaoId);
          if(!error && dieta){
            const movs = dieta.itens.filter(it=>it.ingredienteId).map(it=>{
              const ing = getIng(it.ingredienteId);
              const consumoKg = quantidadeKg*it.pct/100;
              return {
                data, ingrediente_id: it.ingredienteId, tipo: 'saida',
                quantidade: kgParaUnidade(consumoKg, ing?.unidade), producao_racao_id: producaoId,
              };
            });
            if(movs.length){
              ({error} = await db.from('movimentos').insert(movs));
            }
          }
        } else {
          const resultado = await salvarOuEnfileirar(type, {dietaId, data, quantidadeKg});
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='venda'){
        const loteId = Number(document.getElementById('f-lotevenda').value);
        const data = document.getElementById('f-datavenda').value;
        const qtdVal = document.getElementById('f-qtdvenda').value;
        const tipoVenda = document.getElementById('f-tipovenda').value;
        const observacao = document.getElementById('f-obsvenda').value;
        if(!validarObrigatorios([[data,'Data'],[qtdVal,'Quantidade de animais']])) return;
        if(Number(qtdVal)<=0){ alert('A quantidade de animais precisa ser maior que zero.'); return; }
        let pesoMedioKg=0, valorArroba=0, valorPorAnimal=0, valorKg=0;
        if(tipoVenda==='cabeca'){
          valorPorAnimal = numDecimal(document.getElementById('f-valorporanimalvenda').value);
          if(valorPorAnimal<=0){ alert('O valor por animal precisa ser maior que zero.'); return; }
        } else if(tipoVenda==='kg'){
          pesoMedioKg = numDecimal(document.getElementById('f-pesovenda').value);
          valorKg = numDecimal(document.getElementById('f-valorkgvenda').value);
          if(pesoMedioKg<=0){ alert('O peso por animal precisa ser maior que zero.'); return; }
          if(valorKg<=0){ alert('O valor do kg precisa ser maior que zero.'); return; }
        } else {
          pesoMedioKg = numDecimal(document.getElementById('f-pesovenda').value);
          valorArroba = numDecimal(document.getElementById('f-valorarrobavenda').value);
          if(pesoMedioKg<=0){ alert('O peso de carcaça precisa ser maior que zero.'); return; }
          if(valorArroba<=0){ alert('O valor da arroba precisa ser maior que zero.'); return; }
        }
        const quantidade = Number(qtdVal);
        const campos = {quantidade, tipoVenda, pesoMedioKg, valorArroba, valorPorAnimal, valorKg};
        const arrobas = tipoVenda==='arroba' ? arrobasVenda(campos) : null;
        const valorTotal = valorVenda(campos);
        if(editDraft._editId){
          const vendaId = editDraft._editId;
          const loteAntigoId = editDraft._loteIdOriginal;
          const quantidadeAntiga = Number(editDraft._quantidadeOriginal||0);
          // desfaz o efeito da venda antiga no lote antigo antes de aplicar a nova
          if(loteAntigoId){
            const loteAntigo = state.lotes.find(l=>l.id===loteAntigoId);
            if(loteAntigo){
              ({error} = await db.from('lotes').update({numero_animais: Number(loteAntigo.numeroAnimais||0)+quantidadeAntiga}).eq('id', loteAntigoId));
            }
          }
          if(!error){
            const row = {data, lote_id: loteId, quantidade, tipo_venda: tipoVenda, peso_medio_kg: pesoMedioKg||null, valor_arroba: valorArroba||null, valor_por_animal: valorPorAnimal||null, valor_kg: valorKg||null, observacao};
            ({error} = await db.from('abates').update(row).eq('id', vendaId));
          }
          if(!error){
            const lote = state.lotes.find(l=>l.id===loteId);
            const descricao = `${TIPO_VENDA_LABEL[tipoVenda]||'Venda'} — ${lote?lote.nome:'Lote'} (${fmtInt(quantidade)} animais)`;
            ({error} = await db.from('receitas').update({data, lote_id:loteId, descricao, arrobas, valor:valorTotal}).eq('abate_id', vendaId));
          }
          if(!error){
            const lote = state.lotes.find(l=>l.id===loteId);
            if(lote){
              const baseAnimais = loteId===loteAntigoId ? Number(lote.numeroAnimais||0)+quantidadeAntiga : Number(lote.numeroAnimais||0);
              const novoNumero = Math.max(0, baseAnimais-quantidade);
              const updLote = {numero_animais: novoNumero};
              if(novoNumero===0 && !lote.dataFim) updLote.data_fim = data;
              ({error} = await db.from('lotes').update(updLote).eq('id', lote.id));
            }
          }
        } else {
          const resultado = await salvarOuEnfileirar(type, {loteId, data, quantidade, tipoVenda, pesoMedioKg, valorArroba, valorPorAnimal, valorKg, observacao});
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='reproducaoCusto'){
        const dataReprodVal = document.getElementById('f-data').value;
        const itemVal = document.getElementById('f-item').value;
        const custoVal = document.getElementById('f-custoreproducao').value;
        if(!validarObrigatorios([[dataReprodVal,'Data'],[itemVal,'Item'],[custoVal,'Custo']])) return;
        if(Number(custoVal)<=0){ alert('O custo precisa ser maior que zero.'); return; }
        const campos = {
          loteId: Number(document.getElementById('f-lote').value),
          data: dataReprodVal,
          item: itemVal,
          custo: Number(custoVal),
        };
        if(editDraft._editId){
          ({error} = await db.from('reproducao_custos').update(reproducaoCustoToRow(campos)).eq('id', editDraft._editId));
        } else {
          const resultado = await salvarOuEnfileirar(type, campos);
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='parto'){
        const dataPartoVal = document.getElementById('f-data').value;
        const numeroMaeVal = document.getElementById('f-numeromae').value;
        if(!validarObrigatorios([[dataPartoVal,'Data'],[numeroMaeVal,'Número da mãe']])) return;
        const campos = {
          loteId: Number(document.getElementById('f-lote').value),
          data: dataPartoVal,
          numeroMae: numeroMaeVal,
          sexoBezerro: document.getElementById('f-sexobezerro').value,
        };
        if(editDraft._editId){
          ({error} = await db.from('partos').update(partoToRow(campos)).eq('id', editDraft._editId));
        } else {
          const resultado = await salvarOuEnfileirar(type, campos);
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='pesagem'){
        const dataPesagemVal = document.getElementById('f-datapesagem').value;
        const pesoVal = document.getElementById('f-pesomedio').value;
        if(!validarObrigatorios([[dataPesagemVal,'Data'],[pesoVal,'Peso médio por animal']])) return;
        if(Number(pesoVal)<=0){ alert('O peso precisa ser maior que zero.'); return; }
        const campos = {
          loteId: Number(document.getElementById('f-lotepesagem').value),
          data: dataPesagemVal,
          pesoMedioKg: Number(pesoVal),
          observacao: document.getElementById('f-obspesagem').value,
        };
        if(editDraft._editId){
          ({error} = await db.from('pesagens').update(pesagemToRow(campos)).eq('id', editDraft._editId));
        } else {
          const resultado = await salvarOuEnfileirar(type, campos);
          if(resultado.enfileirado){
            alert('Sem conexão — o lançamento foi salvo neste aparelho e será enviado automaticamente quando a internet voltar.');
            state.modal = null; editDraft = null; render();
            return;
          }
          error = resultado.error;
        }
      } else if(type==='custoFixo'){
        const data = document.getElementById('f-datacustofixo').value || null;
        const areas = ['confinamento','pasto','cria'].filter(a=>document.getElementById(`f-areacustofixo-${a}`).checked);
        const campos = {
          nome: document.getElementById('f-nome').value || 'Sem nome',
          categoria: document.getElementById('f-categoria').value,
          descricao: document.getElementById('f-descricaocustofixo').value,
          valorMensal: Number(document.getElementById('f-valormensal').value)||0,
          data,
          mes: data ? data.slice(0,7) : null,
          areas,
          observacao: document.getElementById('f-obscustofixo').value,
        };
        const row = custoFixoToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('custos_fixos').update(row).eq('id', editDraft._editId));
        } else {
          ({error} = await db.from('custos_fixos').insert(row));
        }
      } else if(type==='investimento'){
        const campos = {
          nome: document.getElementById('f-nome').value || 'Sem nome',
          categoria: document.getElementById('f-categoria').value,
          valor: Number(document.getElementById('f-valorinvest').value)||0,
          data: document.getElementById('f-data').value,
        };
        const row = investimentoToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('investimentos').update(row).eq('id', editDraft._editId));
        } else {
          ({error} = await db.from('investimentos').insert(row));
        }
      } else if(type==='receita'){
        const campos = {
          loteId: document.getElementById('f-lotereceita').value ? Number(document.getElementById('f-lotereceita').value) : null,
          data: document.getElementById('f-data').value,
          descricao: document.getElementById('f-descricaoreceita').value || 'Sem descrição',
          arrobas: document.getElementById('f-arrobas').value ? Number(document.getElementById('f-arrobas').value) : null,
          valor: Number(document.getElementById('f-valorreceita').value)||0,
          observacao: document.getElementById('f-obsreceita').value,
        };
        const row = receitaToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('receitas').update(row).eq('id', editDraft._editId));
        } else {
          ({error} = await db.from('receitas').insert(row));
        }
      } else if(type==='precoArroba'){
        const data = document.getElementById('f-dataarroba').value;
        const valorMachoStr = document.getElementById('f-valorarrobamacho').value;
        const valorFemeaStr = document.getElementById('f-valorarrobafemea').value;
        if(valorMachoStr!==''){
          const row = precoArrobaToRow({data, valor:Number(valorMachoStr)||0, sexo:'macho'});
          if(editDraft._editIdMacho){
            ({error} = await db.from('precos_arroba').update(row).eq('id', editDraft._editIdMacho));
          } else {
            ({error} = await db.from('precos_arroba').insert(row));
          }
        }
        if(!error && valorFemeaStr!==''){
          const row = precoArrobaToRow({data, valor:Number(valorFemeaStr)||0, sexo:'femea'});
          if(editDraft._editIdFemea){
            ({error} = await db.from('precos_arroba').update(row).eq('id', editDraft._editIdFemea));
          } else {
            ({error} = await db.from('precos_arroba').insert(row));
          }
        }
      } else if(type==='metaMargem'){
        const pct = Number(document.getElementById('f-metamargem').value)||0;
        ({error} = await db.from('config_financeiro').upsert({id:1, meta_margem_pct:pct}));
      } else if(type==='fazenda'){
        const campos = {
          nome: document.getElementById('f-nomefazenda').value || 'Sem nome',
          hectares: Number(document.getElementById('f-hectaresfazenda').value)||0,
        };
        const row = fazendaToRow(campos);
        if(editDraft._editId){
          ({error} = await db.from('fazendas').update(row).eq('id', editDraft._editId));
        } else {
          ({error} = await db.from('fazendas').insert(row));
        }
      } else if(type==='permissoes'){
        const papel = document.getElementById('f-papelusuario').value;
        const ativo = document.getElementById('f-ativousuario').checked;
        const permissoes = {};
        document.querySelectorAll('[data-perm-modulo]').forEach(sel=>{ permissoes[sel.dataset.permModulo] = sel.value; });
        ({error} = await db.from('profiles').update({papel, ativo, permissoes}).eq('id', editDraft._perfilId));
      } else if(type==='trocarSenha'){
        const senhaAtual = document.getElementById('f-senhaatual').value;
        const novaSenha = document.getElementById('f-novasenha').value;
        const confirmarSenha = document.getElementById('f-confirmarsenha').value;
        if(!senhaAtual || !novaSenha || !confirmarSenha){ alert('Preencha todos os campos.'); return; }
        if(novaSenha.length<6){ alert('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
        if(novaSenha!==confirmarSenha){ alert('A confirmação não bate com a nova senha.'); return; }
        const email = `${state.perfil.usuario}@${DOMINIO_LOGIN}`;
        const { error: erroSenhaAtual } = await db.auth.signInWithPassword({ email, password: senhaAtual });
        if(erroSenhaAtual){ alert('Senha atual incorreta.'); return; }
        ({error} = await db.auth.updateUser({ password: novaSenha }));
        if(error){ alert('Não foi possível trocar a senha: ' + error.message); return; }
        state.modal = null; editDraft = null;
        alert('Senha alterada com sucesso.');
        render();
        return;
      }
      if(error){
        alert('Não foi possível salvar: ' + error.message);
        return;
      }
      state.modal = null; editDraft = null;
      await loadAll();
    };
  }

  // painel de resultados: hover sincronizado entre gráfico e legenda
  const tooltip = document.getElementById('painel-tooltip');
  const clearHovers = ()=>{
    document.querySelectorAll('.donut-slice.hover, .legenda-row.hover').forEach(el=>el.classList.remove('hover'));
  };
  document.querySelectorAll('[data-slice-idx]').forEach(el=>{
    const idx = el.dataset.sliceIdx;
    el.addEventListener('pointerenter', ()=>{
      clearHovers();
      el.classList.add('hover');
      const row = document.querySelector(`[data-legenda-idx="${idx}"]`);
      if(row) row.classList.add('hover');
      if(tooltip){
        tooltip.innerHTML = `<div class="v">R$ ${el.dataset.tipValor}</div><div class="l">${el.dataset.tipNome} · ${el.dataset.tipPct}%</div>`;
        tooltip.style.display = 'block';
      }
    });
    el.addEventListener('pointermove', (e)=>{
      if(tooltip){ tooltip.style.left = (e.clientX+14)+'px'; tooltip.style.top = (e.clientY+14)+'px'; }
    });
    el.addEventListener('pointerleave', ()=>{
      clearHovers();
      if(tooltip) tooltip.style.display = 'none';
    });
    el.addEventListener('focus', ()=>{
      clearHovers();
      el.classList.add('hover');
      const row = document.querySelector(`[data-legenda-idx="${idx}"]`);
      if(row) row.classList.add('hover');
    });
    el.addEventListener('blur', clearHovers);
  });
  document.querySelectorAll('[data-legenda-idx]').forEach(el=>{
    const idx = el.dataset.legendaIdx;
    el.addEventListener('pointerenter', ()=>{
      clearHovers();
      el.classList.add('hover');
      const slice = document.querySelector(`[data-slice-idx="${idx}"]`);
      if(slice) slice.classList.add('hover');
    });
    el.addEventListener('pointerleave', clearHovers);
  });
  // Clique numa fatia do donut ou linha da legenda abre o detalhe (as
  // despesas que compõem aquela fatia, com botão de editar cada uma).
  // A chave é "painelId-idx" — o painelId em si pode ter hífen (ex:
  // "area-ano"), então separamos só no último hífen (o idx nunca tem).
  const abrirDetalheFatia = (chave)=>{
    const idx = Number(chave.slice(chave.lastIndexOf('-')+1));
    const panelId = chave.slice(0, chave.lastIndexOf('-'));
    const entry = (state.paineisResultadosDados[panelId]||[])[idx];
    if(!entry) return;
    state.modal = {type:'detalheGrafico', panelId, idx};
    render();
  };
  document.querySelectorAll('[data-slice-idx]').forEach(el=>{
    el.addEventListener('click', ()=>abrirDetalheFatia(el.dataset.sliceIdx));
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); abrirDetalheFatia(el.dataset.sliceIdx); } });
  });
  document.querySelectorAll('[data-legenda-idx]').forEach(el=>{
    el.addEventListener('click', ()=>abrirDetalheFatia(el.dataset.legendaIdx));
  });
}

initAuth();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js'));
}

// tenta sincronizar a fila offline assim que o navegador avisar que voltou
// a conexão, e periodicamente como reforço (o evento 'online' nem sempre
// dispara de forma confiável em todo dispositivo/navegador).
window.addEventListener('online', tentarSincronizarFila);
setInterval(tentarSincronizarFila, 30000);
// se sobrou algo pendente de uma sessão anterior (app fechado antes de
// sincronizar), tenta assim que o app abre de novo.
setTimeout(tentarSincronizarFila, 3000);
</script>
</body>
