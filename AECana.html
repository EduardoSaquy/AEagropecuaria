<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

     Script injetado nao consegue mandar dado para outro endereco. Se um dia precisar de outro servico, entra aqui. -->

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AE Cana</title>
<link rel="manifest" href="manifest_cana.json">
<link rel="icon" href="icon-cana-192.png">
<link rel="apple-touch-icon" href="icon-cana-192.png">
<meta name="theme-color" content="#1B4332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-escuro:#173D2E;
    --verde-medio:#158A4C;
    --verde-vivo:#00BE5E;
    --verde-vivo-escuro:#008C31;
    --verde-claro:#DFF6E8;
    --dourado-escuro:#6B4413;
    --dourado-medio:#A6741F;
    --dourado-claro:#E3C371;
    --dourado-bg:#F7EFDC;
    --grafite:#1A2430;
    --cinza:#5B6B7A;
    --cinza-claro:#E1E7EE;
    --cinza-bg:#F5F7FA;
    --chip-bg:#F0F1F3;
    --chip-color:#6B7280;
    --branco:#FFFFFF;
    --ambar:#C98A2B;
    --ambar-texto:#7A4F08;
    --ambar-bg:#F5E9D7;
    --alerta:#B03A24;
    --alerta-bg:#FBEAE6;
    --ok-bg:#E3F1EA;
    --bom:#007A2B;
    --bom-bg:#DFF6E8;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,42,74,0.04), 0 8px 24px rgba(15,42,74,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--cinza-bg);
    color:var(--grafite);
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; flex-direction:column; height:100vh; overflow:hidden;}
  /* ---------- TOPBAR + TABSROW ---------- */
  .topbar{background:var(--verde-escuro); padding:0 28px; display:flex; align-items:center; gap:20px; height:60px; flex-shrink:0;}
  .brand{display:flex; align-items:center; gap:10px; color:#fff;}
  .brand-mark{width:26px; height:26px; flex-shrink:0;}
  .brand-name{font-family:'Fraunces',serif; font-weight:700; font-size:18px; letter-spacing:0.2px;}
  .topbar-user{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .topbar-user-nome{color:rgba(255,255,255,0.85); font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px;}
  .avatar{width:28px; height:28px; border-radius:50%; background:var(--verde-vivo); color:#0B2318; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;}
  .btn-sair{background:rgba(255,255,255,0.1); border:none; color:#fff; padding:7px 11px; border-radius:8px; font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .btn-sair:hover{background:rgba(255,255,255,0.2);}
  .tabsrow{background:var(--branco); border-bottom:1px solid var(--cinza-claro); display:flex; gap:6px; padding:10px 20px; overflow-x:auto; flex-shrink:0;}
  .nav-item{display:flex; align-items:center; gap:7px; font-family:'Inter',sans-serif; font-size:13px; font-weight:700; color:var(--cinza); background:none; border:none; padding:9px 14px; border-radius:10px; cursor:pointer; white-space:nowrap; transition:background 0.12s, color 0.12s;}
  .nav-item svg{opacity:0.72; flex-shrink:0;}
  .nav-item:hover{background:var(--cinza-bg); color:var(--verde-escuro);}
  .nav-item.active{background:var(--verde-vivo); color:#0B2318;}
  .nav-item.active svg{opacity:1;}
  /* ---------- MAIN ---------- */
  .main{flex:1; padding:28px 32px 60px 32px; max-width:1280px; width:100%; margin:0 auto; overflow-y:auto;}
  .page-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--verde-medio); font-weight:700; margin:0 0 4px 0;}
  h1{font-family:'Fraunces',serif; font-size:26px; font-weight:700; margin:0; color:var(--grafite); letter-spacing:-0.2px;}
  .page-desc{color:var(--cinza); font-size:13.5px; margin-top:6px; max-width:600px;}
  .btn{
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700; padding:10px 18px; border-radius:10px;
    border:none; cursor:pointer; transition:filter 0.15s, transform 0.1s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--verde-vivo); color:#0B2318;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary.dourado{background:var(--dourado-medio); color:#2B1D06;}
  .btn-ghost{background:var(--branco); color:var(--verde-escuro); border:1px solid var(--cinza-claro);}
  .btn-ghost:hover{background:var(--cinza-bg);}
  .btn-danger-ghost{background:var(--branco); color:var(--alerta); border:1px solid var(--cinza-claro); padding:6px 10px; font-size:12px;}
  .btn-danger-ghost:hover{background:var(--alerta-bg);}
  .btn-sm{padding:7px 13px; font-size:12.5px;}
  .card{background:var(--branco); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--cinza-claro); overflow-x:auto;}
  .card-pad{padding:22px 24px;}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  .stat-card{background:var(--branco); border:1px solid var(--cinza-claro); border-radius:var(--radius); padding:18px 20px;}
  .frente-bloco{margin-bottom:26px;}
  .frente-bloco-titulo{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .frente-bloco-titulo h3{font-family:'Fraunces',serif; font-size:16px; margin:0; color:var(--verde-escuro);}
  .frente-bloco.graos .frente-bloco-titulo h3{color:var(--dourado-escuro);}
  /* ---------- GRÁFICO DE BARRAS (Despesas, Receita x Despesa) ---------- */
  .despesa-barras{display:flex; flex-direction:column; gap:8px;}
  .despesa-barra-linha{
    display:grid; grid-template-columns:200px 1fr 130px; align-items:center; gap:14px;
    cursor:pointer; padding:8px 10px; border-radius:9px; transition:background 0.12s;
  }
  .despesa-barra-linha:hover{background:var(--cinza-bg);}
  .despesa-barra-linha.ativa{background:var(--verde-claro);}
  .despesa-barra-nome{font-size:13px; color:var(--grafite); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .despesa-barra-track{background:var(--cinza-claro); border-radius:6px; height:10px; overflow:hidden;}
  .despesa-barra-fill{background:var(--verde-vivo); height:100%; border-radius:6px; transition:width 0.2s;}
  .despesa-barra-linha.ativa .despesa-barra-fill{background:var(--verde-vivo-escuro);}
  .despesa-barra-valor{font-size:12.5px; text-align:right; color:var(--cinza);}
  .despesa-grupo{margin-bottom:10px; overflow:visible;}
  .despesa-grupo-header{display:flex; align-items:center; gap:12px; padding:16px 22px; cursor:pointer;}
  .despesa-grupo-header:hover{background:var(--cinza-bg);}
  .despesa-grupo-seta{color:var(--cinza); font-size:10px; width:12px; flex-shrink:0;}
  .despesa-grupo-nome{font-weight:700; color:var(--grafite); flex-shrink:0;}
  .despesa-grupo-valor{margin-left:auto; font-size:13.5px;}
  .despesa-grupo-tabela{width:100%; border-collapse:collapse;}
  .despesa-grupo-tabela td{padding:13px 22px; border-top:1px solid var(--cinza-claro); font-size:13px; background:transparent;}
  .despesa-grupo-tabela tr:hover td{background:var(--cinza-bg);}
  .despesa-grupo-data{white-space:nowrap; width:100px; color:var(--cinza);}
  .despesa-grupo-valorlinha{white-space:nowrap; width:130px; text-align:right;}
  .despesa-grupo-acoes{white-space:nowrap; width:170px; text-align:right;}
  .despesa-grupo-acoes .btn-ghost, .despesa-grupo-acoes .btn-danger-ghost{margin-left:6px;}
  /* ---------- tags de contexto (Fazenda/Talhão/Cultura) ---------- */
  .contexto-tags{display:flex; gap:6px; align-items:center; margin-top:5px; flex-wrap:wrap;}
  /* ---------- DONUT ---------- */
  .painel-resultados{display:flex; gap:32px; align-items:center; flex-wrap:wrap;}
  .donut-wrap{flex-shrink:0;}
  .donut-svg{display:block;}
  .donut-slice{cursor:pointer; transition:opacity 0.15s;}
  .donut-slice:hover{opacity:0.82;}
  .donut-label{font-family:'Inter',monospace; font-size:11px; font-weight:600; fill:#fff; pointer-events:none;}
  .donut-center-value{font-family:'Inter',monospace; font-size:17px; font-weight:600; fill:var(--grafite);}
  .donut-center-label{font-family:'Inter',sans-serif; font-size:10px; fill:var(--cinza); text-transform:uppercase; letter-spacing:0.5px;}
  .painel-legenda{flex:1; min-width:220px; display:flex; flex-direction:column; gap:2px;}
  .legenda-row{display:grid; grid-template-columns:12px 1fr auto auto; align-items:center; gap:10px; padding:7px 8px; border-radius:8px; cursor:pointer;}
  .legenda-row:hover{background:var(--cinza-bg);}
  .legenda-swatch{width:12px; height:12px; border-radius:3px;}
  .legenda-nome{font-size:13px; color:var(--grafite);}
  .legenda-valor{font-family:'Inter',monospace; font-size:12.5px; color:var(--grafite); font-variant-numeric:tabular-nums;}
  .legenda-pct{font-family:'Inter',monospace; font-size:12.5px; color:var(--cinza); min-width:48px; text-align:right; font-variant-numeric:tabular-nums;}
  @media (max-width:760px){ .painel-resultados{flex-direction:column; align-items:stretch;} .donut-wrap{align-self:center;} }
  .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:0.7px; color:var(--cinza); font-weight:700;}
  .stat-value{font-family:'IBM Plex Mono',monospace; font-size:23px; font-weight:600; color:var(--grafite); margin-top:8px;}
  .stat-value.alerta{color:var(--alerta);}
  /* ---------- resumo financeiro (totais no topo de Despesas/Receitas) ---------- */
  .totals-strip{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:20px; padding-bottom:18px; border-bottom:1px solid var(--cinza-claro);}
  .totals-nums{display:flex; gap:40px; flex-wrap:wrap; row-gap:14px;}
  .total-item{display:flex; flex-direction:column; gap:8px;}
  .total-label{font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--cinza); font-weight:700;}
  .total-value{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--grafite); padding-bottom:9px; border-bottom:2.5px solid var(--cinza-claro); min-width:140px;}
  .total-value.neg{color:var(--alerta); border-bottom-color:var(--alerta);}
  .total-value.pos{color:var(--verde-vivo-escuro); border-bottom-color:var(--verde-vivo);}
  .silo-wrap{display:flex; align-items:center; gap:8px;}
  .silo{width:14px; height:30px; border:1.5px solid var(--verde-escuro); border-radius:3px; position:relative; overflow:hidden; background:var(--cinza-claro); flex-shrink:0;}
  .silo-fill{position:absolute; bottom:0; left:0; right:0; background:var(--verde-medio);}
  .silo-fill.alerta{background:var(--alerta);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--cinza); font-weight:700; padding:13px 14px; border-bottom:1px solid var(--cinza-claro); white-space:nowrap;}
  td{padding:13px 14px; border-bottom:1px solid var(--cinza-claro); color:var(--grafite); vertical-align:middle;}
  tbody tr:hover td{background:var(--cinza-bg);}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .pill{display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;}
  .pill-ok{background:var(--ok-bg); color:var(--verde-vivo-escuro);}
  .pill-alerta{background:var(--alerta-bg); color:var(--alerta);}
  .pill-cat{background:var(--chip-bg); color:var(--chip-color); border-radius:8px; font-weight:600;}
  .pill-warn{background:var(--ambar-bg); color:var(--ambar-texto);}
  .pill-cana{background:var(--verde-claro); color:var(--verde-vivo-escuro);}
  .pill-graos{background:var(--dourado-bg); color:var(--dourado-medio);}
  /* form modal */
  .overlay{position:fixed; inset:0; background:rgba(23,61,46,0.4); display:flex; align-items:flex-start; justify-content:center; padding:50px 20px; overflow-y:auto; z-index:50;}
  .modal{background:var(--branco); border-radius:16px; width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal.modal-lg{max-width:760px;}
  .modal-head{padding:20px 24px; border-bottom:1px solid var(--cinza-claro); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h3{font-family:'Fraunces',serif; font-size:18px; margin:0; color:var(--grafite);}
  .modal-close{background:none; border:none; cursor:pointer; color:var(--cinza); font-size:20px; line-height:1;}
  .modal-body{padding:22px 24px; display:flex; flex-direction:column; gap:14px; max-height:70vh; overflow-y:auto;}
  .modal-foot{padding:16px 24px; border-top:1px solid var(--cinza-claro); display:flex; justify-content:flex-end; gap:10px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  label{font-size:12px; font-weight:600; color:var(--grafite);}
  input, select, textarea{font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 12px; border:1px solid var(--cinza-claro); border-radius:9px; background:var(--branco); color:var(--grafite); outline:none; width:100%;}
  input:focus, select:focus, textarea:focus{border-color:var(--verde-vivo); box-shadow:0 0 0 3px rgba(0,190,94,0.14);}
  .hint{font-size:11px; color:var(--cinza);}
  .empty{text-align:center; padding:50px 20px; color:var(--cinza);}
  .empty h4{font-family:'Fraunces',serif; color:var(--grafite); margin:10px 0 6px 0; font-size:16px;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
  .search{display:flex; align-items:center; gap:8px; background:var(--branco); border:1px solid var(--cinza-claro); border-radius:10px; padding:9px 13px; width:260px;}
  .search input{border:none; padding:0; flex:1;}
  .search input:focus{box-shadow:none;}
  .subtabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
  .subtab{font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--cinza); background:var(--branco); border:1px solid var(--cinza-claro); padding:8px 14px; border-radius:20px; cursor:pointer; white-space:nowrap;}
  .subtab:hover{color:var(--verde-escuro);}
  .subtab.active{color:#fff; background:var(--verde-escuro); border-color:var(--verde-escuro);}
  /* ---------- segmentado (toggle Cana/Grãos) ---------- */
  .segmented{display:inline-flex; border:1px solid var(--cinza-claro); border-radius:9px; overflow:hidden; padding:3px; background:var(--branco);}
  .segmented button{font-family:'Inter',sans-serif; font-size:12.5px; font-weight:700; padding:7px 15px; border:none; border-radius:7px; background:transparent; color:var(--cinza); cursor:pointer;}
  .segmented button.active{background:var(--verde-vivo); color:#0B2318;}
  .segmented button.active.graos{background:var(--dourado-medio); color:#2B1D06;}
  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--cinza-bg);}
  .login-card{background:var(--branco); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.12); border:1px solid var(--cinza-claro); padding:40px 36px; width:100%; max-width:360px;}
  .login-brand{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
  .login-brand .brand-name{color:var(--grafite); font-family:'Fraunces',serif; font-weight:700; font-size:19px;}
  .login-field{margin-bottom:16px; display:flex; flex-direction:column; gap:5px;}
  .login-field input{width:100%;}
  .login-error{background:var(--alerta-bg); color:var(--alerta); font-size:13px; padding:10px 12px; border-radius:9px; margin-bottom:16px;}
  .login-btn{width:100%; margin-top:6px; justify-content:center;}
  .login-btn:disabled{opacity:0.6; cursor:default;}
  .login-loading{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--cinza); font-size:14px;}
  /* ---------- ADMIN ---------- */
  .perm-matrix{width:100%; border-collapse:collapse; font-size:13px;}
  .perm-matrix th, .perm-matrix td{padding:8px 10px; border-bottom:1px solid var(--cinza-claro); text-align:left;}
  .perm-matrix select{width:100%; padding:6px 8px; font-size:12.5px;}
  /* Celular: campo com menos de 16px faz o iPhone dar zoom ao tocar nele e a tela fica ampliada
     (05/11/2026). So abaixo de 760px; o desktop segue com 13,5px. Fica depois do .perm-matrix
     select para ganhar dele (mesma especificidade). Campo grande da Pecuaria ja tem 19px. */
  @media (max-width:760px){
    input, select, textarea, .perm-matrix select{font-size:16px;}
  }
  .status-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px;}
  .status-dot.ativo{background:var(--bom);}
  .status-dot.inativo{background:var(--cinza);}
  /* ---------- RESPONSIVO (celular) ---------- */
  @media (max-width:760px){
    .app{height:auto; overflow:visible;}
    .topbar{padding:10px 14px; height:auto; flex-wrap:wrap; row-gap:8px; position:-webkit-sticky; position:sticky; top:0; z-index:40;}
    .topbar-user-nome{display:none;}
    .tabsrow{padding:8px 10px; position:-webkit-sticky; position:sticky; top:0; z-index:39;}
    .nav-item{padding:8px 11px; font-size:12.5px;}
    .main{padding:20px 16px 48px 16px; max-width:100%; overflow-y:visible;}
    .page-header{flex-direction:column; align-items:flex-start; gap:14px;}
    h1{font-size:22px;}
    .btn{width:100%; justify-content:center;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .totals-strip{flex-direction:column; align-items:stretch;}
    .totals-nums{gap:22px;}
    .total-value{font-size:19px; min-width:0;}
    .toolbar{flex-direction:column; align-items:stretch;}
    .search{width:100%;}
    .card{overflow-x:auto; -webkit-overflow-scrolling:touch;}
    .overlay{padding:16px 10px;}
    .despesa-barra-linha{grid-template-columns:1fr auto; grid-template-areas:"nome valor" "track track"; row-gap:4px;}
    .despesa-barra-nome{grid-area:nome;}
    .despesa-barra-valor{grid-area:valor;}
    .despesa-barra-track{grid-area:track;}
    .despesa-grupo-header{flex-wrap:wrap; row-gap:6px;}
    .despesa-grupo-valor{margin-left:0;}
  }
/* ---------- USO NO CAMPO: ALVOS DE TOQUE (06/11/2026) ----------
   Em tela de toque (tablet/celular) botao e campo tem pelo menos 44 px de altura (Apple 44, Material 48; o
   minimo da WCAG 2.2 AA e 24). Os botoes mediam 26 a 34 px. O mouse do desktop segue como era.
   NAO definir display aqui: uma classe que o CSS esconde em tela larga (menu de celular) voltaria a aparecer. */
@media (pointer: coarse){
  .aviso-fechar, .btn, .btn-sm, .btn-sair, .nav-item, .periodo-tab, .btn-ghost, .btn-danger-ghost, button.btn-link, summary, .mobile-nav-toggle, .subtab, .tab, .link-nome, .valor-clicavel{
    min-height:44px;
  }
  input:not([type=checkbox]):not([type=radio]):not([type=color]), select{min-height:44px;}
  textarea{min-height:88px;}
  input[type=checkbox], input[type=radio]{width:24px; height:24px; min-width:24px; accent-color:var(--bom); flex:none;}
  label:has(> input[type=checkbox]), label:has(> input[type=radio]){min-height:44px; display:flex; align-items:center; gap:8px;}
  td.acoes .btn-sm{margin:4px 8px 4px 0;}
  .btn-sair, .modal-close, .aviso-fechar{min-width:44px;}
  .modal-close, .valor-clicavel{min-height:44px;}
}
/* o link "← Painel" e uma ancora: centraliza o texto como os botoes irmaos (com o min-height do toque ele ficava no topo) */
a.btn-sair{display:inline-flex; align-items:center; justify-content:center;}
/* a marca desenhada em verde escuro some no fundo verde escuro da barra: versao clara, so nesta barra */
.topbar .brand-mark [stroke="#173D2E"], .topbar .brand-mark [stroke="#1B4332"]{stroke:#DFF6E8;}
.topbar .brand-mark [fill="#173D2E"]{fill:#DFF6E8;}

/* ---------- MENU LATERAL (tela larga, 07/11/2026; tablet deitado 08/11/2026) ----------
   Mesmo desenho do AE Matriz (pedido do Eduardo): menu principal grande numa coluna a esquerda. Da largura de 1160 px
   para cima (232 px de 1280 para cima, 196 px de 1160 a 1279: iPad deitado); de 760 a 1159 px a barra de cima fica, com o menu
   maior; abaixo disso e o menu de celular. So CSS: o
   .topbar usa display:contents para a marca e o usuario virarem pecas da coluna; botoes, data-* e a ordem do HTML nao mudam. */
@media (min-width:1160px){
  .app{display:grid; grid-template-columns:232px minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto;
       grid-template-areas:"marca conteudo" "menu conteudo" "usuario conteudo";}
  .topbar{display:contents;}
  .brand{grid-area:marca; background:var(--verde-escuro); padding:26px 24px 20px; gap:12px;}
  .brand-mark{width:34px; height:34px;}
  .brand-name{font-size:22px;}
  .tabsrow{grid-area:menu; background:var(--verde-escuro); border:none; flex-direction:column; flex-wrap:nowrap; gap:5px;
           padding:4px 14px 14px; overflow-x:hidden; overflow-y:auto;}
  .nav-item{font-size:16px; font-weight:700; padding:7px 16px; min-height:54px; gap:14px; width:100%; color:rgba(255,255,255,0.82); border-radius:12px; flex-shrink:0;
            white-space:normal; text-align:left; line-height:1.2;}
  .nav-item svg{width:23px; height:23px; opacity:0.9;}
  .nav-item:hover{background:rgba(255,255,255,0.09); color:#fff;}
  .nav-item.active{background:var(--verde-vivo); color:#0B2318;}
  .topbar-user{grid-area:usuario; margin:0; background:var(--verde-escuro); padding:12px 16px 18px; border-top:1px solid rgba(255,255,255,0.14);
               display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .avatar{order:-1; width:36px; height:36px; font-size:14px;}
  .topbar-user-nome{flex:1 1 calc(100% - 52px); max-width:none; min-width:0; font-size:12.5px; line-height:1.3; white-space:normal;
                    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  /* um botao por linha (08/11/2026): lado a lado, "Trocar senha" passava da borda do botao no iPad (Safari) */
  .topbar-user .btn-sair{flex:1 1 100%; text-align:center; padding:9px 8px; white-space:normal; line-height:1.2;}
  .topbar-user a.btn-sair, .topbar-user .btn-pendencias{flex:1 1 100%;}
  .main{grid-area:conteudo; max-width:none; margin:0; padding:32px 24px 60px 24px;}
}
@media (min-width:1160px) and (max-width:1279px){
  .app{grid-template-columns:196px minmax(0,1fr);}
  .brand{padding:22px 16px 16px;}
  .brand-name{font-size:20px;}

  .nav-item{font-size:15px; padding:7px 10px; gap:10px;}

}

}

  .tabsrow{gap:3px; padding:2px 14px 10px;}
  .nav-item{min-height:48px; font-size:15.5px;}
  .topbar-user{padding:10px 14px 14px;}
}
/* ---------- SETINHA COM AS SUB-ABAS DE CADA ITEM DO MENU (08/11/2026) ----------
   Pedido do Eduardo: uma setinha nos itens do menu que tem sub-abas, para abrir a lista ali e ir direto numa delas (o
   HTML vem do ItemDoMenu(), em core.js). So aparece onde o menu e uma coluna; na barra de cima fica escondida e os
   envoltorios nao criam caixa (display:contents), entao a barra se desenha como antes. */
.nav-grupo, .nav-linha{display:contents;}
.nav-seta, .nav-sub{display:none;}
@media (min-width:1160px){
  .nav-grupo{display:flex; flex-direction:column; gap:3px; width:100%; flex-shrink:0;}
  .nav-linha{display:flex; align-items:stretch; gap:2px; width:100%;}
  .nav-linha .nav-item{flex:1 1 auto; min-width:0; width:auto; padding-right:4px;}
  /* a setinha tem 44 px de toque, mas o desenho dela so ocupa o meio: a ponta esquerda fica por baixo do nome do item, para nomes
     compridos (Confinamento, Formulacao de Dietas) nao serem cortados */
  .nav-linha .nav-seta{margin-left:-14px; position:relative;}
  .nav-seta{display:flex; flex:none; width:44px; align-items:center; justify-content:center; padding:0; border:none; border-radius:12px;
            background:transparent; color:rgba(255,255,255,0.78); cursor:pointer;}
  .nav-seta:hover{background:rgba(255,255,255,0.09); color:#fff;}
  .nav-seta svg{transition:transform 0.15s;}
  .nav-grupo.aberto .nav-seta svg{transform:rotate(180deg);}
  .nav-grupo.ativo .nav-linha{background:var(--verde-vivo); border-radius:12px; gap:0;}
  .nav-grupo.ativo .nav-linha .nav-item.active{background:transparent;}
  .nav-grupo.ativo .nav-seta{background:transparent; color:#0B2318;}
  .nav-sub{display:none; flex-direction:column; gap:2px; margin:0 0 6px 22px; padding-left:12px; border-left:2px solid rgba(255,255,255,0.2);}
  .nav-grupo.aberto .nav-sub{display:flex;}
  .nav-sub-item{min-height:44px; padding:6px 12px; border:none; border-radius:9px; background:transparent; text-align:left; cursor:pointer;
                font-family:'Inter',sans-serif; font-size:14.5px; font-weight:600; line-height:1.25; color:rgba(255,255,255,0.8);}
  .nav-sub-item:hover{background:rgba(255,255,255,0.09); color:#fff;}
  .nav-sub-item.active{background:rgba(255,255,255,0.16); color:#fff; font-weight:700;}
}
@media (min-width:1160px) and (max-width:1279px){
  .nav-linha .nav-item{padding:7px 2px 7px 8px; gap:7px; font-size:14px; overflow-wrap:break-word;}
  .nav-linha .nav-item svg{width:17px; height:17px;}
  .nav-sub{margin-left:18px; padding-left:8px;}
}
/* ---------- AVISOS NA PAGINA (07/11/2026): no lugar do alert() que travava a tela ---------- */

/* ---------- MENU DO CELULAR (☰), 09/11/2026 ----------
   Pedido do Eduardo: "coloca os 3 risquinhos para clicar e abrir uma janela com as abas; quero todos com a mesma cara" (o AE
   Matriz ja era assim). Ate 760 px o menu fica escondido; o botao (BotaoMenuCelular, em core.js) mostra onde a pessoa esta e abre

  .menu-celular-seta svg{transition:transform 0.15s;}
  .menu-celular[aria-expanded="true"] .menu-celular-seta svg{transform:rotate(180deg);}
  .tabsrow, .sidebar nav{display:none !important; position:static !important; flex-direction:column !important; flex-wrap:nowrap !important;
    gap:2px !important; padding:8px !important; margin:0 !important; overflow:visible !important; background:var(--branco) !important;
    border-bottom:1px solid var(--cinza-claro); box-shadow:0 6px 12px rgba(0,0,0,0.08);}
  html.menu-celular-aberto .tabsrow, html.menu-celular-aberto .sidebar nav{display:flex !important;}
  html.menu-celular-aberto .fab-wrap{display:none;}
  .tabsrow .nav-item, .sidebar nav .nav-item{width:100%; justify-content:flex-start; white-space:normal; padding:10px 12px; font-size:14px; min-height:44px;}
  .tabsrow .nav-item:not(.active), .sidebar nav .nav-item:not(.active){color:var(--grafite);}
  .nav-grupo{display:flex; flex-direction:column; gap:2px; width:100%;}
  .nav-linha{display:flex; align-items:stretch; gap:2px; width:100%;}
  .nav-linha .nav-item{flex:1 1 auto; min-width:0; width:auto;}
  .nav-seta{display:flex; flex:none; width:48px; align-items:center; justify-content:center; padding:0; border:none; border-radius:8px;
            background:transparent; color:var(--cinza); cursor:pointer;}
  .nav-seta:hover{background:var(--cinza-bg);}
  .nav-seta svg{transition:transform 0.15s;}
  .nav-grupo.aberto .nav-seta svg{transform:rotate(180deg);}
  .nav-sub{display:none; flex-direction:column; gap:2px; margin:0 0 6px 30px; padding-left:10px; border-left:2px solid var(--cinza-claro);}
  .nav-grupo.aberto .nav-sub{display:flex;}
  .nav-sub-item{min-height:44px; padding:8px 12px; border:none; border-radius:8px; background:transparent; text-align:left; cursor:pointer;
                font-family:'Inter',sans-serif; font-size:14px; font-weight:600; color:var(--grafite);}
  .nav-sub-item:hover{background:var(--cinza-bg);}
  .nav-sub-item.active{background:var(--cinza-bg); color:var(--menu-sub-ativo); font-weight:700;}
}

<script>
/* ===================== SUPABASE =====================
 * AE Lavoura reaproveita o MESMO projeto Supabase que hoje é o do AE
 * Cana (cana_schema.sql) — não é um banco novo. Fazendas, Culturas,
 * Safras, Talhões/Áreas e Centros de Custo (Fase 1) já existem e já
 * são compartilháveis entre Cana e Grãos (a coluna `frente` já aceita
 * 'cana' e 'graos' desde o desenho original). As tabelas de Grãos
 * (plantios_graos, insumos_graos, entradas_insumo_graos,
 * aplicacoes_graos, colheitas_graos, despesas_graos, receitas_graos)
 * foram acrescentadas por lavoura_migracao_graos.sql, sem alterar nada
 * do que já existia — ver esse arquivo para detalhes.
 * Login e usuários também são os MESMOS do AE Cana: uma conta que já
 * existe lá funciona aqui, e o que ela vê depende só das permissões
 * marcadas em Administração > Usuários (agora com módulos extras para
 * Grãos, além dos de Cana). O AE Pecuária e o AE Combustível
 * continuam em projetos Supabase próprios e separados — não mudou
 * nada neles; ver AEMatriz.html para a visão consolidada entre todos. */
const db = supabase.createClient(
  'https://kmkystqgpvmzrccxvyaz.supabase.co',
  'sb_publishable_YclssD8pzNZhWO_Om0anMg_SwaZHQOa'
);

/* ===================== A FRENTE DESTE APP =====================
 * Este arquivo e o AE Cana. Ele foi gerado a partir do
 * AELavoura.html por gerar_apps_lavoura.py e so enxerga uma frente.
 * Cana e Cereais sao operacoes em estados diferentes, com equipes e
 * cadastros proprios; o banco continua sendo um so, e o AE Matriz e
 * quem consolida as tres atividades. */
const FRENTE = 'cana';       // culturas.frente
const ATIVIDADE = 'cana'; // fazenda_atividades.atividade

/* ===================== HELPERS DE CONVERSÃO ===================== */

/* ===================== OPÇÕES (catálogos de enum) =====================
 * CATEGORIAS_INSUMO e TIPOS_OPERACAO existem em duas versões porque as
 * restrições (CHECK) das tabelas *_cana e *_graos no banco são
 * diferentes: insumos_cana/aplicacoes_cana não aceitam 'semente',
 * 'dessecacao' nem 'semeadura' (não fazem sentido pra cana, cultura
 * perene) — só insumos_graos/aplicacoes_graos aceitam. Usar a lista
 * errada faria o formulário oferecer uma opção que o banco rejeita. */
const OPCOES = {
  ESTADOS: [{value:'TO',label:'Tocantins'},{value:'SP',label:'São Paulo'}],
  FRENTES: [{value:'cana',label:'Cana-de-açúcar'}],
  CATEGORIAS_INSUMO_CANA: [
    {value:'herbicida',label:'Herbicida'}, {value:'inseticida',label:'Inseticida'},
    {value:'fungicida',label:'Fungicida'}, {value:'adubo',label:'Adubo/Fertilizante'},
    {value:'corretivo',label:'Corretivo de solo (Calcário/Gesso)'}, {value:'outro',label:'Outro'},
  ],
  CATEGORIAS_INSUMO_GRAOS: [
    {value:'semente',label:'Semente'}, {value:'herbicida',label:'Herbicida'}, {value:'inseticida',label:'Inseticida'},
    {value:'fungicida',label:'Fungicida'}, {value:'adubo',label:'Adubo/Fertilizante'},
    {value:'corretivo',label:'Corretivo de solo (Calcário/Gesso)'}, {value:'outro',label:'Outro'},
  ],
  TIPOS_OPERACAO_CANA: [
    {value:'adubacao',label:'Adubação'}, {value:'herbicida',label:'Aplicação de herbicida'},
    {value:'inseticida',label:'Aplicação de inseticida'}, {value:'fungicida',label:'Aplicação de fungicida'},
    {value:'cultivo_mecanico',label:'Cultivo mecânico'}, {value:'outro',label:'Outro'},
  ],
  TIPOS_OPERACAO_GRAOS: [
    {value:'dessecacao',label:'Dessecação'}, {value:'semeadura',label:'Semeadura'},
    {value:'adubacao',label:'Adubação'}, {value:'herbicida',label:'Aplicação de herbicida'},
    {value:'inseticida',label:'Aplicação de inseticida'}, {value:'fungicida',label:'Aplicação de fungicida'},
    {value:'cultivo_mecanico',label:'Cultivo mecânico'}, {value:'outro',label:'Outro'},
  ],
};

/* ===================== FRENTE DE UM TALHÃO =====================
 * Talhões não têm coluna própria de frente — ela vem da Cultura
 * vinculada (fazendas/culturas/safras/talhoes_areas são cadastros
 * ÚNICOS, compartilhados por Cana e Grãos neste app). Um talhão sem
 * cultura definida (culturaId vazio) fica "sem frente" até alguém
 * escolher a cultura — nesse estado ele não some do cadastro, mas
 * fica de fora de Custo por Talhão/Histórico (não dá pra saber qual
 * conjunto de tabelas usar). */
// Area que entra no TCH de uma colheita: a area colhida, se informada; senao
// o talhao inteiro. Usado no formulario, na lista e no historico do talhao.
function areaDaColheita(c){
  if(Number(c?.areaColhida) > 0) return Number(c.areaColhida);
  const t = state.talhoes.find(x=>x.id===c?.talhaoId);
  return t && Number(t.areaHa) > 0 ? Number(t.areaHa) : null;
}

/* ===================== CADASTROS (motor genérico de CRUD) =====================
 * Cadastros de base (fazendas, culturas, talhoes, safras) sao tabelas

 * frente 'cana' - o corte e feito em filtrarPelaFrente(), na
 * entrada dos dados. Fazenda e cadastro do AE Matriz; aqui ela aparece
 * para consulta e para agrupar os talhoes. Centro de custo saiu junto
 * com o Financeiro para o Matriz. */
const CADASTROS = {
  fazendas: {
    table:'fazendas', label:'Fazendas', singular:'Fazenda', modulo:'matriz_fazendas',

      {key:'areaHa', label:'Área (ha)', type:'number', step:'0.01', suffix:' ha'},
      {key:'ativo', label:'Fazenda ativa', type:'checkbox', default:true, list:false},
    ],
  },

    fields:[

      {key:'frente', label:'Frente', type:'select', options:OPCOES.FRENTES, required:true},
      {key:'ativo', label:'Ativa', type:'checkbox', default:true, list:false},
    ],
  },
  talhoes: {
    table:'talhoes_areas', label:'Talhões', singular:'Talhão', modulo:'cana_cadastros',
    desc:'Talhões de cana desta fazenda. A Cultura define a safra e o histórico de cada um.',
    emptyHint:'Cadastre uma fazenda antes de criar um talhão.',
    filtroLista: item => item.tipo==='talhao',
    historico: true,
    fields:[
      {key:'fazendaId', label:'Fazenda', type:'fk', refEntity:'fazendas', required:true},
      {key:'nome', label:'Nome', type:'text', required:true, placeholder:'Ex: Talhão 12'},
      {key:'tipo', type:'fixed', value:'talhao', list:false},
      {key:'areaHa', label:'Área (ha)', type:'number', step:'0.01', suffix:' ha'},
      {key:'culturaId', label:'Cultura', type:'fk', refEntity:'culturas', required:true},
      {key:'ativo', label:'Talhão ativo', type:'checkbox', default:true, list:false},
    ],
  },
  safras: {
    table:'safras', label:'Safras', singular:'Safra', modulo:'cana_cadastros',
    fields:[
      {key:'fazendaId', label:'Fazenda', type:'fk', refEntity:'fazendas', required:true},
      {key:'culturaId', label:'Cultura', type:'fk', refEntity:'culturas', required:true},
      {key:'nome', label:'Safra', type:'text', required:true, placeholder:'Ex: 2024/2025'},
      {key:'dataInicio', label:'Início', type:'date'},
      {key:'dataFim', label:'Fim', type:'date'},
      {key:'ativo', label:'Ativa', type:'checkbox', default:true, list:false},
    ],
  },
  /* ---------- CANA ---------- */
  plantiosCana: {
    table:'plantios_cana', label:'Plantio', singular:'Plantio', modulo:'operacoes',
    desc:'Registro do plantio de cada talhão de cana — variedade e data de plantio, com previsão de reforma. Uma linha por estande (do plantio até a reforma); os cortes entram em Colheita.',
    emptyHint:'Cadastre um talhão de cana antes de registrar um plantio.',
    orderBy:'data_plantio', orderDesc:true, semBusca:true,
    fields:[
      {key:'talhaoId', label:'Talhão', type:'fk', refEntity:'talhoes', required:true, filter:t=>frenteDoTalhao(t)==='cana'},
      {key:'safraId', label:'Safra', type:'fk', refEntity:'safras', filter:s=>{ const c=state.culturas.find(x=>x.id===s.culturaId); return !!c && c.frente==='cana'; }},
      {key:'variedade', label:'Variedade', type:'text', required:true, placeholder:'Ex: RB92579'},
      {key:'dataPlantio', label:'Data do plantio', type:'date', required:true},
      {key:'dataReformaPrevista', label:'Previsão de reforma', type:'date'},
      {key:'observacao', label:'Observação', type:'textarea', list:false},
      {key:'ativo', label:'Plantio ativo (talhão em produção)', type:'checkbox', default:true, list:false},
    ],
  },
  colheitasCana: {
    table:'colheitas_cana', label:'Colheita', singular:'Colheita', modulo:'operacoes',
    desc:'Registro da colheita de cada talhão de cana — toneladas colhidas e TCH (toneladas por hectare).',
    emptyHint:'Cadastre um talhão de cana antes de registrar uma colheita.',
    orderBy:'data', orderDesc:true, semBusca:true, semStatus:true,
    fields:[
      {key:'talhaoId', label:'Talhão', type:'fk', refEntity:'talhoes', required:true, filter:t=>frenteDoTalhao(t)==='cana'},

      {key:'corte', label:'Corte', type:'number', step:'1', dec:0, hint:'1 = cana-planta, 2 = 1ª soca, 3 = 2ª soca...'},
      {key:'toneladas', label:'Toneladas', type:'number', step:'0.01', required:true},
      // Area colhida: pedido do Eduardo em 21/10/2026 (Palmito: 40 ha de

      // pela area toda do talhao saia de 24 t/ha num talhao de 102). Em

async function salvarCadastro(key){
  const cfg = CADASTROS[key];
  const row = {};
  let erro = '';
  cfg.fields.forEach(f=>{
    if(f.type==='computed') return;
    const raw = lerCampoDOM(f);
    if(f.required && (raw===''||raw===undefined||raw===null)) erro = erro || `Preencha o campo "${f.label}".`;
    let val = raw;
    if(f.type==='number') val = (raw===''||raw===undefined||raw===null) ? null : Number(raw);
    if(f.type==='fk') val = raw ? Number(raw) : null;
    if(f.type==='date') val = raw || null;
    if(f.type==='checkbox') val = !!raw;
    row[toSnake(f.key)] = (val===''? null : val);
  });
  if(!erro && key==='colheitasCana' && Number(row.area_colhida) > 0){
    const t = state.talhoes.find(x=>x.id===row.talhao_id);
    if(t && Number(t.areaHa) > 0 && Number(row.area_colhida) > Number(t.areaHa) + 0.001)
      erro = `A área colhida (${fmt(row.area_colhida)} ha) passa da área do talhão (${fmt(t.areaHa)} ha).`;
  }
  if(erro){ state.cadastroError = erro; render(); return; }
  state.cadastroLoading = true; state.cadastroError = ''; render();
  let error;
  if(editDraft._editId){
    ({error} = await db.from(cfg.table).update(row).eq('id', editDraft._editId));
  } else {
    ({error} = await db.from(cfg.table).insert(row));
  }
  state.cadastroLoading = false;
  if(error){ state.cadastroError = mensagemErroSupabase(error); render(); return; }
  state.modal = null; editDraft = null;
  await loadAll();
}

 * entra 100% nele; despesa geral (sem talhão) é rateada ENTRE OS
 * TALHÕES DA MESMA FRENTE com plantio ativo, proporcional à área —
 * uma despesa de Grãos nunca dilui o custo de um talhão de Cana e
 * vice-versa, porque os dois ratões são calculados separadamente. */

/* ===================== RESULTADOS: RESULTADO (Cana, Grãos e Geral) =====================
 * Junta Receita (receitas_cana/receitas_graos) com Despesas gerais e
 * custo de insumo de cada frente — sem guardar nada à parte. O bloco
 * "Geral" soma as duas frentes: é a resposta direta para "quanto a
 * lavoura inteira deu de lucro" (o que o AE Matriz também vai
 * enxergar, lendo este mesmo indicador). Resultado/ha de cada frente
 * usa a área EM PRODUÇÃO daquela frente (talhões com plantio ativo) —
 * mais correto que usar a área total das fazendas (que inclui hectares
 * de outra frente, ou nenhuma). O bloco Geral usa a soma das duas

const MODULOS_PERMISSAO = [

/* ===================== HISTÓRICO DO TALHÃO =====================
 * Ramifica por frente (frenteDoTalhao) — usa colheitas_cana/
 * aplicacoes_cana para talhão de cana, colheitas_graos/aplicacoes_graos
 * para talhão de grãos. Não guarda nada à parte: lê direto dos dois
 * módulos, então fica sempre conciliado com o que já foi lançado. */
function ModalHistoricoTalhao(){
  const talhaoId = state.modal.talhaoId;
  const t = state.talhoes.find(x=>x.id===talhaoId);
  if(!t) return '';
  const frente = frenteDoTalhao(t);
  if(!frente){
    return `
    <div class="overlay" data-close-overlay="1">
      <div class="modal modal-lg" data-stop="1">
        <div class="modal-head"><h3>Histórico — ${esc(t.nome)}</h3><button class="modal-close" data-close="1">&times;</button></div>
        <div class="modal-body">${Empty('Talhão sem cultura definida','Defina a Cultura deste talhão em Cadastros > Talhões para ver o histórico.')}</div>
        <div class="modal-foot"><button class="btn btn-ghost" data-close="1">Fechar</button></div>
      </div>
    </div>`;
  }
  const frenteChave = frente==='cana' ? 'Cana' : 'Graos';
  const unidade = frenteChave==='Cana' ? 't' : 'sc';
  const campoQtd = frenteChave==='Cana' ? 'toneladas' : 'sacas';
  const chaveColheitas = frenteChave==='Cana' ? 'colheitasCana' : 'colheitasGraos';
  const chaveAplicacoes = frenteChave==='Cana' ? 'aplicacoesCana' : 'aplicacoesGraos';
  const chaveInsumos = frenteChave==='Cana' ? 'insumosCana' : 'insumosGraos';
  const categoriasOpt = frenteChave==='Cana' ? OPCOES.CATEGORIAS_INSUMO_CANA : OPCOES.CATEGORIAS_INSUMO_GRAOS;

  const colheitasDoTalhao = state[chaveColheitas].filter(c=>c.talhaoId===talhaoId).sort((a,b)=> (b.data||'').localeCompare(a.data||''));
  const producaoTotal = colheitasDoTalhao.reduce((a,c)=>a+Number(c[campoQtd]||0),0);
  // Media ponderada pela area colhida de cada corte (sem area colhida, o
  // talhao inteiro): soma das toneladas / soma das areas colhidas.
  const areaColhidaTotal = colheitasDoTalhao.reduce((a,c)=>a+(frenteChave==='Cana' ? (areaDaColheita(c)||0) : Number(t.areaHa||0)),0);
  const produtividadeMedia = areaColhidaTotal>0 ? producaoTotal/areaColhidaTotal : null;

  const aplicacoesDoTalhao = state[chaveAplicacoes].filter(a=>a.talhaoId===talhaoId);
  const porInsumo = {};
  aplicacoesDoTalhao.forEach(a=>{
    if(!porInsumo[a.insumoId]) porInsumo[a.insumoId] = 0;
    porInsumo[a.insumoId] += Number(a.quantidade||0);
  });
  const linhasInsumo = Object.entries(porInsumo).map(([insumoId,total])=>{
    const insumo = state[chaveInsumos].find(x=>x.id===Number(insumoId));
    return {
      nome: insumo?.nome || '—',
      categoria: (categoriasOpt.find(o=>o.value===insumo?.categoria)||{}).label || '—',
      total, unidade: insumo?.unidade || '',
    };
  }).sort((a,b)=> a.nome.localeCompare(b.nome));

  return `
  <div class="overlay" data-close-overlay="1">
    <div class="modal modal-lg" data-stop="1">
      <div class="modal-head"><h3>Histórico — ${esc(t.nome)} <span class="pill ${frenteChave==='Cana'?'pill-cana':'pill-graos'}" style="margin-left:8px;">${frenteChave==='Cana'?'Cana':'Grãos'}</span></h3><button class="modal-close" data-close="1">&times;</button></div>
      <div class="modal-body">
        <p class="hint">${fkNome('fazendas', t.fazendaId)} · ${t.areaHa ? fmt(t.areaHa)+' ha' : 'área não informada'}</p>

        <div class="stat-row" style="grid-template-columns:repeat(3,1fr);">
          <div class="stat-card"><div class="stat-label">Número de colheitas</div><div class="stat-value">${colheitasDoTalhao.length}</div></div>
          <div class="stat-card"><div class="stat-label">Produção total</div><div class="stat-value">${fmt(producaoTotal)} ${unidade}</div></div>
          <div class="stat-card"><div class="stat-label">${frenteChave==='Cana'?'TCH médio':'Produtividade média'}</div><div class="stat-value">${produtividadeMedia==null?'—':fmt(produtividadeMedia)+' '+unidade+'/ha'}</div></div>
        </div>

        <h4 style="font-family:'Fraunces',serif; color:var(--verde-escuro); margin:4px 0;">${frenteChave==='Cana'?'Colheitas (cortes)':'Colheitas'}</h4>
        ${colheitasDoTalhao.length===0 ? `<p class="hint">Nenhuma colheita registrada para este talhão.</p>` : `
        <table>
          <thead><tr><th>Data</th>${frenteChave==='Cana'?'<th>Corte</th>':''}<th>${unidade==='t'?'Toneladas':'Sacas'}</th><th>${frenteChave==='Cana'?'TCH':'Produtividade'}</th></tr></thead>
          <tbody>
            ${colheitasDoTalhao.map(c=>`
              <tr>
                <td>${fmtData(c.data)}</td>
                ${frenteChave==='Cana'?`<td>${c.corte ?? '—'}</td>`:''}
                <td class="mono">${fmt(c[campoQtd])} ${unidade}</td>
                <td class="mono">${(()=>{ const a = frenteChave==='Cana' ? areaDaColheita(c) : Number(t.areaHa||0);
                  return a ? fmt(Number(c[campoQtd]||0)/a) + ' '+unidade+'/ha' + (frenteChave==='Cana' && Number(c.areaColhida)>0 ? ` <span class="hint">(${fmt(a)} ha colhidos)</span>` : '') : '—'; })()}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}

        <h4 style="font-family:'Fraunces',serif; color:var(--verde-escuro); margin:16px 0 4px 0;">Insumos aplicados</h4>
        ${linhasInsumo.length===0 ? `<p class="hint">Nenhuma aplicação registrada para este talhão.</p>` : `
        <table>
          <thead><tr><th>Insumo</th><th>Categoria</th><th>Total aplicado</th></tr></thead>
          <tbody>
            ${linhasInsumo.map(l=>`
              <tr>
                <td><strong>${esc(l.nome)}</strong></td>
                <td>${l.categoria}</td>
                <td class="mono">${fmt(l.total)} ${l.unidade}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="1">Fechar</button>
      </div>
    </div>
  </div>`;
}

/* ===================== EVENTOS ===================== */
function attachEvents(){
  const loginForm = document.querySelector('[data-login-form]');
  if(loginForm){
    loginForm.onsubmit = (e)=>{ e.preventDefault(); fazerLogin(); };
    const uEl = document.querySelector('[data-login-usuario]');
    const sEl = document.querySelector('[data-login-senha]');
    if(uEl) uEl.oninput = (e)=>{ state.loginDraft.usuario = e.target.value; };
    if(sEl) sEl.oninput = (e)=>{ state.loginDraft.senha = e.target.value; };
  }
  document.querySelectorAll('[data-logout]').forEach(el=>{ el.onclick = ()=> fazerLogout(); });
  document.querySelectorAll('[data-trocar-senha-abrir]').forEach(el=>{
    el.onclick = ()=>{ editDraft = {senhaAtual:'', novaSenha:'', confirmarSenha:''}; state.modal = {type:'trocarSenha'}; render(); };
  });
  document.querySelectorAll('[data-novo-usuario]').forEach(el=>{
    el.onclick = ()=>{ editDraft = {nome:'', usuario:'', senha:''}; state.usuarioError=''; state.modal = {type:'usuario'}; render(); };
  });
  document.querySelectorAll('[data-editar-usuario]').forEach(el=>{
    el.onclick = ()=>{
      const perfil = state.perfis.find(p=>p.id===el.dataset.editarUsuario);
      editDraft = {_perfilId: perfil.id, nome: perfil.nome, usuario: perfil.usuario, papel: perfil.papel, ativo: perfil.ativo, permissoes: {...perfil.permissoes}};
      state.modal = {type:'permissoes'}; render();
    };
  });
  const criarUsuarioBtn = document.querySelector('[data-criar-usuario]');
  if(criarUsuarioBtn){
    criarUsuarioBtn.onclick = async ()=>{
      const nome = document.getElementById('f-nomeusuario').value.trim();
      const usuario = document.getElementById('f-usuario').value.trim();
      const senha = document.getElementById('f-senhausuario').value;
      if(!nome || !usuario || !senha){ state.usuarioError = 'Preencha nome, usuário e senha.'; render(); return; }
      state.usuarioLoading = true; state.usuarioError = ''; render();
      const { data, error } = await db.functions.invoke('criar-usuario-cana', { body: { nome, usuario, senha } });
      state.usuarioLoading = false;
      if(error || data?.error){
        let msg = data?.error || error?.message || 'Falha ao criar usuário.';
        if(error?.context && typeof error.context.json === 'function'){
          try { const corpo = await error.context.json(); if(corpo?.error) msg = corpo.error; } catch(e){}
        }
        state.usuarioError = msg; render(); return;
      }
      state.modal = null; editDraft = null;
      await loadAll();
    };
  }
  const searchEl = document.querySelector('[data-search]');
  if(searchEl){
    searchEl.oninput = (e)=>{
      state.search = e.target.value; render();
      const s = document.querySelector('[data-search]');
      s.focus(); s.setSelectionRange(s.value.length, s.value.length);
    };
  }
  document.querySelectorAll('[data-nav-group]').forEach(el=>{
    el.onclick = ()=>{
      const group = GROUPS[el.dataset.navGroup];
      if(!group.pages.some(p=>p.key===state.page)){
        state.page = group.pages[0].key;
      }
      render();
    };
  });
  document.querySelectorAll('[data-subnav]').forEach(el=>{
    el.onclick = ()=>{ state.page = el.dataset.subnav; render(); };
  });
  document.querySelectorAll('[data-novo-cadastro]').forEach(el=>{
    el.onclick = ()=>{
      const presets = el.dataset.presetFazenda ? {fazendaId:Number(el.dataset.presetFazenda)} : null;
      abrirNovoCadastro(el.dataset.novoCadastro, presets);
      render();
    };
  });
  document.querySelectorAll('[data-fazenda-talhoes-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const id = Number(el.dataset.fazendaTalhoesToggle);
      state.fazendaTalhoesAbertos[id] = !state.fazendaTalhoesAbertos[id];
      render();
    };
  });
  document.querySelectorAll('[data-edit-cadastro]').forEach(el=>{
    el.onclick = ()=>{
      const [key, idStr] = el.dataset.editCadastro.split(':');
      abrirEditarCadastro(key, Number(idStr));
      render();
    };
  });
  document.querySelectorAll('[data-historico-talhao]').forEach(el=>{
    el.onclick = ()=>{
      state.modal = {type:'historicoTalhao', talhaoId:Number(el.dataset.historicoTalhao)};
      render();
    };
  });
  document.querySelectorAll('[data-del-cadastro]').forEach(el=>{
    el.onclick = async ()=>{
      const [key, idStr] = el.dataset.delCadastro.split(':');
      await excluirCadastro(key, Number(idStr));
    };
  });
  const saveCadastroBtn = document.querySelector('[data-save-cadastro]');
  if(saveCadastroBtn){
    saveCadastroBtn.onclick = ()=> salvarCadastro(saveCadastroBtn.dataset.saveCadastro);
  }
  document.querySelectorAll('[data-close], [data-close-overlay]').forEach(el=>{
    el.onclick = (e)=>{ if(e.target.dataset.stop) return; state.modal = null; editDraft = null; render(); };
  });
  const stopEl = document.querySelector('[data-stop]');
  if(stopEl) stopEl.onclick = (e)=> e.stopPropagation();

  const saveBtn = document.querySelector('[data-save]');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const type = saveBtn.dataset.save;
      let error = null;
      if(type==='permissoes'){
        const papel = document.getElementById('f-papelusuario').value;
        const ativo = document.getElementById('f-ativousuario').checked;
        // Parte das permissoes que a pessoa JA TEM e sobrescreve so os
        // modulos mostrados nesta tela. Com o banco unificado, profiles.permissoes
        // guarda os modulos dos tres apps no mesmo jsonb — montar o objeto do
        // zero aqui apagaria silenciosamente os modulos dos outros apps.
        const permissoes = {...(editDraft.permissoes || {})};
        document.querySelectorAll('[data-perm-modulo]').forEach(sel=>{ permissoes[sel.dataset.permModulo] = sel.value; });
        ({error} = await db.from('profiles').update({papel, ativo, permissoes}).eq('id', editDraft._perfilId));
      } else if(type==='trocarSenha'){
        const senhaAtual = document.getElementById('f-senhaatual').value;
        const novaSenha = document.getElementById('f-novasenha').value;
        const confirmarSenha = document.getElementById('f-confirmarsenha').value;
        if(!senhaAtual || !novaSenha || !confirmarSenha){ alert('Preencha todos os campos.'); return; }
        if(novaSenha.length<6){ alert('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
        if(novaSenha!==confirmarSenha){ alert('A confirmação não bate com a nova senha.'); return; }
        const email = `${state.perfil.usuario}@${DOMINIO_LOGIN}`;
        const { error: erroSenhaAtual } = await db.auth.signInWithPassword({ email, password: senhaAtual });
        if(erroSenhaAtual){ alert('Senha atual incorreta.'); return; }
        ({error} = await db.auth.updateUser({ password: novaSenha }));
        if(error){ alert('Não foi possível trocar a senha: ' + error.message); return; }
        state.modal = null; editDraft = null;
        alert('Senha alterada com sucesso.');
        render();
        return;
      }
      if(error){ alert('Não foi possível salvar: ' + error.message); return; }
      state.modal = null; editDraft = null;
      await loadAll();
    };
  }
}

initAuth();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}));
}
</script>
<script>
// Rotulo solto (sem "for") ao lado de UM campo com id: liga os dois (clicar no nome abre o campo; o leitor de
// tela le o nome certo). So liga quando nao ha duvida: um rotulo e um campo no mesmo bloco.
(function(){
  function ligar(){
    document.querySelectorAll('label:not([for])').forEach(function(l){
      if(l.querySelector('input,select,textarea') || !l.parentElement) return;
      var campos = l.parentElement.querySelectorAll('input:not([type=hidden]),select,textarea');
      var rotulos = l.parentElement.querySelectorAll(':scope > label');
      if(campos.length === 1 && rotulos.length === 1 && campos[0].id) l.htmlFor = campos[0].id;
    });
  }
  var t = null;
  new MutationObserver(function(){ clearTimeout(t); t = setTimeout(ligar, 80); }).observe(document.body, {childList:true, subtree:true});
  ligar();
})();
</script>
